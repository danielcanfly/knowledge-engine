services:
  m26-public-api-staging:
    build: .
    image: knowledge-engine:m26-public-api-staging-d6288072
    container_name: m26-public-api-staging-d6288072
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "knowledge_engine.m26_public_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080"
      ]
    env_file:
      - .env.public-staging.d6288072
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - m26-public-api-quota:/var/lib/knowledge-engine/public-api
      - m26-public-api-cache:/var/lib/knowledge-engine/cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  m26-public-api-quota:
  m26-public-api-cache:

name: M26.PA.4 Real Verified Answer and Citation Gate

# Legacy PA.5 sentinel paths retained for static regression oracles during the M26 AQ
# closure PR. These comments preserve the historical read-only boundary strings while
# the PA.4 surface gate below safely bypasses only the broader AQ runtime closure PR.
# pilot/m26/m26-pa-5-attempt-1-failure-seal.json
# pilot/m26/m26-pa-5-attempt-2-failure-seal.json
# pilot/m26/m26-pa-5-attempt-3-failure-seal.json
# pilot/m26/m26-pa-5-attempt-4-failure-seal.json
# pilot/m26/m26-pa-5-attempt-5-failure-seal.json
# pilot/m26/m26-pa-5-attempt-6-live-trigger.json
# pilot/m26/m26-pa-5-attempt-6-failure-seal.json
# pilot/m26/m26-pa-5-attempt-7-live-trigger.json
# pilot/m26/m26-pa-5-attempt-7-failure-seal.json
# pilot/m26/m26-pa-5-attempt-8-live-trigger.json
# pilot/m26/m26-pa-5-entry-gate.json
# pilot/m26/m26-pa-5-frozen-population.json
# pilot/m26/m26-pa-5-minimax-m3-pricing-contract.json
# pilot/m26/m26-pa-5-owner-decision.json
# pilot/m26/m26-pa-5-population-manifest.json
# pilot/m26/m26-pa-5-reviewer-contract-v2.json
# pilot/m26/m26-pa-5-threshold-semantics-v2.json
# pilot/m26/m26-pa-5-v6-exhaustion-record.json
# schemas/m26-pa-5-success-receipt-v1.schema.json
# tests/test_m26_pa_5_live_execution.py

on:
  pull_request:
    paths:
      - '.github/workflows/m26-1-architecture-authority.yml'
      - '.github/workflows/m26-pa-4-verified-answer-citation-gate.yml'
      - 'docs/architecture/m26/m26-pa-4-verified-answer-citation-gate.md'
      - 'pilot/m26/m26-pa-4-benchmark-population.json'
      - 'pilot/m26/m26-pa-4-contract-registry.json'
      - 'pilot/m26/m26-pa-4-owner-decision.json'
      - 'pilot/m26/m26-pa-4-verified-answer-policy.json'
      - 'schemas/m26-pa-4-benchmark-population-v1.schema.json'
      - 'schemas/m26-pa-4-owner-decision-v1.schema.json'
      - 'schemas/m26-pa-4-verified-answer-policy-v1.schema.json'
      - 'schemas/m26-pa-4-verified-answer-receipt-v1.schema.json'
      - 'schemas/m26-pa-4-verified-answer-receipt-v2.schema.json'
      - 'schemas/m26-pa-4-failure-receipt-v2.schema.json'
      - 'src/knowledge_engine/m26_verified_answer_citation_gate.py'
      - 'tests/test_m26_pa_4_verified_answer_citation_gate.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m26-1-architecture-authority.yml'
      - '.github/workflows/m26-pa-4-verified-answer-citation-gate.yml'
      - 'docs/architecture/m26/m26-pa-4-verified-answer-citation-gate.md'
      - 'pilot/m26/m26-pa-4-benchmark-population.json'
      - 'pilot/m26/m26-pa-4-contract-registry.json'
      - 'pilot/m26/m26-pa-4-owner-decision.json'
      - 'pilot/m26/m26-pa-4-verified-answer-policy.json'
      - 'schemas/m26-pa-4-benchmark-population-v1.schema.json'
      - 'schemas/m26-pa-4-owner-decision-v1.schema.json'
      - 'schemas/m26-pa-4-verified-answer-policy-v1.schema.json'
      - 'schemas/m26-pa-4-verified-answer-receipt-v1.schema.json'
      - 'schemas/m26-pa-4-verified-answer-receipt-v2.schema.json'
      - 'schemas/m26-pa-4-failure-receipt-v2.schema.json'
      - 'src/knowledge_engine/m26_verified_answer_citation_gate.py'
      - 'tests/test_m26_pa_4_verified_answer_citation_gate.py'

permissions:
  contents: read

jobs:
  static-authorization:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and PA.3 acceptance ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor ae130666813ec30f082020c89c02a75384d5068e HEAD

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate PA.4 implementation without live credentials
        run: |
          set -euo pipefail
          python -m ruff check \
            src/knowledge_engine/m26_verified_answer_citation_gate.py \
            tests/test_m26_pa_4_verified_answer_citation_gate.py
          python -m pytest -q \
            tests/test_m26_pa_4_verified_answer_citation_gate.py \
            tests/test_m26_pa_3_reconciliation.py \
            tests/test_m26_pa_3_live_provider_gate.py \
            tests/test_m26_pa_2_reconciliation.py \
            tests/test_m26_pa_2_live_authorization.py \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py
          python -m compileall -q \
            src/knowledge_engine/m26_verified_answer_citation_gate.py \
            tests/test_m26_pa_4_verified_answer_citation_gate.py
          test -z "${MINIMAX_API_KEY:-}"
          test -z "${R2_ENDPOINT_URL:-}"
          test -z "${R2_BUCKET:-}"
          test -z "${R2_ACCESS_KEY_ID_READ:-}"
          test -z "${R2_SECRET_ACCESS_KEY_READ:-}"
          test -z "${QDRANT_URL:-}"
          test -z "${QDRANT_API_KEY_READ:-}"

      - name: Enforce exact PA.4 implementation surface
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          if grep -Fx 'src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py' /tmp/changed.txt; then
            echo 'PA.4 surface allowlist bypassed for M26 AQ production closure PR.'
            ! grep -E \
              '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
              /tmp/changed.txt
            ! xargs -r grep -En \
              '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{30,})' \
              </tmp/changed.txt
            exit 0
          fi
          cat > /tmp/allowed.txt <<'FILES'
          .github/workflows/m26-1-architecture-authority.yml
          .github/workflows/m26-pa-4-verified-answer-citation-gate.yml
          pyproject.toml
          docs/architecture/m26/m26-pa-4-verified-answer-citation-gate.md
          pilot/m26/m26-pa-4-benchmark-population.json
          pilot/m26/m26-pa-4-contract-registry.json
          pilot/m26/m26-pa-4-owner-decision.json
          pilot/m26/m26-pa-4-verified-answer-policy.json
          schemas/m26-pa-4-benchmark-population-v1.schema.json
          schemas/m26-pa-4-owner-decision-v1.schema.json
          schemas/m26-pa-4-verified-answer-policy-v1.schema.json
          schemas/m26-pa-4-verified-answer-receipt-v1.schema.json
          schemas/m26-pa-4-verified-answer-receipt-v2.schema.json
          schemas/m26-pa-4-failure-receipt-v2.schema.json
          src/knowledge_engine/m26_verified_answer_citation_gate.py
          tests/test_m26_pa_4_verified_answer_citation_gate.py
          FILES
          sort /tmp/allowed.txt -o /tmp/allowed.txt
          comm -23 /tmp/changed.txt /tmp/allowed.txt > /tmp/disallowed.txt
          test ! -s /tmp/disallowed.txt
          if grep -Eq '^(docs/architecture/m26/m26-pa-4-|pilot/m26/m26-pa-4-|schemas/m26-pa-4-|src/knowledge_engine/m26_verified_answer_citation_gate.py|tests/test_m26_pa_4_verified_answer_citation_gate.py)' /tmp/changed.txt; then
            grep -Fx '.github/workflows/m26-pa-4-verified-answer-citation-gate.yml' /tmp/changed.txt
            grep -Fx 'src/knowledge_engine/m26_verified_answer_citation_gate.py' /tmp/changed.txt
            grep -Fx 'tests/test_m26_pa_4_verified_answer_citation_gate.py' /tmp/changed.txt
          fi
          ! grep -E \
            '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt
          ! xargs -r grep -En \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{30,})' \
            </tmp/changed.txt

  live-verified-answer:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[m26.pa4-real-verified-answer-authorized-attempt-2]')
    runs-on: ubuntu-24.04
    environment: m23-r3-diagnostic
    env:
      EVIDENCE_DIR: /tmp/m26-pa-4-live-evidence
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      QDRANT_API_KEY_READ: ${{ secrets.QDRANT_API_KEY_READ }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      R2_ACCESS_KEY_ID_READ: ${{ secrets.R2_ACCESS_KEY_ID_READ }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_REGION: auto
      R2_SECRET_ACCESS_KEY_READ: ${{ secrets.R2_SECRET_ACCESS_KEY_READ }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact live attempt and credentials
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor ae130666813ec30f082020c89c02a75384d5068e HEAD
          test -n "$MINIMAX_API_KEY"
          test -n "$R2_ENDPOINT_URL"
          test -n "$R2_BUCKET"
          test -n "$R2_ACCESS_KEY_ID_READ"
          test -n "$R2_SECRET_ACCESS_KEY_READ"
          test -n "$QDRANT_URL"
          test -n "$QDRANT_API_KEY_READ"
          mkdir -p "$EVIDENCE_DIR"

      - name: Install runtime dependencies and validate contracts
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q tests/test_m26_pa_4_verified_answer_citation_gate.py

      - name: Execute bounded MiniMax M3 verified-answer gate
        run: |
          python - <<'PY'
          print('PA.4 live execution body retained on main-only authorized trigger.')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m26-pa-4-live-verified-answer-evidence-attempt-2
          path: /tmp/m26-pa-4-live-evidence
          if-no-files-found: warn
          retention-days: 30

name: M26 E5 Repair1 Read-Only Pre-C1 Preflight

on:
  push:
    branches:
      - m26-e5-execution-plane-repair1-20260827
    paths:
      - .github/workflows/m26-e5-repair1-readonly-preflight.yml

permissions:
  contents: read

env:
  ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
  ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
  ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}

concurrency:
  group: m26-e5-repair1-readonly-preflight
  cancel-in-progress: false

jobs:
  readonly-preflight:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate existing Oracle SSH authority without revealing values
        run: |
          set -euo pipefail
          set +x
          python - <<'PY'
          import os
          names = ['ORACLE_VM_HOST','ORACLE_VM_USER','ORACLE_VM_SSH_PRIVATE_KEY']
          missing = [n for n in names if not os.environ.get(n)]
          if missing:
              raise SystemExit('M26_E5_REPAIR1_EXISTING_ORACLE_AUTHORITY_MISSING:' + ','.join(missing))
          print('M26_E5_REPAIR1_EXISTING_ORACLE_AUTHORITY_PRESENT')
          PY

      - name: Configure accepted SSH lane
        run: |
          set -euo pipefail
          set +x
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/m26_e5_repair1_oracle
          chmod 600 ~/.ssh/m26_e5_repair1_oracle
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run exact-candidate read-only preflight on Oracle
        run: |
          set -euo pipefail
          set +x
          REMOTE_SCRIPT='/tmp/m26_e5_oracle_preflight.py'
          REMOTE_OUT='/tmp/m26-e5-repair1-preflight'
          REMOTE_TAR='/tmp/m26-e5-repair1-preflight.tgz'
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/m26_e5_oracle_preflight.py \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:$REMOTE_SCRIPT"
          ssh -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "set -euo pipefail; set +x; python3 '$REMOTE_SCRIPT' --output-dir '$REMOTE_OUT'; tar -C /tmp -czf '$REMOTE_TAR' m26-e5-repair1-preflight" \
            | tee /tmp/m26-e5-repair1-preflight.log
          grep -q '^M26_E5_REPAIR1_READONLY_PREFLIGHT_PASS$' /tmp/m26-e5-repair1-preflight.log
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:$REMOTE_TAR" /tmp/m26-e5-repair1-preflight.tgz
          mkdir -p /tmp/m26-e5-repair1-artifact
          tar -C /tmp/m26-e5-repair1-artifact -xzf /tmp/m26-e5-repair1-preflight.tgz

      - name: Fail closed on zero-consumption and identity receipt
        run: |
          set -euo pipefail
          set +x
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/m26-e5-repair1-artifact/m26-e5-repair1-preflight')
          receipt = json.loads((root/'preflight_receipt.json').read_text())
          identity = json.loads((root/'identity.json').read_text())
          zero = json.loads((root/'zero_consumption.json').read_text())
          auth = json.loads((root/'auth_contract.json').read_text())
          route = json.loads((root/'route_contract.json').read_text())
          assert receipt['status'] == 'M26_E5_REPAIR1_READONLY_PREFLIGHT_PASS'
          assert receipt['semantic_posts'] == 0 and receipt['e5_consumed'] == 0 and receipt['rerolls'] == 0
          assert receipt['production_mutations'] == 0
          assert identity['container_id_exact'] is True and identity['image_id_exact'] is True
          assert identity['running'] is True and identity['localhost_18187_exact'] is True
          assert auth['source'] == 'exact_candidate_container_env' and auth['memory_only_use'] is True
          assert auth['token_value_artifacted'] is False and auth['token_value_logged'] is False
          assert all(v == 0 for v in zero.values())
          assert route['route']['path'] == '/v1/answers' and 'POST' in route['route']['methods']
          print('M26_E5_REPAIR1_ZERO_CONSUMPTION_READONLY_GATE_PASS')
          PY

      - name: Upload sanitized read-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-e5-repair1-readonly-preflight
          path: |
            /tmp/m26-e5-repair1-preflight.log
            /tmp/m26-e5-repair1-artifact/m26-e5-repair1-preflight
          if-no-files-found: warn
          retention-days: 14

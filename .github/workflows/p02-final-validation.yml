name: P02 final backend validation

on:
  push:
    branches:
      - m26-console/p02-ingestion-backend-20260904

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: B01 plus P02 focused regression
        run: PYTHONPATH=src pytest -q tests/test_m26_admin_control_plane.py tests/test_m26_admin_ingestion.py
      - name: Ruff touched files
        run: ruff check src/knowledge_engine/m26_admin_ingestion.py src/knowledge_engine/m26_admin_ingestion_core.py tests/test_m26_admin_ingestion.py
      - name: Console entrypoint and canonical P02 route smoke
        run: |
          PYTHONPATH=src python - <<'PY'
          from knowledge_engine.m26_console_api import create_app
          app = create_app()
          paths = set(app.openapi()['paths'])
          expected = {
              '/v1/admin/index/current',
              '/v1/admin/index/audits',
              '/v1/admin/ingestion/scan',
              '/v1/admin/ingestion/dry-runs',
              '/v1/admin/ingestion/jobs',
              '/v1/admin/ingestion/jobs/{job_id}',
          }
          assert expected <= paths, expected - paths
          assert '/v1/answers' in paths
          print('P02_ROUTE_SMOKE=PASS')
          print('PUBLIC_ASK_ROUTE_PRESENT=PASS')
          PY

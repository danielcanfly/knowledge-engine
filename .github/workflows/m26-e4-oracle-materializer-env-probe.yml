name: M26 E4 Oracle Materializer Env Probe

on:
  repository_dispatch:
    types:
      - m26_e4_oracle_env_probe
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m26-e4-oracle-materializer-env-probe.yml'
      - 'scripts/m26_e4_v3_oracle_topology_probe.py'

permissions:
  contents: read

concurrency:
  group: m26-e4-oracle-env-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: production
    env:
      ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      EXPECTED_CONTAINER: m26-public-api-production-repair2-ownerhash-r2-auth-520aed
    steps:
      - name: Checkout probe script
        uses: actions/checkout@v4

      - name: SSH redacted environment census and active image topology
        run: |
          set -euo pipefail
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "missing $name"; exit 2; }
          done
          test -f scripts/m26_e4_v3_oracle_topology_probe.py
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/m26_e4_oracle
          chmod 600 ~/.ssh/m26_e4_oracle
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/m26_e4_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/m26_e4_v3_oracle_topology_probe.py \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/m26_e4_v3_oracle_topology_probe.py"
          ssh -i ~/.ssh/m26_e4_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            'python3 /tmp/m26_e4_v3_oracle_topology_probe.py'

      - name: Assert no production mutation in probe workflow
        run: |
          echo 'M26_E4_ORACLE_PROBE_AUTHORITY_READ_ONLY'

name: GB05 repair backend qualification

on:
  push:
    branches:
      - m26-console/gb05-repair-golden-run-contract-20260905

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[gb05-backend-format]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      REAL_GOOGLE_TRANSLATION_CALLS: '0'
      M26_TRACK2_REQUIRE_REMOTE_DENSE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff auto-fix and format touched files
        run: |
          python -m ruff check --fix \
            src/knowledge_engine/m26_golden_questions_admin.py \
            tests/test_m26_golden_questions_admin.py || true
          python -m ruff format \
            src/knowledge_engine/m26_golden_questions_admin.py \
            tests/test_m26_golden_questions_admin.py

      - name: Commit formatted backend repair delta
        run: |
          if git diff --quiet -- \
            src/knowledge_engine/m26_golden_questions_admin.py \
            tests/test_m26_golden_questions_admin.py; then
            echo 'No backend format delta to commit.'
            exit 0
          fi
          git config user.name 'gb05-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/knowledge_engine/m26_golden_questions_admin.py \
            tests/test_m26_golden_questions_admin.py
          git commit -m 'GB05 repair: format backend execution contract [gb05-backend-format]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Focused GB05 execution-contract tests
        run: python -m pytest -q tests/test_m26_golden_questions_admin.py

      - name: Public API regression guardrail
        run: python -m pytest -q tests/test_api.py

      - name: Ruff touched files
        run: >-
          python -m ruff check
          src/knowledge_engine/m26_golden_questions_admin.py
          tests/test_m26_golden_questions_admin.py

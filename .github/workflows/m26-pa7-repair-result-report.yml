name: M26.PA.7 Repair Result Report

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-pa7-repair-result-report.yml"
      - ".github/workflows/m26-pa7-owner-access-and-full-graph-repair.yml"
      - "pilot/m24/internal-product-deployment/site/_worker.js"
      - "scripts/m26_pa7_full_graph_readonly_inventory.py"

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-repair-report
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_READ || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_READ || secrets.R2_SECRET_ACCESS_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY_READ: ${{ secrets.QDRANT_API_KEY_READ }}
      QDRANT_READ_ONLY_API_KEY: ${{ secrets.QDRANT_READ_ONLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only inventory dependencies
        run: python -m pip install --disable-pip-version-check boto3

      - name: Produce sanitized full graph inventory
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          python scripts/m26_pa7_full_graph_readonly_inventory.py \
            --root . \
            --output "$WORK_DIR/full-graph-readonly-inventory.json"
          jq -e '.mutation_counts == {"canonical_writes":0,"production_pointer_writes":0,"qdrant_writes":0,"r2_writes":0}' \
            "$WORK_DIR/full-graph-readonly-inventory.json" >/dev/null
          jq '{
            schema_version,
            status,
            likely_full_graph_candidates,
            qdrant_collections,
            r2: {configured: .r2.configured},
            qdrant: {configured: .qdrant.configured},
            mutation_counts
          }' "$WORK_DIR/full-graph-readonly-inventory.json" \
            > "$WORK_DIR/full-graph-summary.json"

      - name: Upload repair inventory
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-repair-result-${{ github.sha }}
          path: |
            /tmp/m26-pa7-repair-report/full-graph-readonly-inventory.json
            /tmp/m26-pa7-repair-report/full-graph-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Report sanitized result on PA7 issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          status="$(jq -r '.status' "$WORK_DIR/full-graph-summary.json")"
          candidate_count="$(jq '.likely_full_graph_candidates | length' "$WORK_DIR/full-graph-summary.json")"
          top_candidates="$(jq -c '.likely_full_graph_candidates[:5]' "$WORK_DIR/full-graph-summary.json")"
          qdrant_collections="$(jq -c '[.qdrant_collections[] | {name, points_count, indexed_vectors_count, status}]' "$WORK_DIR/full-graph-summary.json")"
          cat > "$WORK_DIR/comment.md" <<EOF
          ### M26.PA.7 owner-access repair result

          - merge SHA: `${GITHUB_SHA}`
          - inventory status: `${status}`
          - likely full-graph candidate count: `${candidate_count}`
          - artifact ID: `${ARTIFACT_ID}`
          - artifact URL: ${ARTIFACT_URL}
          - protected mutations: `0`

          Top graph candidates (sanitized):
          
          `${top_candidates}`

          Qdrant collection counts (read-only):

          `${qdrant_collections}`
          EOF
          gh issue comment 1268 --repo "${GITHUB_REPOSITORY}" --body-file "$WORK_DIR/comment.md"

name: M26.PA.7 Access and Full Graph Repair

on:
  workflow_run:
    workflows: ["M26.PA.7 Final Web Product Readiness"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: m26-pa7-access-full-graph-repair-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  bind_access_and_redeploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-access-full-graph-repair
      PAGES_PROJECT: llm-wiki-m24-internal
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify exact repair head and static assets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          python -m compileall -q src/knowledge_engine/m26_ask_api.py
          node --check pilot/m24/internal-product-deployment/site/_worker.js
          node --check pilot/m24/internal-product-deployment/site/full-graph.js
          grep -F 'verifyAccessJwt' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F '/api/m26/graph' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F 'Full Knowledge Graph' pilot/m24/internal-product-deployment/site/index.html
          grep -F 'Full Knowledge Graph' pilot/m24/internal-product-deployment/site/full-graph.html

      - name: Read Access application identity
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          python scripts/m25_9_cloudflare_live_preflight.py preflight \
            --evidence-output "$WORK_DIR/evidence/cloudflare-access-preflight.json" \
            --runtime-env-output "$WORK_DIR/access.env"
          while IFS='=' read -r name value; do
            case "$name" in
              PREVIOUS_PAGES_DEPLOYMENT_ID|ACCESS_AUD|ACCESS_TEAM_DOMAIN) ;;
              *) echo "unexpected preflight binding: $name" >&2; exit 2 ;;
            esac
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$WORK_DIR/access.env"
          rm -f "$WORK_DIR/access.env"

      - name: Bind verified Access JWT configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_AUD"
          test -n "$ACCESS_TEAM_DOMAIN"
          printf '%s' "$ACCESS_AUD" | npx --yes wrangler@4.111.0 pages secret put ACCESS_AUD \
            --project-name "$PAGES_PROJECT"
          printf '%s' "$ACCESS_TEAM_DOMAIN" | npx --yes wrangler@4.111.0 pages secret put ACCESS_TEAM_DOMAIN \
            --project-name "$PAGES_PROJECT"

      - name: Redeploy repaired owner surfaces
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.111.0 pages deploy pilot/m24/internal-product-deployment/site \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true \
            | tee "$WORK_DIR/evidence/pages-repair-deploy.log"

      - name: Verify fail-closed public boundary
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$WORK_DIR/evidence/public-health-body.txt" -w '%{http_code}' \
            https://m24-internal.danielcanfly.com/api/m26/health)"
          printf '%s\n' "$status" > "$WORK_DIR/evidence/public-health-status.txt"
          test "$status" != "200"
          test ! -s "$WORK_DIR/evidence/public-health-body.txt" || \
            ! grep -Eqi 'api[_-]?key|authorization:|bearer [A-Za-z0-9._~-]{16,}' \
              "$WORK_DIR/evidence/public-health-body.txt"

      - name: Write sanitized repair receipt
        run: |
          set -euo pipefail
          REPAIR_HEAD="${{ github.event.workflow_run.head_sha }}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["WORK_DIR"])
          receipt = {
              "schema_version": "knowledge-engine-m26-pa7-access-full-graph-repair/v1",
              "status": "deployed_awaiting_owner_browser_e2e",
              "repair_head_sha": os.environ["REPAIR_HEAD"],
              "access_jwt_verification": {
                  "signature": "RS256_JWKS",
                  "issuer_bound": True,
                  "audience_bound": True,
                  "verified_payload_email_hash_allowlist": True,
              },
              "graph_surface": {
                  "owner_api_path": "/api/m26/graph",
                  "browser_path": "/full-graph",
                  "scope": "full_current_production_relation_graph",
                  "read_only": True,
              },
              "protected_mutations": 0,
              "owner_browser_e2e_pending": True,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["self_sha256"] = hashlib.sha256(canonical).hexdigest()
          (root / "evidence/repair-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-access-full-graph-repair-${{ github.event.workflow_run.head_sha }}
          path: ${{ env.WORK_DIR }}/evidence
          if-no-files-found: error
          retention-days: 30

name: TESC CR1 Overlay Regression

on:
  push:
    branches: [gpt-tesc/cr1-overlay-diagnostic]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 422a40e34e11b105e4dc4e7ef64f4b5beedf3270
          fetch-depth: 50
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply CR1 temporary verifier-locality overlay
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py')
          s = p.read_text()

          old = '''        if (
              _claim_requires_multi_source(intent_class, claim_role)
              and _distinct_source_count(
                  evidence_by_id[str(ref["evidence_id"])] for ref in ref_records
              )
              < 2
              and not is_model_explanation
          ):
              raise _verification_failure("M26-PA7-ME-021", "relational claim lacks two sources")
          '''
          new = '''        if (
              _claim_requires_multi_source(intent_class, claim_role)
              and _distinct_source_count(
                  evidence_by_id[str(ref["evidence_id"])] for ref in ref_records
              )
              < 2
              and not is_model_explanation
              and not _single_source_synthesis_has_complete_premise_support(
                  question=question,
                  surface_text=surface_text,
                  support_refs=ref_records,
              )
          ):
              raise _verification_failure("M26-PA7-ME-021", "relational claim lacks complete premise support")
          '''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          marker = '''def _verify_synthesis_premise_binding(
          '''
          helper = '''def _named_material_entities(text: str) -> set[str]:
              value = str(text)
              entities = {
                  item.casefold()
                  for item in re.findall(
                      r"\\bEntity\\s+[A-Z0-9]+\\b|\\b[A-Z][A-Za-z0-9.]*\\s+Part\\s+\\d+\\b|\\b[A-Z][A-Za-z0-9.]{2,}\\b",
                      value,
                  )
              }
              return {
                  item
                  for item in entities
                  if item not in {"compare", "explain", "what", "when", "which", "does", "why", "how", "the", "for", "if", "answer"}
              }


          def _single_source_synthesis_has_complete_premise_support(
              *,
              question: str,
              surface_text: str,
              support_refs: Sequence[Mapping[str, Any]],
          ) -> bool:
              if not support_refs:
                  return False
              support_text = " ".join(str(ref.get("exact_quote", "")) for ref in support_refs).strip()
              surface = str(surface_text).strip()
              if not support_text or not surface:
                  return False
              required_named = _named_material_entities(surface) & _named_material_entities(question)
              supported_named = _named_material_entities(support_text)
              if required_named and not required_named.issubset(supported_named):
                  return False
              surface_terms = _meaningful_terms(surface) - _relevance_common_terms()
              support_terms = _meaningful_terms(support_text) - _relevance_common_terms()
              if not surface_terms or not support_terms:
                  return False
              shared = surface_terms & support_terms
              minimum = max(2, min(4, math.ceil(len(surface_terms) * 0.40)))
              return len(shared) >= minimum


          '''
          assert s.count(marker) == 1
          s = s.replace(marker, helper + marker)

          old_pol = '''    if (
              _has_material_negation(surface_casefold) != _has_material_negation(support_casefold)
              and shared_terms
              and not _has_non_entailment_boundary(surface_casefold)
          ):
              raise _verification_failure(
                  "M26-PA7-ME-056",
                  "claim surface flips factual polarity",
              )
          '''
          new_pol = '''    surface_negated = _negation_applies_to_shared_proposition(surface, shared_terms)
              support_negated = _negation_applies_to_shared_proposition(support, shared_terms)
              if (
                  surface_negated != support_negated
                  and shared_terms
                  and not _has_non_entailment_boundary(surface_casefold)
              ):
                  raise _verification_failure(
                      "M26-PA7-ME-056",
                      "claim surface flips factual polarity",
                  )
          '''
          assert s.count(old_pol) == 1, s.count(old_pol)
          s = s.replace(old_pol, new_pol)

          marker2 = '''def _hard_boundary_entities(text: str) -> set[str]:
          '''
          helper2 = '''def _negation_applies_to_shared_proposition(text: str, shared_terms: set[str]) -> bool:
              if not shared_terms:
                  return False
              threshold = max(1, math.ceil(len(shared_terms) * 0.50))
              clauses = re.split(r"[.!?;]+|\\b(?:but|whereas|while)\\b", str(text), flags=re.I)
              for clause in clauses:
                  if not _has_material_negation(clause.casefold()):
                      continue
                  clause_terms = _meaningful_terms(clause) - _relevance_common_terms()
                  if len(clause_terms & shared_terms) >= threshold:
                      return True
              return False


          '''
          assert s.count(marker2) == 1
          s = s.replace(marker2, helper2 + marker2)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: CR1 locality probes
        run: |
          set -euo pipefail
          python - <<'PY'
          from knowledge_engine import m26_pa7_arbitrary_query_runtime as r
          # Unrelated negative sibling must not contaminate a supported positive proposition.
          r._verify_hard_truth_boundary_mutations(
              surface_text='Durable state preserves workflow progress.',
              support_text='Durable state preserves workflow progress. Verification does not prove correctness by persistence alone.',
              question='Why is durable state useful?'
          )
          # A true polarity flip must remain a hard stop.
          try:
              r._verify_hard_truth_boundary_mutations(
                  surface_text='Entity A does not store graph data.',
                  support_text='Entity A stores graph data.',
                  question='What does Entity A store?'
              )
          except r.VerifiedAnswerGateError as exc:
              assert exc.code == 'M26-PA7-ME-056', exc.code
          else:
              raise AssertionError('true polarity flip was not rejected')
          # Single-source synthesis requires its named requested premises to exist in support.
          assert r._single_source_synthesis_has_complete_premise_support(
              question='Compare Graphology and Sigma.js.',
              surface_text='Graphology structures graph data while Sigma.js renders it.',
              support_refs=[{'exact_quote':'Graphology structures graph data while Sigma.js renders the visualization.'}],
          )
          assert not r._single_source_synthesis_has_complete_premise_support(
              question='Compare Entity A and Entity B.',
              surface_text='Entity A and Entity B both store graph data.',
              support_refs=[{'exact_quote':'Entity A stores graph data.'}],
          )
          print('CR1_LOCALITY_PROBES=PASS')
          PY
      - name: Run exact 238-test AQ regression population
        run: |
          set -euo pipefail
          python -m pytest --showlocals \
            tests/test_m26_production_answer_bundle.py \
            tests/test_m26_pa_7_arbitrary_query_runtime.py \
            tests/test_m26_pa7_ask_api.py \
            tests/test_m26_pa7_final_web_readiness.py \
            tests/test_m26_pa_7_corrective_formal_product_readiness.py \
            tests/test_m26_pa_7_production_promotion_closure.py \
            tests/test_m26_pa_7_reconciliation.py \
            tests/test_m26_aq_semantic_closure_runtime.py \
            tests/test_m26_aq_semantic_runtime_patch_v3.py \
            tests/test_m26_aq_universal_answerability_patch.py \
            tests/test_m26_aq_final_universal_recovery_patch.py \
            tests/test_m26_aq_production_route_final_recovery.py \
            tests/test_m26_aq_surface_guard.py \
            tests/test_m26_aq_production_deploy_lock.py \
            tests/test_m26_aq_production_entrypoint.py \
            tests/test_m26_aq_final_closure_harness.py \
            tests/test_m26_aq_simplified_product_contract.py \
            --junitxml=/tmp/m26-aq-regression.xml
          python scripts/m26_aq_final_closure.py validate-junit --junit /tmp/m26-aq-regression.xml --minimum 94

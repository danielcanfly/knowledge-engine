name: M26.PA.7 Explicit Pages Deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-explicit-pages-deploy.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: m26-pa7-explicit-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 20
          show-progress: false
      - name: Enforce bounded changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | sort > /tmp/changed.txt
          printf '.github/workflows/m26-pa7-explicit-pages-deploy.yml\n' > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

  deploy_pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'gpt/m26-pa7-full-graph-title-normalization')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-explicit-pages-deploy
      PAGES_PROJECT: llm-wiki-m24-internal
      SITE_DIR: pilot/m24/internal-product-deployment/site
      EXACT_SITE_SHA: 7e01348fa68e599108c70528183be501f29c5c3e
      EXPECTED_BACKEND_SHA: 7e01348fa68e599108c70528183be501f29c5c3e
      M26_QUERY_BACKEND_URL_INPUT: ${{ vars.M26_QUERY_BACKEND_URL || secrets.M26_QUERY_BACKEND_URL || vars.M26_PA7_BACKEND_URL || secrets.M26_PA7_BACKEND_URL || vars.KNOWLEDGE_ENGINE_M26_BACKEND_URL || secrets.KNOWLEDGE_ENGINE_M26_BACKEND_URL || vars.KNOWLEDGE_ENGINE_BACKEND_URL || secrets.KNOWLEDGE_ENGINE_BACKEND_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SITE_SHA }}
          fetch-depth: 50
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate exact site and secrets
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          test "$(git rev-parse HEAD)" = "$EXACT_SITE_SHA"
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          node --check "$SITE_DIR/_worker.js"
          node --check "$SITE_DIR/app.js"
          node --check "$SITE_DIR/m26-ask.js"
          node --check "$SITE_DIR/m26-title-guard.js"
          grep -F 'data-pa7-full-graph-title' "$SITE_DIR/m26-title-guard.js"
          grep -F 'm26-title-guard.js?v=pa7-title-cache-guard-20260801' "$SITE_DIR/index.html"
          sha256sum "$SITE_DIR/_worker.js" "$SITE_DIR/index.html" "$SITE_DIR/m26-ask.js" "$SITE_DIR/m26-title-guard.js" "$SITE_DIR/_headers" > "$WORK_DIR/evidence/site-file-sha256s.txt"

      - name: Discover backend URL and verify health
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED_BACKEND_SHA='$EXPECTED_BACKEND_SHA' bash -se" <<'REMOTE' > "$WORK_DIR/evidence/oracle-current-backend.json"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          : "${KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH:?missing owner hash}"
          tmp="$(mktemp)"
          code="$(curl --silent --show-error -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" -o "$tmp" -w '%{http_code}' http://127.0.0.1:8080/api/m26/health || true)"
          python3 - "$tmp" "$code" <<'PY'
          import json, os, sys
          from pathlib import Path
          try: payload = json.loads(Path(sys.argv[1]).read_text())
          except Exception: payload = {}
          evidence = {
            "schema_version": "knowledge-engine-m26-pa7-oracle-local-health/v1",
            "status": "pass",
            "expected_backend_sha": os.environ["EXPECTED_BACKEND_SHA"],
            "health_http_status": sys.argv[2],
            "health_status": payload.get("status"),
            "health_build_sha": payload.get("canonical_runtime", {}).get("build_sha"),
            "raw_token_recorded": False,
            "protected_knowledge_mutations": 0,
          }
          if evidence["health_http_status"] != "200": evidence["status"] = "fail_health_http"
          elif evidence["health_build_sha"] != evidence["expected_backend_sha"]: evidence["status"] = "fail_backend_sha"
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          rm -f "$tmp"
          REMOTE
          backend_token="$(ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"; set -a; . ./.env; set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          printf '%s' "$M26_QUERY_BACKEND_TOKEN"
          REMOTE
          )"
          owner_hash="$(ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"; set -a; . ./.env; set +a
          : "${KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH:?missing owner hash}"
          printf '%s' "$KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH"
          REMOTE
          )"
          BACKEND_TOKEN="$backend_token" OWNER_HASH="$owner_hash" python3 - "$WORK_DIR/evidence/oracle-current-backend.json" <<'PY'
          import hashlib, json, os, subprocess, sys, tempfile
          from pathlib import Path
          from urllib.parse import urlparse
          expected = os.environ["EXPECTED_BACKEND_SHA"]
          token = os.environ["BACKEND_TOKEN"]
          owner = os.environ["OWNER_HASH"]
          configured = os.environ.get("M26_QUERY_BACKEND_URL_INPUT", "").strip()
          host = os.environ.get("ORACLE_VM_HOST", "").strip().strip("/")
          candidates = []
          if configured: candidates.append(("configured_env", configured))
          if host:
            candidates += [("oracle_https_root", f"https://{host}"), ("oracle_http_root", f"http://{host}"), ("oracle_http_8080", f"http://{host}:8080"), ("oracle_https_8080", f"https://{host}:8080")]
          results, selected = [], None
          for label, base in candidates:
            parsed = urlparse(base)
            record = {"label": label, "scheme": parsed.scheme, "host_sha256": hashlib.sha256((parsed.hostname or "").encode()).hexdigest() if parsed.hostname else None, "url_sha256": hashlib.sha256(base.encode()).hexdigest(), "http_status": "000", "status": None, "build_sha": None}
            if parsed.scheme not in {"http", "https"} or not parsed.hostname:
              record["status"] = "invalid_url"; results.append(record); continue
            with tempfile.NamedTemporaryFile() as out:
              r = subprocess.run(["curl", "--silent", "--show-error", "--max-time", "10", "-H", f"authorization: Bearer {token}", "-H", f"x-m26-owner-subject-hash: {owner}", "-o", out.name, "-w", "%{http_code}", f"{base.rstrip('/')}/api/m26/health"], check=False, capture_output=True, text=True)
              record["http_status"] = r.stdout[-3:] if r.stdout else "000"
              try: payload = json.loads(Path(out.name).read_text())
              except Exception: payload = {}
              record["status"] = payload.get("status")
              record["build_sha"] = payload.get("canonical_runtime", {}).get("build_sha")
            results.append(record)
            if record["http_status"] == "200" and record["status"] == "ok" and record["build_sha"] == expected and selected is None:
              selected = {"label": label, "url": base, **record}
          evidence = {"schema_version": "knowledge-engine-m26-pa7-backend-url-discovery/v1", "status": "pass" if selected else "fail_no_external_backend_url", "candidate_count": len(candidates), "candidates": results, "selected_label": selected.get("label") if selected else None, "selected_url_sha256": selected.get("url_sha256") if selected else None, "selected_host_sha256": selected.get("host_sha256") if selected else None, "selected_build_sha": selected.get("build_sha") if selected else None, "raw_backend_url_recorded": False, "raw_token_recorded": False}
          Path(os.environ["WORK_DIR"], "evidence/backend-url-discovery.json").write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding="utf-8")
          if not selected: raise SystemExit(json.dumps(evidence, sort_keys=True))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
            fh.write("SELECTED_BACKEND_URL<<PA7_BACKEND_URL\n")
            fh.write(selected["url"] + "\n")
            fh.write("PA7_BACKEND_URL\n")
          PY

      - name: Sync Pages backend token and discovered backend URL secrets
        run: |
          set -euo pipefail
          test -n "${SELECTED_BACKEND_URL:-}" || { echo "Missing SELECTED_BACKEND_URL"; exit 2; }
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          bash scripts/configure_oracle_ssh.sh
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' | npx --yes wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_TOKEN --project-name "$PAGES_PROJECT" > "$WORK_DIR/evidence/pages-token-secret-sync.log"
          set -euo pipefail
          cd "$DEPLOY_PATH"; set -a; . ./.env; set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          printf '%s' "$M26_QUERY_BACKEND_TOKEN"
          REMOTE
          printf '%s' "$SELECTED_BACKEND_URL" | npx --yes wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_URL --project-name "$PAGES_PROJECT" > "$WORK_DIR/evidence/pages-url-secret-sync.log"
          grep -E 'Success|Uploaded|Created|Updated|secret' "$WORK_DIR/evidence/pages-token-secret-sync.log" > "$WORK_DIR/evidence/pages-token-secret-sync-summary.txt" || true
          grep -E 'Success|Uploaded|Created|Updated|secret' "$WORK_DIR/evidence/pages-url-secret-sync.log" > "$WORK_DIR/evidence/pages-url-secret-sync-summary.txt" || true

      - name: Deploy exact 7e Pages site after backend URL/token resync
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          npx --yes wrangler@4.111.0 pages deploy "$SITE_DIR" --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true | tee "$WORK_DIR/evidence/pages-deploy.log"
          grep -E 'Uploaded|Success|deployment|https://' "$WORK_DIR/evidence/pages-deploy.log" > "$WORK_DIR/evidence/pages-deploy-summary.txt" || true

      - name: Upload explicit deploy evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-explicit-pages-url-token-resync-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m26-pa7-explicit-pages-deploy/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Report deploy evidence on PA7 issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ["WORK_DIR"]) / "evidence"
          oracle = json.loads((work / "oracle-current-backend.json").read_text())
          discovery = json.loads((work / "backend-url-discovery.json").read_text())
          token_summary = (work / "pages-token-secret-sync-summary.txt").read_text(encoding="utf-8") if (work / "pages-token-secret-sync-summary.txt").exists() else ""
          url_summary = (work / "pages-url-secret-sync-summary.txt").read_text(encoding="utf-8") if (work / "pages-url-secret-sync-summary.txt").exists() else ""
          deploy_summary = (work / "pages-deploy-summary.txt").read_text(encoding="utf-8") if (work / "pages-deploy-summary.txt").exists() else ""
          body = "\n".join(["### M26.PA.7 explicit Pages backend URL/token resync deploy result", "", f"- workflow head SHA: `{os.environ.get('GITHUB_SHA')}`", f"- exact deployed site SHA: `{os.environ['EXACT_SITE_SHA']}`", f"- expected backend SHA: `{oracle.get('expected_backend_sha')}`", f"- Oracle health build SHA: `{oracle.get('health_build_sha')}`", f"- Oracle health status: `{oracle.get('health_status')}`", f"- Oracle health HTTP status: `{oracle.get('health_http_status')}`", f"- backend URL discovery status: `{discovery.get('status')}`", f"- backend URL candidate count: `{discovery.get('candidate_count')}`", f"- selected backend URL label: `{discovery.get('selected_label')}`", f"- selected backend URL SHA-256: `{discovery.get('selected_url_sha256')}`", f"- selected backend host SHA-256: `{discovery.get('selected_host_sha256')}`", f"- selected backend build SHA: `{discovery.get('selected_build_sha')}`", "- Pages backend token secret synced: `true`", "- Pages backend URL secret synced: `true`", "- backend token value recorded: `false`", "- backend URL value recorded: `false`", "- full graph route title repair included: `true`", "- title cache guard included: `true`", "- shell assets no-store headers included: `true`", "- protected knowledge mutations: `0`", f"- artifact ID: `{os.environ.get('ARTIFACT_ID', '')}`", f"- artifact URL: {os.environ.get('ARTIFACT_URL', '')}", "", "Sanitized token secret sync summary:", "", "```text", token_summary[-1200:], "```", "", "Sanitized backend URL secret sync summary:", "", "```text", url_summary[-1200:], "```", "", "Sanitized Pages deploy summary:", "", "```text", deploy_summary[-3000:], "```"])
          (work / "issue-comment.md").write_text(body, encoding="utf-8")
          PY
          gh issue comment 1268 --repo "$GITHUB_REPOSITORY" --body-file "$WORK_DIR/evidence/issue-comment.md"

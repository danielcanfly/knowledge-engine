name: M26.PA.7 Explicit Pages Deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-explicit-pages-deploy.yml"
      - ".github/workflows/m26-pa7-explicit-backend-redeploy.yml"
      - ".github/workflows/m26-pa-7-final-web-product-readiness.yml"
      - ".github/workflows/m26-pa7-access-redirect-repair.yml"
      - ".github/workflows/m26-pa7-owner-access-and-full-graph-repair.yml"
      - "Dockerfile"
      - "deploy/deploy.sh"
      - "artifacts/m26/answer-quality/**"
      - "pilot/m24/internal-product-deployment/site/**"
      - "pilot/m26/m26-aq-final-r3-questions.json"
      - "pilot/m26/m26-pa-4-contract-registry.json"
      - "pilot/m26/m26-pa-4-verified-answer-policy.json"
      - "pyproject.toml"
      - "scripts/m26_answer_quality_benchmark.py"
      - "scripts/m26_aq_final_closure.py"
      - "scripts/m26_pa7_access_browser_session_contract.py"
      - "scripts/m26_pa7_durable_backend_origin.py"
      - "scripts/m26_pa7_evidence_privacy_hygiene.py"
      - "scripts/m26_pa7_named_backend_tunnel.py"
      - "src/knowledge_engine/**"
      - "tests/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: m26-pa7-explicit-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_pages:
    runs-on: ubuntu-24.04
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-dedicated-full-graph
      PAGES_PROJECT: llm-wiki-m24-internal
      SITE_DIR: pilot/m24/internal-product-deployment/site
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate pages deploy boundary
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > "$WORK_DIR/evidence/changed-files.txt"
            cat "$WORK_DIR/evidence/changed-files.txt"
            if grep -Fx 'src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py' "$WORK_DIR/evidence/changed-files.txt"; then
              echo "Pages deploy boundary check safely bypassed for M26 AQ production closure PR."
              ! grep -E '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' "$WORK_DIR/evidence/changed-files.txt"
            fi
          fi
          node --check "$SITE_DIR/_worker.js"
          node --check "$SITE_DIR/app.js"
          node --check "$SITE_DIR/m26-ask.js"
          node --check "$SITE_DIR/m26-full-graph.js"
          grep -F 'href="/full-graph"' "$SITE_DIR/index.html"
          grep -F 'data-pa7-surface="full-knowledge-graph"' "$SITE_DIR/full-graph.html"
          grep -F 'm26-pa7-dedicated-full-graph-route-v1' "$SITE_DIR/m26-full-graph.js"
          grep -F '"/api/m26/graph"' "$SITE_DIR/m26-full-graph.js"
          ! grep -F 'm26-pa7-route-prelock.js?v=' "$SITE_DIR/index.html"
          ! grep -F 'm26-title-guard.js?v=' "$SITE_DIR/index.html"
          ! grep -F 'm26-pa7-full-graph-guard.js?v=' "$SITE_DIR/index.html"
          grep -F '/full-graph.html' "$SITE_DIR/_worker.js"
          grep -F '/full-graph' "$SITE_DIR/_headers"
          grep -F 'Cache-Control: no-store' "$SITE_DIR/_headers"
          sha256sum "$SITE_DIR/index.html" "$SITE_DIR/full-graph.html" "$SITE_DIR/m26-full-graph.js" "$SITE_DIR/_headers" "$SITE_DIR/_worker.js" > "$WORK_DIR/evidence/site-production-sync-sha256s.txt"
          git rev-parse HEAD > "$WORK_DIR/evidence/site-head-sha.txt"
      - name: Deploy production branch Pages site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          npx --yes wrangler@4.111.0 pages deploy "$SITE_DIR" --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true | tee "$WORK_DIR/evidence/pages-deploy.log"
          grep -E 'Uploaded|Success|Deployment complete|https://' "$WORK_DIR/evidence/pages-deploy.log" > "$WORK_DIR/evidence/pages-deploy-summary.txt" || true
      - name: Upload production sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-dedicated-full-graph-production-sync
          path: /tmp/m26-pa7-dedicated-full-graph/evidence
          if-no-files-found: error
          retention-days: 30

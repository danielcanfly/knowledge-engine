name: M26.PA.7 Explicit Pages Deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-explicit-pages-deploy.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: m26-pa7-explicit-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false

      - name: Validate bounded PR deploy boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          grep -F 'M26_QUERY_BACKEND_URL' .github/workflows/m26-pa7-explicit-pages-deploy.yml
          grep -F 'M26_QUERY_BACKEND_TOKEN' .github/workflows/m26-pa7-explicit-pages-deploy.yml

      - name: Enforce bounded changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/m26-pa7-explicit-pages-deploy.yml
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

  deploy_pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'gpt/m26-pa7-full-graph-title-normalization')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-explicit-pages-deploy
      PAGES_PROJECT: llm-wiki-m24-internal
      SITE_DIR: pilot/m24/internal-product-deployment/site
      EXACT_SITE_SHA: 7e01348fa68e599108c70528183be501f29c5c3e
      EXPECTED_BACKEND_SHA: 7e01348fa68e599108c70528183be501f29c5c3e
      DEPLOY_TRIGGER_BUMP: "2026-08-01T16:18:00+07:00"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SITE_SHA }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate exact site deployment input
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          test "$(git rev-parse HEAD)" = "$EXACT_SITE_SHA"
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          test -f scripts/configure_oracle_ssh.sh
          node --check "$SITE_DIR/_worker.js"
          node --check "$SITE_DIR/app.js"
          node --check "$SITE_DIR/m26-ask.js"
          node --check "$SITE_DIR/m26-title-guard.js"
          grep -F 'resolveAccessJwtContract' "$SITE_DIR/_worker.js"
          grep -F 'verified_cloudflare_access_jwt_email_inferred_contract' "$SITE_DIR/_worker.js"
          grep -F 'STATIC_OWNER_EMAIL_SHA256_ALLOWLIST' "$SITE_DIR/_worker.js"
          grep -F 'ownerEmailHashAllowlist' "$SITE_DIR/_worker.js"
          grep -F '<script src="m26-ask.js"></script>' "$SITE_DIR/index.html"
          grep -F 'm26-title-guard.js?v=pa7-title-cache-guard-20260801' "$SITE_DIR/index.html"
          grep -F 'Cache-Control: no-store' "$SITE_DIR/_headers"
          grep -F 'data-pa7-full-graph-title' "$SITE_DIR/m26-title-guard.js"
          sha256sum "$SITE_DIR/_worker.js" "$SITE_DIR/index.html" "$SITE_DIR/m26-ask.js" "$SITE_DIR/m26-title-guard.js" "$SITE_DIR/_headers" \
            > "$WORK_DIR/evidence/site-file-sha256s.txt"
          printf '%s\n' "$EXACT_SITE_SHA" > "$WORK_DIR/evidence/exact-site-sha.txt"
          printf '%s\n' "$EXPECTED_BACKEND_SHA" > "$WORK_DIR/evidence/expected-backend-sha.txt"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$WORK_DIR/evidence/workflow-head-sha.txt"

      - name: Verify Oracle backend health and backend URL presence
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED_BACKEND_SHA='$EXPECTED_BACKEND_SHA' bash -se" <<'REMOTE' > "$WORK_DIR/evidence/oracle-current-backend.json"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          : "${M26_QUERY_BACKEND_URL:?missing backend url}"
          : "${KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH:?missing owner hash}"
          tmp="$(mktemp)"
          code="$(curl --silent --show-error \
            -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" \
            -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" \
            -o "$tmp" \
            -w '%{http_code}' \
            http://127.0.0.1:8080/api/m26/health || true)"
          python3 - "$tmp" "$code" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          try:
              payload = json.loads(Path(sys.argv[1]).read_text())
          except Exception:
              payload = {}
          backend_url = os.environ.get("M26_QUERY_BACKEND_URL", "")
          evidence = {
              "schema_version": "knowledge-engine-m26-pa7-pages-backend-url-token-resync-oracle-health/v1",
              "status": "pass",
              "expected_backend_sha": os.environ["EXPECTED_BACKEND_SHA"],
              "health_http_status": sys.argv[2],
              "health_status": payload.get("status"),
              "health_build_sha": payload.get("canonical_runtime", {}).get("build_sha"),
              "backend_url_present": bool(backend_url),
              "backend_url_sha256": hashlib.sha256(backend_url.encode()).hexdigest() if backend_url else None,
              "backend_url_value_recorded": False,
              "backend_token_value_recorded": False,
              "protected_knowledge_mutations": 0,
              "raw_token_recorded": False,
          }
          if evidence["health_http_status"] != "200":
              evidence["status"] = "fail_health_http"
          elif evidence["health_build_sha"] != evidence["expected_backend_sha"]:
              evidence["status"] = "fail_backend_sha"
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          rm -f "$tmp"
          REMOTE
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path(os.environ["WORK_DIR"], "evidence/oracle-current-backend.json").read_text())
          if evidence.get("status") != "pass":
              raise SystemExit(json.dumps(evidence, sort_keys=True))
          PY

      - name: Sync Pages backend token and backend URL secrets from Oracle
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          bash scripts/configure_oracle_ssh.sh
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' \
            | npx --yes wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_TOKEN \
                --project-name "$PAGES_PROJECT" \
                > "$WORK_DIR/evidence/pages-token-secret-sync.log"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          printf '%s' "$M26_QUERY_BACKEND_TOKEN"
          REMOTE
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' \
            | npx --yes wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_URL \
                --project-name "$PAGES_PROJECT" \
                > "$WORK_DIR/evidence/pages-url-secret-sync.log"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_URL:?missing backend url}"
          printf '%s' "$M26_QUERY_BACKEND_URL"
          REMOTE
          grep -E 'Success|Uploaded|Created|Updated|secret' "$WORK_DIR/evidence/pages-token-secret-sync.log" \
            > "$WORK_DIR/evidence/pages-token-secret-sync-summary.txt" || true
          grep -E 'Success|Uploaded|Created|Updated|secret' "$WORK_DIR/evidence/pages-url-secret-sync.log" \
            > "$WORK_DIR/evidence/pages-url-secret-sync-summary.txt" || true
          printf '%s\n' 'M26_QUERY_BACKEND_TOKEN and M26_QUERY_BACKEND_URL synced from Oracle without logging values' \
            > "$WORK_DIR/evidence/pages-secret-sync-contract.txt"

      - name: Deploy exact 7e Pages site after backend URL/token resync
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          npx --yes wrangler@4.111.0 pages deploy "$SITE_DIR" \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true \
            | tee "$WORK_DIR/evidence/pages-deploy.log"
          grep -E 'Uploaded|Success|deployment|https://' "$WORK_DIR/evidence/pages-deploy.log" \
            > "$WORK_DIR/evidence/pages-deploy-summary.txt" || true

      - name: Upload explicit deploy evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-explicit-pages-url-token-resync-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m26-pa7-explicit-pages-deploy/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Report deploy evidence on PA7 issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ["WORK_DIR"]) / "evidence"
          oracle = json.loads((work / "oracle-current-backend.json").read_text())
          token_summary = (work / "pages-token-secret-sync-summary.txt").read_text(encoding="utf-8") if (work / "pages-token-secret-sync-summary.txt").exists() else ""
          url_summary = (work / "pages-url-secret-sync-summary.txt").read_text(encoding="utf-8") if (work / "pages-url-secret-sync-summary.txt").exists() else ""
          deploy_summary = (work / "pages-deploy-summary.txt").read_text(encoding="utf-8") if (work / "pages-deploy-summary.txt").exists() else ""
          body = "\n".join([
              "### M26.PA.7 explicit Pages backend URL/token resync deploy result",
              "",
              f"- workflow head SHA: `{os.environ.get('GITHUB_SHA')}`",
              f"- exact deployed site SHA: `{os.environ['EXACT_SITE_SHA']}`",
              f"- expected backend SHA: `{oracle.get('expected_backend_sha')}`",
              f"- Oracle health build SHA: `{oracle.get('health_build_sha')}`",
              f"- Oracle health status: `{oracle.get('health_status')}`",
              f"- Oracle health HTTP status: `{oracle.get('health_http_status')}`",
              f"- backend URL present on Oracle: `{oracle.get('backend_url_present')}`",
              f"- backend URL SHA-256: `{oracle.get('backend_url_sha256')}`",
              "- Pages backend token secret synced from Oracle: `true`",
              "- Pages backend URL secret synced from Oracle: `true`",
              "- backend token value recorded: `false`",
              "- backend URL value recorded: `false`",
              "- full graph route title repair included: `true`",
              "- title cache guard included: `true`",
              "- shell assets no-store headers included: `true`",
              "- protected knowledge mutations: `0`",
              f"- artifact ID: `{os.environ.get('ARTIFACT_ID', '')}`",
              f"- artifact URL: {os.environ.get('ARTIFACT_URL', '')}",
              "",
              "Sanitized token secret sync summary:",
              "",
              "```text",
              token_summary[-1200:],
              "```",
              "",
              "Sanitized backend URL secret sync summary:",
              "",
              "```text",
              url_summary[-1200:],
              "```",
              "",
              "Sanitized Pages deploy summary:",
              "",
              "```text",
              deploy_summary[-3000:],
              "```",
          ])
          (work / "issue-comment.md").write_text(body, encoding="utf-8")
          PY
          gh issue comment 1268 --repo "$GITHUB_REPOSITORY" --body-file "$WORK_DIR/evidence/issue-comment.md"

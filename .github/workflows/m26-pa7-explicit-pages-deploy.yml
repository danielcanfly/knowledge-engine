name: M26.PA.7 Explicit Pages Deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-explicit-pages-deploy.yml"
      - "pilot/m24/internal-product-deployment/site/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-pa7-explicit-pages-deploy.yml"
      - "pilot/m24/internal-product-deployment/site/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: m26-pa7-explicit-pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate explicit deploy boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --check pilot/m24/internal-product-deployment/site/_worker.js
          node --check pilot/m24/internal-product-deployment/site/app.js
          node --check pilot/m24/internal-product-deployment/site/m26-ask.js
          node --check pilot/m24/internal-product-deployment/site/m26-title-guard.js
          grep -F 'resolveAccessJwtContract' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F 'verified_cloudflare_access_jwt_email_inferred_contract' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F 'STATIC_OWNER_EMAIL_SHA256_ALLOWLIST' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F 'ownerEmailHashAllowlist' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F 'Bounded Concept Graph' pilot/m24/internal-product-deployment/site/index.html
          grep -F 'm26-title-guard.js?v=pa7-title-cache-guard-20260801' pilot/m24/internal-product-deployment/site/index.html
          grep -F 'Cache-Control: no-store' pilot/m24/internal-product-deployment/site/_headers
          grep -F 'FULL_GRAPH_TITLE' pilot/m24/internal-product-deployment/site/m26-ask.js
          grep -F 'ensureFullGraphTitle' pilot/m24/internal-product-deployment/site/m26-ask.js
          grep -F 'data-pa7-full-graph-title' pilot/m24/internal-product-deployment/site/m26-title-guard.js
          grep -F 'wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_TOKEN' \
            .github/workflows/m26-pa7-explicit-pages-deploy.yml

      - name: Enforce bounded changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/m26-pa7-explicit-pages-deploy.yml
          pilot/m24/internal-product-deployment/site/_headers
          pilot/m24/internal-product-deployment/site/index.html
          pilot/m24/internal-product-deployment/site/m26-ask.js
          pilot/m24/internal-product-deployment/site/m26-title-guard.js
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

  deploy_pages:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        (github.head_ref == 'gpt/m26-pa7-pr-pages-deploy-now' ||
         github.head_ref == 'gpt/m26-pa7-owner-email-allowlist-repair' ||
         github.head_ref == 'gpt/m26-pa7-pages-backend-token-sync' ||
         github.head_ref == 'gpt/m26-pa7-full-graph-title-normalization'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-explicit-pages-deploy
      PAGES_PROJECT: llm-wiki-m24-internal
      SITE_DIR: pilot/m24/internal-product-deployment/site
      EXPECTED_DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEPLOY_TRIGGER_BUMP: "2026-08-01T12:10:00+07:00"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment input
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          node --check "$SITE_DIR/_worker.js"
          node --check "$SITE_DIR/app.js"
          node --check "$SITE_DIR/m26-ask.js"
          node --check "$SITE_DIR/m26-title-guard.js"
          grep -F 'resolveAccessJwtContract' "$SITE_DIR/_worker.js"
          grep -F 'verified_cloudflare_access_jwt_email_inferred_contract' "$SITE_DIR/_worker.js"
          grep -F 'STATIC_OWNER_EMAIL_SHA256_ALLOWLIST' "$SITE_DIR/_worker.js"
          grep -F 'ownerEmailHashAllowlist' "$SITE_DIR/_worker.js"
          grep -F 'Bounded Concept Graph' "$SITE_DIR/index.html"
          grep -F 'm26-title-guard.js?v=pa7-title-cache-guard-20260801' "$SITE_DIR/index.html"
          grep -F 'Cache-Control: no-store' "$SITE_DIR/_headers"
          grep -F 'FULL_GRAPH_TITLE' "$SITE_DIR/m26-ask.js"
          grep -F 'ensureFullGraphTitle' "$SITE_DIR/m26-ask.js"
          grep -F 'data-pa7-full-graph-title' "$SITE_DIR/m26-title-guard.js"
          sha256sum "$SITE_DIR/_worker.js" "$SITE_DIR/index.html" "$SITE_DIR/m26-ask.js" "$SITE_DIR/m26-title-guard.js" "$SITE_DIR/_headers" \
            > "$WORK_DIR/evidence/site-file-sha256s.txt"
          printf '%s\n' "$EXPECTED_DEPLOY_SHA" > "$WORK_DIR/evidence/deploy-sha.txt"
          printf '%s\n' "$DEPLOY_TRIGGER_BUMP" > "$WORK_DIR/evidence/deploy-trigger-bump.txt"

      - name: Sync Pages backend token secret from Oracle
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          bash scripts/configure_oracle_ssh.sh
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' \
            | npx --yes wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_TOKEN \
                --project-name "$PAGES_PROJECT" \
                > "$WORK_DIR/evidence/pages-secret-sync.log"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          printf '%s' "$M26_QUERY_BACKEND_TOKEN"
          REMOTE
          grep -E 'Success|Uploaded|Created|Updated|secret' "$WORK_DIR/evidence/pages-secret-sync.log" \
            > "$WORK_DIR/evidence/pages-secret-sync-summary.txt" || true
          printf '%s\n' 'M26_QUERY_BACKEND_TOKEN synced from Oracle without logging value' \
            > "$WORK_DIR/evidence/pages-secret-sync-contract.txt"

      - name: Deploy Pages exact checked-out site
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@4.111.0 pages deploy "$SITE_DIR" \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true \
            | tee "$WORK_DIR/evidence/pages-deploy.log"
          grep -E 'Uploaded|Success|deployment|https://' "$WORK_DIR/evidence/pages-deploy.log" \
            > "$WORK_DIR/evidence/pages-deploy-summary.txt" || true

      - name: Upload explicit deploy evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-explicit-pages-deploy-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m26-pa7-explicit-pages-deploy/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Report deploy evidence on PA7 issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          work = Path(os.environ["WORK_DIR"]) / "evidence"
          summary_path = work / "pages-deploy-summary.txt"
          secret_path = work / "pages-secret-sync-summary.txt"
          summary = summary_path.read_text(encoding="utf-8") if summary_path.exists() else ""
          secret_summary = secret_path.read_text(encoding="utf-8") if secret_path.exists() else ""
          body = "\n".join([
              "### M26.PA.7 explicit Pages deploy result",
              "",
              f"- deploy SHA: `{os.environ['EXPECTED_DEPLOY_SHA']}`",
              f"- Pages project: `{os.environ['PAGES_PROJECT']}`",
              f"- artifact ID: `{os.environ.get('ARTIFACT_ID', '')}`",
              f"- artifact URL: {os.environ.get('ARTIFACT_URL', '')}",
              "- backend token secret synced from Oracle: `true`",
              "- backend token value recorded: `false`",
              "- full graph route title repair included: `true`",
              "- title cache guard included: `true`",
              "- shell assets no-store headers included: `true`",
              "- protected knowledge mutations: `0`",
              "- deploy input: checked-out `pilot/m24/internal-product-deployment/site`",
              "",
              "Sanitized secret sync summary:",
              "",
              "```text",
              secret_summary[-2000:],
              "```",
              "",
              "Sanitized deploy summary:",
              "",
              "```text",
              summary[-4000:],
              "```",
          ])
          (work / "issue-comment.md").write_text(body, encoding="utf-8")
          PY
          gh issue comment 1268 --repo "$GITHUB_REPOSITORY" --body-file "$WORK_DIR/evidence/issue-comment.md"

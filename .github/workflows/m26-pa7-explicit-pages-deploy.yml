name: M26.PA.7 Explicit Pages Deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-explicit-pages-deploy.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: m26-pa7-explicit-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Enforce bounded changed files
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=50
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > changed-files.txt
          cat changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {".github/workflows/m26-pa7-explicit-pages-deploy.yml"}
          actual = set(Path("changed-files.txt").read_text().splitlines())
          extra = sorted(actual - expected)
          missing = sorted(expected - actual)
          if extra or missing:
              raise SystemExit(f"bounded changed files failed extra={extra} missing={missing}")
          PY

  deploy_pages:
    needs: verify
    runs-on: ubuntu-24.04
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-explicit-pages-deploy
      PAGES_PROJECT: llm-wiki-m24-internal
      SITE_DIR: pilot/m24/internal-product-deployment/site
      EXACT_SITE_SHA: 7e01348fa68e599108c70528183be501f29c5c3e
      EXPECTED_BACKEND_SHA: 7e01348fa68e599108c70528183be501f29c5c3e
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e01348fa68e599108c70528183be501f29c5c3e
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact site deployment input
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          test "$(git rev-parse HEAD)" = "$EXACT_SITE_SHA"
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          node --check "$SITE_DIR/_worker.js"
          node --check "$SITE_DIR/app.js"
          node --check "$SITE_DIR/m26-ask.js"
          node --check "$SITE_DIR/m26-title-guard.js"
          grep -F 'resolveAccessJwtContract' "$SITE_DIR/_worker.js"
          grep -F 'verified_cloudflare_access_jwt_email_inferred_contract' "$SITE_DIR/_worker.js"
          grep -F 'STATIC_OWNER_EMAIL_SHA256_ALLOWLIST' "$SITE_DIR/_worker.js"
          grep -F 'ownerEmailHashAllowlist' "$SITE_DIR/_worker.js"
          grep -F '<script src="m26-ask.js"></script>' "$SITE_DIR/index.html"
          grep -F 'm26-title-guard.js?v=pa7-title-cache-guard-20260801' "$SITE_DIR/index.html"
          grep -F 'Cache-Control: no-store' "$SITE_DIR/_headers"
          grep -F 'data-pa7-full-graph-title' "$SITE_DIR/m26-title-guard.js"
          sha256sum "$SITE_DIR/_worker.js" "$SITE_DIR/index.html" "$SITE_DIR/m26-ask.js" "$SITE_DIR/m26-title-guard.js" "$SITE_DIR/_headers" > "$WORK_DIR/evidence/site-file-sha256s.txt"
          printf '%s\n' "$EXACT_SITE_SHA" > "$WORK_DIR/evidence/exact-site-sha.txt"
          printf '%s\n' "$EXPECTED_BACKEND_SHA" > "$WORK_DIR/evidence/expected-backend-sha.txt"
          printf '%s\n' "bounded_quick_tunnel_public_origin_repair" > "$WORK_DIR/evidence/repair-mode.txt"
      - name: Start bounded quick tunnel and verify public backend health
        id: tunnel
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh
          set +e
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED_BACKEND_SHA='$EXPECTED_BACKEND_SHA' bash -se" <<'REMOTE' > "$WORK_DIR/evidence/backend-public-origin.remote-stdout" 2> "$WORK_DIR/evidence/backend-public-origin.remote-stderr"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          : "${KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH:?missing owner hash}"
          RUN_DIR="$DEPLOY_PATH/.pa7-public-origin"
          BIN_DIR="$RUN_DIR/bin"
          mkdir -p "$BIN_DIR"

          local_tmp="$(mktemp)"
          local_code="$(curl --silent --show-error -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" -o "$local_tmp" -w '%{http_code}' http://127.0.0.1:8080/api/m26/health || true)"
          python3 - "$local_tmp" "$local_code" <<'PY'
          import json, os, sys
          from pathlib import Path
          try:
              payload = json.loads(Path(sys.argv[1]).read_text())
          except Exception:
              payload = {}
          evidence = {
              "schema_version": "knowledge-engine-m26-pa7-oracle-local-health/v1",
              "status": "pass",
              "expected_backend_sha": os.environ["EXPECTED_BACKEND_SHA"],
              "health_http_status": sys.argv[2],
              "health_status": payload.get("status"),
              "health_build_sha": payload.get("canonical_runtime", {}).get("build_sha"),
          }
          if evidence["health_http_status"] != "200":
              evidence["status"] = "fail_health_http"
          elif evidence["health_build_sha"] != evidence["expected_backend_sha"]:
              evidence["status"] = "fail_backend_sha"
          if evidence["status"] != "pass":
              print(json.dumps(evidence, indent=2, sort_keys=True))
              raise SystemExit(1)
          PY
          rm -f "$local_tmp"

          if command -v cloudflared >/dev/null 2>&1; then
            CF_BIN="$(command -v cloudflared)"
          elif [ -x "$BIN_DIR/cloudflared" ]; then
            CF_BIN="$BIN_DIR/cloudflared"
          else
            arch="$(uname -m)"
            case "$arch" in
              x86_64|amd64) cf_asset="cloudflared-linux-amd64" ;;
              aarch64|arm64) cf_asset="cloudflared-linux-arm64" ;;
              *) echo "unsupported cloudflared arch: $arch" >&2; exit 2 ;;
            esac
            curl --fail --silent --show-error --location "https://github.com/cloudflare/cloudflared/releases/latest/download/$cf_asset" -o "$BIN_DIR/cloudflared"
            chmod 0755 "$BIN_DIR/cloudflared"
            CF_BIN="$BIN_DIR/cloudflared"
          fi

          if [ -f "$RUN_DIR/cloudflared.pid" ]; then
            old_pid="$(cat "$RUN_DIR/cloudflared.pid" || true)"
            if [ -n "$old_pid" ] && kill -0 "$old_pid" >/dev/null 2>&1; then
              kill "$old_pid" >/dev/null 2>&1 || true
              sleep 2
            fi
          fi
          rm -f "$RUN_DIR/cloudflared.log" "$RUN_DIR/backend-url"
          nohup "$CF_BIN" tunnel --url http://127.0.0.1:8080 --no-autoupdate --edge-ip-version auto > "$RUN_DIR/cloudflared.log" 2>&1 &
          tunnel_pid="$!"
          printf '%s' "$tunnel_pid" > "$RUN_DIR/cloudflared.pid"

          tunnel_url=""
          for _attempt in $(seq 1 75); do
            tunnel_url="$(grep -Eo 'https://[-A-Za-z0-9]+\.trycloudflare\.com' "$RUN_DIR/cloudflared.log" | tail -n 1 || true)"
            if [ -n "$tunnel_url" ]; then
              break
            fi
            if ! kill -0 "$tunnel_pid" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          public_tmp="$(mktemp)"
          public_code="000"
          if [ -n "$tunnel_url" ]; then
            for _public_attempt in $(seq 1 60); do
              rm -f "$public_tmp"
              public_tmp="$(mktemp)"
              public_code="$(curl --silent --output "$public_tmp" --connect-timeout 10 --max-time 25 -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" -w '%{http_code}' "$tunnel_url/api/m26/health" 2>/dev/null || true)"
              if [ "$public_code" = "200" ]; then
                break
              fi
              sleep 2
            done
          fi
          python3 - "$public_tmp" "$public_code" "$tunnel_url" "$RUN_DIR/cloudflared.log" <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          try:
              payload = json.loads(Path(sys.argv[1]).read_text())
          except Exception:
              payload = {}
          url = sys.argv[3]
          log_path = Path(sys.argv[4])
          raw_log_tail = "\n".join(log_path.read_text(errors="replace").splitlines()[-80:]) if log_path.exists() else ""
          sanitized_tail = re.sub(r"https://[-A-Za-z0-9]+\.trycloudflare\.com", "<redacted_trycloudflare_url>", raw_log_tail)
          evidence = {
              "schema_version": "knowledge-engine-m26-pa7-public-backend-origin/v3",
              "status": "pass",
              "expected_backend_sha": os.environ["EXPECTED_BACKEND_SHA"],
              "tunnel_url_present": bool(url),
              "public_health_http_status": sys.argv[2],
              "public_health_status": payload.get("status"),
              "public_health_build_sha": payload.get("canonical_runtime", {}).get("build_sha"),
              "selected_backend_url_sha256": hashlib.sha256(url.encode()).hexdigest() if url else None,
              "selected_backend_host_sha256": hashlib.sha256(url.split('/')[2].encode()).hexdigest() if url else None,
              "raw_backend_url_recorded": False,
              "raw_token_recorded": False,
              "protected_knowledge_mutations": 0,
              "r2_write_operations": 0,
              "qdrant_write_operations": 0,
              "production_pointer_mutations": 0,
              "cloudflared_log_tail_sanitized": sanitized_tail[:5000],
          }
          if not url:
              evidence["status"] = "fail_tunnel_url_missing"
          elif evidence["public_health_http_status"] != "200":
              evidence["status"] = "fail_public_health_http"
          elif evidence["public_health_status"] != "ok":
              evidence["status"] = "fail_public_health_status"
          elif evidence["public_health_build_sha"] != evidence["expected_backend_sha"]:
              evidence["status"] = "fail_public_backend_sha"
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if evidence["status"] != "pass":
              raise SystemExit(1)
          PY
          rm -f "$public_tmp"
          printf '%s' "$tunnel_url" > "$RUN_DIR/backend-url"
          REMOTE
          remote_status=$?
          set -e
          python3 - <<'PY'
          import json, re, os
          from pathlib import Path
          work = Path(os.environ["WORK_DIR"]) / "evidence"
          stdout = (work / "backend-public-origin.remote-stdout").read_text(errors="replace") if (work / "backend-public-origin.remote-stdout").exists() else ""
          stderr = (work / "backend-public-origin.remote-stderr").read_text(errors="replace") if (work / "backend-public-origin.remote-stderr").exists() else ""
          sanitize = lambda text: re.sub(r"https://[-A-Za-z0-9]+\.trycloudflare\.com", "<redacted_trycloudflare_url>", text)[-8000:]
          try:
              payload = json.loads(stdout)
          except Exception:
              payload = {
                  "schema_version": "knowledge-engine-m26-pa7-public-backend-origin-wrapper/v1",
                  "status": "fail_remote_step_no_json",
                  "remote_stdout_tail_sanitized": sanitize(stdout),
                  "remote_stderr_tail_sanitized": sanitize(stderr),
                  "raw_backend_url_recorded": False,
                  "raw_token_recorded": False,
              }
          (work / "backend-public-origin.json").write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          if [ "$remote_status" -ne 0 ]; then
            exit "$remote_status"
          fi
      - name: Sync Pages backend token and tunnel URL secrets from Oracle
        if: success()
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          bash scripts/configure_oracle_ssh.sh
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' | npx --yes wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_TOKEN --project-name "$PAGES_PROJECT" > "$WORK_DIR/evidence/pages-backend-token-sync.log"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          printf '%s' "$M26_QUERY_BACKEND_TOKEN"
          REMOTE
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' | npx --yes wrangler@4.111.0 pages secret put M26_QUERY_BACKEND_URL --project-name "$PAGES_PROJECT" > "$WORK_DIR/evidence/pages-backend-url-sync.log"
          set -euo pipefail
          url_file="$DEPLOY_PATH/.pa7-public-origin/backend-url"
          test -s "$url_file"
          cat "$url_file"
          REMOTE
          grep -E 'Success|Uploaded|Created|Updated|secret' "$WORK_DIR/evidence/pages-backend-token-sync.log" > "$WORK_DIR/evidence/pages-backend-token-sync-summary.txt" || true
          grep -E 'Success|Uploaded|Created|Updated|secret' "$WORK_DIR/evidence/pages-backend-url-sync.log" > "$WORK_DIR/evidence/pages-backend-url-sync-summary.txt" || true
      - name: Deploy exact 7e Pages site after tunnel URL/token resync
        if: success()
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_TOKEN:-$CLOUDFLARE_FALLBACK_API_TOKEN}"
          npx --yes wrangler@4.111.0 pages deploy "$SITE_DIR" --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true | tee "$WORK_DIR/evidence/pages-deploy.log"
          grep -E 'Uploaded|Success|deployment|https://' "$WORK_DIR/evidence/pages-deploy.log" > "$WORK_DIR/evidence/pages-deploy-summary.txt" || true
      - name: Upload explicit deploy evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-explicit-pages-public-origin-repair-7e01348fa68e599108c70528183be501f29c5c3e
          path: /tmp/m26-pa7-explicit-pages-deploy/evidence
          if-no-files-found: error
          retention-days: 30
      - name: Report deploy evidence on PA7 issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ["WORK_DIR"]) / "evidence"
          public = json.loads((work / "backend-public-origin.json").read_text()) if (work / "backend-public-origin.json").exists() else {"status": "missing_backend_public_origin_evidence"}
          token_summary = (work / "pages-backend-token-sync-summary.txt").read_text(errors="replace") if (work / "pages-backend-token-sync-summary.txt").exists() else ""
          url_summary = (work / "pages-backend-url-sync-summary.txt").read_text(errors="replace") if (work / "pages-backend-url-sync-summary.txt").exists() else ""
          deploy_summary = (work / "pages-deploy-summary.txt").read_text(errors="replace") if (work / "pages-deploy-summary.txt").exists() else ""
          body = "\n".join([
              "### M26.PA.7 explicit Pages public backend origin repair result",
              "",
              f"- exact site SHA: `{os.environ['EXACT_SITE_SHA']}`",
              f"- expected backend SHA: `{os.environ['EXPECTED_BACKEND_SHA']}`",
              f"- public backend origin status: `{public.get('status')}`",
              f"- tunnel URL present: `{public.get('tunnel_url_present')}`",
              f"- public health HTTP status: `{public.get('public_health_http_status')}`",
              f"- public health build SHA: `{public.get('public_health_build_sha')}`",
              f"- selected backend URL SHA-256: `{public.get('selected_backend_url_sha256')}`",
              f"- selected backend host SHA-256: `{public.get('selected_backend_host_sha256')}`",
              f"- raw backend URL recorded: `{public.get('raw_backend_url_recorded')}`",
              f"- raw token recorded: `{public.get('raw_token_recorded')}`",
              f"- protected knowledge mutations: `{public.get('protected_knowledge_mutations')}`",
              f"- R2 writes: `{public.get('r2_write_operations')}`",
              f"- Qdrant writes: `{public.get('qdrant_write_operations')}`",
              f"- production pointer mutations: `{public.get('production_pointer_mutations')}`",
              f"- artifact ID: `{os.environ.get('ARTIFACT_ID', '')}`",
              f"- artifact URL: {os.environ.get('ARTIFACT_URL', '')}",
              "",
              "Sanitized tunnel / failure detail:",
              "",
              "```json",
              json.dumps(public, indent=2, sort_keys=True)[-6000:],
              "```",
              "",
              "Sanitized token secret sync summary:",
              "",
              "```text",
              token_summary[-2000:],
              "```",
              "",
              "Sanitized backend URL secret sync summary:",
              "",
              "```text",
              url_summary[-2000:],
              "```",
              "",
              "Sanitized Pages deploy summary:",
              "",
              "```text",
              deploy_summary[-3000:],
              "```",
          ])
          (work / "issue-comment.md").write_text(body, encoding="utf-8")
          PY
          gh issue comment 1268 --repo "$GITHUB_REPOSITORY" --body-file "$WORK_DIR/evidence/issue-comment.md"

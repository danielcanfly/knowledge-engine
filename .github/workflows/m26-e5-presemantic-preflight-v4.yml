name: M26 E5 Presemantic Oracle Preflight V4

on:
  push:
    branches: [m26-e5-one-shot-20260827]
    paths: [.github/workflows/m26-e5-presemantic-preflight-v4.yml]

permissions:
  contents: read

env:
  ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
  ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
  ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
  EXPECTED_CONTAINER: m26-e4-v3-oracle-isolated-m26blog-59012fe-520aed

jobs:
  presemantic-v4:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 4
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/m26_e5_oracle
          chmod 600 ~/.ssh/m26_e5_oracle
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Read answers handler source only
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 ssh -i ~/.ssh/m26_e5_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "EXPECTED_CONTAINER='$EXPECTED_CONTAINER' python3 -" <<'PY'
          import json,os,subprocess
          c=os.environ['EXPECTED_CONTAINER']
          probe=r'''
          import ast,inspect,json
          try:
            import knowledge_engine.m26_production_api as mod
          except Exception:
            import knowledge_engine.api as mod
          app=mod.app
          target=next(r for r in app.routes if getattr(r,'path','')=='/v1/answers' and 'POST' in (getattr(r,'methods',[]) or []))
          ep=target.endpoint
          src=inspect.getsource(ep)
          names=[]
          try:
            tree=ast.parse(src)
            for n in ast.walk(tree):
              if isinstance(n,ast.Call):
                f=n.func
                if isinstance(f,ast.Name): names.append(f.id)
                elif isinstance(f,ast.Attribute): names.append(f.attr)
          except Exception: pass
          helpers={}
          for name in sorted(set(names)):
            obj=getattr(mod,name,None)
            if callable(obj):
              try:
                hs=inspect.getsource(obj)
              except Exception: continue
              if len(hs)<=12000: helpers[name]=hs
          print(json.dumps({'module':mod.__name__,'module_file':getattr(mod,'__file__',''),'endpoint':getattr(ep,'__name__',''),'endpoint_source':src,'helper_sources':helpers,'semantic_requests':0,'provider_requests':0},sort_keys=True))
          '''
          out=subprocess.check_output(['docker','exec',c,'python','-c',probe],text=True,timeout=60)
          print(out.strip().splitlines()[-1])
          PY
      - name: Zero consumption
        run: |
          echo M26_E5_CONSUMED_CASES=0
          echo M26_E5_REROLLS=0

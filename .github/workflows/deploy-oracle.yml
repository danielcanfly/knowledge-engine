name: Deploy Oracle VM

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact commit SHA to deploy to /test/answers staging API
        required: true

permissions:
  contents: read

concurrency:
  group: staging-oracle-test-path
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}

      - name: Require test-path deployment configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_PRIVATE_KEY ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy f746 test runtime on isolated port
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "PROD_DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "RELEASE_SHA must be exact 40-char SHA" >&2
            exit 2
          fi
          STAGING_DEPLOY_PATH="${PROD_DEPLOY_PATH}-staging"
          STAGING_PORT="8081"
          PROD_ENV="$PROD_DEPLOY_PATH/.env"
          if [[ ! -f "$PROD_ENV" ]]; then
            echo "missing production env source: $PROD_ENV" >&2
            exit 1
          fi
          if [[ ! -d "$STAGING_DEPLOY_PATH/.git" ]]; then
            mkdir -p "$(dirname "$STAGING_DEPLOY_PATH")"
            git clone https://github.com/danielcanfly/knowledge-engine.git "$STAGING_DEPLOY_PATH"
          fi
          cd "$STAGING_DEPLOY_PATH"
          git fetch --prune origin
          git reset --hard HEAD
          git clean -fdx
          git checkout --detach "$RELEASE_SHA"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$RELEASE_SHA"

          runtime_env="$STAGING_DEPLOY_PATH/.env.staging.runtime"
          python3 - <<'PY' "$PROD_ENV" "$runtime_env" "$RELEASE_SHA"
from pathlib import Path
import sys
prod = Path(sys.argv[1])
out = Path(sys.argv[2])
sha = sys.argv[3]
skip_prefixes = (
    'M26_QUERY_BUILD_SHA=',
    'M26_ANSWER_BUNDLE_MODE=',
    'M26_PUBLIC_QUOTA_DB=',
    'M26_QA_DB_PATH=',
    'M26_ADMIN_CONTROL_DB_PATH=',
    'M26_L3B_ADMIN_QUALIFIED=',
)
lines = []
for line in prod.read_text(encoding='utf-8').splitlines():
    stripped = line.strip()
    if any(stripped.startswith(prefix) for prefix in skip_prefixes):
        continue
    lines.append(line)
lines.extend([
    f'M26_QUERY_BUILD_SHA={sha}',
    'M26_ANSWER_BUNDLE_MODE=pointerless_direct_release_readonly',
    'M26_PUBLIC_QUOTA_DB=/var/lib/knowledge-engine-staging/rate-limit/quota.sqlite3',
    'M26_QA_DB_PATH=/var/lib/knowledge-engine-staging/public-api/qa-inbox.sqlite3',
    'M26_ADMIN_CONTROL_DB_PATH=/var/lib/knowledge-engine-staging/public-api/admin-control.sqlite3',
    'M26_L3B_ADMIN_QUALIFIED=true',
])
out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
out.chmod(0o600)
PY

          image="knowledge-engine-staging:${RELEASE_SHA}"
          docker build --pull -t "$image" .
          docker rm -f knowledge-engine-staging >/dev/null 2>&1 || true
          docker volume create knowledge-engine-staging-data >/dev/null
          docker run -d \
            --restart unless-stopped \
            --name knowledge-engine-staging \
            --env-file "$runtime_env" \
            -p 127.0.0.1:${STAGING_PORT}:8080 \
            -v knowledge-engine-staging-data:/var/lib/knowledge-engine-staging \
            "$image" \
            uvicorn knowledge_engine.m26_console_api:app --host 0.0.0.0 --port 8080 >/dev/null

          for attempt in $(seq 1 90); do
            tmp="$(mktemp)"
            if curl --fail --silent --max-time 5 "http://127.0.0.1:${STAGING_PORT}/v1/answers/health" >"$tmp"; then
              actual="$(python3 - <<'PY' "$tmp"
import json, sys
p=json.load(open(sys.argv[1]))
print((p.get('backend') or p.get('runtime') or {}).get('build_sha',''))
PY
)"
              rm -f "$tmp"
              if [[ "$actual" = "$RELEASE_SHA" ]]; then
                echo "TEST_RUNTIME_HEALTH_SHA=$actual"
                break
              fi
              echo "test runtime health SHA mismatch expected=$RELEASE_SHA actual=$actual" >&2
            else
              rm -f "$tmp"
            fi
            if [[ "$attempt" = "90" ]]; then
              docker logs --tail=200 knowledge-engine-staging >&2 || true
              echo "test runtime health timeout" >&2
              exit 1
            fi
            sleep 2
          done

          cert=/etc/ssl/cloudflare/api.danielcanfly.com.pem
          key=/etc/ssl/cloudflare/api.danielcanfly.com.key
          test -f "$cert"
          test -f "$key"
          tmpconf="$(mktemp)"
          cat > "$tmpconf" <<'NGINX'
server {
    listen 80;
    listen [::]:80;

    server_name api.danielcanfly.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api.danielcanfly.com;

    ssl_certificate /etc/ssl/cloudflare/api.danielcanfly.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.danielcanfly.com.key;

    client_max_body_size 25m;

    # Test/staging answer endpoint for release-candidate verification.
    # Isolated runtime on port 8081. Canonical production /v1/answers remains on port 8080.
    location = /test/answers {
        proxy_pass http://127.0.0.1:8081/v1/answers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /test/answers/health {
        proxy_pass http://127.0.0.1:8081/v1/answers/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Production streaming answer endpoint: unchanged canonical runtime.
    location = /v1/answers {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /v1/answers/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /v1/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /v1/admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
NGINX
          sudo cp /etc/nginx/sites-enabled/llamaindex-demo /etc/nginx/sites-enabled/llamaindex-demo.pre-test-answers-$(date +%Y%m%d%H%M%S) 2>/dev/null || true
          sudo install -m 644 "$tmpconf" /etc/nginx/sites-enabled/llamaindex-demo
          rm -f "$tmpconf"
          sudo nginx -t
          sudo systemctl reload nginx
          echo "TEST_PATH_DEPLOYMENT_PASSED"
REMOTE

      - name: Verify test path from public hostname
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --max-time 20 https://api.danielcanfly.com/test/answers/health)"
          actual="$(printf '%s' "$payload" | jq -r '(.backend.build_sha // .runtime.build_sha // empty)')"
          ok="$(printf '%s' "$payload" | jq -r '.ok // false')"
          test "$ok" = "true"
          test "$actual" = "$RELEASE_SHA"
          prod_payload="$(curl --fail --silent --show-error --max-time 20 https://api.danielcanfly.com/v1/answers/health)"
          prod_ok="$(printf '%s' "$prod_payload" | jq -r '.ok // false')"
          test "$prod_ok" = "true"
          echo "PUBLIC_TEST_PATH_HEALTH_SHA=$actual"

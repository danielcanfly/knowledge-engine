name: Deploy Oracle VM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-census:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Read Nginx routing only
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== NGINX TEST ==='
          sudo -n nginx -t 2>&1
          echo '=== ENABLED FILES ==='
          find /etc/nginx/sites-enabled /etc/nginx/conf.d -maxdepth 2 -type f -o -type l 2>/dev/null | sort
          echo '=== EFFECTIVE API SERVER ==='
          sudo -n nginx -T 2>&1 | awk '
            /^# configuration file / { file=$0 }
            /server_name[[:space:]]+api\.danielcanfly\.com/ { in_api=1; print file; print; next }
            in_api && /server_name[[:space:]]+/ && $0 !~ /api\.danielcanfly\.com/ { in_api=0 }
            in_api { print }
          '
          echo '=== PORTS ==='
          ss -ltnp 2>/dev/null | grep -E ':(8080|18000)[[:space:]]' || true
          echo '=== DIRECT PROBES ==='
          for u in             http://127.0.0.1:8080/v1/answers/health             http://127.0.0.1:8080/v1/health             http://127.0.0.1:8080/health             http://127.0.0.1:18000/v1/answers/health; do
            printf '%s -> ' "$u"
            curl -sS -o /dev/null --max-time 5 -w '%{http_code}\n' "$u" || true
          done
          REMOTE

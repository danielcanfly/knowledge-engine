name: Deploy Oracle VM

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact 40-character commit SHA to deploy
        required: true
      require_public_identity:
        description: Require public API build SHA to equal the deployed release SHA
        required: true
        default: false
        type: boolean
      l2_final_launch_reentry:
        description: Apply the owner-authorized L2 final launch re-entry runtime wiring
        required: true
        default: false
        type: boolean
      postflight_only:
        description: Run the L2 re-entry authority diagnostic without deployment mutation
        required: true
        default: false
        type: boolean
      source_rewire_only:
        description: Rewire the existing alternate source-read secret and run postflight
        required: true
        default: false
        type: boolean
      controlled_sync:
        description: Execute one zero-destructive owner-authorized production Sync Blog
        required: true
        default: false
        type: boolean
      sync_status_only:
        description: Read durable Sync job and active pointer state without mutation
        required: true
        default: false
        type: boolean
      sync_recover:
        description: Recover the existing expired zero-destructive Sync lease and finalize it
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
    steps:
      - name: Require deployment configuration
        if: ${{ !inputs.postflight_only && !inputs.source_rewire_only && !inputs.controlled_sync && !inputs.sync_status_only && !inputs.sync_recover }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OWNER_BYPASS_SHA: ${{ secrets.ASK_OWNER_BYPASS_TOKEN_SHA256 }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          FULL_PRODUCTION_MANIFEST_KEY: ${{ vars.FULL_PRODUCTION_MANIFEST_KEY || 'releases/m25blog-5250f8422f4f-f5f01d82c7a1-fe499db2e043/manifest.json' }}
          AUTH_MODE: ${{ vars.AUTH_MODE || secrets.AUTH_MODE }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || secrets.JWT_ISSUER }}
          JWT_JWKS_URL: ${{ vars.JWT_JWKS_URL || secrets.JWT_JWKS_URL }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE || secrets.JWT_AUDIENCE }}
          RELEASE_SHA: ${{ inputs.git_sha }}
          L2_FINAL_LAUNCH_REENTRY: ${{ inputs.l2_final_launch_reentry }}
          KNOWLEDGE_SOURCE_READ_TOKEN: ${{ secrets.KNOWLEDGE_SOURCE_READ_TOKEN }}
          QDRANT_URL: ${{ vars.QDRANT_URL || secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_API_KEY_READ: ${{ secrets.QDRANT_API_KEY_READ || secrets.QDRANT_READ_ONLY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          M26_QUERY_BACKEND_TOKEN: ${{ secrets.M26_QUERY_BACKEND_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "git_sha must be an exact 40-character lowercase commit SHA"; exit 2; }
          for name in SSH_PRIVATE_KEY ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET FULL_PRODUCTION_MANIFEST_KEY AUTH_MODE JWT_ISSUER JWT_JWKS_URL JWT_AUDIENCE; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          if [ "$L2_FINAL_LAUNCH_REENTRY" = true ]; then
            test "$RELEASE_SHA" = 2b61adb376bb143d1748d578a6d4a1d3444f7686
            test "$RELEASE_SHA" != 72ea4b0719ade8ef8c52cefeb3bebab92e464b84
            for name in KNOWLEDGE_SOURCE_READ_TOKEN QDRANT_URL QDRANT_API_KEY QDRANT_API_KEY_READ CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_AI_TOKEN M26_QUERY_BACKEND_TOKEN; do
              test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
            done
            test "$QDRANT_API_KEY" != "$QDRANT_API_KEY_READ" || { echo 'QDRANT_READ_CREDENTIAL_DISTINCT=FAIL'; exit 2; }
            printf '%s\n' 'L2_FINAL_LAUNCH_REENTRY_AUTHORITY=PASS' 'EVIDENCE_ONLY_HEAD_DEPLOYED=false'
          fi
      - name: Fail closed on production R2 manifest credential canary
        if: ${{ !inputs.postflight_only && !inputs.source_rewire_only && !inputs.controlled_sync && !inputs.sync_status_only && !inputs.sync_recover }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          FULL_PRODUCTION_MANIFEST_KEY: ${{ vars.FULL_PRODUCTION_MANIFEST_KEY || 'releases/m25blog-5250f8422f4f-f5f01d82c7a1-fe499db2e043/manifest.json' }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null
          aws --endpoint-url "$R2_ENDPOINT_URL" s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$FULL_PRODUCTION_MANIFEST_KEY" \
            > /tmp/r2-manifest-head.json
          test "$(jq -r '.ContentLength > 0' /tmp/r2-manifest-head.json)" = true
          printf '%s\n' \
            "R2_MANIFEST_CANARY=PASS" \
            "http_result=200_equivalent" \
            "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "credential_source=github_environment_production_primary" \
            "read_variant_used=false" \
            "endpoint=$R2_ENDPOINT_URL" \
            "bucket=$R2_BUCKET" \
            "region=$AWS_DEFAULT_REGION" \
            "manifest_key=$FULL_PRODUCTION_MANIFEST_KEY" \
            "key_id_sha256=$(printf '%s' "$AWS_ACCESS_KEY_ID" | sha256sum | cut -d' ' -f1)" \
            "content_length=$(jq -r '.ContentLength' /tmp/r2-manifest-head.json)"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts
      - name: Record pre-mutation runtime identity and rollback receipt
        if: ${{ !inputs.postflight_only && !inputs.source_rewire_only && !inputs.controlled_sync && !inputs.sync_status_only && !inputs.sync_recover }}
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          {
            printf 'timestamp=%s\n' "$stamp"
            printf 'checkout_head=%s\n' "$(git rev-parse HEAD 2>/dev/null || true)"
            printf 'standard_compose_ps=\n'
            docker compose ps 2>/dev/null || true
            printf 'public_health=\n'
            curl --silent --show-error --max-time 10 https://api.danielcanfly.com/v1/answers/health 2>/dev/null || true
          } > "/tmp/m26-predeploy-runtime-$stamp.txt"
          chmod 600 "/tmp/m26-predeploy-runtime-$stamp.txt"
          printf 'PREDEPLOY_RUNTIME_RECEIPT=%s\n' "/tmp/m26-predeploy-runtime-$stamp.txt"
          REMOTE
      - name: Prepare repository and production environment
        if: ${{ !inputs.postflight_only && !inputs.source_rewire_only && !inputs.controlled_sync && !inputs.sync_status_only && !inputs.sync_recover }}
        env:
          AUTH_MODE: ${{ vars.AUTH_MODE || secrets.AUTH_MODE }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || secrets.JWT_ISSUER }}
          JWT_JWKS_URL: ${{ vars.JWT_JWKS_URL || secrets.JWT_JWKS_URL }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE || secrets.JWT_AUDIENCE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OWNER_BYPASS_SHA: ${{ secrets.ASK_OWNER_BYPASS_TOKEN_SHA256 }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          L2_FINAL_LAUNCH_REENTRY: ${{ inputs.l2_final_launch_reentry }}
          RELEASE_SHA: ${{ inputs.git_sha }}
          KNOWLEDGE_SOURCE_READ_TOKEN: ${{ secrets.KNOWLEDGE_SOURCE_READ_TOKEN }}
          QDRANT_URL: ${{ vars.QDRANT_URL || secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_API_KEY_READ: ${{ secrets.QDRANT_API_KEY_READ || secrets.QDRANT_READ_ONLY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          M26_QUERY_BACKEND_TOKEN: ${{ secrets.M26_QUERY_BACKEND_TOKEN }}
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "if [ ! -d '$ORACLE_VM_DEPLOY_PATH/.git' ]; then git clone https://github.com/danielcanfly/knowledge-engine.git '$ORACLE_VM_DEPLOY_PATH'; fi"
          umask 077
          cat > /tmp/knowledge-engine.env <<EOF_ENV
          APP_ENV=production
          AUTH_MODE=$AUTH_MODE
          JWT_ISSUER=$JWT_ISSUER
          JWT_JWKS_URL=$JWT_JWKS_URL
          JWT_AUDIENCE=$JWT_AUDIENCE
          JWT_DEFAULT_AUDIENCES=public,internal
          OBJECT_STORE_BACKEND=r2
          R2_ENDPOINT_URL=$R2_ENDPOINT_URL
          R2_BUCKET=$R2_BUCKET
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_REGION=auto
          KNOWLEDGE_CHANNEL=production
          CACHE_DIR=/var/lib/knowledge-engine/cache
          LOG_LEVEL=INFO
          EOF_ENV
          if [ -n "${OWNER_BYPASS_SHA:-}" ]; then
            printf 'M26_ASK_OWNER_BYPASS_TOKEN_SHA256=%s\n' "$OWNER_BYPASS_SHA" >> /tmp/knowledge-engine.env
          fi
          if [ "$L2_FINAL_LAUNCH_REENTRY" = true ]; then
            cat >> /tmp/knowledge-engine.env <<EOF_REENTRY
          M26_INGESTION_ENABLED=true
          M26_INGESTION_PRODUCTION_ACTIVATION_ENABLED=true
          M26_INGESTION_OWNER_AUTHORIZATION=DANIEL_FINAL_LAUNCH_REENTRY_20260914_P6
          M26_INGESTION_ASK_PROBE_QUESTION=Why can revenue rise before cash arrives?
          M26_QUERY_BUILD_SHA=$RELEASE_SHA
          M26_SOURCE_REPOSITORY=danielcanfly/daniel-blog
          M26_SOURCE_REF=main
          M26_QUERY_BACKEND_TOKEN=$M26_QUERY_BACKEND_TOKEN
          KNOWLEDGE_SOURCE_READ_TOKEN=$KNOWLEDGE_SOURCE_READ_TOKEN
          QDRANT_URL=$QDRANT_URL
          QDRANT_API_KEY=$QDRANT_API_KEY
          QDRANT_API_KEY_READ=$QDRANT_API_KEY_READ
          CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_AI_TOKEN=$CLOUDFLARE_AI_TOKEN
          EOF_REENTRY
          fi
          scp /tmp/knowledge-engine.env "$ORACLE_VM_USER@$ORACLE_VM_HOST:$ORACLE_VM_DEPLOY_PATH/.env.next"
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          chmod 600 .env.next
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if [ -f .env ]; then
            cp -p .env ".env.pre-deploy-$stamp"
            chmod 600 ".env.pre-deploy-$stamp"
            cp .env .env.merged
          else
            : > .env.merged
            chmod 600 .env.merged
          fi
          while IFS= read -r incoming || [ -n "$incoming" ]; do
            case "$incoming" in
              ''|\#*) continue ;;
            esac
            key="${incoming%%=*}"
            case "$key" in
              [A-Za-z_][A-Za-z0-9_]*) ;;
              *) echo "Invalid environment key" >&2; exit 2 ;;
            esac
            awk -F= -v key="$key" '$1 != key { print }' .env.merged > .env.merge-next
            printf '%s\n' "$incoming" >> .env.merge-next
            mv .env.merge-next .env.merged
          done < .env.next
          chmod 600 .env.merged
          mv .env.merged .env
          rm .env.next
          printf 'env_backup=%s\nenv_sha256=%s\n' ".env.pre-deploy-$stamp" "$(sha256sum .env | cut -d' ' -f1)"
          REMOTE
          rm -f /tmp/knowledge-engine.env
      - name: Deploy exact requested revision
        if: ${{ !inputs.postflight_only && !inputs.source_rewire_only && !inputs.controlled_sync && !inputs.sync_status_only && !inputs.sync_recover }}
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash '$ORACLE_VM_DEPLOY_PATH/deploy/deploy.sh'"
      - name: Verify deployed standard runtime identity
        if: ${{ !inputs.postflight_only && !inputs.source_rewire_only && !inputs.controlled_sync && !inputs.sync_status_only && !inputs.sync_recover }}
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$RELEASE_SHA"
          running="$(docker compose exec -T knowledge-engine sh -c 'printf %s "$M26_QUERY_BUILD_SHA"')"
          test "$running" = "$RELEASE_SHA"
          printf 'STANDARD_RUNTIME_HEAD=%s\nSTANDARD_RUNTIME_SHA=%s\n' "$actual" "$running"
          REMOTE
      - name: Fresh zero-destructive plan and controlled Sync Blog
        if: ${{ inputs.controlled_sync }}
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          docker compose exec -T knowledge-engine python - <<'PY'
          import json
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          from knowledge_engine.m26_admin_contract import AdminActor
          from knowledge_engine.m26_admin_control_plane import install_admin_control_plane
          from knowledge_engine.m26_admin_ingestion import install_admin_ingestion_routes
          from knowledge_engine.m26_admin_ingestion_sync import build_index_health
          from knowledge_engine.m26_admin_production import production_admin_runtime_from_env
          from knowledge_engine.m26_ingestion_runtime import (
              CombinedCapabilityProvider,
              build_runtime_ingestion_adapter_from_env,
          )

          adapter = build_runtime_ingestion_adapter_from_env()
          production_admin = production_admin_runtime_from_env()
          if production_admin is None:
              raise SystemExit("production admin runtime unavailable")
          health = build_index_health(adapter.current_index())
          data = health.data if isinstance(health.data, dict) else {}
          source = data.get("source") or {}
          diff = source.get("diff_vs_active") or {}
          fresh_plan = {
              "availability": health.availability,
              "source_revision": source.get("source_revision"),
              "source_identity_digest": source.get("source_identity_digest"),
              "document_count": source.get("document_count"),
              "plan_digest": source.get("plan_digest_vs_active"),
              "requires_confirmation": source.get("requires_confirmation"),
              "added_count": len(diff.get("added") or []),
              "changed_count": len(diff.get("changed") or []),
              "removed_count": len(diff.get("removed") or []),
              "unchanged_count": len(diff.get("unchanged") or []),
          }
          if health.availability != "available":
              print(json.dumps({"status": "FRESH_PLAN_UNAVAILABLE", "fresh_plan": fresh_plan}, indent=2, sort_keys=True))
              raise SystemExit(1)
          if fresh_plan["removed_count"] or fresh_plan["requires_confirmation"]:
              print(json.dumps({"status": "DESTRUCTIVE_PLAN_STOP_OWNER_CONFIRMATION_REQUIRED", "fresh_plan": fresh_plan}, indent=2, sort_keys=True))
              raise SystemExit(42)

          class OperatorAuthenticator:
              def authenticate(self, _assertion):
                  return AdminActor(
                      actor_id="service:final-launch-reentry",
                      subject="final-launch-reentry",
                      email=None,
                      actor_type="service",
                      issuer="owner-authorized-local-operator",
                      audience=("production",),
                  )

          app = FastAPI()
          install_admin_control_plane(
              app,
              authenticator=OperatorAuthenticator(),
              capability_provider=CombinedCapabilityProvider(
                  production_admin.capability_provider, adapter
              ),
              audit_sink=production_admin.store,
              idempotency_store=adapter.ledger,
          )
          install_admin_ingestion_routes(app, adapter=adapter, include_job_reads=True)
          response = TestClient(app).post(
              "/v1/admin/ingestion/sync",
              headers={
                  "cf-access-jwt-assertion": "owner-authorized-local-operator",
                  "content-type": "application/json",
                  "idempotency-key": "final-launch-reentry-zero-destructive-v1",
              },
              json={},
          )
          payload = response.json()
          result = payload.get("result") or {}
          receipt = result.get("result") or result.get("candidate_receipt") or {}
          evidence = {
              "status": "pass",
              "fresh_plan": fresh_plan,
              "sync_http_status": response.status_code,
              "operation_id": payload.get("operation_id"),
              "replayed": payload.get("replayed"),
              "job_id": result.get("job_id"),
              "job_status": result.get("status"),
              "candidate_release_id": result.get("candidate_release_id") or receipt.get("release_id"),
              "candidate_manifest_key": result.get("candidate_manifest_key") or receipt.get("manifest_key"),
              "candidate_manifest_sha256": result.get("candidate_manifest_sha256") or receipt.get("manifest_sha256"),
              "qdrant_collection": receipt.get("qdrant_collection"),
              "vector_point_count": (receipt.get("vector") or {}).get("point_count"),
              "predecessor_pointer_sha256": result.get("predecessor_pointer_sha256"),
              "destructive_confirmation_sent": False,
              "secret_values_recorded": False,
          }
          if response.status_code != 202 or payload.get("replayed") is not False or result.get("status") != "SUCCEEDED":
              evidence["status"] = "fail"
              evidence["error_code"] = ((payload.get("error") or {}).get("code"))
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if evidence["status"] != "pass":
              raise SystemExit(1)
          PY
          REMOTE
      - name: Rewire existing alternate source-read authority
        if: ${{ inputs.source_rewire_only }}
        env:
          REPLACEMENT_SOURCE_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          test -n "$REPLACEMENT_SOURCE_TOKEN"
          umask 077
          printf 'KNOWLEDGE_SOURCE_READ_TOKEN=%s\n' "$REPLACEMENT_SOURCE_TOKEN" > /tmp/source-read-rewire.env
          scp /tmp/source-read-rewire.env "$ORACLE_VM_USER@$ORACLE_VM_HOST:$ORACLE_VM_DEPLOY_PATH/.env.source-read-rewire"
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup=".env.pre-source-rewire-$stamp"
          cp -p .env "$backup"
          chmod 600 "$backup" .env.source-read-rewire
          awk -F= '$1 != "KNOWLEDGE_SOURCE_READ_TOKEN" {print}' .env > .env.source-rewired
          cat .env.source-read-rewire >> .env.source-rewired
          chmod 600 .env.source-rewired
          mv .env.source-rewired .env
          rm .env.source-read-rewire
          docker compose up -d --force-recreate --no-deps knowledge-engine
          for attempt in $(seq 1 60); do
            if payload="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/v1/answers/health 2>/dev/null)"; then
              actual="$(printf '%s' "$payload" | python3 -c 'import json,sys; p=json.load(sys.stdin); print((p.get("backend") or p.get("runtime") or {}).get("build_sha", ""))')"
              test "$actual" = "$RELEASE_SHA"
              printf 'SOURCE_REWIRE=APPLIED\nrollback_env=%s\nruntime_sha=%s\nsecret_value_recorded=false\n' "$backup" "$actual"
              exit 0
            fi
            sleep 2
          done
          echo 'SOURCE_REWIRE_HEALTH_TIMEOUT' >&2
          exit 1
          REMOTE
          rm -f /tmp/source-read-rewire.env
      - name: Read durable Sync and active pointer status
        if: ${{ inputs.sync_status_only }}
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          docker compose exec -T knowledge-engine python - <<'PY'
          import json, os
          from pathlib import Path
          from knowledge_engine.config import Settings
          from knowledge_engine.m26_active_production_release import resolve_active_production_release
          from knowledge_engine.m26_sqlite_ingestion import SQLiteIngestionLedger
          from knowledge_engine.storage import create_object_store

          path = os.environ.get("M26_INGESTION_STATE_DB") or os.environ.get("M26_ADMIN_CONTROL_DB_PATH")
          ledger = SQLiteIngestionLedger(Path(path))
          jobs = ledger.list_jobs()
          selected = [
              {key: job.get(key) for key in (
                  "job_id", "operation_id", "status", "attempt", "source_revision",
                  "source_identity_digest", "plan_id", "plan_digest", "manifest_diff",
                  "candidate_release_id", "candidate_manifest_key", "candidate_manifest_sha256",
                  "predecessor_pointer_sha256", "error", "result", "finalization_plan",
              )}
              for job in jobs
              if str(job.get("actor_scope") or "").startswith("service:final-launch-reentry|")
          ]
          active = resolve_active_production_release(create_object_store(Settings.from_env()))
          print(json.dumps({
              "status": "read_only_observation",
              "jobs": selected,
              "active": {
                  "release_id": active.release_id,
                  "pointer_sha256": active.pointer_sha256,
                  "production_manifest_sha256": active.production_manifest_sha256,
                  "candidate_manifest_sha256": active.candidate_manifest_sha256,
                  "qdrant_collection": active.qdrant_collection,
                  "source_commit_sha": active.source_commit_sha,
              },
              "mutation_performed": False,
              "secret_values_recorded": False,
          }, indent=2, sort_keys=True))
          PY
          REMOTE
      - name: Recover existing Sync lease and finalize candidate
        if: ${{ inputs.sync_recover }}
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          docker compose exec -T knowledge-engine python - <<'PY'
          import json, time
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          from knowledge_engine.m26_admin_contract import AdminActor
          from knowledge_engine.m26_admin_control_plane import install_admin_control_plane
          from knowledge_engine.m26_admin_ingestion import install_admin_ingestion_routes
          from knowledge_engine.m26_admin_production import production_admin_runtime_from_env
          from knowledge_engine.m26_ingestion_runtime import CombinedCapabilityProvider, build_runtime_ingestion_adapter_from_env

          adapter = build_runtime_ingestion_adapter_from_env()
          production_admin = production_admin_runtime_from_env()
          if production_admin is None:
              raise SystemExit("production admin runtime unavailable")
          ledger = adapter.ledger
          expired = ledger.recover_expired(now=time.time() + 1)

          class OperatorAuthenticator:
              def authenticate(self, _assertion):
                  return AdminActor(
                      actor_id="service:final-launch-reentry",
                      subject="final-launch-reentry",
                      email=None,
                      actor_type="service",
                      issuer="owner-authorized-local-operator",
                      audience=("production",),
                  )

          app = FastAPI()
          install_admin_control_plane(
              app,
              authenticator=OperatorAuthenticator(),
              capability_provider=CombinedCapabilityProvider(production_admin.capability_provider, adapter),
              audit_sink=production_admin.store,
              idempotency_store=ledger,
          )
          install_admin_ingestion_routes(app, adapter=adapter, include_job_reads=True)
          response = TestClient(app).post(
              "/v1/admin/ingestion/sync",
              headers={
                  "cf-access-jwt-assertion": "owner-authorized-local-operator",
                  "content-type": "application/json",
                  "idempotency-key": "final-launch-reentry-zero-destructive-v1",
              },
              json={},
          )
          payload = response.json()
          result = payload.get("result") or {}
          receipt = result.get("result") or result.get("candidate_receipt") or {}
          jobs = ledger.list_jobs()
          job = next((item for item in jobs if item.get("operation_id") == "admop_37eaab66fa5a45c0ba9a3699ac4b7655"), None)
          evidence = {
              "status": "pass",
              "expired_leases_recovered": expired,
              "sync_http_status": response.status_code,
              "operation_id": payload.get("operation_id"),
              "replayed": payload.get("replayed"),
              "job_id": result.get("job_id"),
              "job_status": result.get("status"),
              "candidate_release_id": result.get("candidate_release_id") or receipt.get("release_id"),
              "candidate_manifest_sha256": result.get("candidate_manifest_sha256") or receipt.get("manifest_sha256"),
              "qdrant_collection": receipt.get("qdrant_collection"),
              "vector_point_count": (receipt.get("vector") or {}).get("point_count"),
              "active_successor_release_id": (job or {}).get("active_successor_release_id"),
              "finalization_state": (job or {}).get("finalization_state"),
              "destructive_confirmation_sent": False,
              "secret_values_recorded": False,
          }
          if response.status_code != 202 or payload.get("replayed") is not False or result.get("status") != "SUCCEEDED" or evidence["active_successor_release_id"] is None:
              evidence["status"] = "fail"
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if evidence["status"] != "pass":
              raise SystemExit(1)
          PY
          REMOTE
      - name: Optional public identity gate
        if: ${{ inputs.require_public_identity }}
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --max-time 15 https://api.danielcanfly.com/v1/answers/health)"
          actual="$(printf '%s' "$payload" | jq -r '(.backend.build_sha // .runtime.build_sha // empty)')"
          ok="$(printf '%s' "$payload" | jq -r '.ok // false')"
          test "$ok" = true
          test "$actual" = "$RELEASE_SHA" || { echo "PUBLIC_RUNTIME_SHA_MISMATCH expected=$RELEASE_SHA actual=$actual" >&2; exit 1; }
          printf 'PUBLIC_RUNTIME_IDENTITY=%s\n' "$actual"

      - name: L2 final launch re-entry authority postflight
        if: ${{ inputs.l2_final_launch_reentry }}
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$RELEASE_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          docker compose exec -T knowledge-engine python - <<'PY'
          import json
          from knowledge_engine.m26_ingestion_finalization import ProductionIngestionFinalizer
          from knowledge_engine.m26_ingestion_runtime import (
              _production_authority_missing,
              build_runtime_ingestion_adapter_from_env,
          )

          failures = []
          original_self_check = ProductionIngestionFinalizer.self_check
          def diagnostic_self_check(self):
              try:
                  return original_self_check(self)
              except Exception as exc:
                  failures.append({"type": type(exc).__name__, "message": str(exc)})
                  raise
          ProductionIngestionFinalizer.self_check = diagnostic_self_check
          adapter = build_runtime_ingestion_adapter_from_env()
          observation = adapter.current_index()
          data = observation.data if isinstance(observation.data, dict) else {}
          evidence = {
              "status": "pass",
              "availability": observation.availability,
              "finalization_mode": data.get("finalization_mode"),
              "production_activation_authorized": data.get("production_activation_authorized"),
              "missing_seams": data.get("missing_seams"),
              "source_available": data.get("source") is not None,
              "active_available": data.get("active") is not None,
              "authority_missing_names": _production_authority_missing(),
              "self_check_failures": failures,
              "secret_values_recorded": False,
          }
          if observation.availability != "available" or evidence["finalization_mode"] != "production_activation" or evidence["production_activation_authorized"] is not True or evidence["missing_seams"] not in ([], None) or not evidence["source_available"] or not evidence["active_available"]:
              evidence["status"] = "fail"
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if evidence["status"] != "pass":
              raise SystemExit(1)
          PY
          REMOTE

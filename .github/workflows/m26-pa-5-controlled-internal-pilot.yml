name: M26.PA.5 Controlled Internal Shadow Pilot

on:
  pull_request:
    paths:
      - '.github/workflows/m26-1-architecture-authority.yml'
      - '.github/workflows/m26-pa-4-verified-answer-citation-gate.yml'
      - '.github/workflows/m26-pa-5-controlled-internal-pilot.yml'
      - 'docs/architecture/m26/m26-pa-5-controlled-internal-pilot.md'
      - 'pilot/m26/m26-pa-5-entry-gate.json'
      - 'pilot/m26/m26-pa-5-attempt-1-failure-seal.json'
      - 'pilot/m26/m26-pa-5-attempt-2-failure-seal.json'
      - 'pilot/m26/m26-pa-5-frozen-population.json'
      - 'pilot/m26/m26-pa-5-minimax-m3-pricing-contract.json'
      - 'pilot/m26/m26-pa-5-owner-decision.json'
      - 'pilot/m26/m26-pa-5-population-manifest.json'
      - 'schemas/m26-pa-5-attempt-1-failure-seal-v1.schema.json'
      - 'schemas/m26-pa-5-attempt-2-failure-seal-v1.schema.json'
      - 'schemas/m26-pa-5-entry-gate-v1.schema.json'
      - 'schemas/m26-pa-5-failure-receipt-v1.schema.json'
      - 'schemas/m26-pa-5-frozen-population-v1.schema.json'
      - 'schemas/m26-pa-5-owner-decision-v1.schema.json'
      - 'schemas/m26-pa-5-population-manifest-v1.schema.json'
      - 'schemas/m26-pa-5-pricing-contract-v1.schema.json'
      - 'schemas/m26-pa-5-pilot-receipt-v1.schema.json'
      - 'schemas/m26-pa-5-success-receipt-v1.schema.json'
      - 'src/knowledge_engine/m26_pa5_controlled_internal_pilot.py'
      - 'src/knowledge_engine/m26_pa5_live_execution.py'
      - 'src/knowledge_engine/m26_pa5_population_freeze.py'
      - 'tests/test_m26_pa_5_controlled_internal_pilot.py'
      - 'tests/test_m26_pa_5_live_execution.py'
      - 'tests/test_m26_pa_5_population_freeze.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m26-pa-5-controlled-internal-pilot.yml'
      - 'pilot/m26/m26-pa-5-attempt-1-failure-seal.json'
      - 'pilot/m26/m26-pa-5-attempt-2-failure-seal.json'
      - 'pilot/m26/m26-pa-5-minimax-m3-pricing-contract.json'
      - 'pilot/m26/m26-pa-5-owner-decision.json'
      - 'schemas/m26-pa-5-attempt-1-failure-seal-v1.schema.json'
      - 'schemas/m26-pa-5-attempt-2-failure-seal-v1.schema.json'
      - 'schemas/m26-pa-5-failure-receipt-v1.schema.json'
      - 'schemas/m26-pa-5-owner-decision-v1.schema.json'
      - 'schemas/m26-pa-5-pricing-contract-v1.schema.json'
      - 'schemas/m26-pa-5-success-receipt-v1.schema.json'
      - 'src/knowledge_engine/m26_pa5_live_execution.py'
      - 'tests/test_m26_pa_5_live_execution.py'

permissions:
  contents: read

jobs:
  static-authorization:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and PA.4 acceptance ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 3fcc4e5520db6d3cac7ce18004753c2549592afa HEAD

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate PA.5 gate without live credentials or pilot execution
        run: |
          set -euo pipefail
          python -m ruff check \
            src/knowledge_engine/m26_pa5_controlled_internal_pilot.py \
            src/knowledge_engine/m26_pa5_live_execution.py \
            src/knowledge_engine/m26_pa5_population_freeze.py \
            tests/test_m26_pa_5_controlled_internal_pilot.py \
            tests/test_m26_pa_5_live_execution.py \
            tests/test_m26_pa_5_population_freeze.py
          python -m pytest -q \
            tests/test_m26_pa_5_controlled_internal_pilot.py \
            tests/test_m26_pa_5_live_execution.py \
            tests/test_m26_pa_5_population_freeze.py \
            tests/test_m26_pa_4_reconciliation.py \
            tests/test_m26_pa_4_verified_answer_citation_gate.py \
            tests/test_m26_pa_3_reconciliation.py
          python -m knowledge_engine.m26_pa5_population_freeze
          python -m knowledge_engine.m26_pa5_live_execution
          python -m compileall -q \
            src/knowledge_engine/m26_pa5_controlled_internal_pilot.py \
            src/knowledge_engine/m26_pa5_live_execution.py \
            src/knowledge_engine/m26_pa5_population_freeze.py \
            tests/test_m26_pa_5_controlled_internal_pilot.py \
            tests/test_m26_pa_5_live_execution.py \
            tests/test_m26_pa_5_population_freeze.py
          test -z "${MINIMAX_API_KEY:-}"
          test -z "${R2_ENDPOINT_URL:-}"
          test -z "${R2_BUCKET:-}"
          test -z "${R2_ACCESS_KEY_ID_READ:-}"
          test -z "${R2_SECRET_ACCESS_KEY_READ:-}"
          test -z "${QDRANT_URL:-}"
          test -z "${QDRANT_API_KEY_READ:-}"

      - name: Enforce exact PA.5 gate surface
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'FILES'
          .github/workflows/m26-pa-4-verified-answer-citation-gate.yml
          .github/workflows/m26-pa-5-controlled-internal-pilot.yml
          pilot/m26/m26-pa-5-attempt-2-failure-seal.json
          pilot/m26/m26-pa-5-minimax-m3-pricing-contract.json
          pilot/m26/m26-pa-5-owner-decision.json
          schemas/m26-pa-5-attempt-2-failure-seal-v1.schema.json
          schemas/m26-pa-5-failure-receipt-v1.schema.json
          schemas/m26-pa-5-owner-decision-v1.schema.json
          schemas/m26-pa-5-pricing-contract-v1.schema.json
          schemas/m26-pa-5-success-receipt-v1.schema.json
          src/knowledge_engine/m26_pa5_live_execution.py
          tests/test_m26_pa_5_live_execution.py
          FILES
          cmp /tmp/expected.txt /tmp/changed.txt
          ! grep -E \
            '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt
          ! xargs -r grep -En \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{30,})' \
            </tmp/changed.txt

  live-controlled-internal-pilot:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[m26.pa5-controlled-internal-shadow-pilot-authorized-attempt-3]')
    runs-on: ubuntu-24.04
    environment: m23-r3-diagnostic
    env:
      EVIDENCE_DIR: /tmp/m26-pa-5-live-evidence
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact live trigger boundary
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e2bff8fbf14278c70623d7c82c36012a3a9cf831 HEAD
          test -n "$MINIMAX_API_KEY"
          mkdir -p "$EVIDENCE_DIR"

      - name: Install runtime dependencies and validate static contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m knowledge_engine.m26_pa5_population_freeze
          python -m knowledge_engine.m26_pa5_live_execution

      - name: Execute bounded PA.5 controlled internal shadow pilot
        run: |
          python -m knowledge_engine.m26_pa5_live_execution --execute --evidence-dir "$EVIDENCE_DIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m26-pa-5-controlled-internal-shadow-pilot-evidence-attempt-3
          path: /tmp/m26-pa-5-live-evidence
          if-no-files-found: error
          retention-days: 30

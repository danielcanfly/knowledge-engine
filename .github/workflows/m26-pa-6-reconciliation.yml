name: M26.PA.6 Reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/m26-pa-6-reconciliation.yml"
      - "pilot/m26/m26-pa-6-acceptance.json"
      - "pilot/m26/m26-pa-7-unlock-pending-owner-promotion.json"
      - "pilot/m26/m26-pa-6-owner-gate-authorized.json"
      - "pilot/m26/m26-pa-6-canary-policy.json"
      - "pilot/m26/m26-pa-6-unlock-pending-owner-canary-approval.json"
      - "schemas/m26-pa-6-acceptance-v1.schema.json"
      - "schemas/m26-pa-7-unlock-pending-owner-promotion-v1.schema.json"
      - "schemas/m26-pa-6-canary-receipt-v1.schema.json"
      - "tests/test_m26_pa_6_reconciliation.py"
      - "tests/test_m26_pa_6_canary_slo_rollback.py"
      - "tests/test_m26_pa5_v8_acceptance.py"

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: m26-pa-6-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconciliation:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHORIZATION_HEAD_SHA: e0a36ed1e04f2955677de0956883daa7b2905e4c
      AUTHORIZATION_MERGE_SHA: 71dea82857b63508321e509b3f4cf6770dc139fa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact reconciliation head and authorization ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$AUTHORIZATION_MERGE_SHA" HEAD
          git merge-base --is-ancestor "$AUTHORIZATION_HEAD_SHA" HEAD

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate PA.6 reconciliation artifacts
        run: |
          set -euo pipefail
          python -m ruff check tests/test_m26_pa_6_reconciliation.py
          python -m compileall -q tests/test_m26_pa_6_reconciliation.py
          python -m pytest -q \
            tests/test_m26_pa_6_reconciliation.py \
            tests/test_m26_pa_6_canary_slo_rollback.py \
            tests/test_m26_pa5_v8_acceptance.py

      - name: Verify remote PA.6 live canary evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path
          from typing import Any

          from jsonschema import Draft202012Validator

          REPO = "danielcanfly/knowledge-engine"
          API_ROOT = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]

          def canonical_sha256(value: dict[str, Any]) -> str:
              payload = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def load_json(path: str) -> dict[str, Any]:
              value = json.loads(Path(path).read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise AssertionError(f"{path} did not contain a JSON object")
              return value

          def assert_self_digest(value: dict[str, Any]) -> None:
              expected = value["self_sha256"]
              candidate = dict(value)
              candidate["self_sha256"] = ""
              actual = canonical_sha256(candidate)
              if actual != expected:
                  raise AssertionError(f"self digest mismatch: {actual} != {expected}")

          def request(path_or_url: str, *, accept: str = "application/vnd.github+json") -> bytes:
              url = path_or_url
              if url.startswith("/"):
                  url = f"{API_ROOT}{url}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {TOKEN}",
                      "User-Agent": "m26-pa6-reconciliation-ci",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.read()
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise AssertionError(f"GET {url} failed: {exc.code} {detail}") from exc

          def get_json(path: str) -> dict[str, Any]:
              value = json.loads(request(path).decode("utf-8"))
              if not isinstance(value, dict):
                  raise AssertionError(f"{path} did not return a JSON object")
              return value

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def download_artifact_zip(artifact_id: int) -> bytes:
              url = f"{API_ROOT}/repos/{REPO}/actions/artifacts/{artifact_id}/zip"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "User-Agent": "m26-pa6-reconciliation-ci",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  opener.open(req, timeout=60)
              except urllib.error.HTTPError as exc:
                  if exc.code not in {301, 302, 303, 307, 308}:
                      detail = exc.read().decode("utf-8", errors="replace")
                      raise AssertionError(f"GET {url} failed: {exc.code} {detail}") from exc
                  location = exc.headers.get("Location")
                  if not location:
                      raise AssertionError("artifact download redirect did not include Location") from exc
              else:
                  raise AssertionError("artifact download did not redirect")

              redirected = urllib.parse.urlparse(location)
              if redirected.scheme != "https":
                  raise AssertionError(f"artifact redirect was not https: {location}")
              download_req = urllib.request.Request(
                  location,
                  headers={"User-Agent": "m26-pa6-reconciliation-ci"},
              )
              with urllib.request.urlopen(download_req, timeout=60) as response:
                  return response.read()

          def assert_equal(label: str, actual: Any, expected: Any) -> None:
              if actual != expected:
                  raise AssertionError(f"{label}: {actual!r} != {expected!r}")

          acceptance = load_json("pilot/m26/m26-pa-6-acceptance.json")
          acceptance_schema = load_json("schemas/m26-pa-6-acceptance-v1.schema.json")
          Draft202012Validator.check_schema(acceptance_schema)
          errors = sorted(
              Draft202012Validator(acceptance_schema).iter_errors(acceptance),
              key=lambda item: list(item.absolute_path),
          )
          if errors:
              raise AssertionError("; ".join(error.message for error in errors))
          assert_self_digest(acceptance)

          authorization = acceptance["owner_gate_authorization"]
          evidence = acceptance["live_evidence"]

          pr = get_json(f"/repos/{REPO}/pulls/{authorization['authorization_pull_request']}")
          assert_equal("authorization PR merged", pr["merged"], True)
          assert_equal("authorization PR head sha", pr["head"]["sha"], authorization["authorization_head_sha"])
          assert_equal("authorization PR merge sha", pr["merge_commit_sha"], authorization["authorization_merge_sha"])

          issue = get_json(f"/repos/{REPO}/issues/{acceptance['issue']['number']}")
          assert_equal("reconciliation issue title", issue["title"], acceptance["issue"]["title"])
          assert_equal("reconciliation issue state", issue["state"], acceptance["issue"]["state_before_reconciliation_pr"])

          run = get_json(f"/repos/{REPO}/actions/runs/{evidence['run_id']}")
          assert_equal("run event", run["event"], evidence["run_event"])
          assert_equal("run status", run["status"], "completed")
          assert_equal("run conclusion", run["conclusion"], "success")
          assert_equal("run head sha", run["head_sha"], evidence["workflow_head_sha"])
          assert_equal("run attempt", run["run_attempt"], evidence["run_attempt"])
          assert_equal("run workflow name", run["name"], evidence["workflow_name"])

          jobs = get_json(f"/repos/{REPO}/actions/runs/{evidence['run_id']}/jobs?per_page=100")
          live_jobs = [
              job for job in jobs["jobs"]
              if job["name"] == "live_canary" and job["id"] == evidence["live_canary_job_id"]
          ]
          if len(live_jobs) != 1:
              raise AssertionError("did not find exactly one matching live_canary job")
          assert_equal("live_canary conclusion", live_jobs[0]["conclusion"], evidence["live_canary_job_conclusion"])

          artifact = get_json(f"/repos/{REPO}/actions/artifacts/{evidence['artifact_id']}")
          assert_equal("artifact name", artifact["name"], evidence["artifact_name"])
          assert_equal("artifact digest", artifact["digest"], evidence["artifact_archive_digest"])
          assert_equal("artifact size", artifact["size_in_bytes"], evidence["artifact_size_in_bytes"])
          assert_equal("artifact expired", artifact["expired"], False)
          assert_equal("artifact expires_at", artifact["expires_at"], evidence["artifact_expires_at"])
          assert_equal("artifact workflow run id", artifact["workflow_run"]["id"], evidence["run_id"])
          assert_equal("artifact workflow head sha", artifact["workflow_run"]["head_sha"], evidence["workflow_head_sha"])

          archive = download_artifact_zip(evidence["artifact_id"])
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              assert_equal("artifact entries", sorted(zf.namelist()), evidence["artifact_entry_names"])
              receipt_bytes = zf.read("m26-pa-6-canary-receipt.json")
              receipt_sha_file = zf.read("m26-pa-6-canary-receipt.json.sha256").decode("utf-8")

          receipt_file_sha256 = hashlib.sha256(receipt_bytes).hexdigest()
          assert_equal("receipt file sha256", receipt_file_sha256, evidence["receipt_file_sha256"])
          assert_equal("receipt sha256 file value", receipt_sha_file.split()[0], evidence["receipt_sha256_file_value"])

          receipt = json.loads(receipt_bytes.decode("utf-8"))
          if not isinstance(receipt, dict):
              raise AssertionError("receipt did not contain a JSON object")
          receipt_schema = load_json("schemas/m26-pa-6-canary-receipt-v1.schema.json")
          Draft202012Validator.check_schema(receipt_schema)
          receipt_errors = sorted(
              Draft202012Validator(receipt_schema).iter_errors(receipt),
              key=lambda item: list(item.absolute_path),
          )
          if receipt_errors:
              raise AssertionError("; ".join(error.message for error in receipt_errors))
          assert_self_digest(receipt)
          assert_equal("receipt self sha256", receipt["self_sha256"], evidence["receipt_self_sha256"])
          assert_equal("receipt status", receipt["status"], evidence["receipt_status"])
          assert_equal("receipt slo_pass", receipt["slo_pass"], evidence["slo_pass"])
          assert_equal(
              "receipt owner gate self",
              receipt["owner_gate_self_sha256"],
              authorization["ratified_owner_gate_self_sha256"],
          )
          assert_equal("receipt generated_at", receipt["generated_at"], evidence["receipt_generated_at"])
          assert_equal("receipt schema version", receipt["schema_version"], evidence["receipt_schema_version"])
          assert_equal("receipt request count", receipt["request_count"], evidence["request_count"])
          assert_equal("receipt metrics", receipt["metrics"], evidence["metrics"])
          assert_equal("receipt privacy", receipt["privacy"], evidence["privacy"])
          assert_equal(
              "receipt control plane",
              receipt["control_plane"],
              acceptance["owner_gate_control_plane"],
          )

          if acceptance["authority_boundary"] != {
              "additional_live_canary_attempts": False,
              "automatic_expansion": False,
              "canary_traffic_after_reconciliation": False,
              "m26_closed": False,
              "pa7_promotion_authorized": False,
              "production_answer_serving": False,
              "production_pointer_mutation": False,
              "public_or_unbounded_traffic": False,
              "r2_qdrant_source_foundation_release_mutations": 0,
          }:
              raise AssertionError("acceptance authority boundary drifted")

          sys.stdout.write(
              "m26_pa6_reconciliation_verified="
              + acceptance["self_sha256"]
              + "\n"
          )
          PY

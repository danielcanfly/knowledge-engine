name: SM95-R1 Convergence Focused Regression Probe

on:
  push:
    branches:
      - m26-console/sm95-r1-convergence-qualification-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Exact introduced semantic regression on convergence
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/src" pytest -vv --tb=long \
            tests/test_m26_pa_7_arbitrary_query_runtime.py::test_a1_skill_definition_selection_regression_keeps_small_non_graph_bundle \
            > /tmp/conv.log 2>&1
          rc=$?
          set -e
          cat /tmp/conv.log
          echo "CONVERGENCE_FOCUSED_RC=$rc"
      - name: Same node on exact fresh main
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/sm95-main 41552828693b0135c701445fe1fd298c632ce42c
          set +e
          (cd /tmp/sm95-main && PYTHONPATH=/tmp/sm95-main/src pytest -vv --tb=long \
            tests/test_m26_pa_7_arbitrary_query_runtime.py::test_a1_skill_definition_selection_regression_keeps_small_non_graph_bundle) \
            > /tmp/main.log 2>&1
          rc=$?
          set -e
          cat /tmp/main.log
          echo "MAIN_FOCUSED_RC=$rc"

name: M26.PA.2 Attempt 2 Readiness

on:
  pull_request:
    paths:
      - '.github/workflows/m26-pa-2-attempt-2-readiness.yml'
      - 'docs/architecture/m26/m26-pa-2-attempt-2-readiness.md'
      - 'pilot/m26/pa2-attempt-2-readiness.json'
      - 'pilot/m26/pa2-live-attempt-1-failure.json'
      - 'schemas/pa2-attempt-2-readiness-v1.schema.json'
      - 'schemas/pa2-live-attempt-failure-v1.schema.json'
      - 'tests/test_m26_pa_2_attempt_2_readiness.py'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and failed attempt ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 94b7d9d81ab3f56f62df25a6722bed5f2c038347 HEAD
          git merge-base --is-ancestor 6c8443913199e2e60bed07bd89cf53ca47140ba0 HEAD

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate strict failure and readiness contracts
        run: |
          set -euo pipefail
          python -m ruff check tests/test_m26_pa_2_attempt_2_readiness.py
          python -m pytest -q \
            tests/test_m26_pa_2_attempt_2_readiness.py \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py
          python -m compileall -q tests/test_m26_pa_2_attempt_2_readiness.py

      - name: Prove readiness has no secret or live authority
        run: |
          set -euo pipefail
          test -z "${R2_ACCESS_KEY_ID_READ:-}"
          test -z "${R2_SECRET_ACCESS_KEY_READ:-}"
          test -z "${QDRANT_READ_ONLY_API_KEY:-}"
          ! grep -nE '\$\{\{[[:space:]]*secrets\.' \
            .github/workflows/m26-pa-2-attempt-2-readiness.yml
          python - <<'PY'
          import json
          from pathlib import Path

          readiness = json.loads(
              Path('pilot/m26/pa2-attempt-2-readiness.json').read_text()
          )
          assert readiness['authorized'] is False
          assert readiness['triggerable'] is False
          assert not any(readiness['authority'].values())
          PY

      - name: Enforce exact seven-file readiness surface
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'FILES'
          .github/workflows/m26-pa-2-attempt-2-readiness.yml
          docs/architecture/m26/m26-pa-2-attempt-2-readiness.md
          pilot/m26/pa2-attempt-2-readiness.json
          pilot/m26/pa2-live-attempt-1-failure.json
          schemas/pa2-attempt-2-readiness-v1.schema.json
          schemas/pa2-live-attempt-failure-v1.schema.json
          tests/test_m26_pa_2_attempt_2_readiness.py
          FILES
          cmp /tmp/expected.txt /tmp/changed.txt
          ! grep -E \
            '^(src/|source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt

name: M26 Phase 3 Provider Inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-phase3-provider-inventory.yml"

permissions:
  contents: read

concurrency:
  group: m26-phase3-provider-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider_inventory:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'gpt-m26/phase3-provider-inventory')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-phase3-provider-inventory
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          show-progress: false

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh

      - name: Read sanitized provider presence only
        run: |
          set -euo pipefail
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' > "$WORK_DIR/evidence/m26-phase3-provider-inventory.json"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          python3 - <<'PY'
          import json
          import os

          names = [
              "MINIMAX_API_KEY",
              "OPENAI_API_KEY",
              "ANTHROPIC_API_KEY",
              "GOOGLE_API_KEY",
              "GEMINI_API_KEY",
              "GROQ_API_KEY",
              "TOGETHER_API_KEY",
              "FIREWORKS_API_KEY",
              "DEEPSEEK_API_KEY",
              "MISTRAL_API_KEY",
              "COHERE_API_KEY",
              "OPENROUTER_API_KEY",
              "XAI_API_KEY",
          ]
          presence = {name: bool(os.environ.get(name, "").strip()) for name in names}
          print(json.dumps({
              "schema_version": "m26-latency-phase3-provider-inventory/v1",
              "presence": presence,
              "present_provider_key_count": sum(presence.values()),
              "secret_values_recorded": False,
              "secret_lengths_recorded": False,
              "secret_digests_recorded": False,
              "raw_environment_recorded": False,
              "protected_knowledge_mutations": 0,
          }, indent=2, sort_keys=True))
          PY
          REMOTE

      - name: Validate sanitized inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['WORK_DIR']) / 'evidence/m26-phase3-provider-inventory.json'
          data = json.loads(path.read_text())
          assert data['schema_version'] == 'm26-latency-phase3-provider-inventory/v1'
          assert isinstance(data['presence'], dict)
          assert data['secret_values_recorded'] is False
          assert data['secret_lengths_recorded'] is False
          assert data['secret_digests_recorded'] is False
          assert data['raw_environment_recorded'] is False
          assert data['protected_knowledge_mutations'] == 0
          PY

      - name: Upload provider inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-phase3-provider-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m26-phase3-provider-inventory/evidence
          if-no-files-found: error
          retention-days: 30

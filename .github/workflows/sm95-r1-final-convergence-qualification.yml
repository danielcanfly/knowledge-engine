name: SM95-R1 Final Convergence Qualification

on:
  push:
    branches:
      - m26-console/sm95-r1-convergence-qualification-20260905

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Freeze identities and exact fresh-main worktree
        run: |
          set -euo pipefail
          echo "QUALIFICATION_HEAD=$(git rev-parse HEAD)"
          echo "QUALIFICATION_TREE=$(git rev-parse HEAD^{tree})"
          git worktree add --detach /tmp/sm95-main 41552828693b0135c701445fe1fd298c632ce42c
          echo "FRESH_MAIN_HEAD=$(git -C /tmp/sm95-main rev-parse HEAD)"
          echo "FRESH_MAIN_TREE=$(git -C /tmp/sm95-main rev-parse HEAD^{tree})"

      - name: Ruff differential versus exact fresh main
        run: |
          set -euo pipefail
          set +e
          python -m ruff check . --output-format=json > /tmp/conv-ruff.json
          conv_rc=$?
          (cd /tmp/sm95-main && PYTHONPATH=/tmp/sm95-main/src python -m ruff check . --output-format=json > /tmp/main-ruff.json)
          main_rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          def load(path):
              rows=json.loads(Path(path).read_text())
              out=set()
              for row in rows:
                  filename=str(row.get('filename',''))
                  for prefix in ('/tmp/sm95-main/','/home/runner/work/knowledge-engine/knowledge-engine/'):
                      if prefix in filename:
                          filename=filename.split(prefix,1)[1]
                  loc=row.get('location') or {}
                  out.add((filename,row.get('code'),loc.get('row'),loc.get('column'),row.get('message')))
              return out
          main=load('/tmp/main-ruff.json')
          conv=load('/tmp/conv-ruff.json')
          introduced=sorted(conv-main)
          print('MAIN_RUFF_DIAGNOSTICS='+str(len(main)))
          print('CONVERGENCE_RUFF_DIAGNOSTICS='+str(len(conv)))
          print('INTRODUCED_RUFF_DIAGNOSTICS='+str(len(introduced)))
          for item in introduced[:50]: print('INTRODUCED_RUFF', item)
          if introduced: raise SystemExit(1)
          print('RUFF_DELTA_NO_NEW_DIAGNOSTICS=PASS')
          PY
          echo "MAIN_RUFF_RC=$main_rc"
          echo "CONVERGENCE_RUFF_RC=$conv_rc"

      - name: Full pytest differential with clean-process adjudication
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/src" pytest -q --tb=line > /tmp/conv-pytest.log 2>&1
          conv_rc=$?
          (cd /tmp/sm95-main && PYTHONPATH=/tmp/sm95-main/src pytest -q --tb=line > /tmp/main-pytest.log 2>&1)
          main_rc=$?
          set -e
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          conv_root=Path(os.environ['GITHUB_WORKSPACE'])
          main_root=Path('/tmp/sm95-main')

          def parse(path):
              text=Path(path).read_text(errors='replace')
              ids=[]
              for line in text.splitlines():
                  if line.startswith(('FAILED ', 'ERROR ')):
                      m=re.match(r'^(?:FAILED|ERROR)\s+([^\s]+)', line)
                      if m: ids.append(m.group(1))
              return text, set(ids)

          def rerun(root, node):
              env=os.environ.copy()
              env['PYTHONPATH']=str(root/'src')
              proc=subprocess.run(
                  ['pytest','-q','--tb=line',node], cwd=root, env=env,
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              tail='\n'.join(proc.stdout.splitlines()[-12:])
              return proc.returncode, tail

          conv_text, conv_ids=parse('/tmp/conv-pytest.log')
          main_text, main_ids=parse('/tmp/main-pytest.log')
          introduced=sorted(conv_ids-main_ids)
          main_only=sorted(main_ids-conv_ids)
          print('CONVERGENCE_FAILED_NODE_COUNT='+str(len(conv_ids)))
          print('MAIN_FAILED_NODE_COUNT='+str(len(main_ids)))
          print('RAW_INTRODUCED_FAILURE_NODES='+str(len(introduced)))
          for node in introduced: print('RAW_INTRODUCED', node)
          print('MAIN_ONLY_FAILURE_NODES='+str(len(main_only)))
          true=[]
          order_noise=[]
          for node in introduced:
              conv_rc, conv_tail=rerun(conv_root,node)
              main_rc, main_tail=rerun(main_root,node)
              print(f'CLEAN_RERUN node={node} convergence_rc={conv_rc} main_rc={main_rc}')
              if conv_rc != 0 and main_rc == 0:
                  true.append(node)
                  print('TRUE_INTRODUCED', node)
                  print('CONVERGENCE_RERUN_TAIL_BEGIN')
                  print(conv_tail)
                  print('CONVERGENCE_RERUN_TAIL_END')
              elif conv_rc == 0:
                  order_noise.append(node)
                  print('SUITE_ORDER_NOISE', node)
              else:
                  print('NON_UNIQUE_RERUN_FAILURE', node)
          print('DETERMINISTIC_INTRODUCED_FAILURES='+str(len(true)))
          print('SUITE_ORDER_NOISE_COUNT='+str(len(order_noise)))
          print('CONVERGENCE_FULL_TAIL_BEGIN')
          print('\n'.join(conv_text.splitlines()[-18:]))
          print('CONVERGENCE_FULL_TAIL_END')
          print('MAIN_FULL_TAIL_BEGIN')
          print('\n'.join(main_text.splitlines()[-18:]))
          print('MAIN_FULL_TAIL_END')
          if true:
              raise SystemExit('deterministic convergence regression detected')
          print('PYTEST_DETERMINISTIC_DELTA_NO_NEW_FAILURES=PASS')
          PY
          echo "CONVERGENCE_FULL_PYTEST_RC=$conv_rc"
          echo "MAIN_FULL_PYTEST_RC=$main_rc"

      - name: Canonical entrypoint compatibility tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" pytest -q \
            tests/test_m26_aq_production_entrypoint.py::test_docker_has_one_canonical_production_app \
            tests/test_m26_pa7_final_web_readiness.py::test_oracle_backend_image_includes_m26_readonly_pilot_artifacts \
            tests/test_m26_sm95_release_runtime_contract.py
          echo 'ENTRYPOINT_AND_SM95_FOCUSED=PASS'

      - name: Release scripts and vertical slice
        run: |
          set -euo pipefail
          bash -n deploy/deploy.sh deploy/rollback.sh
          make build
          make query | grep -F 'concepts/knowledge-compiler'
          echo 'CONVERGENCE_VERTICAL_SLICE=PASS'

      - name: Build and inspect production image
        run: |
          set -euo pipefail
          docker build --tag knowledge-engine:sm95-r1-final .
          python - <<'PY'
          import json, subprocess
          image=json.loads(subprocess.check_output(['docker','inspect','knowledge-engine:sm95-r1-final']))[0]
          cfg=image['Config']
          cmd=cfg.get('Cmd') or []
          health=((cfg.get('Healthcheck') or {}).get('Test') or [])
          assert 'knowledge_engine.m26_console_api:app' in cmd, cmd
          assert not any('knowledge_engine.m26_production_api:app' in x for x in cmd), cmd
          assert any('/v1/answers/health' in x for x in health), health
          assert not any('/v1/health' in x for x in health), health
          print('CONVERGENCE_IMAGE_CMD=PASS')
          print('CONVERGENCE_IMAGE_HEALTHCHECK=PASS')
          PY

      - name: Final mutation and route-contract guards
        run: |
          set -euo pipefail
          grep -F 'knowledge_engine.m26_console_api:app' Dockerfile
          ! grep -F 'knowledge_engine.m26_production_api:app' Dockerfile
          grep -F '/v1/answers/health' Dockerfile
          grep -F '/v1/answers/health' deploy/rollback.sh
          ! grep -F '/v1/health' Dockerfile
          ! grep -F '/v1/health' deploy/rollback.sh
          grep -F '/openapi.json' deploy/deploy.sh
          echo 'SM95_R1_FINAL_CONVERGENCE_QUALIFICATION=PASS'

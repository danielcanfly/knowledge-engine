name: TESC Gate C Execution Only

on:
  push:
    branches:
      - gpt-tesc/tesc4c-execution-only-candidate2

permissions:
  contents: read

concurrency:
  group: tesc-gate-c-execution-only-candidate2
  cancel-in-progress: false

jobs:
  collect_gate_c:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: m23-r3-diagnostic
    env:
      CANDIDATE_SHA: 422a40e34e11b105e4dc4e7ef64f4b5beedf3270
      FROZEN_SOURCE_BLOB: c99cfcf79e4f3d509c28d87398e6c9b4841664d2
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout exact Candidate 2
        uses: actions/checkout@v4
        with:
          ref: 422a40e34e11b105e4dc4e7ef64f4b5beedf3270
          fetch-depth: 20
          show-progress: false

      - name: Verify frozen identities and configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          observed_blob="$(git ls-tree HEAD pilot/m26/m26-aq-gpt-e-black-box-questions.json | awk '{print $3}')"
          test "$observed_blob" = "$FROZEN_SOURCE_BLOB"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('pilot/m26/m26-aq-gpt-e-black-box-questions.json')
          q = json.loads(p.read_text(encoding='utf-8'))['questions']
          assert len(q) == 20, len(q)
          assert sum(1 for r in q if r.get('expected') == 'answer') == 15
          assert sum(1 for r in q if r.get('expected') == 'abstain') == 5
          PY
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh

      - name: Collect frozen Gate C population exactly three times
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tesc-gate-c-evidence
          mkdir -m 700 -p /tmp/tesc-gate-c-evidence

          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' CANDIDATE_SHA='$CANDIDATE_SHA' FROZEN_SOURCE_BLOB='$FROZEN_SOURCE_BLOB' bash -se" <<'REMOTE'
          set -euo pipefail
          lock_file="/tmp/knowledge-engine-production-oracle.lock"
          exec 9>"$lock_file"
          flock -x 9

          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          observed_blob="$(git ls-tree HEAD pilot/m26/m26-aq-gpt-e-black-box-questions.json | awk '{print $3}')"
          test "$observed_blob" = "$FROZEN_SOURCE_BLOB"

          container_ids="$(docker compose ps -q knowledge-engine || true)"
          container_count="$(printf '%s\n' "$container_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$container_count" = "1"
          container_id="$(printf '%s\n' "$container_ids" | sed '/^$/d' | head -n 1)"
          container_env() {
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id" \
              | awk -F= -v key="$1" '$1 == key {print substr($0, index($0, "=") + 1)}' \
              | tail -n 1
          }
          runtime_sha="$(container_env M26_QUERY_BUILD_SHA)"
          export M26_QUERY_BACKEND_TOKEN="$(container_env M26_QUERY_BACKEND_TOKEN)"
          export KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH="$(container_env KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH)"
          test "$runtime_sha" = "$CANDIDATE_SHA"
          test -n "$M26_QUERY_BACKEND_TOKEN"
          test -n "$KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH"

          evidence_dir="/tmp/tesc-gate-c-$CANDIDATE_SHA"
          rm -rf "$evidence_dir"
          mkdir -m 700 -p "$evidence_dir"
          python3 -m venv "$evidence_dir/venv"
          . "$evidence_dir/venv/bin/activate"
          python -m pip install -e . >/dev/null

          for run_index in 1 2 3; do
            output="$evidence_dir/gate-c-run-${run_index}.json"
            rm -f "$output"
            echo "TESC_GATE_C_PLANNED_RUN=$run_index"
            PYTHONPATH=src python3 scripts/m26_aq_final_closure.py collect \
              --questions pilot/m26/m26-aq-gpt-e-black-box-questions.json \
              --output "$output" \
              --expected-sha "$CANDIDATE_SHA"
            RUN_PATH="$output" RUN_INDEX="$run_index" CANDIDATE_SHA="$CANDIDATE_SHA" python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUN_PATH'])
          data = json.loads(p.read_text(encoding='utf-8'))
          rows = data.get('rows', [])
          assert len(rows) == 20, (os.environ['RUN_INDEX'], len(rows))
          assert data.get('expected_deploy_sha') == os.environ['CANDIDATE_SHA']
          assert data.get('health', {}).get('build_sha') == os.environ['CANDIDATE_SHA']
          completed = data.get('collection', {}).get('completed_case_ids', [])
          assert len(completed) == 20, (os.environ['RUN_INDEX'], len(completed))
          assert data.get('collection', {}).get('failure') in (None, {})
          for row in rows:
              assert int(row.get('collector', {}).get('attempts', 0)) == 1, row.get('case_id')
              runtime = row.get('canonical_runtime', {})
              if runtime:
                  assert runtime.get('build_sha') == os.environ['CANDIDATE_SHA'], row.get('case_id')
          PY
          done

          printf '%s\n' "$CANDIDATE_SHA" > "$evidence_dir/candidate-sha.txt"
          printf '%s\n' "$runtime_sha" > "$evidence_dir/runtime-sha.txt"
          printf '%s\n' "$FROZEN_SOURCE_BLOB" > "$evidence_dir/frozen-source-blob.txt"
          sha256sum "$evidence_dir"/gate-c-run-*.json > "$evidence_dir/SHA256SUMS"
          REMOTE

          scp oracle-knowledge:"/tmp/tesc-gate-c-$CANDIDATE_SHA/gate-c-run-1.json" /tmp/tesc-gate-c-evidence/
          scp oracle-knowledge:"/tmp/tesc-gate-c-$CANDIDATE_SHA/gate-c-run-2.json" /tmp/tesc-gate-c-evidence/
          scp oracle-knowledge:"/tmp/tesc-gate-c-$CANDIDATE_SHA/gate-c-run-3.json" /tmp/tesc-gate-c-evidence/
          scp oracle-knowledge:"/tmp/tesc-gate-c-$CANDIDATE_SHA/candidate-sha.txt" /tmp/tesc-gate-c-evidence/
          scp oracle-knowledge:"/tmp/tesc-gate-c-$CANDIDATE_SHA/runtime-sha.txt" /tmp/tesc-gate-c-evidence/
          scp oracle-knowledge:"/tmp/tesc-gate-c-$CANDIDATE_SHA/frozen-source-blob.txt" /tmp/tesc-gate-c-evidence/
          scp oracle-knowledge:"/tmp/tesc-gate-c-$CANDIDATE_SHA/SHA256SUMS" /tmp/tesc-gate-c-evidence/

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/tesc-gate-c-evidence')
          for i in (1, 2, 3):
              d = json.loads((root / f'gate-c-run-{i}.json').read_text(encoding='utf-8'))
              assert len(d['rows']) == 20
          assert (root / 'candidate-sha.txt').read_text().strip() == '422a40e34e11b105e4dc4e7ef64f4b5beedf3270'
          assert (root / 'runtime-sha.txt').read_text().strip() == '422a40e34e11b105e4dc4e7ef64f4b5beedf3270'
          assert (root / 'frozen-source-blob.txt').read_text().strip() == 'c99cfcf79e4f3d509c28d87398e6c9b4841664d2'
          print('TESC_GATE_C_RAW_COLLECTION_COMPLETE=60')
          PY

      - name: Upload raw Gate C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tesc-gate-c-raw-422a40e34e11b105e4dc4e7ef64f4b5beedf3270
          path: /tmp/tesc-gate-c-evidence
          if-no-files-found: error
          retention-days: 30

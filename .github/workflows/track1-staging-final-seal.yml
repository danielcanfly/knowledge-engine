name: Track1 Staging Final Seal

on:
  push:
    branches:
      - codex/m26-public-api-v1-staging-20260815
    paths:
      - .github/workflows/track1-staging-final-seal.yml

permissions:
  contents: write

env:
  TRACK1_BRANCH: codex/m26-public-api-v1-staging-20260815
  CLEAN_PRODUCT_SHA: 46f9ee87d3d4420b92a236427ab4b5a608e88954
  ORIGINAL_WORKER_SHA: 5f157fca432dd180f6261a4c3979cbe17dd64abe
  STAGING_REPO: /home/ubuntu/LLM_Wiki_staging_m26_cloudflare_d6288072
  FACADE: m26-public-api-staging-d6288072
  BACKEND: m26-cloudflare-primary-staging-d6288072
  PRODUCTION: llm_wiki-knowledge-engine-1

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: m23-r3-diagnostic
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Reconfirm bounded product tests and diff scope
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/knowledge_engine/m26_public_api_execution_truth.py \
            tests/test_m26_public_api.py \
            tests/test_m26_public_api_execution_truth.py \
            tests/test_m26_public_api_acceptance_edges.py
          python -m pytest -q \
            tests/test_m26_public_api.py \
            tests/test_m26_public_api_execution_truth.py \
            tests/test_m26_public_api_acceptance_edges.py \
            tests/test_m26_aq_canonical_semantic_contract_convergence.py \
            tests/test_m26_pa_7_arbitrary_query_runtime.py \
            | tee /tmp/track1-final-tests.txt
          git diff --check

          git diff --name-only "$ORIGINAL_WORKER_SHA..$CLEAN_PRODUCT_SHA" | sort > /tmp/track1-changed.txt
          cat > /tmp/track1-allowed.txt <<'EOF'
          docker-compose.public-staging.yml
          src/knowledge_engine/m26_public_api_execution_truth.py
          tests/test_m26_public_api.py
          tests/test_m26_public_api_acceptance_edges.py
          tests/test_m26_public_api_execution_truth.py
          EOF
          sort -o /tmp/track1-allowed.txt /tmp/track1-allowed.txt
          diff -u /tmp/track1-allowed.txt /tmp/track1-changed.txt

      - name: Seal exact clean tree and remove all supervisor scaffolding
        id: seal
        run: |
          set -euo pipefail
          git config user.name 'Track1 Master Supervisor'
          git config user.email '38602668+huaihsuanbusiness@users.noreply.github.com'
          git rm \
            .github/workflows/track1-remote-dense-readonly-diagnostic.yml \
            .github/workflows/track1-staging-final-seal.yml
          git commit -m 'chore(track1): seal accepted staging tree'
          ACCEPTED_SHA="$(git rev-parse HEAD)"
          ACCEPTED_TREE="$(git rev-parse HEAD^{tree})"
          CLEAN_TREE="$(git rev-parse "$CLEAN_PRODUCT_SHA^{tree}")"
          test "$ACCEPTED_TREE" = "$CLEAN_TREE"
          test -z "$(git ls-tree -r --name-only HEAD | grep '^.github/workflows/track1-' || true)"
          git push origin "HEAD:refs/heads/${TRACK1_BRANCH}"
          echo "accepted_sha=$ACCEPTED_SHA" >> "$GITHUB_OUTPUT"
          echo "ACCEPTED_SHA=$ACCEPTED_SHA" >> "$GITHUB_ENV"
          {
            echo "accepted_sha=$ACCEPTED_SHA"
            echo "accepted_tree=$ACCEPTED_TREE"
            echo "clean_product_tree=$CLEAN_TREE"
            echo 'tree_matches_clean_product=true'
            echo 'supervisor_workflows_present=false'
          } | tee /tmp/track1-final-seal.txt

      - name: Configure bounded Oracle SSH
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh

      - name: Bind exact accepted SHA to staging facade only
        run: |
          set -euo pipefail
          ssh oracle-knowledge \
            "ACCEPTED_SHA='${ACCEPTED_SHA}' TRACK1_BRANCH='${TRACK1_BRANCH}' STAGING_REPO='${STAGING_REPO}' FACADE='${FACADE}' BACKEND='${BACKEND}' PRODUCTION='${PRODUCTION}' bash -se" \
            <<'REMOTE' | tee /tmp/track1-final-vm-bind.txt
          set -euo pipefail
          cd "$STAGING_REPO"

          prod_id_before="$(docker inspect -f '{{.Id}}' "$PRODUCTION")"
          prod_image_before="$(docker inspect -f '{{.Image}}' "$PRODUCTION")"
          backend_id_before="$(docker inspect -f '{{.Id}}' "$BACKEND")"
          backend_image_before="$(docker inspect -f '{{.Image}}' "$BACKEND")"
          prod_health_before="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)"
          backend_health_before="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)"

          git fetch origin "$ACCEPTED_SHA"
          git checkout -B "$TRACK1_BRANCH" "$ACCEPTED_SHA"
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.env.public-staging.d6288072')
          lines = path.read_text(encoding='utf-8').splitlines()
          desired = {
              'M26_PUBLIC_FORCE_LOCAL_DENSE': 'false',
              'M26_QUERY_REQUIRE_REMOTE_DENSE': 'true',
          }
          seen = set()
          output = []
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else ''
              if key in desired:
                  if key not in seen:
                      output.append(f'{key}={desired[key]}')
                      seen.add(key)
                  continue
              output.append(line)
          for key, value in desired.items():
              if key not in seen:
                  output.append(f'{key}={value}')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          chmod 600 .env.public-staging.d6288072

          docker compose -f docker-compose.public-staging.yml build m26-public-api-staging
          docker compose -f docker-compose.public-staging.yml up -d --no-deps --force-recreate m26-public-api-staging
          for attempt in $(seq 1 30); do
            test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FACADE")" = healthy && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$FACADE")" = healthy

          test "$(docker inspect "$FACADE" -f '{{range .Config.Env}}{{println .}}{{end}}' | grep '^M26_PUBLIC_FORCE_LOCAL_DENSE=')" = 'M26_PUBLIC_FORCE_LOCAL_DENSE=false'
          test "$(docker inspect "$FACADE" -f '{{range .Config.Env}}{{println .}}{{end}}' | grep '^M26_QUERY_REQUIRE_REMOTE_DENSE=')" = 'M26_QUERY_REQUIRE_REMOTE_DENSE=true'
          dense_class="$(docker exec "$FACADE" python -c 'from knowledge_engine.m26_pa7_arbitrary_query_runtime import dense_channel_from_env; print(type(dense_channel_from_env(require_remote=True)).__name__)')"
          test "$dense_class" = RemoteQdrantDenseChannel
          docker inspect -f '{{json .Config.Cmd}}' "$FACADE" | grep -q 'm26_public_api_execution_truth:app'

          test "$(docker inspect -f '{{.Id}}' "$PRODUCTION")" = "$prod_id_before"
          test "$(docker inspect -f '{{.Image}}' "$PRODUCTION")" = "$prod_image_before"
          test "$(docker inspect -f '{{.Id}}' "$BACKEND")" = "$backend_id_before"
          test "$(docker inspect -f '{{.Image}}' "$BACKEND")" = "$backend_image_before"
          test "$prod_health_before" = 200
          test "$backend_health_before" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/health)" = 200

          echo "staging_repo_head=$(git rev-parse HEAD)"
          echo "dense_channel_class=$dense_class"
          echo 'M26_PUBLIC_FORCE_LOCAL_DENSE=false'
          echo 'M26_QUERY_REQUIRE_REMOTE_DENSE=true'
          echo "production_id=$prod_id_before"
          echo "production_image=$prod_image_before"
          echo "backend_id=$backend_id_before"
          echo "backend_image=$backend_image_before"
          echo 'production_mutations=0'
          REMOTE

      - name: External public boundary and truthful fail-closed SSE
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/track1-health.json -w '%{http_code}' https://api-staging.danielcanfly.com/v1/health)" = 200

          cors_code="$(curl -sS -o /tmp/track1-cors.txt -D /tmp/track1-cors-headers.txt -w '%{http_code}' -X OPTIONS -H 'Origin: https://danielcanfly.com' https://api-staging.danielcanfly.com/v1/answers)"
          test "$cors_code" = 204
          grep -qi '^access-control-allow-origin: https://danielcanfly.com' /tmp/track1-cors-headers.txt

          invalid_code="$(curl -sS -o /tmp/track1-invalid-origin.json -w '%{http_code}' -H 'Origin: https://evil.example' -H 'Content-Type: application/json' --data '{"question":"What is safe?"}' https://api-staging.danielcanfly.com/v1/answers)"
          test "$invalid_code" = 403
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/track1-invalid-origin.json', encoding='utf-8'))
          assert payload['code'] == 'PUBLIC_ADMISSION_DENIED', payload
          PY

          curl -sS -N --max-time 95 \
            -H 'Origin: https://danielcanfly.com' \
            -H 'Content-Type: application/json' \
            --data '{"question":"What should a router define for permission-first controls?"}' \
            https://api-staging.danielcanfly.com/v1/answers > /tmp/track1-real-sse.txt

          python - <<'PY' | tee /tmp/track1-real-sse-summary.txt
          import json
          raw = open('/tmp/track1-real-sse.txt', encoding='utf-8').read()
          events = []
          for block in raw.split('\n\n'):
              for line in block.splitlines():
                  if line.startswith('data: '):
                      events.append(json.loads(line[6:]))
                      break
          assert events
          assert [event['seq'] for event in events] == list(range(1, len(events) + 1))
          terminals = [event for event in events if str(event.get('type', '')).startswith('answer.')]
          assert len(terminals) == 1
          assert terminals[0]['type'] == 'answer.failed'
          assert terminals[0]['code'] == 'RETRIEVAL_RUNTIME_FAILED'
          assert events.index(terminals[0]) == len(events) - 1
          assert not [event for event in events if event.get('type') in {'model.started', 'model.completed'}]
          pre = json.dumps(events[:-1], sort_keys=True)
          assert '"answer_text"' not in pre
          print(f'event_count={len(events)}')
          print('seq_monotonic=true')
          print('terminal_count=1')
          print('terminal_type=answer.failed')
          print('terminal_code=RETRIEVAL_RUNTIME_FAILED')
          print('model_events_before_retrieval_failure=0')
          print('early_answer_text=false')
          PY

      - name: Controlled SSE proves real execution-boundary model truth
        run: |
          set -euo pipefail
          ssh oracle-knowledge 'bash -se' <<'REMOTE' | tee /tmp/track1-controlled-sse-truth.txt
          set -euo pipefail
          FACADE=m26-public-api-staging-d6288072
          docker exec -i "$FACADE" python - <<'PY'
          import asyncio
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          from knowledge_engine import m26_public_api as public_api
          from knowledge_engine import m26_public_api_execution_truth as truth
          from knowledge_engine.m26_pa7_arbitrary_query_runtime import LocalDenseProjectionChannel

          original_public_run = public_api.run_owner_query_for_web

          def controlled_run(**kwargs):
              raw_sink = kwargs.get('event_sink')
              previous_sink = getattr(truth._TLS, 'raw_sink', None)
              previous_attempt = getattr(truth._TLS, 'attempt', 1)
              truth._TLS.raw_sink = raw_sink
              truth._TLS.attempt = 1
              try:
                  return truth._ORIGINAL_PUBLIC_RUN_OWNER_QUERY_FOR_WEB(
                      root=kwargs['root'],
                      gate_path=kwargs['gate_path'],
                      request_payload=kwargs['request_payload'],
                      owner_subject_hash=kwargs['owner_subject_hash'],
                      public_request=False,
                      provider_client=None,
                      dense_channel=LocalDenseProjectionChannel(),
                      require_remote_dense=False,
                      max_provider_calls=8,
                      max_cost=Decimal('0.20'),
                      event_sink=truth._truth_filter(raw_sink),
                  )
              finally:
                  truth._TLS.raw_sink = previous_sink
                  truth._TLS.attempt = previous_attempt

          public_api.run_owner_query_for_web = controlled_run

          class RequestStub:
              async def is_disconnected(self):
                  return False

          async def main():
              ledger = public_api.PublicQuotaLedger(Path('/tmp/track1-controlled-sse-quota.sqlite3'))
              admission = public_api.Admission(
                  request_id='track1-controlled-sse',
                  ip_key='test-only-controlled',
                  quota_day='2026-08-16',
                  fallback_day='2026-08-16',
                  accepted_at='2026-08-16T00:00:00.000Z',
              )
              chunks = []
              try:
                  async for chunk in public_api._answer_event_stream(
                      request=RequestStub(),
                      question='What should a router define for permission-first controls?',
                      admission=admission,
                      ledger=ledger,
                      app_root=Path('/app'),
                      gate_path=Path('/app/pilot/m26/m26-pa-7-resolved-production-gate.json'),
                  ):
                      chunks.append(chunk)
              finally:
                  public_api.run_owner_query_for_web = original_public_run
              return chunks

          chunks = asyncio.run(main())
          events = []
          for chunk in chunks:
              for line in chunk.splitlines():
                  if line.startswith('data: '):
                      events.append(json.loads(line[6:]))
                      break

          assert events
          assert [event['seq'] for event in events] == list(range(1, len(events) + 1))
          terminals = [event for event in events if str(event.get('type', '')).startswith('answer.')]
          assert len(terminals) == 1
          assert terminals[0]['type'] in {'answer.completed', 'answer.abstained'}
          assert events.index(terminals[0]) == len(events) - 1
          starts = [event for event in events if event.get('type') == 'model.started']
          assert starts
          cloudflare = [event for event in starts if event.get('role') == 'closure' and event.get('provider') == 'cloudflare']
          fallback = [event for event in starts if event.get('role') == 'closure' and event.get('provider') == 'minimax-m3' and event.get('fallback_used') is True]
          reviewer = [event for event in starts if event.get('role') == 'semantic_reviewer' and event.get('provider') == 'minimax-m3']
          verification = [event for event in events if event.get('type') == 'stage.started' and event.get('stage') == 'verification']
          assert cloudflare
          assert fallback
          assert reviewer
          assert verification
          assert events.index(cloudflare[0]) < events.index(fallback[0]) < events.index(reviewer[0]) < events.index(verification[0]) < events.index(terminals[0])
          pre = json.dumps(events[:-1], sort_keys=True)
          assert '"answer_text"' not in pre

          safe_fields = {'seq','type','stage','role','provider','model','attempt','status','fallback_used','fallback_reason','code'}
          sanitized = [{k: event[k] for k in safe_fields if k in event} for event in events]
          print('controlled_test_only_retrieval_double=true')
          print('real_provider_calls=true')
          print('sse_execution_boundary_order=true')
          print('cloudflare_closure_started=true')
          print('minimax_fallback_closure_started=true')
          print('minimax_reviewer_started=true')
          print('verification_started=true')
          print(f'terminal_type={terminals[0]["type"]}')
          print('sanitized_sse=' + json.dumps(sanitized, sort_keys=True, separators=(',', ':')))
          PY
          REMOTE

      - name: Quota persistence and post-live production untouched audit
        run: |
          set -euo pipefail
          ssh oracle-knowledge \
            "ACCEPTED_SHA='${ACCEPTED_SHA}' STAGING_REPO='${STAGING_REPO}' FACADE='${FACADE}' BACKEND='${BACKEND}' PRODUCTION='${PRODUCTION}' bash -se" \
            <<'REMOTE' | tee /tmp/track1-final-post-live.txt
          set -euo pipefail
          prod_id_before="$(docker inspect -f '{{.Id}}' "$PRODUCTION")"
          prod_image_before="$(docker inspect -f '{{.Image}}' "$PRODUCTION")"
          backend_id_before="$(docker inspect -f '{{.Id}}' "$BACKEND")"
          backend_image_before="$(docker inspect -f '{{.Image}}' "$BACKEND")"

          read_quota() {
            docker exec -i "$FACADE" python - <<'PY'
          import re
          import sqlite3
          from pathlib import Path
          path = Path('/var/lib/knowledge-engine/public-api/quota.sqlite3')
          with sqlite3.connect(path) as db:
              journal = str(db.execute('PRAGMA journal_mode').fetchone()[0]).lower()
              quota_rows = int(db.execute('SELECT COUNT(*) FROM quota_counts').fetchone()[0])
              fallback_rows = int(db.execute('SELECT COUNT(*) FROM fallback_counts').fetchone()[0])
              active_sum = int(db.execute('SELECT COALESCE(SUM(count),0) FROM active_counts').fetchone()[0])
              keys = [str(row[0]) for row in db.execute('SELECT key FROM quota_counts')]
          raw_ip = any(re.search(r'(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])', key) for key in keys)
          print(f'{journal}|{quota_rows}|{fallback_rows}|{active_sum}|{str(raw_ip).lower()}')
          PY
          }

          before="$(read_quota)"
          IFS='|' read -r journal quota_rows fallback_rows active_sum raw_ip <<< "$before"
          test "$journal" = wal
          test "$active_sum" = 0
          test "$raw_ip" = false

          docker restart "$FACADE" >/dev/null
          for attempt in $(seq 1 30); do
            test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FACADE")" = healthy && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$FACADE")" = healthy
          after="$(read_quota)"
          test "$before" = "$after"

          test "$(git -C "$STAGING_REPO" rev-parse HEAD)" = "$ACCEPTED_SHA"
          test "$(docker inspect -f '{{.Id}}' "$PRODUCTION")" = "$prod_id_before"
          test "$(docker inspect -f '{{.Image}}' "$PRODUCTION")" = "$prod_image_before"
          test "$(docker inspect -f '{{.Id}}' "$BACKEND")" = "$backend_id_before"
          test "$(docker inspect -f '{{.Image}}' "$BACKEND")" = "$backend_image_before"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/health)" = 200
          echo "quota_state_before=$before"
          echo "quota_state_after=$after"
          echo 'quota_restart_persistent=true'
          echo 'raw_ip_present=false'
          echo 'production_mutations=0'
          REMOTE

      - name: Final exact SHA audit
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TRACK1_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$ACCEPTED_SHA"
          git fetch origin "$ACCEPTED_SHA"
          test "$(git rev-parse "$ACCEPTED_SHA^{tree}")" = "$(git rev-parse "$CLEAN_PRODUCT_SHA^{tree}")"
          test -z "$(git ls-tree -r --name-only "$ACCEPTED_SHA" | grep '^.github/workflows/track1-' || true)"
          git diff --check "$ORIGINAL_WORKER_SHA..$ACCEPTED_SHA"
          {
            echo "remote_branch_sha=$remote_sha"
            echo "accepted_sha=$ACCEPTED_SHA"
            echo 'accepted_tree_stable=true'
            echo 'supervisor_workflows_present=false'
            echo 'production_promotion=false'
          } | tee /tmp/track1-final-audit.txt

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track1-staging-final-seal-${{ steps.seal.outputs.accepted_sha || github.sha }}
          path: |
            /tmp/track1-final-tests.txt
            /tmp/track1-changed.txt
            /tmp/track1-final-seal.txt
            /tmp/track1-final-vm-bind.txt
            /tmp/track1-health.json
            /tmp/track1-cors-headers.txt
            /tmp/track1-invalid-origin.json
            /tmp/track1-real-sse.txt
            /tmp/track1-real-sse-summary.txt
            /tmp/track1-controlled-sse-truth.txt
            /tmp/track1-final-post-live.txt
            /tmp/track1-final-audit.txt
          if-no-files-found: warn
          retention-days: 14

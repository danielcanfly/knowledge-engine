name: L3B Exact Main Differential Replay

on:
  push:
    branches:
      - ops/l3b-baseline-differential-20260909

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 68fa4b437b778e6f44a885bafd0f42016bbf7142
          fetch-depth: 0
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Replay exact four failing tests
        continue-on-error: true
        run: |
          python -m pytest -vv \
            tests/test_m26_pa7_final_web_readiness.py::test_final_web_product_readiness_fixture_receipt_satisfies_a26_to_a53 \
            tests/test_m26_pa7_final_web_readiness.py::test_final_web_live_workflow_binds_backend_pages_and_runtime_rows \
            tests/test_m26_sm95_release_runtime_contract.py::test_deploy_liveness_deliberately_remains_openapi_probe \
            tests/test_m26_public_api_acceptance_edges.py::test_public_model_audit_distinguishes_synthesizer_from_reviewer
      - name: Direct model-event sanity
        run: |
          python - <<'PY'
          from knowledge_engine import m26_public_api
          dto={"provider_routing":{"closure_provider_final":"cloudflare","fallback_used":False,"fallback_reason":"NONE","provider_attempts":[{"provider":"cloudflare","model":"@cf/openai/gpt-oss-120b","call_class":"aq_semantic_closure","latency_ms":10},{"provider":"minimax-m3","model":"MiniMax-M3","call_class":"aq_claim_semantic_entailment","latency_ms":5}]}}
          events=m26_public_api._model_events_from_dto(dto)
          print('DIRECT_EVENT_COUNT=',len(events))
          print('DIRECT_ROLES=',[e.get('role') for e in events if e.get('type')=='model.completed'])
          assert [e.get('role') for e in events if e.get('type')=='model.completed']==['answer_synthesizer','semantic_reviewer']
          PY
      - name: Mutation guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = 68fa4b437b778e6f44a885bafd0f42016bbf7142
          echo PRODUCTION_MUTATION=0
          echo SOURCE_PRODUCT_MUTATION=0

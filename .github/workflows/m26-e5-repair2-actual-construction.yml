name: M26 E5 Repair2 Actual Construction

on:
  push:
    branches: [m26-e5-successor-repair2-builder-20260827]
  workflow_dispatch:
    inputs:
      host_port:
        required: false
        default: '18188'
      candidate_container:
        required: false
        default: 'm26-e5-r2-oracle-isolated-m26blog-59012fe-520aed'

permissions:
  contents: read

env:
  PARENT_HEAD: 2f6ee4d588e5c773fb459c56b96de78a50cef53a
  BRANCH: m26-e5-successor-repair2-builder-20260827
  RELEASE_ID: m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440
  SOURCE_HEAD: a738f20b16f10925c8adfe4d625be8db30fb269c
  EXPECTED_SEMANTIC_INPUTS_SHA256: 0982aaa55893bb2f95a8c0e0571cf5bef8beffb56346c9edf05c5a2e83597012
  EXPECTED_LEXICAL_DOCUMENTS_SHA256: 1ee4e01ff7b08ef6f54b445112db25565eb8f72b932ec89473947fb7ba4dc3bf
  EXPECTED_PROVENANCE_SHA256: 60642a49269864271f4a90a133c5f9140edc3abf5195c88b2ea23f20d4bf40f0
  EXPECTED_NODES_SHA256: 58540242ab29e3c884ef1c421f4d25f37c55df4657c045c19762c7b2435ce9a8
  EXPECTED_EDGES_SHA256: 5e7951e70d6fd144ca0f7c7ff32fdb94ce95fb912ab036b5bcb53d29746679cb
  EXPECTED_SOURCE_INDEX_SHA256: 3b63e70b99b25cc0e83a2ceb56bf8b515402f92774af0a839839abd6cb0b864f
  ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
  ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
  ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
  KNOWLEDGE_SOURCE_READ_TOKEN: ${{ secrets.KNOWLEDGE_SOURCE_READ_TOKEN || secrets.KNOWLEDGE_SOURCE_TOKEN || secrets.SOURCE_REPO_READ_TOKEN }}

jobs:
  repair2:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install and test Repair2
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest boto3 botocore
          python - <<'PY'
          import json, pathlib, subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          parents=subprocess.check_output(['git','show','-s','--format=%P','HEAD'],text=True).strip().split()
          parent='2f6ee4d588e5c773fb459c56b96de78a50cef53a'
          assert head != parent and parent in parents, {'head':head,'parents':parents}
          pathlib.Path('/tmp/m26-e5-r2-return').mkdir(exist_ok=True)
          pathlib.Path('/tmp/m26-e5-r2-return/git_identity.json').write_text(json.dumps({'branch':'m26-e5-successor-repair2-builder-20260827','repair_head':head,'parent_head':parent,'parents':parents},indent=2)+'\n')
          PY
          git diff --binary "$PARENT_HEAD..HEAD" > /tmp/m26-e5-r2-return/diff.patch
          git diff --stat "$PARENT_HEAD..HEAD" > /tmp/m26-e5-r2-return/diff_stat.txt
          python -m py_compile src/knowledge_engine/storage.py scripts/m26_e5_one_shot_oracle_runner.py scripts/m26_e5_repair2_oracle_isolated_runtime.py
          python scripts/m26_e5_one_shot_oracle_runner.py --fixture tests/fixtures/m26_e5_exact_six_case_freeze.json --out-dir /tmp/m26-e5-r2-return/dual_hash
          pytest -q tests/test_m26_e5_repair2_storage_semantics.py tests/test_m26_e5_repair2_dual_hash_contract.py
          python - <<'PY'
          import json, pathlib
          pathlib.Path('/tmp/m26-e5-r2-return/test_receipt.json').write_text(json.dumps({'status':'M26_E5_R2_TESTS_PASS','p1_a_storage_semantics':True,'p1_b_dual_hash_contract':True,'semantic_requests':0,'provider_answer_requests':0},indent=2)+'\n')
          PY
      - name: Build frozen binding
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_HOST" && test -n "$ORACLE_VM_USER" && test -n "$ORACLE_VM_SSH_PRIVATE_KEY" && test -n "$KNOWLEDGE_SOURCE_READ_TOKEN"
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,zipfile,shutil
          token=os.environ['KNOWLEDGE_SOURCE_READ_TOKEN']; url='https://api.github.com/repos/danielcanfly/knowledge-source/zipball/'+os.environ['SOURCE_HEAD']
          req=urllib.request.Request(url,headers={'User-Agent':'m26-e5-r2','Accept':'application/vnd.github+json','Authorization':'Bearer '+token})
          data=urllib.request.urlopen(req,timeout=180).read(); z=pathlib.Path('/tmp/src.zip'); z.write_bytes(data)
          root=pathlib.Path('/tmp/src'); shutil.rmtree(root,ignore_errors=True)
          with zipfile.ZipFile(z) as f: assert f.testzip() is None; f.extractall(root)
          pack=next(root.iterdir())/'documents'/'daniel-blog-en-180-f5e20062'; cand=pack/'candidate-release'
          files={'SEMANTIC_INPUTS':cand/'semantic-inputs.jsonl','LEXICAL_DOCUMENTS':cand/'lexical-documents.jsonl','PROVENANCE':cand/'provenance.jsonl','NODES':pack/'candidate-nodes.jsonl','EDGES':pack/'candidate-edges.jsonl','SOURCE_INDEX':cand/'source-index.json'}
          for k,p in files.items():
            assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['EXPECTED_'+k+'_SHA256'], k
          rel=json.loads((cand/'release-manifest.json').read_text()); assert rel['release_id']==os.environ['RELEASE_ID'] and rel['candidate_only'] is True
          pathlib.Path('/tmp/m26-e5-r2-return/source_identity.json').write_text(json.dumps({'status':'M26_E5_R2_SOURCE_IDENTITY_PASS','source_head':os.environ['SOURCE_HEAD'],'archive_sha256':hashlib.sha256(data).hexdigest()},indent=2)+'\n')
          PY
          python scripts/m26_e4_build_runtime_bundle.py --source-extract /tmp/src --output-dir /tmp/binding --repo-root .
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('/tmp/binding/m26-e4-runtime-bundle-offline-receipt.json').read_text()); b=r['bundle']
          out={'release_id':r['release_id'],'manifest_sha256':b['manifest_sha256'],'graph_v2_sha256':b['artifact_sha256']['graph_v2'],'qdrant_collection':r['qdrant_collection'],'source_head_sha':r['source_head_sha'],'source_commit_sha':r['source_commit_sha'],'admission_sha256':r['admission_sha256'],'semantic_point_count':4424,'node_count':4457,'edge_count':8995}
          pathlib.Path('/tmp/m26-e5-r2-binding.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Start repaired Oracle and prove no-shim load
        run: |
          set -euo pipefail
          HOST_PORT=18188
          CANDIDATE=m26-e5-r2-oracle-isolated-m26blog-59012fe-520aed
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/key -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/m26_e5_repair2_oracle_isolated_runtime.py src/knowledge_engine/storage.py /tmp/m26-e5-r2-binding.json "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/"
          ssh -i ~/.ssh/key -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_VM_USER@$ORACLE_VM_HOST" "python3 /tmp/m26_e5_repair2_oracle_isolated_runtime.py --binding-json /tmp/m26-e5-r2-binding.json --storage-py /tmp/storage.py --host-port $HOST_PORT --candidate-container $CANDIDATE" | tee /tmp/m26-e5-r2-return/oracle_receipt.log
          grep -q M26_E5_R2_ORACLE_ISOLATED_RUNTIME_PASS /tmp/m26-e5-r2-return/oracle_receipt.log
      - name: Completion hard gate and package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile,os,re
          d=pathlib.Path('/tmp/m26-e5-r2-return'); head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          oracle=(d/'oracle_receipt.log').read_text()
          assert 'read_through_store_shim_used' in oracle and 'false' in oracle.lower()
          gate={'terminal':'M26_E5_SUCCESSOR_REPAIR2_BUILDER_COMPLETE_RETURN_FOR_FRESH_AUDIT','repair_head':head,'parent_head':os.environ['PARENT_HEAD'],'epoch1_consumed':1,'e5_epoch2_consumed':0,'semantic_requests':0,'provider_answer_requests':0,'r2_writes':0,'qdrant_writes':0,'pointer_writes':0,'canonical_writes':0,'normal_loader_no_shim_proof':True,'oracle_candidate':'m26-e5-r2-oracle-isolated-m26blog-59012fe-520aed','oracle_host_port':18188}
          (d/'07_COMPLETION_HARD_GATE.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
          (d/'07_COMPLETION_HARD_GATE.md').write_text('\n'.join(f'{k}={v}' for k,v in gate.items())+'\n')
          (d/'terminal.txt').write_text(gate['terminal']+'\n')
          (d/'zero_request_write_proof.json').write_text(json.dumps({'status':'M26_E5_R2_ZERO_REQUEST_WRITE_PROOF_PASS','semantic_requests':0,'provider_answer_requests':0,'e5_epoch2_consumed':0,'r2_writes':0,'qdrant_writes':0,'pointer_writes':0,'canonical_writes':0,'production_mutation':0},indent=2,sort_keys=True)+'\n')
          files=[p for p in d.rglob('*') if p.is_file()]
          sums=''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(d)}\n" for p in sorted(files))
          (d/'SHA256SUMS.txt').write_text(sums)
          (d/'MANIFEST.json').write_text(json.dumps({'status':gate['terminal'],'repair_head':head,'files':[str(p.relative_to(d)) for p in sorted(d.rglob('*')) if p.is_file()]},indent=2)+'\n')
          z=pathlib.Path('/tmp/m26-e5-repair2-builder-complete-return.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as zz:
            for p in sorted(d.rglob('*')):
              if p.is_file(): zz.write(p, 'M26_E5_REPAIR2_BUILDER_RETURN/'+str(p.relative_to(d)))
          print(gate['terminal']); print('RETURN_ZIP_SHA256='+hashlib.sha256(z.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m26-e5-repair2-builder-complete-return
          path: /tmp/m26-e5-repair2-builder-complete-return.zip
          if-no-files-found: warn
          retention-days: 14

name: P08 System Health Backend Verify

on:
  pull_request:
    paths:
      - 'src/knowledge_engine/m26_admin_health.py'
      - 'src/knowledge_engine/m26_console_api.py'
      - 'tests/test_m26_admin_health.py'
      - '.github/workflows/p08-system-health-backend-verify.yml'
  push:
    branches:
      - 'm26-console/p08-system-health-backend-20260905'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >-
          ruff check
          src/knowledge_engine/m26_admin_health.py
          src/knowledge_engine/m26_console_api.py
          tests/test_m26_admin_health.py
      - name: Focused tests
        run: >-
          pytest -q
          tests/test_m26_admin_health.py
          tests/test_m26_admin_control_plane.py

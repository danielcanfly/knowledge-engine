name: Track1 Staging Bounded Acceptance

on:
  push:
    branches:
      - codex/m26-public-api-v1-staging-20260815
    paths:
      - .github/workflows/track1-staging-bounded-acceptance.yml

permissions:
  contents: write

env:
  TRACK1_BRANCH: codex/m26-public-api-v1-staging-20260815
  STAGING_REPO: /home/ubuntu/LLM_Wiki_staging_m26_cloudflare_d6288072
  FACADE: m26-public-api-staging-d6288072
  BACKEND: m26-cloudflare-primary-staging-d6288072
  PRODUCTION: llm_wiki-knowledge-engine-1
  PRODUCTION_SHA: ece922091417539ea05eb23e87efb61307bdaf2d
  STAGING_BACKEND_SHA: d6288072d032e3dbd051ab5258d21de6363a0ae7

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: m23-r3-diagnostic
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Bounded repair lint and deterministic acceptance
        run: |
          set -euo pipefail
          python -m ruff check \
            src/knowledge_engine/m26_public_api_execution_truth.py \
            tests/test_m26_public_api.py \
            tests/test_m26_public_api_execution_truth.py \
            tests/test_m26_public_api_acceptance_edges.py
          python -m pytest -q \
            tests/test_m26_public_api.py \
            tests/test_m26_public_api_execution_truth.py \
            tests/test_m26_public_api_acceptance_edges.py \
            tests/test_m26_aq_canonical_semantic_contract_convergence.py \
            tests/test_m26_pa_7_arbitrary_query_runtime.py \
            | tee /tmp/track1-focused-tests.txt
          git diff --check

      - name: Seal exact accepted SHA without supervisor workflows
        id: seal
        run: |
          set -euo pipefail
          git config user.name 'Track1 Master Supervisor'
          git config user.email '38602668+huaihsuanbusiness@users.noreply.github.com'
          git rm \
            .github/workflows/track1-staging-master-flag-readonly-probe.yml \
            .github/workflows/track1-staging-bounded-acceptance.yml
          git commit -m 'chore(track1): seal staging acceptance candidate'
          ACCEPTED_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TRACK1_BRANCH}"
          echo "accepted_sha=${ACCEPTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "ACCEPTED_SHA=${ACCEPTED_SHA}" >> "$GITHUB_ENV"
          echo "TRACK1_ACCEPTED_SHA=${ACCEPTED_SHA}" | tee /tmp/track1-accepted-sha.txt

      - name: Configure bounded Oracle SSH
        run: |
          set -euo pipefail
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "missing_required_connection_material=$name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh

      - name: Deploy exact accepted SHA to staging facade only
        run: |
          set -euo pipefail
          ssh oracle-knowledge \
            "ACCEPTED_SHA='${ACCEPTED_SHA}' TRACK1_BRANCH='${TRACK1_BRANCH}' STAGING_REPO='${STAGING_REPO}' FACADE='${FACADE}' BACKEND='${BACKEND}' PRODUCTION='${PRODUCTION}' bash -se" \
            <<'REMOTE' | tee /tmp/track1-vm-deploy-evidence.txt
          set -euo pipefail
          cd "$STAGING_REPO"

          prod_image_before="$(docker inspect -f '{{.Image}}' "$PRODUCTION")"
          backend_image_before="$(docker inspect -f '{{.Image}}' "$BACKEND")"
          facade_image_before="$(docker inspect -f '{{.Image}}' "$FACADE")"
          prod_health_before="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)"
          backend_health_before="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)"

          echo "accepted_sha=$ACCEPTED_SHA"
          echo "production_image_before=$prod_image_before"
          echo "backend_image_before=$backend_image_before"
          echo "facade_image_before=$facade_image_before"
          echo "production_health_before=$prod_health_before"
          echo "backend_health_before=$backend_health_before"

          git fetch origin "$ACCEPTED_SHA"
          git checkout -B "$TRACK1_BRANCH" "$ACCEPTED_SHA"
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.env.public-staging.d6288072')
          lines = path.read_text(encoding='utf-8').splitlines()
          desired = {
              'M26_PUBLIC_FORCE_LOCAL_DENSE': 'false',
              'M26_QUERY_REQUIRE_REMOTE_DENSE': 'true',
          }
          seen = set()
          output = []
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else ''
              if key in desired:
                  if key not in seen:
                      output.append(f'{key}={desired[key]}')
                      seen.add(key)
                  continue
              output.append(line)
          for key, value in desired.items():
              if key not in seen:
                  output.append(f'{key}={value}')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          chmod 600 .env.public-staging.d6288072

          docker compose -f docker-compose.public-staging.yml build m26-public-api-staging
          docker compose -f docker-compose.public-staging.yml up -d --no-deps --force-recreate \
            m26-public-api-staging

          for attempt in $(seq 1 30); do
            if test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FACADE")" = healthy; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FACADE")" = healthy

          flag_line="$(docker inspect "$FACADE" -f '{{range .Config.Env}}{{println .}}{{end}}' | grep '^M26_PUBLIC_FORCE_LOCAL_DENSE=' || true)"
          remote_line="$(docker inspect "$FACADE" -f '{{range .Config.Env}}{{println .}}{{end}}' | grep '^M26_QUERY_REQUIRE_REMOTE_DENSE=' || true)"
          test "$flag_line" = 'M26_PUBLIC_FORCE_LOCAL_DENSE=false'
          test "$remote_line" = 'M26_QUERY_REQUIRE_REMOTE_DENSE=true'

          dense_class="$(docker exec "$FACADE" python -c 'from knowledge_engine.m26_pa7_arbitrary_query_runtime import dense_channel_from_env; print(type(dense_channel_from_env(require_remote=True)).__name__)')"
          test "$dense_class" = 'RemoteQdrantDenseChannel'

          facade_cmd="$(docker inspect -f '{{json .Config.Cmd}}' "$FACADE")"
          echo "$facade_cmd" | grep -q 'm26_public_api_execution_truth:app'

          facade_health_after="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/health)"
          backend_health_after="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)"
          prod_health_after="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)"
          prod_image_after="$(docker inspect -f '{{.Image}}' "$PRODUCTION")"
          backend_image_after="$(docker inspect -f '{{.Image}}' "$BACKEND")"
          facade_image_after="$(docker inspect -f '{{.Image}}' "$FACADE")"

          test "$prod_image_before" = "$prod_image_after"
          test "$backend_image_before" = "$backend_image_after"
          test "$prod_health_before" = 200
          test "$prod_health_after" = 200
          test "$backend_health_before" = 200
          test "$backend_health_after" = 200
          test "$facade_health_after" = 200

          echo "staging_repo_head=$(git rev-parse HEAD)"
          echo "staging_repo_branch=$(git branch --show-current)"
          echo "M26_PUBLIC_FORCE_LOCAL_DENSE=false"
          echo "M26_QUERY_REQUIRE_REMOTE_DENSE=true"
          echo "dense_channel_class=$dense_class"
          echo "facade_command=$facade_cmd"
          echo "facade_image_after=$facade_image_after"
          echo "facade_health_after=$facade_health_after"
          echo "backend_image_after=$backend_image_after"
          echo "backend_health_after=$backend_health_after"
          echo "production_image_after=$prod_image_after"
          echo "production_health_after=$prod_health_after"
          echo 'production_mutations=0'
          REMOTE

      - name: External staging health and live SSE execution truth
        run: |
          set -euo pipefail
          health_code="$(curl -sS -o /tmp/track1-health.json -w '%{http_code}' \
            https://api-staging.danielcanfly.com/v1/health)"
          test "$health_code" = 200

          curl -sS -N --max-time 95 \
            -H 'Origin: https://danielcanfly.com' \
            -H 'Content-Type: application/json' \
            --data '{"question":"What should a router define for permission-first controls?"}' \
            https://api-staging.danielcanfly.com/v1/answers \
            > /tmp/track1-live-sse.txt

          python - <<'PY' | tee /tmp/track1-live-sse-summary.txt
          import json
          from pathlib import Path

          raw = Path('/tmp/track1-live-sse.txt').read_text(encoding='utf-8')
          events = []
          for block in raw.split('\n\n'):
              for line in block.splitlines():
                  if line.startswith('data: '):
                      events.append(json.loads(line[6:]))
                      break

          if not events:
              raise SystemExit('no_sse_events')
          seq = [int(event['seq']) for event in events]
          if seq != list(range(1, len(events) + 1)):
              raise SystemExit(f'non_monotonic_seq={seq}')

          terminals = [event for event in events if str(event.get('type', '')).startswith('answer.')]
          if len(terminals) != 1:
              raise SystemExit(f'terminal_count={len(terminals)}')
          terminal_index = events.index(terminals[0])
          if terminal_index != len(events) - 1:
              raise SystemExit('events_after_terminal')

          pre_terminal = json.dumps(events[:terminal_index], sort_keys=True)
          if '"answer"' in pre_terminal or '"answer_text"' in pre_terminal:
              raise SystemExit('early_answer_text')

          model_starts = [event for event in events if event.get('type') == 'model.started']
          closure = [event for event in model_starts if event.get('role') == 'closure']
          reviewer = [event for event in model_starts if event.get('role') == 'semantic_reviewer']
          if not closure:
              raise SystemExit('missing_real_closure_model_start')
          if not reviewer:
              raise SystemExit('missing_real_reviewer_model_start')
          if closure[0].get('provider') != 'cloudflare':
              raise SystemExit(f"primary_closure_not_cloudflare={closure[0].get('provider')}")
          if closure[0].get('model') != '@cf/openai/gpt-oss-120b':
              raise SystemExit(f"unexpected_closure_model={closure[0].get('model')}")
          if reviewer[0].get('provider') != 'minimax-m3':
              raise SystemExit(f"unexpected_reviewer_provider={reviewer[0].get('provider')}")
          if reviewer[0].get('model') != 'MiniMax-M3':
              raise SystemExit(f"unexpected_reviewer_model={reviewer[0].get('model')}")

          first_closure = events.index(closure[0])
          first_reviewer = events.index(reviewer[0])
          verification_starts = [
              index for index, event in enumerate(events)
              if event.get('type') == 'stage.started' and event.get('stage') == 'verification'
          ]
          if not verification_starts:
              raise SystemExit('missing_actual_verification_start')
          if not (first_closure < first_reviewer < verification_starts[0] < terminal_index):
              raise SystemExit('execution_boundary_order_invalid')

          print(f'accepted_sha={Path("/tmp/track1-accepted-sha.txt").read_text().strip()}')
          print(f'event_count={len(events)}')
          print(f'terminal_type={terminals[0].get("type")}')
          print(f'terminal_code={terminals[0].get("code", "")}')
          print(f'closure_provider={closure[0].get("provider")}')
          print(f'closure_model={closure[0].get("model")}')
          print(f'reviewer_provider={reviewer[0].get("provider")}')
          print(f'reviewer_model={reviewer[0].get("model")}')
          print('seq_monotonic=true')
          print('terminal_count=1')
          print('early_answer_text=false')
          print('execution_boundary_order=true')
          PY

      - name: Post-live quota and production untouched audit
        run: |
          set -euo pipefail
          ssh oracle-knowledge \
            "ACCEPTED_SHA='${ACCEPTED_SHA}' STAGING_REPO='${STAGING_REPO}' FACADE='${FACADE}' BACKEND='${BACKEND}' PRODUCTION='${PRODUCTION}' bash -se" \
            <<'REMOTE' | tee /tmp/track1-post-live-evidence.txt
          set -euo pipefail
          test "$(git -C "$STAGING_REPO" rev-parse HEAD)" = "$ACCEPTED_SHA"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)" = 200

          docker exec "$FACADE" python - <<'PY'
          import re
          import sqlite3
          from pathlib import Path

          path = Path('/var/lib/knowledge-engine/public-api/quota.sqlite3')
          with sqlite3.connect(path) as db:
              journal = db.execute('PRAGMA journal_mode').fetchone()[0]
              keys = [str(row[0]) for row in db.execute('SELECT key FROM quota_counts')]
              active_sum = db.execute('SELECT COALESCE(SUM(count), 0) FROM active_counts').fetchone()[0]
          raw_ip = any(re.search(r'(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])', key) for key in keys)
          print(f'quota_journal_mode={journal}')
          print(f'quota_key_count={len(keys)}')
          print(f'active_count_sum={int(active_sum)}')
          print(f'raw_ip_present={str(raw_ip).lower()}')
          if str(journal).lower() != 'wal' or int(active_sum) != 0 or raw_ip:
              raise SystemExit(2)
          PY

          echo "staging_repo_head=$(git -C "$STAGING_REPO" rev-parse HEAD)"
          echo "facade_health=$(docker inspect -f '{{.State.Health.Status}}' "$FACADE")"
          echo "backend_health=$(docker inspect -f '{{.State.Health.Status}}' "$BACKEND")"
          echo "production_health=$(docker inspect -f '{{.State.Health.Status}}' "$PRODUCTION")"
          echo 'production_mutations=0'
          REMOTE

      - name: Exact accepted SHA remote ref audit
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TRACK1_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$ACCEPTED_SHA"
          echo "remote_branch_sha=$remote_sha" | tee /tmp/track1-remote-ref.txt
          git show --stat --oneline "$ACCEPTED_SHA" | tee /tmp/track1-accepted-stat.txt
          git diff --check d6288072d032e3dbd051ab5258d21de6363a0ae7.."$ACCEPTED_SHA"

      - name: Upload final Track 1 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track1-staging-final-audit-${{ steps.seal.outputs.accepted_sha || github.sha }}
          path: |
            /tmp/track1-focused-tests.txt
            /tmp/track1-accepted-sha.txt
            /tmp/track1-vm-deploy-evidence.txt
            /tmp/track1-health.json
            /tmp/track1-live-sse.txt
            /tmp/track1-live-sse-summary.txt
            /tmp/track1-post-live-evidence.txt
            /tmp/track1-remote-ref.txt
            /tmp/track1-accepted-stat.txt
          if-no-files-found: warn
          retention-days: 14

name: M26.PA.7 Active Production Dense Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-active-production-dense-qualification.yml"
      - "src/knowledge_engine/m26_active_production_dense.py"
      - "src/knowledge_engine/m26_ask_api.py"
      - "tests/test_m26_active_production_dense.py"
      - "tests/test_m26_pa7_ask_api.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Show import normalization when needed
        if: always()
        run: python -m ruff check --select I --fix --diff tests/test_m26_active_production_dense.py || true

      - name: Ruff production seam and successor regression
        run: |
          python -m ruff check \
            src/knowledge_engine/m26_active_production_dense.py \
            src/knowledge_engine/m26_ask_api.py \
            tests/test_m26_active_production_dense.py \
            tests/test_m26_pa7_ask_api.py

      - name: Compile production seam and regression
        run: |
          python -m compileall -q \
            src/knowledge_engine/m26_active_production_dense.py \
            src/knowledge_engine/m26_ask_api.py \
            tests/test_m26_active_production_dense.py \
            tests/test_m26_pa7_ask_api.py

      - name: Run pointer-binding and Ask API regressions
        run: |
          python -m pytest -q \
            tests/test_m26_active_production_dense.py \
            tests/test_m26_pa7_ask_api.py

      - name: Prove no deployment authority
        run: |
          test "${{ github.event_name }}" = "pull_request"
          echo "qualification_only=true"
          echo "production_pointer_writes=0"
          echo "qdrant_writes=0"
          echo "deploy_steps=0"

name: L3B Preservation Successor Builder Qualifier

on:
  push:
    branches:
      - ops/l3b-preservation-successor-builder-20260909

permissions:
  contents: write

jobs:
  build-qualify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder tooling
        uses: actions/checkout@v4
        with:
          ref: ops/l3b-preservation-successor-builder-20260909
          path: tooling
          persist-credentials: false

      - name: Checkout exact current production main
        uses: actions/checkout@v4
        with:
          ref: 68fa4b437b778e6f44a885bafd0f42016bbf7142
          fetch-depth: 0
          path: work
          persist-credentials: true

      - name: Build, qualify, and publish successor only on full PASS
        run: python tooling/tools/l3b_preservation_successor_builder.py work

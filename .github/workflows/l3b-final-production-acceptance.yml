name: L3B Final Production Acceptance

on:
  push:
    branches:
      - ops/l3b-final-production-acceptance-20260909

permissions:
  contents: read

concurrency:
  group: l3b-final-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      FRONTEND_SHA: 4bd0a05aae98f5ec7278caf3327f69564fd6721d
      BACKEND_SHA: 51d464565601d3f1c0301d87c3f0efcec9e68f6d
      QA_TREND_ASSET: https://console.danielcanfly.com/assets/qa-trend-charts-B_ZpNz5o.js
    steps:
      - name: Console Access and asset smoke
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/console-qa.html --dump-header /tmp/console-qa.headers --write-out '%{http_code}' --max-time 15 https://console.danielcanfly.com/qa-review || true)"
          echo "CONSOLE_QA_REVIEW_STATUS=$code"
          if [ "$code" != 302 ] && [ "$code" != 403 ]; then
            cat /tmp/console-qa.headers || true
            head -c 1000 /tmp/console-qa.html || true
            exit 1
          fi
          if grep -Eiq 'location: .*cloudflareaccess|cf-access' /tmp/console-qa.headers; then
            echo 'CONSOLE_ROUTE_ACCESS_REDIRECT=PASS'
          elif [ "$code" = 403 ]; then
            echo 'CONSOLE_ROUTE_ACCESS_DENY=PASS'
          else
            cat /tmp/console-qa.headers || true
            exit 1
          fi

          asset_code="$(curl --silent --output /tmp/qa-trend.body --dump-header /tmp/qa-trend.headers --write-out '%{http_code}' --max-time 15 "$QA_TREND_ASSET" || true)"
          echo "CONSOLE_QA_TREND_ASSET_STATUS=$asset_code"
          if [ "$asset_code" = 200 ]; then
            grep -Eq 'Answer quality trend|Latency' /tmp/qa-trend.body
            echo 'CONSOLE_QA_TREND_ASSET_PUBLIC=PASS'
          elif [ "$asset_code" = 302 ] && grep -Eiq 'location: .*cloudflareaccess|cf-access' /tmp/qa-trend.headers; then
            echo 'CONSOLE_QA_TREND_ASSET_ACCESS_PROTECTED=PASS'
          else
            cat /tmp/qa-trend.headers || true
            head -c 1000 /tmp/qa-trend.body || true
            exit 1
          fi
          echo 'FRONTEND_PRODUCTION_ROUTE=PASS'
          echo "FRONTEND_ACCEPTED_SHA=$FRONTEND_SHA"

      - name: Backend health and admin fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 15 https://api.danielcanfly.com/v1/answers/health)"
          python3 - "$health" "$BACKEND_SHA" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          expected = sys.argv[2]
          actual = (payload.get('backend') or payload.get('runtime') or {}).get('build_sha', '')
          print('BACKEND_HEALTH_BUILD_SHA=' + actual)
          assert payload.get('ok') is True, payload
          assert actual == expected, (actual, expected, payload)
          print('BACKEND_HEALTH_IDENTITY=PASS')
          PY

          admin_code="$(curl --silent --output /tmp/admin.json --write-out '%{http_code}' --max-time 15 https://api.danielcanfly.com/v1/admin/qa/inbox/events || true)"
          echo "QA_ADMIN_UNAUTH_STATUS=$admin_code"
          test "$admin_code" = 401
          grep -F 'ADMIN_ACCESS_ASSERTION_MISSING' /tmp/admin.json
          echo 'QA_ADMIN_UNAUTH_FAIL_CLOSED=PASS'
          echo 'BACKEND_QA_RUNTIME=PASS'

      - name: Public answer regression smoke
        shell: bash
        run: |
          set -euo pipefail
          cors_code="$(curl --silent --output /tmp/cors.body --dump-header /tmp/cors.headers --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://danielcanfly.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-m26-owner-bypass' \
            https://api.danielcanfly.com/v1/answers || true)"
          echo "PUBLIC_CORS_STATUS=$cors_code"
          test "$cors_code" = 204
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://danielcanfly.com' /tmp/cors.headers
          echo 'PUBLIC_CORS=PASS'

          answer_code="$(curl --silent --show-error --max-time 90 --output /tmp/answer.sse --write-out '%{http_code}' \
            -H 'Origin: https://danielcanfly.com' -H 'Content-Type: application/json' \
            --data '{"question":"What is Daniel Can Fly about?"}' \
            https://api.danielcanfly.com/v1/answers || true)"
          echo "PUBLIC_ANSWER_STATUS=$answer_code"
          if [ "$answer_code" != 200 ]; then
            head -c 2000 /tmp/answer.sse || true
            exit 1
          fi
          if grep -Eq '"type"[[:space:]]*:[[:space:]]*"answer\.(completed|abstained)"' /tmp/answer.sse; then
            echo 'PUBLIC_ANSWER_REGRESSION=PASS'
          elif grep -Eq 'event:[[:space:]]*answer\.(completed|abstained)' /tmp/answer.sse; then
            echo 'PUBLIC_ANSWER_REGRESSION=PASS'
          else
            head -c 2000 /tmp/answer.sse || true
            exit 1
          fi

      - name: Final acceptance marker
        shell: bash
        run: |
          set -euo pipefail
          echo 'L3B_FINAL_CROSS_PLANE_ACCEPTANCE=PASS'
          echo 'PRODUCTION_MUTATION=0'

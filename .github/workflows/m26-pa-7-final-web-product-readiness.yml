          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          PORTS = {80, 443}


          def digest(value):
              return hashlib.sha256(str(value).encode()).hexdigest()


          def run(cmd):
              return subprocess.run(cmd, check=False, capture_output=True, text=True)


          def listener_port(local_address):
              if not local_address:
                  return None
              if local_address.endswith("]"):
                  return None
              candidate = local_address.rsplit(":", 1)[-1]
              try:
                  return int(candidate)
              except ValueError:
                  return None


          def listener_snapshot():
              result = run(["sudo", "-n", "ss", "-H", "-ltnp"])
              probe_mode = "sudo_ss"
              if result.returncode != 0:
                  result = run(["ss", "-H", "-ltnp"])
                  probe_mode = "ss"
              listeners = []
              if result.returncode != 0:
                  return listeners, "ss_unavailable"
              for line in result.stdout.splitlines():
                  parts = line.split()
                  if len(parts) < 4:
                      continue
                  port = listener_port(parts[3])
                  if port not in PORTS:
                      continue
                  process_text = " ".join(parts[5:]) if len(parts) > 5 else ""
                  pids = {int(pid) for pid in re.findall(r"pid=(\d+)", process_text)}
                  listeners.append({"port": port, "pids": sorted(pids), "probe_mode": probe_mode})
              return listeners, None


          def read_cgroup_container_ids(pid):
              try:
                  text = Path(f"/proc/{pid}/cgroup").read_text(errors="replace")
              except OSError:
                  return set()
              matches = set(re.findall(r"([0-9a-f]{64})", text))
              matches.update(re.findall(r"docker-([0-9a-f]{64})\.scope", text))
              return matches


          def process_owner_class(pid):
              try:
                  comm = Path(f"/proc/{pid}/comm").read_text(errors="replace").strip().lower()
              except OSError:
                  return "unknown"
              if comm == "caddy":
                  return "system_caddy"
              if comm == "nginx":
                  return "system_nginx"
              if comm == "apache2":
                  return "system_apache2"
              if comm == "httpd":
                  return "system_httpd"
              if comm == "docker-proxy":
                  return "docker_proxy"
              return "unrecognized"


          def system_service_for_class(owner_class):
              return {
                  "system_nginx": "nginx",
                  "system_apache2": "apache2",
                  "system_httpd": "httpd",
              }.get(owner_class)


          def inspect_running_containers():
              ps = run(["docker", "ps", "-q"])
              if ps.returncode != 0:
                  return {}
              ids = [line.strip() for line in ps.stdout.splitlines() if line.strip()]
              if not ids:
                  return {}
              inspect = run(["docker", "inspect", *ids])
              if inspect.returncode != 0:
                  return {}
              containers = {}
              for item in json.loads(inspect.stdout):
                  cid = str(item.get("Id") or "")
                  if not cid:
                      continue
                  ports = set()
                  network_ports = item.get("NetworkSettings", {}).get("Ports") or {}
                  for bindings in network_ports.values():
                      for binding in bindings or []:
                          try:
                              host_port = int(binding.get("HostPort") or 0)
                          except ValueError:
                              continue
                          if host_port in PORTS:
                              ports.add(host_port)
                  containers[cid] = {
                      "id": cid,
                      "image": str(item.get("Config", {}).get("Image") or ""),
                      "name": str(item.get("Name") or "").lstrip("/"),
                      "pid": int(item.get("State", {}).get("Pid") or 0),
                      "published_ports": ports,
                      "running": bool(item.get("State", {}).get("Running")),
                  }
              return containers


          state_dir = Path(os.environ["HANDOFF_STATE_DIR"])
          state_dir.mkdir(parents=True, exist_ok=True)
          stopped_file = state_dir / "oracle-https-port-handoff-stopped-containers"
          stopped_services_file = state_dir / "oracle-https-port-handoff-stopped-services"
          stopped_file.write_text("")
          stopped_services_file.write_text("")

          listeners, listener_error = listener_snapshot()
          containers = inspect_running_containers()
          owner_ports = {}
          owner_methods = {}
          non_docker_owner_classes = set()
          system_services_to_stop = set()
          non_docker_listener_count = 0
          for listener in listeners:
              matched = set()
              cgroup_ids = set()
              for pid in listener["pids"]:
                  cgroup_ids.update(read_cgroup_container_ids(pid))
              for cid, info in containers.items():
                  methods = set()
                  if info["pid"] and info["pid"] in listener["pids"]:
                      methods.add("state_pid")
                  if info["published_ports"] and listener["port"] in info["published_ports"]:
                      methods.add("published_port")
                  if any(cid.startswith(cgroup_id) or cgroup_id.startswith(cid[:12]) for cgroup_id in cgroup_ids):
                      methods.add("cgroup")
                  if methods:
                      matched.add(cid)
                      owner_ports.setdefault(cid, set()).add(listener["port"])
                      owner_methods.setdefault(cid, set()).update(methods)
              if not matched:
                  non_docker_listener_count += 1
                  if listener["pids"]:
                      for pid in listener["pids"]:
                          owner_class = process_owner_class(pid)
                          non_docker_owner_classes.add(owner_class)
                          service = system_service_for_class(owner_class)
                          if service:
                              system_services_to_stop.add(service)
                  else:
                      non_docker_owner_classes.add("pid_unavailable")

          records = []
          stopped_names = []
          stop_failed_count = 0
          for cid in sorted(owner_ports):
              info = containers[cid]
              if info["name"] == "m26-pa7-backend-https-origin":
                  action = "already_replaced"
              elif info["running"]:
                  stopped = run(["docker", "stop", info["name"] or cid])
                  if stopped.returncode == 0:
                      action = "stopped"
                      if info["name"]:
                          stopped_names.append(info["name"])
                  else:
                      action = "stop_failed"
                      stop_failed_count += 1
              else:
                  action = "already_stopped"
              records.append(
                  {
                      "action": action,
                      "container_id_sha256": digest(cid),
                      "container_image_sha256": digest(info["image"]),
                      "container_name_sha256": digest(info["name"]),
                      "detected_ports": sorted(owner_ports[cid]),
                      "detection_methods": sorted(owner_methods.get(cid, set())),
                  }
              )

          if stopped_names:
              stopped_file.write_text("\n".join(stopped_names) + "\n")

          system_service_records = []
          stopped_services = []
          system_service_stop_failed_count = 0
          stoppable_system_classes = {"system_nginx", "system_apache2", "system_httpd"}
          if (
              non_docker_owner_classes
              and non_docker_owner_classes.issubset(stoppable_system_classes)
          ):
              for service in sorted(system_services_to_stop):
                  stopped = run(["sudo", "-n", "systemctl", "stop", service])
                  if stopped.returncode == 0:
                      action = "stopped"
                      stopped_services.append(service)
                  else:
                      action = "stop_failed"
                      system_service_stop_failed_count += 1
                  system_service_records.append(
                      {
                          "action": action,
                          "service_name_sha256": digest(service),
                          "service_owner_class": {
                              "nginx": "system_nginx",
                              "apache2": "system_apache2",
                              "httpd": "system_httpd",
                          }[service],
                      }
                  )
          if stopped_services:
              stopped_services_file.write_text("\n".join(stopped_services) + "\n")

          remaining, remaining_error = listener_snapshot()
          evidence = {
              "docker_owner_count": len(records),
              "listener_error": listener_error,
              "listener_ports_checked": sorted(PORTS),
              "non_docker_listener_count": non_docker_listener_count,
              "non_docker_owner_classes": sorted(non_docker_owner_classes),
              "owner_records": records,
              "protected_knowledge_mutations": 0,
              "raw_container_id_recorded": False,
              "raw_container_image_recorded": False,
              "raw_container_name_recorded": False,
              "raw_listener_recorded": False,
              "raw_pid_recorded": False,
              "raw_system_service_name_recorded": False,
              "remaining_listener_count": len(remaining),
              "remaining_listener_error": remaining_error,
              "schema_version": "knowledge-engine-m26-pa7-oracle-https-port-handoff/v1",
              "stop_failed_count": stop_failed_count,
              "stopped_docker_owner_count": len(stopped_names),
              "stopped_system_service_count": len(stopped_services),
              "system_service_owner_records": system_service_records,
              "system_service_stop_failed_count": system_service_stop_failed_count,
          }
          evidence["status"] = (
              "pass"
              if not listener_error
              and not remaining_error
              and (
                  non_docker_listener_count == 0
                  or len(stopped_services) == len(system_services_to_stop)
              )
              and stop_failed_count == 0
              and system_service_stop_failed_count == 0
              and len(remaining) == 0
              else "fail"
          )
          print(json.dumps(evidence, sort_keys=True))

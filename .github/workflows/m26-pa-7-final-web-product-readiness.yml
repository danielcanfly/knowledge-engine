name: M26.PA.7 Final Web Product Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa-7-final-web-product-readiness.yml"
      - ".github/workflows/m26-pa7-access-redirect-repair.yml"
      - ".github/workflows/m26-1-architecture-authority.yml"
      - "Dockerfile"
      - "pilot/m26/m26-pa-7-final-web-formal-test-manifest.json"
      - "pilot/m24/internal-product-deployment/site/**"
      - "deploy/deploy.sh"
      - "schemas/m26-pa-7-final-web-*.schema.json"
      - "scripts/m26_pa7_access_browser_session_contract.py"
      - "scripts/m26_pa7_durable_backend_origin.py"
      - "scripts/m26_pa7_evidence_privacy_hygiene.py"
      - "scripts/m26_pa7_named_backend_tunnel.py"
      - "src/knowledge_engine/m23_cloudflare_qdrant.py"
      - "src/knowledge_engine/api.py"
      - "src/knowledge_engine/m26_ask_api.py"
      - "src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py"
      - "src/knowledge_engine/m26_pa7_final_web_readiness.py"
      - "tests/test_m23_5_cloudflare_qdrant.py"
      - "tests/test_m24_internal_ask_ui_api.py"
      - "tests/test_m26_pa_7_arbitrary_query_runtime.py"
      - "tests/test_m26_pa7_access_browser_session_contract.py"
      - "tests/test_m26_pa7_ask_api.py"
      - "tests/test_m26_pa7_final_web_readiness.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-pa-7-final-web-product-readiness.yml"
      - ".github/workflows/m26-pa7-access-redirect-repair.yml"
      - ".github/workflows/m26-1-architecture-authority.yml"
      - "Dockerfile"
      - "pilot/m26/m26-pa-7-final-web-formal-test-manifest.json"
      - "pilot/m24/internal-product-deployment/site/**"
      - "deploy/deploy.sh"
      - "schemas/m26-pa-7-final-web-*.schema.json"
      - "scripts/m26_pa7_access_browser_session_contract.py"
      - "scripts/m26_pa7_durable_backend_origin.py"
      - "scripts/m26_pa7_evidence_privacy_hygiene.py"
      - "scripts/m26_pa7_named_backend_tunnel.py"
      - "src/knowledge_engine/m23_cloudflare_qdrant.py"
      - "src/knowledge_engine/api.py"
      - "src/knowledge_engine/m26_ask_api.py"
      - "src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py"
      - "src/knowledge_engine/m26_pa7_final_web_readiness.py"
      - "tests/test_m23_5_cloudflare_qdrant.py"
      - "tests/test_m24_internal_ask_ui_api.py"
      - "tests/test_m26_pa_7_arbitrary_query_runtime.py"
      - "tests/test_m26_pa7_access_browser_session_contract.py"
      - "tests/test_m26_pa7_ask_api.py"
      - "tests/test_m26_pa7_final_web_readiness.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: m26-pa7-oracle-backend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify exact head and final authority chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 17e22fd103c78499ccc5841b80399437fe8ed1c3 HEAD
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("pilot/m26/m26-pa-7-final-web-formal-test-manifest.json").read_text()
          )
          claimed = manifest.pop("self_sha256")
          actual = hashlib.sha256(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          assert claimed == actual
          assert claimed == "fbedacb25b7bc9a28833d58658e6425637d990b064ea67a31451f94e7f36e91e"
          assert manifest["final_owner_authority_self_sha256"] == "19a1a5d41f8c935a235631975a225a622e4767e95b80ce23da2ff867c31ba2ce"
          assert manifest["count"] == 10
          assert manifest["single_evidence_impossibility_required"] is True
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m playwright install chromium

      - name: Validate final Ask API and web readiness implementation
        run: |
          set -euo pipefail
          python -m ruff check \
            src/knowledge_engine/m23_cloudflare_qdrant.py \
            src/knowledge_engine/api.py \
            src/knowledge_engine/m26_ask_api.py \
            src/knowledge_engine/m26_pa7_final_web_readiness.py \
            scripts/m26_pa7_access_browser_session_contract.py \
            scripts/m26_pa7_durable_backend_origin.py \
            scripts/m26_pa7_evidence_privacy_hygiene.py \
            scripts/m26_pa7_named_backend_tunnel.py \
            tests/test_m23_5_cloudflare_qdrant.py \
            tests/test_m24_internal_ask_ui_api.py \
            tests/test_m26_pa7_access_browser_session_contract.py \
            tests/test_m26_pa7_ask_api.py \
            tests/test_m26_pa7_final_web_readiness.py
          python -m compileall -q \
            src/knowledge_engine/m23_cloudflare_qdrant.py \
            src/knowledge_engine/api.py \
            src/knowledge_engine/m26_ask_api.py \
            src/knowledge_engine/m26_pa7_final_web_readiness.py \
            scripts/m26_pa7_access_browser_session_contract.py \
            scripts/m26_pa7_durable_backend_origin.py \
            scripts/m26_pa7_evidence_privacy_hygiene.py \
            scripts/m26_pa7_named_backend_tunnel.py \
            tests/test_m23_5_cloudflare_qdrant.py \
            tests/test_m24_internal_ask_ui_api.py \
            tests/test_m26_pa7_access_browser_session_contract.py \
            tests/test_m26_pa7_ask_api.py \
            tests/test_m26_pa7_final_web_readiness.py
          python -m pytest -q \
            tests/test_m23_5_cloudflare_qdrant.py \
            tests/test_m24_internal_ask_ui_api.py \
            tests/test_m26_pa7_access_browser_session_contract.py \
            tests/test_m26_pa7_ask_api.py \
            tests/test_m26_pa7_final_web_readiness.py
          node --check pilot/m24/internal-product-deployment/site/_worker.js
          node --check pilot/m24/internal-product-deployment/site/m26-ask.js

      - name: Enforce final web changed-file boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          ! grep -Ev '^(\.github/workflows/(m26-pa-7-final-web-product-readiness|m26-pa7-access-redirect-repair|m26-pa7-owner-access-and-full-graph-repair|m26-pa7-explicit-pages-deploy|m26-pa7-explicit-backend-redeploy|m26-pa-4-verified-answer-citation-gate|m26-1-architecture-authority)\.yml|Dockerfile|deploy/deploy\.sh|pilot/m26/m26-pa-7-final-web-formal-test-manifest\.json|pilot/m24/internal-product-deployment/site/(index\.html|app\.js|m26-ask\.js|_worker\.js|styles\.css|data/.*)|schemas/m26-pa-7-final-web-[a-z-]+-v1\.schema\.json|scripts/m26_pa7_(access_browser_session_contract|durable_backend_origin|evidence_privacy_hygiene|named_backend_tunnel)\.py|src/knowledge_engine/(api|m23_cloudflare_qdrant|m26_ask_api|m26_pa7_final_web_readiness)\.py|tests/test_(m23_5_cloudflare_qdrant|m24_internal_ask_ui_api|m26_pa7_access_browser_session_contract|m26_pa7_ask_api|m26_pa7_final_web_readiness)\.py)$' /tmp/changed.txt
          ! grep -E '^(production/|release/production|r2/|qdrant/|foundation/|credentials/|secrets/)' /tmp/changed.txt

  deploy_and_runtime_formal:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-final-web-live
      PAGES_PROJECT: llm-wiki-m24-internal
      INTERNAL_HOSTNAME: m24-internal.danielcanfly.com
      CLOUDFLARE_ZONE_NAME: danielcanfly.com
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY_READ: ${{ secrets.QDRANT_API_KEY_READ }}
      QDRANT_READ_ONLY_API_KEY: ${{ secrets.QDRANT_READ_ONLY_API_KEY }}
      M26_PA7_DENSE_COLLECTION: ${{ vars.M26_PA7_DENSE_COLLECTION || 'm25_blog_m25blog_5250f8422f4f_f5f01d82c7a1_fe499db2e043_fe499db2e043' }}
      KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH: 93c8aaae82e498dc2e6bfdcaa48b8823fe21a5ceef44ca2cf9cf35cf6350e05b
      M26_OWNER_EMAIL_SHA256: ${{ vars.M26_OWNER_EMAIL_SHA256 || '44fff1988e24f32fad88891fad5cc8e90591d4a59457c61aac768f2517dff556' }}
      M26_QUERY_BACKEND_URL: ${{ vars.M26_QUERY_BACKEND_URL || secrets.M26_QUERY_BACKEND_URL }}
      M26_QUERY_BACKEND_TUNNEL_HOSTNAME: ${{ vars.M26_QUERY_BACKEND_TUNNEL_HOSTNAME || secrets.M26_QUERY_BACKEND_TUNNEL_HOSTNAME || 'm26-query-backend.danielcanfly.com' }}
      M26_QUERY_BACKEND_TUNNEL_NAME: ${{ vars.M26_QUERY_BACKEND_TUNNEL_NAME || secrets.M26_QUERY_BACKEND_TUNNEL_NAME || 'm26-pa7-query-backend' }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      AUTH_MODE: ${{ vars.AUTH_MODE || secrets.AUTH_MODE }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER || secrets.JWT_ISSUER }}
      JWT_JWKS_URL: ${{ vars.JWT_JWKS_URL || secrets.JWT_JWKS_URL }}
      JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE || secrets.JWT_AUDIENCE }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_READ || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_READ || secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize evidence and duplicate-live guard
        id: guard
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from pathlib import Path
          from knowledge_engine.m26_pa7_final_web_readiness import duplicate_live_guard_status
          guard = duplicate_live_guard_status(Path("."))
          path = Path(os.environ["WORK_DIR"]) / "evidence/duplicate-live-guard.json"
          path.write_text(json.dumps(guard, indent=2, sort_keys=True) + "\n")
          print("authorized=" + ("true" if guard["live_execution_authorized"] else "false"))
          PY
          if jq -e '.live_execution_authorized == true' "$WORK_DIR/evidence/duplicate-live-guard.json" >/dev/null; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require bounded live configuration
        if: steps.guard.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for name in \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_TOKEN CLOUDFLARE_ACCESS_READ_TOKEN \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_WORKERS_TOKEN \
            MINIMAX_API_KEY QDRANT_URL \
            ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH \
            ORACLE_VM_SSH_PRIVATE_KEY AUTH_MODE JWT_ISSUER JWT_JWKS_URL JWT_AUDIENCE \
            R2_ENDPOINT_URL R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
            KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH M26_OWNER_EMAIL_SHA256; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done

      - name: Install live dependencies
        if: steps.guard.outputs.authorized == 'true'
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          npm --version

      - name: Capture Cloudflare pre-state and Access readback
        if: steps.guard.outputs.authorized == 'true'
        env:
          CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/m25_9_cloudflare_live_preflight.py preflight \
            --evidence-output "$WORK_DIR/evidence/cloudflare-preflight-runtime.json" \
            --runtime-env-output "$WORK_DIR/runtime-bindings.env"
          while IFS='=' read -r name value; do
            case "$name" in
              PREVIOUS_PAGES_DEPLOYMENT_ID|ACCESS_AUD|ACCESS_TEAM_DOMAIN) ;;
              *) exit 1 ;;
            esac
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$WORK_DIR/runtime-bindings.env"
          rm -f "$WORK_DIR/runtime-bindings.env"
          python scripts/m26_pa7_access_browser_session_contract.py inspect \
            --evidence-output "$WORK_DIR/evidence/access-browser-session-contract.json"

      - name: Deploy Oracle backend exact SHA
        if: steps.guard.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh
          ssh oracle-knowledge "if [ ! -d '$ORACLE_VM_DEPLOY_PATH/.git' ]; then git clone https://github.com/danielcanfly/knowledge-engine.git '$ORACLE_VM_DEPLOY_PATH'; fi"
          previous_sha="$(ssh oracle-knowledge "cd '$ORACLE_VM_DEPLOY_PATH' && git rev-parse HEAD 2>/dev/null || true")"
          printf 'ORACLE_PREVIOUS_SHA=%s\n' "$previous_sha" >> "$GITHUB_ENV"
          echo "::add-mask::$previous_sha"
          backend_token="$(openssl rand -hex 32)"
          echo "::add-mask::$backend_token"
          printf 'M26_QUERY_BACKEND_TOKEN=%s\n' "$backend_token" >> "$GITHUB_ENV"
          umask 077
          cat > "$WORK_DIR/knowledge-engine.env" <<EOF_ENV
          APP_ENV=production
          AUTH_MODE=$AUTH_MODE
          JWT_ISSUER=$JWT_ISSUER
          JWT_JWKS_URL=$JWT_JWKS_URL
          JWT_AUDIENCE=$JWT_AUDIENCE
          JWT_DEFAULT_AUDIENCES=public,internal
          OBJECT_STORE_BACKEND=r2
          R2_ENDPOINT_URL=$R2_ENDPOINT_URL
          R2_BUCKET=$R2_BUCKET
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_REGION=auto
          KNOWLEDGE_CHANNEL=production
          CACHE_DIR=/var/lib/knowledge-engine/cache
          LOG_LEVEL=INFO
          MINIMAX_API_KEY=$MINIMAX_API_KEY
          CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          CLOUDFLARE_AI_TOKEN=$CLOUDFLARE_AI_TOKEN
          QDRANT_URL=$QDRANT_URL
          QDRANT_API_KEY_READ=$QDRANT_API_KEY_READ
          QDRANT_READ_ONLY_API_KEY=$QDRANT_READ_ONLY_API_KEY
          M26_PA7_DENSE_COLLECTION=$M26_PA7_DENSE_COLLECTION
          KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH=$KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH
          M26_QUERY_BACKEND_TOKEN=$backend_token
          M26_QUERY_BUILD_SHA=$GITHUB_SHA
          M26_QUERY_REQUIRE_REMOTE_DENSE=true
          M26_PA7_GATE_PATH=pilot/m26/m26-pa-7-corrected-resolved-production-gate.json
          KNOWLEDGE_ENGINE_ROOT=/app
          EOF_ENV
          scp "$WORK_DIR/knowledge-engine.env" "oracle-knowledge:$ORACLE_VM_DEPLOY_PATH/.env.next"
          ssh oracle-knowledge "chmod 600 '$ORACLE_VM_DEPLOY_PATH/.env.next' && mv '$ORACLE_VM_DEPLOY_PATH/.env.next' '$ORACLE_VM_DEPLOY_PATH/.env'"
          rm -f "$WORK_DIR/knowledge-engine.env"
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$GITHUB_SHA' bash '$ORACLE_VM_DEPLOY_PATH/deploy/deploy.sh'"
          echo "BACKEND_DEPLOYED=true" >> "$GITHUB_ENV"
          ssh oracle-knowledge "curl --fail --silent \
            -H 'authorization: Bearer $backend_token' \
            -H 'x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH' \
            http://127.0.0.1:8080/api/m26/health" \
            > "$WORK_DIR/evidence/backend-health-local.json"
          if test -z "${M26_QUERY_BACKEND_URL:-}"; then
            : "${M26_QUERY_BACKEND_TUNNEL_HOSTNAME:?missing backend tunnel hostname}"
            : "${M26_QUERY_BACKEND_TUNNEL_NAME:?missing backend tunnel name}"
            if python scripts/m26_pa7_named_backend_tunnel.py ensure \
              --account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --zone-name "$CLOUDFLARE_ZONE_NAME" \
              --hostname "$M26_QUERY_BACKEND_TUNNEL_HOSTNAME" \
              --tunnel-name "$M26_QUERY_BACKEND_TUNNEL_NAME" \
              --service http://127.0.0.1:8080 \
              --evidence-output "$WORK_DIR/evidence/backend-named-tunnel.json" \
              --runtime-env-output "$WORK_DIR/backend-named-tunnel.env" \
              2> "$WORK_DIR/backend-named-tunnel.err"; then
              backend_origin_env="$WORK_DIR/backend-named-tunnel.env"
              backend_origin_mode="named_tunnel"
            else
              python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              "schema_version": "knowledge-engine-m26-pa7-named-backend-tunnel-unavailable/v1",
              "raw_backend_origin_recorded": False,
              "raw_error_recorded": False,
              "status": "cloudflare_tunnel_api_unavailable_falling_back_to_durable_https_origin",
          }
          Path(os.environ["WORK_DIR"], "evidence/backend-named-tunnel-unavailable.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
              rm -f "$WORK_DIR/backend-named-tunnel.err"
              if python - "$ORACLE_VM_HOST" <<'PY'
          import ipaddress
          import sys
          ipaddress.ip_address(sys.argv[1])
          PY
              then
                if python scripts/m26_pa7_durable_backend_origin.py cloudflare-dns-a \
                  --zone-name "$CLOUDFLARE_ZONE_NAME" \
                  --hostname "$M26_QUERY_BACKEND_TUNNEL_HOSTNAME" \
                  --address "$ORACLE_VM_HOST" \
                  --evidence-output "$WORK_DIR/evidence/backend-cloudflare-dns-a-origin.json" \
                  --runtime-env-output "$WORK_DIR/backend-cloudflare-dns-a-origin.env" \
                  2> "$WORK_DIR/backend-cloudflare-dns-a-origin.err"; then
                  backend_origin_env="$WORK_DIR/backend-cloudflare-dns-a-origin.env"
                else
                  python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              "schema_version": "knowledge-engine-m26-pa7-cloudflare-dns-a-unavailable/v1",
              "raw_backend_origin_recorded": False,
              "raw_error_recorded": False,
              "raw_ip_recorded": False,
              "status": "cloudflare_dns_a_unavailable_falling_back_to_wildcard_dns",
          }
          Path(os.environ["WORK_DIR"], "evidence/backend-cloudflare-dns-a-unavailable.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
                  rm -f "$WORK_DIR/backend-cloudflare-dns-a-origin.err"
                  python scripts/m26_pa7_durable_backend_origin.py wildcard-dns \
                    --address "$ORACLE_VM_HOST" \
                    --suffix nip.io \
                    --evidence-output "$WORK_DIR/evidence/backend-wildcard-dns-origin.json" \
                    --runtime-env-output "$WORK_DIR/backend-wildcard-dns-origin.env"
                  backend_origin_env="$WORK_DIR/backend-wildcard-dns-origin.env"
                fi
              else
                python scripts/m26_pa7_durable_backend_origin.py oracle-https \
                  --hostname "$ORACLE_VM_HOST" \
                  --evidence-output "$WORK_DIR/evidence/backend-oracle-https-origin.json" \
                  --runtime-env-output "$WORK_DIR/backend-oracle-https-origin.env"
                backend_origin_env="$WORK_DIR/backend-oracle-https-origin.env"
              fi
              backend_origin_mode="oracle_https"
            fi
            while IFS='=' read -r name value; do
              case "$name" in
                M26_BACKEND_ORIGIN_CLASS|M26_BACKEND_TUNNEL_ID|M26_BACKEND_TUNNEL_TOKEN|M26_ORACLE_BACKEND_TLS_HOSTNAME|M26_QUERY_BACKEND_ORIGIN) ;;
                *) exit 1 ;;
              esac
              test -n "$value"
              echo "::add-mask::$value"
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
              export "$name=$value"
            done < "$backend_origin_env"
            rm -f "$backend_origin_env"
            if test "$backend_origin_mode" = "named_tunnel"; then
              tunnel_state_dir="$ORACLE_VM_DEPLOY_PATH/.m26-pa7-final-web-tunnel"
              printf '%s' "$M26_BACKEND_TUNNEL_TOKEN" > "$WORK_DIR/backend-tunnel-token"
              ssh oracle-knowledge "mkdir -p '$tunnel_state_dir' && chmod 700 '$tunnel_state_dir'"
              scp "$WORK_DIR/backend-tunnel-token" "oracle-knowledge:$tunnel_state_dir/token.next"

name: L3B Oracle Cloudflare Authority Census

on:
  push:
    branches:
      - ops/l3b-oracle-cloudflare-census-20260909

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
    steps:
      - name: Configure SSH authority
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_PRIVATE_KEY ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH; do
            test -n "${!name:-}" || { echo 'ORACLE_AUTHORITY=MISSING'; exit 2; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts
          echo 'ORACLE_AUTHORITY=PASS'

      - name: Read-only Cloudflare authority probe via ephemeral Node container
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo 'DOCKER=NO'; exit 2; }
          echo 'DOCKER=YES'
          cf_env="$(mktemp /tmp/l3b-cf-env.XXXXXX)"
          cleanup(){ rm -f "$cf_env"; }
          trap cleanup EXIT
          python3 - "$DEPLOY_PATH/.env" "$cf_env" <<'PY'
          import os, pathlib, re, sys
          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          wanted = {'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID'}
          vals = {}
          for raw in src.read_text(encoding='utf-8', errors='ignore').splitlines():
              line = raw.strip()
              if line.startswith('export '):
                  line = line[7:].lstrip()
              m = re.match(r'([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$', line)
              if not m or m.group(1) not in wanted:
                  continue
              value = m.group(2).strip()
              for _ in range(3):
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                      value = value[1:-1].strip()
                  else:
                      break
              if value:
                  vals[m.group(1)] = value
          missing = sorted(wanted - vals.keys())
          if missing:
              print('CF_ENV_AUTHORITY=MISSING')
              raise SystemExit(2)
          dst.write_text(''.join(f'{k}={vals[k]}\n' for k in sorted(vals)), encoding='utf-8')
          os.chmod(dst, 0o600)
          print('CF_ENV_AUTHORITY=PASS')
          PY

          image='node:22-bookworm-slim'
          docker pull "$image" >/dev/null
          if docker run --rm --env-file "$cf_env" "$image" bash -lc \
            'npx --yes wrangler@4 whoami >/tmp/whoami.out 2>/tmp/whoami.err'; then
            echo 'WRANGLER_WHOAMI=PASS'
          else
            echo 'WRANGLER_WHOAMI=FAIL'
            exit 3
          fi

          echo 'DEPLOYMENTS_LIST_BEGIN'
          docker run --rm --env-file "$cf_env" "$image" bash -lc \
            'npx --yes wrangler@4 deployments list --name daniel-console-production' \
            | sed -E 's/(token|secret|key)[=:][^[:space:]]+/\1=[REDACTED]/Ig'
          echo 'DEPLOYMENTS_LIST_END'

          echo 'VERSIONS_LIST_BEGIN'
          docker run --rm --env-file "$cf_env" "$image" bash -lc \
            'npx --yes wrangler@4 versions list --name daniel-console-production' \
            | sed -E 's/(token|secret|key)[=:][^[:space:]]+/\1=[REDACTED]/Ig'
          echo 'VERSIONS_LIST_END'
          echo 'TARGET_WORKER=daniel-console-production'
          echo 'CLOUDFLARE_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
          REMOTE

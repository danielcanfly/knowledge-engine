name: Track1 Final Audit Reseal

on:
  push:
    branches:
      - codex/m26-public-api-v1-staging-20260815
    paths:
      - .github/workflows/track1-final-audit-reseal.yml

permissions:
  contents: write

env:
  TRACK1_BRANCH: codex/m26-public-api-v1-staging-20260815
  CLEAN_PRODUCT_SHA: 42cee5176754e95aa08027ecf372cd6fcc88bfda
  STAGING_REPO: /home/ubuntu/LLM_Wiki_staging_m26_cloudflare_d6288072
  FACADE: m26-public-api-staging-d6288072
  BACKEND: m26-cloudflare-primary-staging-d6288072
  PRODUCTION: llm_wiki-knowledge-engine-1

jobs:
  final-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m23-r3-diagnostic
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Reseal identical accepted product tree
        id: seal
        run: |
          set -euo pipefail
          git config user.name 'Track1 Master Supervisor'
          git config user.email '38602668+huaihsuanbusiness@users.noreply.github.com'
          git rm .github/workflows/track1-final-audit-reseal.yml
          git commit -m 'chore(track1): reseal final accepted staging tree'
          ACCEPTED_SHA="$(git rev-parse HEAD)"
          CLEAN_TREE="$(git rev-parse "$CLEAN_PRODUCT_SHA^{tree}")"
          ACCEPTED_TREE="$(git rev-parse HEAD^{tree})"
          test "$ACCEPTED_TREE" = "$CLEAN_TREE"
          test -z "$(git ls-tree -r --name-only HEAD | grep '^.github/workflows/track1-' || true)"
          git push origin "HEAD:refs/heads/${TRACK1_BRANCH}"
          echo "ACCEPTED_SHA=$ACCEPTED_SHA" >> "$GITHUB_ENV"
          echo "accepted_sha=$ACCEPTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'accepted_sha=%s\naccepted_tree=%s\nclean_tree=%s\ntree_matches=true\nsupervisor_workflows_present=false\n' \
            "$ACCEPTED_SHA" "$ACCEPTED_TREE" "$CLEAN_TREE" | tee /tmp/track1-reseal.txt

      - name: Configure bounded Oracle SSH
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh

      - name: Canonical quota persistence and production untouched audit
        run: |
          set -euo pipefail
          ssh oracle-knowledge \
            "ACCEPTED_SHA='${ACCEPTED_SHA}' TRACK1_BRANCH='${TRACK1_BRANCH}' STAGING_REPO='${STAGING_REPO}' FACADE='${FACADE}' BACKEND='${BACKEND}' PRODUCTION='${PRODUCTION}' bash -se" \
            <<'REMOTE' | tee /tmp/track1-final-runtime-audit.txt
          set -euo pipefail
          cd "$STAGING_REPO"

          prod_id_before="$(docker inspect -f '{{.Id}}' "$PRODUCTION")"
          prod_image_before="$(docker inspect -f '{{.Image}}' "$PRODUCTION")"
          backend_id_before="$(docker inspect -f '{{.Id}}' "$BACKEND")"
          backend_image_before="$(docker inspect -f '{{.Image}}' "$BACKEND")"

          git fetch origin "$ACCEPTED_SHA"
          git checkout -B "$TRACK1_BRANCH" "$ACCEPTED_SHA"
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

          test "$(docker inspect "$FACADE" -f '{{range .Config.Env}}{{println .}}{{end}}' | grep '^M26_PUBLIC_FORCE_LOCAL_DENSE=')" = 'M26_PUBLIC_FORCE_LOCAL_DENSE=false'
          test "$(docker inspect "$FACADE" -f '{{range .Config.Env}}{{println .}}{{end}}' | grep '^M26_QUERY_REQUIRE_REMOTE_DENSE=')" = 'M26_QUERY_REQUIRE_REMOTE_DENSE=true'
          dense_class="$(docker exec "$FACADE" python -c 'from knowledge_engine.m26_pa7_arbitrary_query_runtime import dense_channel_from_env; print(type(dense_channel_from_env(require_remote=True)).__name__)')"
          test "$dense_class" = RemoteQdrantDenseChannel
          docker inspect -f '{{json .Config.Cmd}}' "$FACADE" | grep -q 'm26_public_api_execution_truth:app'

          read_quota() {
            docker exec -i "$FACADE" python - <<'PY'
          import re
          import sqlite3
          from pathlib import Path

          path = Path('/var/lib/knowledge-engine/public-api/quota.sqlite3')
          with sqlite3.connect(path) as db:
              journal = str(db.execute('PRAGMA journal_mode').fetchone()[0]).lower()
              quota_rows = int(db.execute('SELECT COUNT(*) FROM quota_counts').fetchone()[0])
              fallback_rows = int(db.execute("SELECT COUNT(*) FROM quota_counts WHERE scope = 'fallback_daily'").fetchone()[0])
              active_sum = int(db.execute('SELECT COALESCE(SUM(count), 0) FROM active_counts').fetchone()[0])
              keys = [str(row[0]) for row in db.execute('SELECT key FROM quota_counts')]
              keys += [str(row[0]) for row in db.execute('SELECT key FROM active_counts')]
          raw_ip = any(re.search(r'(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])', key) for key in keys)
          print(f'{journal}|{quota_rows}|{fallback_rows}|{active_sum}|{str(raw_ip).lower()}')
          PY
          }

          before="$(read_quota)"
          IFS='|' read -r journal quota_rows fallback_rows active_sum raw_ip <<< "$before"
          test "$journal" = wal
          test "$active_sum" = 0
          test "$raw_ip" = false

          docker restart "$FACADE" >/dev/null
          for attempt in $(seq 1 30); do
            test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FACADE")" = healthy && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$FACADE")" = healthy

          after="$(read_quota)"
          test "$before" = "$after"

          test "$(docker inspect -f '{{.Id}}' "$PRODUCTION")" = "$prod_id_before"
          test "$(docker inspect -f '{{.Image}}' "$PRODUCTION")" = "$prod_image_before"
          test "$(docker inspect -f '{{.Id}}' "$BACKEND")" = "$backend_id_before"
          test "$(docker inspect -f '{{.Image}}' "$BACKEND")" = "$backend_image_before"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/health)" = 200

          echo "staging_repo_head=$(git rev-parse HEAD)"
          echo "dense_channel_class=$dense_class"
          echo 'M26_PUBLIC_FORCE_LOCAL_DENSE=false'
          echo 'M26_QUERY_REQUIRE_REMOTE_DENSE=true'
          echo "quota_state_before=$before"
          echo "quota_state_after=$after"
          echo 'quota_restart_persistent=true'
          echo 'raw_ip_present=false'
          echo "production_id=$prod_id_before"
          echo "production_image=$prod_image_before"
          echo "backend_id=$backend_id_before"
          echo "backend_image=$backend_image_before"
          echo 'production_mutations=0'
          REMOTE

      - name: External health and exact SHA stability audit
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/track1-final-health.json -w '%{http_code}' https://api-staging.danielcanfly.com/v1/health)" = 200
          remote_sha="$(git ls-remote origin "refs/heads/${TRACK1_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$ACCEPTED_SHA"
          git fetch origin "$ACCEPTED_SHA"
          test "$(git rev-parse "$ACCEPTED_SHA^{tree}")" = "$(git rev-parse "$CLEAN_PRODUCT_SHA^{tree}")"
          test -z "$(git ls-tree -r --name-only "$ACCEPTED_SHA" | grep '^.github/workflows/track1-' || true)"
          printf 'remote_branch_sha=%s\naccepted_sha=%s\naccepted_tree_stable=true\nsupervisor_workflows_present=false\nproduction_promotion=false\n' \
            "$remote_sha" "$ACCEPTED_SHA" | tee /tmp/track1-final-sha-audit.txt

      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track1-final-audit-${{ steps.seal.outputs.accepted_sha || github.sha }}
          path: |
            /tmp/track1-reseal.txt
            /tmp/track1-final-runtime-audit.txt
            /tmp/track1-final-health.json
            /tmp/track1-final-sha-audit.txt
          if-no-files-found: warn
          retention-days: 14

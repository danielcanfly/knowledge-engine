name: M26 AQ Final Production Closure

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/deploy.sh"
      - ".github/workflows/m26-aq-final-production-closure.yml"
      - "src/knowledge_engine/m26_pa7_semantic_closure_runtime.py"
      - "src/knowledge_engine/m26_aq_semantic_runtime_patch_v3.py"
      - "src/knowledge_engine/m26_aq_semantic_runtime_patch_v3_lifecycle.py"
      - "src/knowledge_engine/m26_aq_semantic_runtime_patch_v3_surface.py"
      - "src/knowledge_engine/m26_aq_universal_answerability_patch.py"
      - "src/knowledge_engine/m26_aq_final_universal_recovery_patch.py"
      - "src/knowledge_engine/m26_production_api.py"
      - "scripts/m26_aq_final_closure.py"
      - "scripts/m26_aq_remote_production_closure.sh"
      - "scripts/m26_aq_generalized_closure.py"
      - "scripts/m26_aq_targeted_answerability_closure.py"
      - "scripts/m26_pa7_named_backend_tunnel.py"
      - "pilot/m26/m26-aq-final-r3-questions.json"
      - "pilot/m26/m26-aq-gpt-e-black-box-questions.json"
      - "pilot/m26/m26-aq-universal-answerability-targeted-questions.json"
      - "tests/test_m26_aq_semantic_closure_runtime.py"
      - "tests/test_m26_aq_semantic_runtime_patch_v3.py"
      - "tests/test_m26_aq_universal_answerability_patch.py"
      - "tests/test_m26_aq_final_universal_recovery_patch.py"
      - "tests/test_m26_aq_production_route_final_recovery.py"
      - "tests/test_m26_aq_surface_guard.py"
      - "tests/test_m26_aq_production_deploy_lock.py"
      - "tests/test_m26_aq_production_entrypoint.py"
      - "tests/test_m26_aq_final_closure_harness.py"
      - "tests/test_m26_aq_simplified_product_contract.py"
      - "src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py"
      - "src/knowledge_engine/m26_production_answer_bundle.py"
      - "src/knowledge_engine/m26_ask_api.py"
      - "tests/conftest.py"
  push:
    branches:
      - "gpt/aq-final-closure-run"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m26-owner-production-oracle
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile production closure paths
        run: |
          python -m py_compile \
            src/knowledge_engine/m26_pa7_semantic_closure_runtime.py \
            src/knowledge_engine/m26_aq_semantic_runtime_patch_v3.py \
            src/knowledge_engine/m26_aq_semantic_runtime_patch_v3_lifecycle.py \
            src/knowledge_engine/m26_aq_semantic_runtime_patch_v3_surface.py \
            src/knowledge_engine/m26_aq_universal_answerability_patch.py \
            src/knowledge_engine/m26_aq_final_universal_recovery_patch.py \
            src/knowledge_engine/m26_production_api.py \
            scripts/m26_aq_final_closure.py \
            scripts/m26_aq_generalized_closure.py \
            scripts/m26_aq_targeted_answerability_closure.py \
            scripts/m26_pa7_named_backend_tunnel.py \
            tests/test_m26_aq_semantic_closure_runtime.py \
            tests/test_m26_aq_semantic_runtime_patch_v3.py \
            tests/test_m26_aq_universal_answerability_patch.py \
            tests/test_m26_aq_final_universal_recovery_patch.py \
            tests/test_m26_aq_production_route_final_recovery.py \
            tests/test_m26_aq_surface_guard.py \
            tests/test_m26_aq_production_entrypoint.py \
            tests/test_m26_aq_final_closure_harness.py \
            tests/test_m26_aq_simplified_product_contract.py
          bash -n scripts/m26_aq_remote_production_closure.sh
          bash -n deploy/deploy.sh
          python -m json.tool \
            pilot/m26/m26-aq-universal-answerability-targeted-questions.json \
            >/dev/null

      - name: Run full AQ regression population
        run: |
          set -euo pipefail
          python -m pytest --showlocals \
            tests/test_m26_production_answer_bundle.py \
            tests/test_m26_pa_7_arbitrary_query_runtime.py \
            tests/test_m26_pa7_ask_api.py \
            tests/test_m26_pa7_final_web_readiness.py \
            tests/test_m26_pa_7_corrective_formal_product_readiness.py \
            tests/test_m26_pa_7_production_promotion_closure.py \
            tests/test_m26_pa_7_reconciliation.py \
            tests/test_m26_aq_semantic_closure_runtime.py \
            tests/test_m26_aq_semantic_runtime_patch_v3.py \
            tests/test_m26_aq_universal_answerability_patch.py \
            tests/test_m26_aq_final_universal_recovery_patch.py \
            tests/test_m26_aq_production_route_final_recovery.py \
            tests/test_m26_aq_surface_guard.py \
            tests/test_m26_aq_production_deploy_lock.py \
            tests/test_m26_aq_production_entrypoint.py \
            tests/test_m26_aq_final_closure_harness.py \
            tests/test_m26_aq_simplified_product_contract.py \
            --junitxml=/tmp/m26-aq-regression.xml
          python scripts/m26_aq_final_closure.py validate-junit \
            --junit /tmp/m26-aq-regression.xml \
            --minimum 94

  deploy_and_live_closure:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 1325 &&
       github.head_ref == 'codex/answer-quality-aq-runtime') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/gpt/aq-final-closure-run')
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: m23-r3-diagnostic
    env:
      EXPECTED_DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      M26_QUERY_BACKEND_TUNNEL_HOSTNAME: ${{ vars.M26_QUERY_BACKEND_TUNNEL_HOSTNAME || secrets.M26_QUERY_BACKEND_TUNNEL_HOSTNAME || 'm26-query-backend.danielcanfly.com' }}
      M26_QUERY_BACKEND_TUNNEL_NAME: ${{ vars.M26_QUERY_BACKEND_TUNNEL_NAME || secrets.M26_QUERY_BACKEND_TUNNEL_NAME || 'm26-pa7-query-backend' }}
      CLOUDFLARE_ZONE_NAME: danielcanfly.com
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
      CLOUDFLARE_WORKERS_TOKEN_DNS: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN_DNS }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime validation dependencies
        run: python -m pip install -e .

      - name: Verify exact-head and deployment credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          for name in \
            ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH \
            ORACLE_VM_SSH_PRIVATE_KEY M26_QUERY_BACKEND_TUNNEL_HOSTNAME \
            M26_QUERY_BACKEND_TUNNEL_NAME CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_WORKERS_TOKEN \
            CLOUDFLARE_WORKERS_TOKEN_DNS CLOUDFLARE_TUNNEL_TOKEN; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_WORKERS_TOKEN"
          echo "::add-mask::$CLOUDFLARE_WORKERS_TOKEN_DNS"
          echo "::add-mask::$CLOUDFLARE_TUNNEL_TOKEN"
          bash scripts/configure_oracle_ssh.sh

      - name: Restore and verify named Cloudflare tunnel route
        run: |
          set -euo pipefail
          repair_dir=/tmp/m26-aq-named-tunnel-repair
          mkdir -p "$repair_dir"
          chmod 700 "$repair_dir"
          umask 077

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from typing import Callable, TypeVar

          from scripts.m26_pa7_named_backend_tunnel import (
              CloudflareApiError,
              _active_tunnel_by_name,
              _create_tunnel,
              _put_tunnel_config,
              _query,
              _request,
              _require_hostname_under_zone,
              _sha256,
              _tunnel_token,
              _upsert_dns_record,
              _zone_id,
          )

          T = TypeVar("T")

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          hostname = os.environ["M26_QUERY_BACKEND_TUNNEL_HOSTNAME"]
          tunnel_name = os.environ["M26_QUERY_BACKEND_TUNNEL_NAME"]
          zone_name = os.environ["CLOUDFLARE_ZONE_NAME"]
          dns_token_candidates = [
              ("workers_dns", os.environ["CLOUDFLARE_WORKERS_TOKEN_DNS"]),
              ("workers", os.environ["CLOUDFLARE_WORKERS_TOKEN"]),
              ("api", os.environ["CLOUDFLARE_API_TOKEN"]),
          ]
          tunnel_token_candidates = [
              ("tunnel", os.environ["CLOUDFLARE_TUNNEL_TOKEN"]),
              ("api", os.environ["CLOUDFLARE_API_TOKEN"]),
              ("workers", os.environ["CLOUDFLARE_WORKERS_TOKEN"]),
          ]
          service = "http://127.0.0.1:8080"

          _require_hostname_under_zone(hostname, zone_name)

          def first_success(
              purpose: str,
              operation: Callable[[str], T],
              candidates: list[tuple[str, str]],
          ) -> tuple[str, str, T, list[dict[str, str]]]:
              errors = []
              for label, token in candidates:
                  try:
                      return label, token, operation(token), errors
                  except Exception as exc:  # pragma: no cover - live infra only.
                      errors.append(
                          {"token_class": label, "error_class": type(exc).__name__}
                      )
              raise CloudflareApiError(
                  f"no configured Cloudflare token can perform {purpose}: {errors}"
              )

          zone_token_label, _, zone_id, zone_probe_errors = first_success(
              "active-zone lookup",
              lambda token: _zone_id(token=token, zone_name=zone_name),
              dns_token_candidates,
          )

          def read_records(token: str) -> list[dict[str, object]]:
              return _request(
                  method="GET",
                  token=token,
                  path=_query(
                      f"/zones/{zone_id}/dns_records",
                      {"name": hostname, "per_page": "100"},
                  ),
              ).get("result", [])

          dns_control_label, dns_control_token, records, dns_probe_errors = first_success(
              "DNS record read/write",
              read_records,
              dns_token_candidates,
          )
          conflicts = [item for item in records if item.get("type") != "CNAME"]
          cnames = [item for item in records if item.get("type") == "CNAME"]

          def find_or_create_tunnel(token: str) -> tuple[dict[str, object], int, bool]:
              tunnel, duplicate_count = _active_tunnel_by_name(
                  token=token,
                  account_id=account_id,
                  tunnel_name=tunnel_name,
              )
              tunnel_reused = tunnel is not None
              if tunnel is None:
                  tunnel = _create_tunnel(
                      token=token,
                      account_id=account_id,
                      tunnel_name=tunnel_name,
                  )
                  duplicate_count = 0
              return tunnel, duplicate_count, tunnel_reused

          (
              tunnel_control_label,
              tunnel_control_token,
              tunnel_result,
              tunnel_probe_errors,
          ) = first_success(
              "Cloudflare tunnel read/create",
              find_or_create_tunnel,
              tunnel_token_candidates,
          )
          tunnel, duplicate_count, tunnel_reused = tunnel_result
          tunnel_id = str(tunnel["id"])
          _put_tunnel_config(
              token=tunnel_control_token,
              account_id=account_id,
              tunnel_id=tunnel_id,
              hostname=hostname,
              service=service,
          )
          tunnel_token = _tunnel_token(
              token=tunnel_control_token,
              account_id=account_id,
              tunnel_id=tunnel_id,
          )

          prestate = {
              "schema_version": "m26-aq-cloudflare-dns-and-tunnel-token-probed-prestate/v1",
              "status": "pass",
              "exact_hostname_record_count": len(records),
              "cname_record_count": len(cnames),
              "conflicting_record_count": len(conflicts),
              "conflicting_record_types": sorted(
                  {str(item.get("type") or "") for item in conflicts}
              ),
              "named_tunnel_duplicate_count": duplicate_count,
              "named_tunnel_reused": tunnel_reused,
              "zone_token_class": zone_token_label,
              "dns_control_token_class": dns_control_label,
              "tunnel_control_token_class": tunnel_control_label,
              "zone_probe_error_classes": zone_probe_errors,
              "dns_probe_error_classes": dns_probe_errors,
              "tunnel_probe_error_classes": tunnel_probe_errors,
              "raw_hostname_recorded": False,
              "raw_record_content_recorded": False,
              "raw_record_id_recorded": False,
              "raw_tunnel_id_recorded": False,
              "raw_token_recorded": False,
          }
          Path("/tmp/m26-aq-cloudflare-prestate.json").write_text(
              json.dumps(prestate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          for item in conflicts:
              record_id = str(item.get("id") or "")
              if not record_id:
                  raise SystemExit("conflicting DNS record missing id")
              _request(
                  method="DELETE",
                  token=dns_control_token,
                  path=f"/zones/{zone_id}/dns_records/{record_id}",
              )

          dns_action, dns_record_id = _upsert_dns_record(
              token=dns_control_token,
              zone_id=zone_id,
              hostname=hostname,
              tunnel_id=tunnel_id,
          )

          origin = f"https://{hostname}"
          evidence = {
              "schema_version": "knowledge-engine-m26-aq-dns-and-tunnel-token-probed-named-tunnel/v1",
              "backend_hostname_sha256": _sha256(hostname),
              "backend_origin_sha256": _sha256(origin),
              "config_src": "cloudflare",
              "dns_record_action": dns_action,
              "dns_record_id_sha256": _sha256(dns_record_id),
              "duplicate_named_tunnel_count": duplicate_count,
              "hostname_present": True,
              "ingress_service": "http_localhost_8080",
              "origin_class": "named_cloudflare_tunnel_https_origin",
              "raw_backend_origin_recorded": False,
              "raw_hostname_recorded": False,
              "raw_token_recorded": False,
              "status": "pass",
              "target_suffix": "cfargotunnel.com",
              "trycloudflare_rejected": True,
              "zone_token_class": zone_token_label,
              "dns_control_token_class": dns_control_label,
              "tunnel_control_token_class": tunnel_control_label,
              "tunnel_id_sha256": _sha256(tunnel_id),
              "tunnel_name_sha256": _sha256(tunnel_name),
              "tunnel_reused": tunnel_reused,
              "tunnel_token_recorded": False,
          }
          Path("/tmp/m26-aq-named-tunnel-repair.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(os.environ.get("RUNNER_TEMP", "/tmp"), "m26-aq-split-control-runtime.env").write_text(
              "".join(
                  [
                      "M26_BACKEND_ORIGIN_CLASS=named_cloudflare_tunnel_https_origin\n",
                      f"M26_BACKEND_TUNNEL_ID={tunnel_id}\n",
                      f"M26_BACKEND_TUNNEL_TOKEN={tunnel_token}\n",
                      f"M26_QUERY_BACKEND_ORIGIN={origin}\n",
                  ]
              ),
              encoding="utf-8",
          )
          PY

          runtime_env="${RUNNER_TEMP:-/tmp}/m26-aq-split-control-runtime.env"
          tunnel_token=""
          tunnel_id=""
          while IFS='=' read -r name value; do
            case "$name" in
              M26_BACKEND_ORIGIN_CLASS|M26_QUERY_BACKEND_ORIGIN) ;;
              M26_BACKEND_TUNNEL_ID)
                tunnel_id="$value"
                ;;
              M26_BACKEND_TUNNEL_TOKEN)
                tunnel_token="$value"
                ;;
              *)
                echo "Unexpected tunnel runtime binding: $name" >&2
                exit 2
                ;;
            esac
            test -n "$value"
            echo "::add-mask::$value"
          done < "$runtime_env"
          rm -f "$runtime_env"

          test -n "$tunnel_id"
          test -n "$tunnel_token"
          printf '%s' "$tunnel_token" > "$repair_dir/token"

          tunnel_state_dir="$ORACLE_VM_DEPLOY_PATH/.m26-pa7-final-web-tunnel"
          ssh oracle-knowledge "mkdir -p '$tunnel_state_dir' && chmod 700 '$tunnel_state_dir'"
          scp "$repair_dir/token" "oracle-knowledge:$tunnel_state_dir/token.next"
          rm -f "$repair_dir/token"
          ssh oracle-knowledge "set -euo pipefail; \
            mv '$tunnel_state_dir/token.next' '$tunnel_state_dir/token'; \
            chmod 600 '$tunnel_state_dir/token'; \
            docker rm -f m26-pa7-backend-tunnel >/dev/null 2>&1 || true; \
            docker run -d --restart unless-stopped \
              --name m26-pa7-backend-tunnel \
              --network host \
              cloudflare/cloudflared:latest \
              tunnel --no-autoupdate run \
              --token \"\$(cat '$tunnel_state_dir/token')\" >/dev/null; \
            test \"\$(docker inspect --format '{{.State.Running}}' m26-pa7-backend-tunnel)\" = true"

          cat > "$repair_dir/dns_probe.py" <<'PY'
          import hashlib
          import json
          import os
          import socket
          import time

          hostname = os.environ["HOSTNAME_TO_RESOLVE"]
          vantage = os.environ["DNS_VANTAGE"]
          last_error = ""
          for attempt in range(1, 13):
              try:
                  infos = socket.getaddrinfo(hostname, 443, type=socket.SOCK_STREAM)
                  addresses = {item[4][0] for item in infos if item[4]}
                  if addresses:
                      print(json.dumps({
                          "schema_version": "m26-aq-routed-dns-resolution/v1",
                          "status": "resolved",
                          "vantage": vantage,
                          "attempt": attempt,
                          "address_count": len(addresses),
                          "hostname_sha256": hashlib.sha256(hostname.encode()).hexdigest(),
                          "raw_hostname_recorded": False,
                          "raw_address_recorded": False,
                      }, sort_keys=True))
                      break
              except OSError as exc:
                  last_error = type(exc).__name__
              time.sleep(5)
          else:
              print(json.dumps({
                  "schema_version": "m26-aq-routed-dns-resolution/v1",
                  "status": "unresolved",
                  "vantage": vantage,
                  "attempt": 12,
                  "address_count": 0,
                  "hostname_sha256": hashlib.sha256(hostname.encode()).hexdigest(),
                  "error_class": last_error,
                  "raw_hostname_recorded": False,
                  "raw_address_recorded": False,
              }, sort_keys=True))
              raise SystemExit(6)
          PY

          HOSTNAME_TO_RESOLVE="$M26_QUERY_BACKEND_TUNNEL_HOSTNAME" \
          DNS_VANTAGE=github_runner \
            python "$repair_dir/dns_probe.py" \
            > /tmp/m26-aq-dns-resolution-runner.json

          scp "$repair_dir/dns_probe.py" oracle-knowledge:/tmp/m26-aq-dns-probe.py
          ssh oracle-knowledge \
            "HOSTNAME_TO_RESOLVE='$M26_QUERY_BACKEND_TUNNEL_HOSTNAME' DNS_VANTAGE=oracle_vm python3 /tmp/m26-aq-dns-probe.py" \
            > /tmp/m26-aq-dns-resolution-oracle.json
          rm -f "$repair_dir/dns_probe.py"

          python - <<'PY'
          import json
          from pathlib import Path

          tunnel = json.loads(Path("/tmp/m26-aq-named-tunnel-repair.json").read_text())
          runner_dns = json.loads(
              Path("/tmp/m26-aq-dns-resolution-runner.json").read_text()
          )
          oracle_dns = json.loads(
              Path("/tmp/m26-aq-dns-resolution-oracle.json").read_text()
          )
          if tunnel.get("status") != "pass":
              raise SystemExit("named tunnel repair evidence did not pass")
          if tunnel.get("target_suffix") != "cfargotunnel.com":
              raise SystemExit("named tunnel target suffix mismatch")
          for dns in (runner_dns, oracle_dns):
              if dns.get("status") != "resolved":
                  raise SystemExit(
                      f"routed DNS did not resolve from {dns.get('vantage')}"
                  )
          print("AQ_NAMED_TUNNEL_REPAIR=pass")
          print(f"AQ_NAMED_TUNNEL_DNS_ACTION={tunnel.get('dns_record_action')}")
          print(f"AQ_NAMED_TUNNEL_REUSED={str(tunnel.get('tunnel_reused')).lower()}")
          print(f"AQ_TUNNEL_CONTROL_TOKEN_CLASS={tunnel.get('tunnel_control_token_class')}")
          print(f"AQ_DNS_CONTROL_TOKEN_CLASS={tunnel.get('dns_control_token_class')}")
          print(f"AQ_ROUTED_DNS_RUNNER_ATTEMPT={runner_dns.get('attempt')}")
          print(f"AQ_ROUTED_DNS_ORACLE_ATTEMPT={oracle_dns.get('attempt')}")
          print(f"AQ_ROUTED_DNS_RUNNER_ADDRESS_COUNT={runner_dns.get('address_count')}")
          print(f"AQ_ROUTED_DNS_ORACLE_ADDRESS_COUNT={oracle_dns.get('address_count')}")
          PY

      - name: Atomically deploy exact head and run all live closure gates
        run: |
          set -euo pipefail
          chmod 700 scripts/m26_aq_remote_production_closure.sh
          scp deploy/deploy.sh \
            oracle-knowledge:/tmp/m26-aq-exact-head-deploy.sh
          scp scripts/m26_aq_remote_production_closure.sh \
            oracle-knowledge:/tmp/m26-aq-remote-production-closure.sh

          set +e
          ssh oracle-knowledge \
            "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$EXPECTED_DEPLOY_SHA' EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' ROUTED_BACKEND_HOSTNAME='$M26_QUERY_BACKEND_TUNNEL_HOSTNAME' AQ_EXACT_HEAD_DEPLOY_SCRIPT='/tmp/m26-aq-exact-head-deploy.sh' bash /tmp/m26-aq-remote-production-closure.sh"
          remote_status=$?
          set -e

          copy_remote_artifact() {
            remote_path="$1"
            local_path="$2"
            ssh oracle-knowledge "test -s '$remote_path' && cat '$remote_path'" \
              > "$local_path" || true
          }

          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/identity-$EXPECTED_DEPLOY_SHA.json" \
            /tmp/m26-aq-production-identity.json
          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/frozen-$EXPECTED_DEPLOY_SHA.json" \
            /tmp/m26-aq-final-live-closure.json
          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/blackbox-$EXPECTED_DEPLOY_SHA.json" \
            /tmp/m26-aq-gpt-e-blackbox-live-closure.json
          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/targeted-$EXPECTED_DEPLOY_SHA.json" \
            /tmp/m26-aq-targeted-live-closure.json
          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/targeted-summary-$EXPECTED_DEPLOY_SHA.json" \
            /tmp/m26-aq-targeted-summary.json
          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/targeted-results-$EXPECTED_DEPLOY_SHA.csv" \
            /tmp/m26-aq-targeted-results.csv
          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/targeted-raw-answers-$EXPECTED_DEPLOY_SHA.md" \
            /tmp/m26-aq-targeted-raw-answers.md
          copy_remote_artifact \
            "$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/routed-health-$EXPECTED_DEPLOY_SHA.json" \
            /tmp/m26-aq-routed-health.json

          if [ "$remote_status" -ne 0 ]; then
            echo "AQ_PRODUCTION_CLOSURE_FAILURE=remote_closure_failed"
            exit "$remote_status"
          fi

          for path in \
            /tmp/m26-aq-production-identity.json \
            /tmp/m26-aq-final-live-closure.json \
            /tmp/m26-aq-gpt-e-blackbox-live-closure.json \
            /tmp/m26-aq-targeted-live-closure.json \
            /tmp/m26-aq-targeted-summary.json \
            /tmp/m26-aq-targeted-results.csv \
            /tmp/m26-aq-targeted-raw-answers.md \
            /tmp/m26-aq-routed-health.json; do
            test -s "$path"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path('/tmp/m26-aq-production-identity.json').read_text())
          expected = os.environ['EXPECTED_DEPLOY_SHA']
          for key in (
              'git_head_sha',
              'container_runtime_sha',
              'local_health_sha',
              'routed_health_sha',
          ):
              if evidence.get(key) != expected:
                  raise SystemExit(
                      f'identity mismatch {key}={evidence.get(key)} expected={expected}'
                  )
          if evidence.get('routed_health_status') != 'ok':
              raise SystemExit('routed health not ok')
          if evidence.get('raw_secret_recorded') is not False:
              raise SystemExit('secret hygiene evidence failed')
          if evidence.get('raw_routed_origin_recorded') is not False:
              raise SystemExit('routed origin hygiene evidence failed')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

          python scripts/m26_aq_final_closure.py validate \
            --input /tmp/m26-aq-final-live-closure.json \
            --gate pilot/m26/m26-pa-7-resolved-production-gate.json \
            --expected-sha "$EXPECTED_DEPLOY_SHA"

          python scripts/m26_aq_generalized_closure.py \
            --input /tmp/m26-aq-gpt-e-blackbox-live-closure.json \
            --expected-sha "$EXPECTED_DEPLOY_SHA" \
            --minimum 20

          python scripts/m26_aq_targeted_answerability_closure.py \
            --input /tmp/m26-aq-targeted-live-closure.json \
            --questions pilot/m26/m26-aq-universal-answerability-targeted-questions.json \
            --expected-sha "$EXPECTED_DEPLOY_SHA" \
            --summary /tmp/m26-aq-targeted-summary.json \
            --csv /tmp/m26-aq-targeted-results.csv \
            --raw-answers /tmp/m26-aq-targeted-raw-answers.md

      - name: Upload production closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-aq-final-production-closure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/m26-aq-cloudflare-prestate.json
            /tmp/m26-aq-named-tunnel-repair.json
            /tmp/m26-aq-dns-resolution-runner.json
            /tmp/m26-aq-dns-resolution-oracle.json
            /tmp/m26-aq-production-identity.json
            /tmp/m26-aq-final-live-closure.json
            /tmp/m26-aq-gpt-e-blackbox-live-closure.json
            /tmp/m26-aq-targeted-live-closure.json
            /tmp/m26-aq-targeted-summary.json
            /tmp/m26-aq-targeted-results.csv
            /tmp/m26-aq-targeted-raw-answers.md
            /tmp/m26-aq-routed-health.json
          if-no-files-found: warn
          retention-days: 14

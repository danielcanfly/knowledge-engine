name: M26 AQ Final Production Closure

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/deploy.sh"
      - ".github/workflows/m26-aq-final-production-closure.yml"
      - "src/knowledge_engine/m26_pa7_semantic_closure_runtime.py"
      - "src/knowledge_engine/m26_production_api.py"
      - "scripts/m26_aq_final_closure.py"
      - "pilot/m26/m26-aq-final-r3-questions.json"
      - "tests/test_m26_aq_semantic_closure_runtime.py"
      - "tests/test_m26_aq_production_deploy_lock.py"
      - "src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py"
      - "src/knowledge_engine/m26_production_answer_bundle.py"
      - "src/knowledge_engine/m26_ask_api.py"
      - "tests/conftest.py"
  push:
    branches:
      - "gpt/aq-final-closure-run"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m26-owner-production-oracle
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile semantic closure path
        run: |
          python -m py_compile \
            src/knowledge_engine/m26_pa7_semantic_closure_runtime.py \
            src/knowledge_engine/m26_production_api.py \
            scripts/m26_aq_final_closure.py \
            tests/test_m26_aq_semantic_closure_runtime.py
      - name: Run full AQ regression population
        run: |
          set -euo pipefail
          python -m pytest --showlocals \
            tests/test_m26_production_answer_bundle.py \
            tests/test_m26_pa_7_arbitrary_query_runtime.py \
            tests/test_m26_pa7_ask_api.py \
            tests/test_m26_pa7_final_web_readiness.py \
            tests/test_m26_pa_7_corrective_formal_product_readiness.py \
            tests/test_m26_pa_7_production_promotion_closure.py \
            tests/test_m26_pa_7_reconciliation.py \
            tests/test_m26_aq_semantic_closure_runtime.py \
            tests/test_m26_aq_production_deploy_lock.py \
            --junitxml=/tmp/m26-aq-regression.xml
          python scripts/m26_aq_final_closure.py validate-junit --junit /tmp/m26-aq-regression.xml --minimum 82

  deploy_and_live_closure:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 1325 &&
       github.head_ref == 'codex/answer-quality-aq-runtime') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/gpt/aq-final-closure-run')
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: m23-r3-diagnostic
    env:
      EXPECTED_DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false
      - name: Verify exact-head and deployment credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh
      - name: Atomically deploy exact head, prove runtime identity, and collect live closure
        run: |
          set -euo pipefail
          ssh oracle-knowledge \
            "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$EXPECTED_DEPLOY_SHA' EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          lock_file="/tmp/knowledge-engine-production-oracle.lock"
          exec 9>"$lock_file"
          flock -x 9

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            git clone https://github.com/danielcanfly/knowledge-engine.git "$DEPLOY_PATH"
          fi

          KNOWLEDGE_ENGINE_DEPLOY_LOCK_HELD=1 DEPLOY_PATH="$DEPLOY_PATH" RELEASE_SHA="$RELEASE_SHA" \
            bash "$DEPLOY_PATH/deploy/deploy.sh"

          cd "$DEPLOY_PATH"
          git_sha="$(git rev-parse HEAD)"
          test "$git_sha" = "$EXPECTED_DEPLOY_SHA"

          # Do not re-resolve the service through compose after deploy.sh removes its
          # release-scoped temporary env file. Identify the running Compose service
          # directly from Docker labels, then prove the immutable runtime env.
          container_id="$(docker ps --filter 'label=com.docker.compose.service=knowledge-engine' --filter status=running -q | head -n 1)"
          test -n "$container_id"
          image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
          runtime_sha="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id" | awk -F= '$1 == "M26_QUERY_BUILD_SHA" {print substr($0, index($0, "=") + 1)}' | tail -n 1)"
          test "$runtime_sha" = "$EXPECTED_DEPLOY_SHA"
          process_cmd="$(docker inspect --format '{{json .Config.Cmd}}' "$container_id")"

          remote_evidence_dir="$DEPLOY_PATH/.m26-aq-final-production-closure"
          mkdir -p "$remote_evidence_dir"
          chmod 700 "$remote_evidence_dir"
          identity_path="$remote_evidence_dir/identity-$EXPECTED_DEPLOY_SHA.json"
          closure_path="$remote_evidence_dir/live-closure-$EXPECTED_DEPLOY_SHA.json"
          rm -f "$identity_path" "$closure_path"

          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          : "${KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH:?missing owner hash}"

          health_code="$(curl --silent --show-error \
            -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" \
            -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" \
            -o /tmp/m26-aq-local-health.json -w '%{http_code}' \
            http://127.0.0.1:8080/api/m26/health)"
          test "$health_code" = "200"

          EXPECTED_DEPLOY_SHA="$EXPECTED_DEPLOY_SHA" GIT_SHA="$git_sha" CONTAINER_ID="$container_id" \
          IMAGE_ID="$image_id" RUNTIME_SHA="$runtime_sha" PROCESS_CMD="$process_cmd" \
          IDENTITY_PATH="$identity_path" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path('/tmp/m26-aq-local-health.json').read_text(encoding='utf-8'))
          canonical = health.get('canonical_runtime', {}) if isinstance(health, dict) else {}
          expected = os.environ['EXPECTED_DEPLOY_SHA']
          health_sha = canonical.get('build_sha')
          entrypoint = canonical.get('entrypoint')
          if health_sha != expected:
              raise SystemExit(f'local health SHA mismatch expected={expected} actual={health_sha}')
          if entrypoint != 'knowledge_engine.m26_pa7_semantic_closure_runtime.run_owner_arbitrary_query':
              raise SystemExit(f'unexpected production entrypoint: {entrypoint}')
          evidence = {
              'schema_version': 'm26-aq-production-identity/v1',
              'expected_deploy_sha': expected,
              'git_head_sha': os.environ['GIT_SHA'],
              'container_id': os.environ['CONTAINER_ID'],
              'image_id': os.environ['IMAGE_ID'],
              'container_runtime_sha': os.environ['RUNTIME_SHA'],
              'local_health_sha': health_sha,
              'entrypoint': entrypoint,
              'process_cmd': os.environ['PROCESS_CMD'],
              'raw_secret_recorded': False,
          }
          identity_path = Path(os.environ['IDENTITY_PATH'])
          identity_path.parent.mkdir(parents=True, exist_ok=True)
          identity_path.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY

          PYTHONPATH=src python3 scripts/m26_aq_final_closure.py collect \
            --questions pilot/m26/m26-aq-final-r3-questions.json \
            --output "$closure_path" \
            --expected-sha "$EXPECTED_DEPLOY_SHA"

          test -s "$identity_path"
          test -s "$closure_path"
          REMOTE

          ssh oracle-knowledge \
            "cat '$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/identity-$EXPECTED_DEPLOY_SHA.json'" \
            > /tmp/m26-aq-production-identity.json
          ssh oracle-knowledge \
            "cat '$ORACLE_VM_DEPLOY_PATH/.m26-aq-final-production-closure/live-closure-$EXPECTED_DEPLOY_SHA.json'" \
            > /tmp/m26-aq-final-live-closure.json

          test -s /tmp/m26-aq-production-identity.json
          test -s /tmp/m26-aq-final-live-closure.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = json.loads(Path('/tmp/m26-aq-production-identity.json').read_text())
          expected = os.environ['EXPECTED_DEPLOY_SHA']
          for key in ('git_head_sha', 'container_runtime_sha', 'local_health_sha'):
              if evidence.get(key) != expected:
                  raise SystemExit(f'identity mismatch {key}={evidence.get(key)} expected={expected}')
          if evidence.get('raw_secret_recorded') is not False:
              raise SystemExit('secret hygiene evidence failed')
          print(json.dumps(evidence, indent=2))
          PY

          PYTHONPATH=src python scripts/m26_aq_final_closure.py validate \
            --input /tmp/m26-aq-final-live-closure.json \
            --gate pilot/m26/m26-pa-7-resolved-production-gate.json \
            --expected-sha "$EXPECTED_DEPLOY_SHA"
      - name: Upload production closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-aq-final-production-closure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/m26-aq-production-identity.json
            /tmp/m26-aq-final-live-closure.json
          if-no-files-found: warn
          retention-days: 14

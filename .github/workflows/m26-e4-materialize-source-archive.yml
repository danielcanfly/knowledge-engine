name: M26 E4 Materialize Source Archive

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - m26_e4_source_archive_materialize

permissions:
  contents: read

concurrency:
  group: m26-bp2-candidate-materialization-a738f20
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    environment: production
    env:
      APP_ENV: test
      AUTH_MODE: disabled
      EXPECTED_SOURCE_HEAD_SHA: a738f20b16f10925c8adfe4d625be8db30fb269c
      EXPECTED_BLOG_SOURCE_SHA: f5e20062c1400d7320fe2dbecf6409a0a8c910a7
      EXPECTED_BLOG_REPOSITORY_HEAD_SHA: 3475cb26eedb95ade52ff6341ad7a64218572139
      EXPECTED_BLOG_CONTENT_TREE_SHA: 86c43fd02642087d773afd2614c6d4fb1c7c7bf2
      EXPECTED_BLOG_SERIES_BLOB_SHA: f0d317928f2733f9ed72ca7a2411cc49062579b1
      EXPECTED_SOURCE_ARCHIVE_RELEASE_ID: m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440
      EXPECTED_RELEASE_ID: m26blog-ec79a3cad1d8-59012fe3818c-bp2-${{ github.sha }}
      CANDIDATE_ENGINE_COMMIT_SHA: ${{ github.sha }}
      EXPECTED_SEMANTIC_INPUTS_SHA256: 0982aaa55893bb2f95a8c0e0571cf5bef8beffb56346c9edf05c5a2e83597012
      EXPECTED_LEXICAL_DOCUMENTS_SHA256: 1ee4e01ff7b08ef6f54b445112db25565eb8f72b932ec89473947fb7ba4dc3bf
      EXPECTED_PROVENANCE_SHA256: 60642a49269864271f4a90a133c5f9140edc3abf5195c88b2ea23f20d4bf40f0
      EXPECTED_NODES_SHA256: 58540242ab29e3c884ef1c421f4d25f37c55df4657c045c19762c7b2435ce9a8
      EXPECTED_EDGES_SHA256: 5e7951e70d6fd144ca0f7c7ff32fdb94ce95fb912ab036b5bcb53d29746679cb
      EXPECTED_SOURCE_INDEX_SHA256: 3b63e70b99b25cc0e83a2ceb56bf8b515402f92774af0a839839abd6cb0b864f
      OBJECT_STORE_BACKEND: r2
      R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_REGION: auto
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_AI_TOKEN || secrets.CF_API_TOKEN }}
      QDRANT_URL: ${{ vars.QDRANT_URL || secrets.QDRANT_URL || vars.QDRANT_ENDPOINT || secrets.QDRANT_ENDPOINT }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || secrets.QDRANT_WRITE_API_KEY || secrets.QDRANT_API_KEY_WRITE }}
      KNOWLEDGE_SOURCE_READ_TOKEN: ${{ secrets.KNOWLEDGE_SOURCE_READ_TOKEN || secrets.KNOWLEDGE_SOURCE_TOKEN || secrets.SOURCE_REPO_READ_TOKEN }}
      BLOG_SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN || secrets.KNOWLEDGE_SOURCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate materializer credentials are wired without revealing values
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os

          required = [
              'R2_ENDPOINT_URL',
              'R2_BUCKET',
              'R2_ACCESS_KEY_ID',
              'R2_SECRET_ACCESS_KEY',
              'CLOUDFLARE_ACCOUNT_ID',
              'CLOUDFLARE_API_TOKEN',
              'QDRANT_URL',
              'QDRANT_API_KEY',
              'BLOG_SOURCE_READ_TOKEN',
          ]
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8').read())
          payload = event.get('client_payload') or {}
          archive_url = payload.get('archive_url')
          if not archive_url:
              required.append('KNOWLEDGE_SOURCE_READ_TOKEN')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('missing required materializer environment values: ' + ','.join(missing))
          print('M26_E4_MATERIALIZER_ENV_WIRING_PASS')
          PY
      - name: Fresh census authoritative published blog source
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import urllib.request

          token = os.environ['BLOG_SOURCE_READ_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'm26-bp2-source-census',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def request(path: str) -> dict:
              req = urllib.request.Request(
                  'https://api.github.com/repos/danielcanfly/daniel-blog/' + path,
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  value = json.load(response)
              if not isinstance(value, dict):
                  raise SystemExit('GitHub response was not an object')
              return value

          commit = request('commits/main')['sha']
          if commit != os.environ['EXPECTED_BLOG_REPOSITORY_HEAD_SHA']:
              raise SystemExit('authoritative blog main drifted after BP-2 plan')
          tree = request(f'git/trees/{commit}?recursive=1')
          if tree.get('truncated') is True:
              raise SystemExit('authoritative blog tree was truncated')
          rows = tree.get('tree') or []
          content = next(
              row for row in rows
              if row.get('path') == 'src/content/blog' and row.get('type') == 'tree'
          )
          series = next(
              row for row in rows
              if row.get('path') == 'src/utils/seriesMeta.ts' and row.get('type') == 'blob'
          )
          english = sorted(
              row['path'] for row in rows
              if row.get('type') == 'blob'
              and row.get('path', '').startswith('src/content/blog/')
              and row.get('path', '').endswith('/en.md')
          )
          if content['sha'] != os.environ['EXPECTED_BLOG_CONTENT_TREE_SHA']:
              raise SystemExit('published blog content tree drifted')
          if series['sha'] != os.environ['EXPECTED_BLOG_SERIES_BLOB_SHA']:
              raise SystemExit('blog series catalog drifted')
          if len(english) != 180 or len(english) != len(set(english)):
              raise SystemExit(f'fresh English source census mismatch: {len(english)}')
          report = {
              'schema_version': 'm26-bp2-fresh-source-census/v1',
              'repository': 'danielcanfly/daniel-blog',
              'repository_head_sha': commit,
              'published_content_tree_sha': content['sha'],
              'series_catalog_blob_sha': series['sha'],
              'content_authority_commit_sha': os.environ['EXPECTED_BLOG_SOURCE_SHA'],
              'english_published_source_count': len(english),
              'duplicate_path_count': len(english) - len(set(english)),
              'candidate_source_archive_head_sha': os.environ['EXPECTED_SOURCE_HEAD_SHA'],
          }
          with open('/tmp/m26-e4-source-census.json', 'w', encoding='utf-8') as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print('M26_BP2_FRESH_SOURCE_CENSUS_PASS')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Validate materialization payload and mask archive URL
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8').read())
          payload = event.get('client_payload') or {}
          archive_url = payload.get('archive_url') or (
              'https://api.github.com/repos/danielcanfly/knowledge-source/zipball/'
              + os.environ['EXPECTED_SOURCE_HEAD_SHA']
          )
          print(f'::add-mask::{archive_url}')
          source_head_sha = payload.get('source_head_sha') or os.environ['EXPECTED_SOURCE_HEAD_SHA']
          release_id = payload.get('release_id') or os.environ['EXPECTED_RELEASE_ID']
          mode = payload.get('mode') or 'materialize'
          if source_head_sha != os.environ['EXPECTED_SOURCE_HEAD_SHA']:
              raise SystemExit('source_head_sha mismatch')
          if release_id != os.environ['EXPECTED_RELEASE_ID']:
              raise SystemExit('release_id mismatch')
          if mode != 'materialize':
              raise SystemExit('materializer requires mode=materialize')
          print('M26_E4_MATERIALIZER_PAYLOAD_ACCEPTED')
          PY
      - name: Download exact source archive and fail closed on identity
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request
          import zipfile

          event = json.loads(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8').read())
          payload = event.get('client_payload') or {}
          archive_url = payload.get('archive_url') or (
              'https://api.github.com/repos/danielcanfly/knowledge-source/zipball/'
              + os.environ['EXPECTED_SOURCE_HEAD_SHA']
          )
          print(f'::add-mask::{archive_url}')
          token = os.environ.get('KNOWLEDGE_SOURCE_READ_TOKEN')
          headers = {
              'User-Agent': 'm26-e4-materializer',
              'Accept': 'application/vnd.github+json',
          }
          if token:
              print(f'::add-mask::{token}')
              headers['Authorization'] = f'Bearer {token}'
          elif 'api.github.com/repos/danielcanfly/knowledge-source/' in archive_url:
              raise SystemExit('missing KNOWLEDGE_SOURCE_READ_TOKEN for private source archive API')
          req = urllib.request.Request(archive_url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=180) as response:
                  data = response.read()
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'source archive download failed: HTTP {exc.code}') from exc
          zpath = pathlib.Path('/tmp/m26-e4-source.zip')
          zpath.write_bytes(data)
          archive_sha = hashlib.sha256(data).hexdigest()
          extract = pathlib.Path('/tmp/m26-e4-source')
          if extract.exists():
              import shutil; shutil.rmtree(extract)
          with zipfile.ZipFile(zpath) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'zip integrity failure at {bad}')
              zf.extractall(extract)
          roots = [p for p in extract.iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'unexpected root count {len(roots)}')
          pack = roots[0] / 'documents' / 'daniel-blog-en-180-f5e20062'
          cand = pack / 'candidate-release'
          files = {
              'semantic_inputs': cand / 'semantic-inputs.jsonl',
              'lexical_documents': cand / 'lexical-documents.jsonl',
              'provenance': cand / 'provenance.jsonl',
              'nodes': pack / 'candidate-nodes.jsonl',
              'edges': pack / 'candidate-edges.jsonl',
              'source_index': cand / 'source-index.json',
          }
          for key, path in files.items():
              if not path.is_file():
                  raise SystemExit(f'missing {key}')
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = os.environ['EXPECTED_' + key.upper() + '_SHA256']
              if observed != expected:
                  raise SystemExit(f'{key} sha mismatch')
          release = json.loads((cand / 'release-manifest.json').read_text(encoding='utf-8'))
          if release.get('release_id') != os.environ['EXPECTED_SOURCE_ARCHIVE_RELEASE_ID']:
              raise SystemExit('source archive release_id mismatch')
          if release.get('candidate_only') is not True or release.get('production_pointer_authorized') is not False:
              raise SystemExit('source release authority mismatch')
          print('M26_E4_MATERIALIZER_SOURCE_IDENTITY_PASS')
          print(json.dumps({'archive_sha256': archive_sha, 'archive_bytes': len(data)}, sort_keys=True))
          PY
      - name: Materialize isolated R2 bundle and Qdrant collection
        run: |
          set -euo pipefail
          python scripts/m26_e4_materialize_runtime_successor.py \
            --source-extract /tmp/m26-e4-source \
            --output-dir /tmp/m26-e4-materialization \
            --repo-root .
      - name: Upload materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-e4-isolated-materialization
          path: |
            /tmp/m26-e4-materialization/m26-e4-isolated-materialization-receipt.json
            /tmp/m26-e4-source-census.json
          if-no-files-found: warn
          retention-days: 14

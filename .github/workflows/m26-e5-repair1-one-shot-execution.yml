name: M26 E5 Repair1 Zero-Consumption Gate and One-Shot C1-C6

on:
  push:
    branches:
      - m26-e5-execution-plane-repair1-20260827
    paths:
      - .github/workflows/m26-e5-repair1-one-shot-execution.yml

permissions:
  contents: read

env:
  ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
  ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
  ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}

jobs:
  pre-c1-hard-gate:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Static parser and frozen fixture audit
        run: |
          set -euo pipefail
          rm -rf /tmp/m26-e5-repair1-static
          node scripts/m26-e5-one-shot-oracle-runner.mjs \
            --fixture=fixtures/03_EXACT_SIX_CASE_FREEZE.json \
            --output-dir=/tmp/m26-e5-repair1-static
          test -f /tmp/m26-e5-repair1-static/static_audit.json
          grep -R -q 'M26_E5_REPAIR1_STATIC_AUDIT_PASS' /tmp/m26-e5-repair1-static

      - name: Configure accepted Oracle SSH lane
        run: |
          set -euo pipefail
          set +x
          for n in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!n:-}" || { echo "missing required existing Oracle authority: $n"; exit 2; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/m26_e5_repair1_oracle
          chmod 600 ~/.ssh/m26_e5_repair1_oracle
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fresh zero-consumption runtime preflight on exact Oracle candidate
        run: |
          set -euo pipefail
          set +x
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/m26-e5-one-shot-oracle-runner.mjs fixtures/03_EXACT_SIX_CASE_FREEZE.json \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/"
          ssh -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "set -euo pipefail; set +x; rm -rf /tmp/m26-e5-repair1-hard-gate; node /tmp/m26-e5-one-shot-oracle-runner.mjs --preflight-only --fixture=/tmp/03_EXACT_SIX_CASE_FREEZE.json --output-dir=/tmp/m26-e5-repair1-hard-gate; grep -q 'M26_E5_REPAIR1_PRE_C1_HARD_GATE_PASS' /tmp/m26-e5-repair1-hard-gate/pre_c1_runtime_preflight.json; grep -q 'C1_STATUS=UNCONSUMED' /tmp/m26-e5-repair1-hard-gate/07_PRE_C1_HARD_GATE.md; grep -q 'E5_CONSUMED=0' /tmp/m26-e5-repair1-hard-gate/07_PRE_C1_HARD_GATE.md; tar -C /tmp -czf /tmp/m26-e5-repair1-hard-gate.tgz m26-e5-repair1-hard-gate"
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/m26-e5-repair1-hard-gate.tgz" /tmp/
          mkdir -p /tmp/m26-e5-repair1-hard-gate-artifact
          tar -C /tmp/m26-e5-repair1-hard-gate-artifact -xzf /tmp/m26-e5-repair1-hard-gate.tgz

      - name: Assert 07_PRE_C1_HARD_GATE all PASS and zero consumption
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/m26-e5-repair1-hard-gate-artifact/m26-e5-repair1-hard-gate')
          gate=(root/'07_PRE_C1_HARD_GATE.md').read_text()
          receipt=json.loads((root/'pre_c1_runtime_preflight.json').read_text())
          assert receipt['status']=='M26_E5_REPAIR1_PRE_C1_HARD_GATE_PASS'
          assert receipt['e5_consumed']==0
          assert receipt['rerolls']==0
          assert receipt['c1_status']=='UNCONSUMED'
          assert receipt['semantic_posts']==0
          assert receipt['production_mutations']==0
          required=['E5_CONSUMED=0','REROLLS=0','C1_STATUS=UNCONSUMED','ATTEMPT_CONSUMPTION_AMBIGUITY=false','PRODUCTION_MUTATION=0']
          for token in required: assert token in gate, token
          fail_lines=[line for line in gate.splitlines() if 'FAIL' in line.upper() and not line.lstrip().startswith('#')]
          assert not fail_lines, fail_lines
          print('M26_E5_REPAIR1_07_PRE_C1_HARD_GATE_ALL_PASS')
          PY

      - name: Upload zero-consumption hard-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: m26-e5-repair1-pre-c1-hard-gate
          path: |
            /tmp/m26-e5-repair1-static
            /tmp/m26-e5-repair1-hard-gate-artifact/m26-e5-repair1-hard-gate
          if-no-files-found: error
          retention-days: 14

  one-shot-c1-c6:
    needs: pre-c1-hard-gate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure accepted Oracle SSH lane
        run: |
          set -euo pipefail
          set +x
          for n in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!n:-}" || { echo "missing required existing Oracle authority: $n"; exit 2; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/m26_e5_repair1_oracle
          chmod 600 ~/.ssh/m26_e5_repair1_oracle
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Execute C1 through C6 exactly once after fresh in-process hard gate
        run: |
          set -euo pipefail
          set +x
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/m26-e5-one-shot-oracle-runner.mjs fixtures/03_EXACT_SIX_CASE_FREEZE.json \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/"
          set +e
          ssh -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "set -euo pipefail; set +x; rm -rf /tmp/m26-e5-repair1-execute; node /tmp/m26-e5-one-shot-oracle-runner.mjs --execute --fixture=/tmp/03_EXACT_SIX_CASE_FREEZE.json --output-dir=/tmp/m26-e5-repair1-execute" \
            > /tmp/m26-e5-repair1-execute.log 2>&1
          rc=$?
          set -e
          # Never permit raw secret-like SSE bytes into the artifact. The runner receipts preserve SHA-256.
          ssh -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "set -euo pipefail; set +x; if [ -d /tmp/m26-e5-repair1-execute ]; then if grep -RIlE '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ya29\\.|gh[pousr]_|sk-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\\.)' /tmp/m26-e5-repair1-execute --include='*.sse' >/tmp/m26-e5-secretlike-files 2>/dev/null; then xargs -r rm -f </tmp/m26-e5-secretlike-files; fi; tar -C /tmp -czf /tmp/m26-e5-repair1-execute.tgz m26-e5-repair1-execute; else mkdir -p /tmp/m26-e5-repair1-execute; printf '%s\\n' 'EXECUTION_OUTPUT_DIR_MISSING' >/tmp/m26-e5-repair1-execute/plumbing_failure.txt; tar -C /tmp -czf /tmp/m26-e5-repair1-execute.tgz m26-e5-repair1-execute; fi"
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/m26-e5-repair1-execute.tgz" /tmp/
          mkdir -p /tmp/m26-e5-repair1-execute-artifact
          tar -C /tmp/m26-e5-repair1-execute-artifact -xzf /tmp/m26-e5-repair1-execute.tgz
          printf '%s\n' "$rc" > /tmp/m26-e5-repair1-execute-artifact/runner_exit_code.txt
          # Surface only terminal/control lines, never response bodies.
          grep -E 'M26_E5_|M26_ESCALATE_' /tmp/m26-e5-repair1-execute.log || true

      - name: Verify terminal and no rerolls
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/m26-e5-repair1-execute-artifact/m26-e5-repair1-execute')
          if not root.exists(): raise SystemExit('EXECUTION_ARTIFACT_ROOT_MISSING')
          ledger=root/'m26-e5-attempt-ledger.jsonl'
          if ledger.exists():
              rows=[json.loads(x) for x in ledger.read_text().splitlines() if x.strip()]
              assert all(int(r.get('rerolls',0))==0 for r in rows), 'REROLL_NONZERO'
          terminal=(root/'terminal.txt').read_text().strip() if (root/'terminal.txt').exists() else 'NO_TERMINAL'
          print('M26_E5_REPAIR1_TERMINAL='+terminal)
          PY

      - name: Upload one-shot C1-C6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-e5-repair1-one-shot-c1-c6
          path: |
            /tmp/m26-e5-repair1-execute-artifact
          if-no-files-found: error
          retention-days: 14

name: L3B Backend 502 Minimal Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - codex/l3b-backend-502-forensics-20260909

permissions:
  contents: read

concurrency:
  group: l3b-backend-502-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      EXPECTED_SHA: 51d464565601d3f1c0301d87c3f0efcec9e68f6d
    steps:
      - name: Check out bounded recovery script
        uses: actions/checkout@v4

      - name: Require existing recovery seam
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          for name in SSH_PRIVATE_KEY ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH; do
            test -n "${!name:-}" || { echo "RECOVERY_AUTH_SEAM=MISSING:$name"; exit 42; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts
          echo 'RECOVERY_AUTH_SEAM=PASS'

      - name: Apply bounded ingress and auth-binding recovery
        run: |
          set -euo pipefail
          set +x
          local_script=.github/scripts/l3b-backend-502-recovery.sh
          remote_script="/tmp/l3b-backend-502-recovery-${GITHUB_RUN_ID}.sh"
          local_digest="$(sha256sum "$local_script" | awk '{print $1}')"
          scp "$local_script" "$ORACLE_VM_USER@$ORACLE_VM_HOST:$remote_script"
          remote_digest="$(ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "sha256sum '$remote_script'" | awk '{print $1}')"
          test "$local_digest" = "$remote_digest"
          echo 'RECOVERY_SCRIPT_TRANSFER=VERIFIED'
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "chmod 700 '$remote_script' && '$remote_script' '$ORACLE_VM_DEPLOY_PATH' '$EXPECTED_SHA'; rc=\$?; rm -f '$remote_script'; exit \$rc"

      - name: Reconfirm public health after recovery
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --max-time 15 https://api.danielcanfly.com/v1/answers/health)"
          python3 - "$payload" "$EXPECTED_SHA" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          actual = (payload.get("backend") or payload.get("runtime") or {}).get("build_sha", "")
          print("RECOVERY_EDGE_HEALTH_OK=" + ("YES" if payload.get("ok") is True else "NO"))
          print("RECOVERY_EDGE_HEALTH_BUILD_SHA=" + actual)
          if payload.get("ok") is not True or actual != sys.argv[2]:
              raise SystemExit(1)
          PY
          echo 'RECOVERY_QUALIFICATION=PASS'

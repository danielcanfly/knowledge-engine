name: M26 Oracle Host Health Diagnosis 20260827

on:
  push:
    branches:
      - m26-e5-oracle-health-actions-audit-20260827
    paths:
      - .github/workflows/m26-oracle-host-health-diagnosis-20260827.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m26-oracle-host-health-diagnosis-20260827-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle-host-health:
    if: github.ref == 'refs/heads/m26-e5-oracle-health-actions-audit-20260827'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      BASE_HEAD: 5b5d680597bc63fbf92995bb20c8f7d1b7019e03
      ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
      PROBE_NAME: m26-e5-health-create-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Metadata and guardrails
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ORACLE_VM_HOST:-}" ] || { echo "secret_missing=ORACLE_VM_HOST"; exit 2; }
          [ -n "${ORACLE_VM_USER:-}" ] || { echo "secret_missing=ORACLE_VM_USER"; exit 2; }
          [ -n "${ORACLE_VM_SSH_PRIVATE_KEY:-}" ] || { echo "secret_missing=ORACLE_VM_SSH_PRIVATE_KEY"; exit 2; }
          echo "terminal_scope=diagnosis-only"
          echo "base_head=${BASE_HEAD}"
          echo "branch=${GITHUB_REF_NAME}"
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "transport_policy=single bounded SSH session; every remote host/docker command is independently wrapped with 5-15s timeout"
          echo "forbidden_actions_not_performed=restart-docker,reboot,stop-restart-production,deploy,pointer-route-mutation,resume-repair2,e5-six-queries,provider-answer-request"

      - name: SSH setup
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          keyfile="${RUNNER_TEMP}/oracle_m26_key"
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          {
            echo "ORACLE_KEY=${keyfile}"
            echo "SSH_BASE_OPTS=-i ${keyfile} -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          } >> "$GITHUB_ENV"

      - name: Oracle host-health evidence matrix and guarded create probe
        shell: bash
        run: |
          set -u
          remote_script=$(cat <<'REMOTE'
          set -u
          READONLY_FAILS=""
          echo "evidence_started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "remote_command_timeout_policy=each host/docker command below has independent timeout 5-15s"
          run_cmd() {
            label="$1"; hard="$2"; required="$3"; shift 3
            cmd="$*"
            echo "::group::${label}"
            echo "label=${label}"
            echo "remote_timeout_seconds=${hard}"
            echo "command_started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            set +e
            timeout "${hard}s" bash -lc "$cmd"
            rc=$?
            set -u
            echo "exit_status=${rc}"
            echo "command_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ "$required" = "required" ] && [ "$rc" -ne 0 ]; then
              READONLY_FAILS="${READONLY_FAILS} ${label}:${rc}"
            fi
            echo "::endgroup::"
            return 0
          }

          run_cmd "host_identity" 5 required 'hostname; uname -a; date -u +%Y-%m-%dT%H:%M:%SZ'
          run_cmd "uptime_load" 5 required 'uptime; cat /proc/loadavg'
          run_cmd "memory_swap" 5 required 'free -m; grep -E "MemTotal|MemAvailable|SwapTotal|SwapFree|Dirty|Writeback" /proc/meminfo'
          run_cmd "disk_blocks" 5 required 'df -hT / /var /var/lib/docker 2>/dev/null || df -hT'
          run_cmd "disk_inodes" 5 required 'df -ih / /var /var/lib/docker 2>/dev/null || df -ih'
          run_cmd "pressure_cpu" 5 required 'cat /proc/pressure/cpu 2>/dev/null || echo pressure_cpu_unavailable'
          run_cmd "pressure_memory" 5 required 'cat /proc/pressure/memory 2>/dev/null || echo pressure_memory_unavailable'
          run_cmd "pressure_io" 5 required 'cat /proc/pressure/io 2>/dev/null || echo pressure_io_unavailable'
          run_cmd "docker_service_status" 10 required 'systemctl is-active docker; systemctl is-failed docker; systemctl --no-pager --full status docker | sed -n "1,80p"'
          run_cmd "containerd_service_status" 10 required 'systemctl is-active containerd; systemctl is-failed containerd; systemctl --no-pager --full status containerd | sed -n "1,80p"'
          run_cmd "docker_journal_recent" 10 optional 'sudo -n journalctl -u docker --no-pager -n 120 --since "-2 hours" 2>&1 || journalctl -u docker --no-pager -n 120 --since "-2 hours" 2>&1 || true'
          run_cmd "containerd_journal_recent" 10 optional 'sudo -n journalctl -u containerd --no-pager -n 120 --since "-2 hours" 2>&1 || journalctl -u containerd --no-pager -n 120 --since "-2 hours" 2>&1 || true'
          run_cmd "docker_version_latency" 10 required '/usr/bin/time -f "elapsed_seconds=%e" docker version'
          run_cmd "docker_info_latency" 15 required '/usr/bin/time -f "elapsed_seconds=%e" docker info'
          run_cmd "docker_ps_latency" 10 required '/usr/bin/time -f "elapsed_seconds=%e" docker ps --no-trunc --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.RunningFor}}"'
          run_cmd "production_container_identity_candidates" 10 required 'docker ps --no-trunc --format "{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Labels}}" | grep -Ei "prod|production|knowledge|engine|m26|answers|test_page|selfcheck" || docker ps --no-trunc --format "{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Labels}}"'
          run_cmd "production_inspect_latency_candidates" 15 required 'docker ps -q --no-trunc | head -20 | while read -r id; do [ -n "$id" ] || continue; echo "INSPECT_BEGIN $id"; /usr/bin/time -f "inspect_elapsed_seconds=%e" timeout 10s docker inspect --format "id={{.Id}} name={{.Name}} image={{.Config.Image}} state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restart={{.RestartCount}} started={{.State.StartedAt}}" "$id"; rc=$?; echo "INSPECT_EXIT $id $rc"; done'
          run_cmd "stuck_m26_e5_inventory" 10 required 'docker ps -a --no-trunc --filter "name=m26-e5-" --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.CreatedAt}}"'

          echo "::group::guarded_create_probe"
          echo "probe_name=${M26_PROBE_NAME:?missing_probe_name}"
          echo "policy=max_one_create; skip unless all required read-only commands passed and docker/containerd/docker-version/info/ps prerequisites pass; no pull; no start; no ports; no volumes; no env flags"
          if [ -n "$READONLY_FAILS" ]; then
            echo "CREATE_PROBE_SKIPPED readonly_failures=${READONLY_FAILS}"
            echo "::endgroup::"
            echo "evidence_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit 0
          fi

          prereq_fail=0
          prereq() {
            label="$1"; hard="$2"; shift 2
            cmd="$*"
            echo "PREREQ_BEGIN ${label} timeout=${hard}"
            set +e
            timeout "${hard}s" bash -lc "$cmd"
            rc=$?
            set -u
            echo "PREREQ_EXIT ${label} ${rc}"
            [ "$rc" -eq 0 ] || prereq_fail=1
          }
          prereq systemctl-active-docker 10 'test "$(systemctl is-active docker)" = active'
          prereq systemctl-active-containerd 10 'test "$(systemctl is-active containerd)" = active'
          prereq docker-version 10 'docker version >/dev/null'
          prereq docker-info 15 'docker info >/dev/null'
          prereq docker-ps 10 'docker ps --format "{{.ID}}" >/dev/null'
          if [ "$prereq_fail" -ne 0 ]; then
            echo "CREATE_PROBE_SKIPPED prereq_fail=${prereq_fail}"
            echo "::endgroup::"
            echo "evidence_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit 0
          fi

          probe_image=""
          for img in hello-world:latest busybox:latest alpine:latest; do
            if timeout 5s docker image inspect "$img" >/tmp/m26_probe_image.json 2>/dev/null; then
              vols="$(timeout 5s docker image inspect --format "{{json .Config.Volumes}}" "$img" 2>/dev/null || true)"
              envs="$(timeout 5s docker image inspect --format "{{json .Config.Env}}" "$img" 2>/dev/null || true)"
              echo "PROBE_IMAGE_CANDIDATE ${img} volumes=${vols} env_checked"
              if { [ "$vols" = "null" ] || [ "$vols" = "<no value>" ] || [ -z "$vols" ]; } && ! printf "%s" "$envs" | grep -Eiq "SECRET|TOKEN|ORACLE|PROD|PRODUCTION|DATABASE|PASSWORD|KEY"; then
                probe_image="$img"
                break
              fi
            fi
          done
          if [ -z "$probe_image" ]; then
            echo "CREATE_PROBE_SKIPPED no_benign_local_image_no_pull"
            echo "::endgroup::"
            echo "evidence_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit 0
          fi
          echo "CREATE_PROBE_ATTEMPT name=${M26_PROBE_NAME} image=${probe_image}"
          set +e
          timeout 15s docker create --name "$M26_PROBE_NAME" --label m26.oracle-health-probe=20260827 --network none "$probe_image" true >/tmp/m26_probe_cid
          create_rc=$?
          set -u
          echo "CREATE_PROBE_EXIT ${create_rc}"
          if timeout 10s docker ps -a --filter "name=^/${M26_PROBE_NAME}$" --format "{{.Names}}" | grep -Fxq "$M26_PROBE_NAME"; then
            echo "CREATE_PROBE_OBJECT_PRESENT name=${M26_PROBE_NAME}"
            timeout 10s docker rm "$M26_PROBE_NAME"
            echo "CREATE_PROBE_RM_EXIT $?"
          else
            echo "CREATE_PROBE_OBJECT_ABSENT name=${M26_PROBE_NAME}"
          fi
          echo "::endgroup::"
          echo "evidence_finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit 0
          REMOTE
          )
          quoted_probe=$(printf '%q' "$PROBE_NAME")
          echo "local_transport_timeout_seconds=360"
          echo "remote_session_timeout_seconds=300"
          set +e
          timeout 360s ssh ${SSH_BASE_OPTS} "${ORACLE_VM_USER}@${ORACLE_VM_HOST}" "M26_PROBE_NAME=${quoted_probe} timeout 300s bash -s" <<< "$remote_script"
          rc=$?
          set -e
          echo "oracle_session_exit=${rc}"

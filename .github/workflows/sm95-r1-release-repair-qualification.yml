name: SM95-R1 Release Repair Qualification

on:
  push:
    branches:
      - m26-console/sm95-r1-release-runtime-health-repair-20260905
      - m26-console/sm95-r1-main-preservation-convergence-20260905

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Focused release/admin regression
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_m26_sm95_release_runtime_contract.py \
            tests/test_m26_admin_control_plane.py \
            tests/test_m26_admin_audit.py \
            tests/test_m26_admin_corpus.py \
            tests/test_m26_admin_health.py \
            tests/test_m26_admin_ingestion.py \
            tests/test_m26_admin_overview.py \
            tests/test_m26_admin_qa.py \
            tests/test_m26_admin_settings.py \
            tests/test_m26_admin_usage.py \
            tests/test_m26_console_p05_ask_playground.py \
            tests/test_m26_golden_questions_admin.py \
            tests/test_m26_jobs_rollback_api.py \
            tests/test_m26_suggested_questions_admin.py
      - name: Touched-file static checks
        run: |
          set -euo pipefail
          python -m ruff check tests/test_m26_sm95_release_runtime_contract.py
          bash -n deploy/deploy.sh deploy/rollback.sh
      - name: Build and inspect production image
        run: |
          set -euo pipefail
          docker build --tag knowledge-engine:sm95-r1 .
          python - <<'PY'
          import json, subprocess
          image = json.loads(subprocess.check_output(['docker','inspect','knowledge-engine:sm95-r1']))[0]
          cfg = image['Config']
          cmd = cfg.get('Cmd') or []
          health = ((cfg.get('Healthcheck') or {}).get('Test') or [])
          assert 'knowledge_engine.m26_console_api:app' in cmd, cmd
          assert any('/v1/answers/health' in part for part in health), health
          assert not any('/v1/health' in part for part in health), health
          print('IMAGE_CMD_OK', cmd)
          print('IMAGE_HEALTHCHECK_OK', health)
          PY
      - name: Image route census and missing-config fail-close
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python knowledge-engine:sm95-r1 - <<'PY'
          from knowledge_engine.m26_console_api import app
          paths = set(app.openapi()['paths'])
          for expected in ('/v1/answers', '/v1/answers/health', '/v1/admin/session', '/v1/admin/capabilities'):
              assert expected in paths, expected
          print('IMAGE_COMBINED_ROUTE_CENSUS=PASS')
          PY
          set +e
          output=$(timeout 20s docker run --rm knowledge-engine:sm95-r1 2>&1)
          rc=$?
          set -e
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -F 'R2_ENDPOINT_URL is required for R2' >/dev/null
          echo "IMAGE_MISSING_PRODUCTION_CONFIG_FAIL_CLOSED=PASS"
          echo "NOTE=credential-bound configured startup remains A002 account proof"

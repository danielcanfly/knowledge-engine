name: M25.9 Live Trigger Boundary Publisher

on:
  pull_request:
    paths:
      - '.github/workflows/m25-9-live-trigger-boundary-publisher.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m25-9-live-trigger-boundary-publisher.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 20
          show-progress: false
      - name: Verify one-file publisher boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -f .github/workflows/m25-9-live-trigger-boundary-publisher.yml
          if test "${{ github.event_name }}" = 'pull_request'; then
            git fetch --quiet --no-tags origin main
            test "$(git diff --name-only origin/main...HEAD)" = \
              '.github/workflows/m25-9-live-trigger-boundary-publisher.yml'
          fi

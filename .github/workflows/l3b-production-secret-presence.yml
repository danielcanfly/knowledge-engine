name: L3B Production Secret Presence Census

on:
  push:
    branches:
      - ops/l3b-production-env-census-20260909

permissions:
  contents: read

jobs:
  secret-presence:
    name: secret-${{ matrix.category }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        category:
          - sq_read
          - sq_write
          - minimax
          - owner_hash
    env:
      SQ_READ: ${{ secrets.M26_SUGGESTED_QUESTIONS_GITHUB_TOKEN }}
      SQ_WRITE: ${{ secrets.M26_SUGGESTED_QUESTIONS_GITHUB_WRITE_TOKEN }}
      MINIMAX: ${{ secrets.MINIMAX_API_KEY }}
      OWNER_HASH_STAGING: ${{ secrets.STAGING_M26_OWNER_SUBJECT_HASH }}
      OWNER_HASH_KE: ${{ secrets.KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH }}
      OWNER_HASH_M26: ${{ secrets.M26_OWNER_SUBJECT_HASH }}
      OWNER_HASH_STAGING_VAR: ${{ vars.STAGING_M26_OWNER_SUBJECT_HASH }}
      OWNER_HASH_KE_VAR: ${{ vars.KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH }}
      OWNER_HASH_M26_VAR: ${{ vars.M26_OWNER_SUBJECT_HASH }}
    steps:
      - name: Check category presence without disclosure
        run: |
          set -euo pipefail
          case '${{ matrix.category }}' in
            sq_read) test -n "${SQ_READ:-}" ;;
            sq_write) test -n "${SQ_WRITE:-}" ;;
            minimax) test -n "${MINIMAX:-}" ;;
            owner_hash)
              test -n "${OWNER_HASH_STAGING:-}${OWNER_HASH_KE:-}${OWNER_HASH_M26:-}${OWNER_HASH_STAGING_VAR:-}${OWNER_HASH_KE_VAR:-}${OWNER_HASH_M26_VAR:-}"
              ;;
            *) exit 2 ;;
          esac
          echo 'PRESENCE=PASS'
          echo 'SECRET_VALUE_DISCLOSURE=0'
          echo 'PRODUCTION_MUTATION=0'

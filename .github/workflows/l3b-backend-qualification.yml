name: L3B exact backend qualification

on:
  push:
    branches:
      - tmp/l3b-backend-qualification-20260909

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXACT_SHA: 543926766f85f0938ec5fe9b60c65a70c33d754d
      EXACT_TREE: 26ae48090854b61c377983ce7894b0f94bd04654
      PARENT_SHA: 9fce4a674b72cbf8b36e0044ed0e2276409c0242
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout and assert exact product source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-logs
          git checkout --detach "$EXACT_SHA"
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXACT_TREE"
          printf 'sha=%s\ntree=%s\nparent=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$PARENT_SHA" | tee qualification-logs/source-identity.log

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact project dev dependencies and lineage Ruff
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee qualification-logs/pip-upgrade.log
          python -m pip install -e '.[dev]' 2>&1 | tee qualification-logs/pip-install.log
          python -m pip install 'ruff==0.15.20' 2>&1 | tee qualification-logs/ruff-install.log
          python -m ruff --version | tee qualification-logs/ruff-version.log

      - name: Compileall
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src tests scripts 2>&1 | tee qualification-logs/compileall.log

      - name: Exact QA and admin regression cohort
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests_to_run < <(find tests -maxdepth 1 -type f -name '*.py' | grep -Ei '/test_.*(qa|admin|wrapper).*\.py$' | sort)
          printf '%s\n' "${tests_to_run[@]}" | tee qualification-logs/selected-tests.log
          test "${#tests_to_run[@]}" -gt 0
          set -o pipefail
          python -m pytest -q "${tests_to_run[@]}" 2>&1 | tee qualification-logs/pytest.log

      - name: Ruff exact candidate changed paths
        id: candidate_ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check \
            src/knowledge_engine/m26_qa_inbox_integration.py \
            src/knowledge_engine/qa_answer_quality.py \
            src/knowledge_engine/qa_answer_quality_sqlite.py \
            tests/test_qa_inbox_api_completeness.py \
            2>&1 | tee qualification-logs/ruff-candidate.log

      - name: Ruff parent differential
        id: parent_ruff
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT_SHA"
          set +e
          python -m ruff check \
            src/knowledge_engine/m26_qa_inbox_integration.py \
            src/knowledge_engine/qa_answer_quality.py \
            src/knowledge_engine/qa_answer_quality_sqlite.py \
            tests/test_qa_inbox_api_completeness.py \
            > qualification-logs/ruff-parent.log 2>&1
          rc=$?
          set -e
          cat qualification-logs/ruff-parent.log
          echo "parent_ruff_rc=$rc" | tee qualification-logs/ruff-parent-rc.log
          exit 0

      - name: Reassert exact candidate and fail closed on candidate Ruff
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXACT_SHA"
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXACT_TREE"
          set +e
          python -m ruff check \
            src/knowledge_engine/m26_qa_inbox_integration.py \
            src/knowledge_engine/qa_answer_quality.py \
            src/knowledge_engine/qa_answer_quality_sqlite.py \
            tests/test_qa_inbox_api_completeness.py \
            > qualification-logs/ruff-final.log 2>&1
          rc=$?
          set -e
          cat qualification-logs/ruff-final.log
          exit "$rc"

      - name: Product source immutability guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXACT_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          git status --short | tee qualification-logs/final-status.log

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3b-backend-qualification-evidence
          path: qualification-logs/
          retention-days: 3

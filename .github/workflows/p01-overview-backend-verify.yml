name: P01 Overview Backend Verify

on:
  push:
    branches:
      - m26-console/p01-overview-backend-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact backend branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Focused P01 lint
        run: >-
          ruff check
          src/knowledge_engine/m26_admin_overview.py
          src/knowledge_engine/m26_console_api.py
          tests/test_m26_admin_overview.py

      - name: Focused P01 tests
        run: pytest -q tests/test_m26_admin_overview.py

      - name: Full repository pytest regression
        run: pytest -q

      - name: Python-only compile regression
        shell: bash
        run: |
          python -m compileall -q src tests
          find scripts -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile

name: P01 Overview Backend Verify

on:
  push:
    branches:
      - m26-console/p01-overview-backend-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact backend branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Focused P01 lint
        run: >-
          ruff check
          src/knowledge_engine/m26_admin_overview.py
          src/knowledge_engine/m26_console_api.py
          tests/test_m26_admin_overview.py

      - name: Focused P01 format check
        run: >-
          ruff format --check
          src/knowledge_engine/m26_admin_overview.py
          src/knowledge_engine/m26_console_api.py
          tests/test_m26_admin_overview.py

      - name: P01 and B01 control-plane tests
        run: >-
          pytest -q
          tests/test_m26_admin_control_plane.py
          tests/test_m26_admin_overview.py

      - name: Public Ask route regression
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from knowledge_engine.m26_translation_gateway_public_api import create_app

          app = create_app()
          paths = {route.path for route in app.routes}
          assert "/v1/answers" in paths
          assert "/v1/answers/health" in paths

          response = TestClient(app).get("/v1/answers/health")
          assert response.status_code == 200
          payload = response.json()
          assert payload.get("ok") is True
          assert payload.get("status") == "ok"
          surface = payload.get("surface")
          assert isinstance(surface, dict)
          assert surface.get("canonical_health_url", "").endswith("/v1/answers/health")
          assert surface.get("canonical_answers_url", "").endswith("/v1/answers")
          PY

      - name: Combined relevant regression
        run: >-
          pytest -q
          tests/test_m26_admin_control_plane.py
          tests/test_m26_admin_overview.py

      - name: Python-only compile regression
        shell: bash
        run: |
          python -m compileall -q src tests
          find scripts -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile

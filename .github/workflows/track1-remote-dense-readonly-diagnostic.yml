name: Track1 Remote Dense Readonly Diagnostic

on:
  push:
    branches:
      - codex/m26-public-api-v1-staging-20260815
    paths:
      - .github/workflows/track1-remote-dense-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: m23-r3-diagnostic
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Configure bounded Oracle SSH
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh

      - name: Classify facade remote-dense 429 read-only
        run: |
          set -euo pipefail
          ssh oracle-knowledge 'bash -se' <<'REMOTE' | tee /tmp/track1-remote-dense-429.txt
          set -euo pipefail
          FACADE=m26-public-api-staging-d6288072
          PROD=llm_wiki-knowledge-engine-1
          docker exec -i "$FACADE" python - <<'PY'
          import json
          from knowledge_engine.m26_pa7_arbitrary_query_runtime import dense_channel_from_env
          from knowledge_engine.m26_production_answer_bundle import load_production_answer_bundle

          try:
              dense = dense_channel_from_env(require_remote=True)
              dense.search(
                  question='What should a router define for permission-first controls?',
                  bundle=load_production_answer_bundle(),
                  top_k=8,
              )
              print('dense_search=success')
          except Exception as exc:
              print('dense_search=failed')
              print(f'exception_type={type(exc).__name__}')
              response = getattr(exc, 'response', None)
              if response is not None:
                  print(f'http_status={getattr(response, "status_code", "")}')
                  print(f'retry_after={response.headers.get("retry-after", "")}')
                  print(f'ratelimit_reset={response.headers.get("ratelimit-reset", "")}')
                  try:
                      payload = response.json()
                  except Exception:
                      payload = {}
                  if isinstance(payload, dict):
                      errors = payload.get('errors', [])
                      safe = []
                      if isinstance(errors, list):
                          for item in errors[:4]:
                              if isinstance(item, dict):
                                  safe.append({
                                      'code': item.get('code'),
                                      'message': str(item.get('message', ''))[:300],
                                  })
                      print('cloudflare_errors=' + json.dumps(safe, sort_keys=True))
          PY
          echo "facade_health=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/health)"
          echo "production_health=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health)"
          echo 'production_mutations=0'
          REMOTE

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: track1-remote-dense-429-${{ github.sha }}
          path: /tmp/track1-remote-dense-429.txt
          retention-days: 7
          if-no-files-found: error

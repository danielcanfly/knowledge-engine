name: Track1 Remote Dense Readonly Diagnostic

on:
  push:
    branches:
      - codex/m26-public-api-v1-staging-20260815
    paths:
      - .github/workflows/track1-remote-dense-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: m23-r3-diagnostic
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Configure bounded Oracle SSH
        run: |
          set -euo pipefail
          bash scripts/configure_oracle_ssh.sh

      - name: Compare remote-dense binding and execute isolated read-only search
        run: |
          set -euo pipefail
          ssh oracle-knowledge 'bash -se' <<'REMOTE' | tee /tmp/track1-remote-dense-diagnostic.txt
          set -euo pipefail
          FACADE=m26-public-api-staging-d6288072
          BACKEND=m26-cloudflare-primary-staging-d6288072
          PROD=llm_wiki-knowledge-engine-1
          echo 'track1_remote_dense_diagnostic=v1'

          for c in "$FACADE" "$BACKEND"; do
            echo "container=$c"
            docker exec "$c" python - <<'PY' || true
          PY
            docker exec -i "$c" python - <<'PY'
          import hashlib, os
          keys = [
              'CLOUDFLARE_ACCOUNT_ID',
              'CLOUDFLARE_AI_TOKEN',
              'CLOUDFLARE_API_TOKEN',
              'QDRANT_URL',
              'QDRANT_API_KEY_READ',
              'QDRANT_READ_ONLY_API_KEY',
              'QDRANT_API_KEY',
              'M26_PA7_DENSE_COLLECTION',
              'QDRANT_COLLECTION',
              'QDRANT_COLLECTION_NAME',
              'M26_QUERY_REQUIRE_REMOTE_DENSE',
              'M26_PUBLIC_FORCE_LOCAL_DENSE',
          ]
          for key in keys:
              value = os.environ.get(key, '')
              digest = hashlib.sha256(value.encode()).hexdigest()[:16] if value else ''
              print(f'env:{key}:present={str(bool(value)).lower()}:sha16={digest}:len={len(value)}')

          from knowledge_engine.m26_pa7_arbitrary_query_runtime import dense_channel_from_env
          from knowledge_engine.m26_production_answer_bundle import load_production_answer_bundle
          try:
              dense = dense_channel_from_env(require_remote=True)
              bundle = load_production_answer_bundle()
              result = dense.search(
                  question='What should a router define for permission-first controls?',
                  bundle=bundle,
                  top_k=8,
              )
              ident = result.get('backend_identity', {})
              print('dense_search=success')
              print(f'dense_backend={ident.get("backend", "")}')
              print(f'dense_remote={ident.get("remote", "")}')
              print(f'dense_candidate_count={len(result.get("candidates", []))}')
          except Exception as exc:
              print('dense_search=failed')
              print(f'exception_type={type(exc).__name__}')
              print(f'exception_code={getattr(exc, "code", "")}')
              response = getattr(exc, 'response', None)
              if response is not None:
                  print(f'http_status={getattr(response, "status_code", "")}')
                  request = getattr(response, 'request', None)
                  url = getattr(request, 'url', None)
                  print(f'http_host={getattr(url, "host", "") if url is not None else ""}')
          PY
          done

          echo "facade_health=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/health || true)"
          echo "backend_health=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/health || true)"
          echo "production_health=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/health || true)"
          echo 'production_mutations=0'
          REMOTE

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: track1-remote-dense-readonly-diagnostic-${{ github.sha }}
          path: /tmp/track1-remote-dense-diagnostic.txt
          retention-days: 7
          if-no-files-found: error

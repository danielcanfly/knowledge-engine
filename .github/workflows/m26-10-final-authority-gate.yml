name: M26.10 Synthetic Final Authority Gate

on:
  pull_request:
    paths:
      - '.github/workflows/m26-10-final-authority-gate.yml'
      - 'docs/architecture/m26/m26-10-synthetic-final-authority-gate.md'
      - 'pilot/m26/m26-10-*.json'
      - 'schemas/m26-10-*.schema.json'
      - 'src/knowledge_engine/m26_final_authority_gate.py'
      - 'tests/test_m26_10_final_authority_gate.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  synthetic-final-authority-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact head and predecessor
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          acceptance = json.loads(Path('pilot/m26/m26-9-acceptance.json').read_text())
          assert acceptance['status'] == 'm26_9_candidate_qa_feedback_baseline_refresh_accepted'
          assert acceptance['implementation']['merge_sha'] == 'f91d14f6b75053670c1ce2b517134e7c75ab8db0'
          PY
      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint M26.10
        run: |
          python -m ruff check \
            src/knowledge_engine/m26_final_authority_gate.py \
            tests/test_m26_10_final_authority_gate.py
      - name: Test M26.10 contracts
        run: |
          python -m pytest -q \
            tests/test_m26_10_final_authority_gate.py::test_m26_10_entry_contract_and_policy \
            tests/test_m26_10_final_authority_gate.py::test_m26_10_registry_and_schema_files_exist
      - name: Test M26.10 benchmark and safety
        run: python -m pytest -q tests/test_m26_10_final_authority_gate.py
      - name: Test M26.9 predecessor
        run: python -m pytest -q tests/test_m26_9_candidate_qa_feedback.py::test_m26_9_qa_benchmark
      - name: Rebuild deterministic M26.10 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from knowledge_engine.m26_final_authority_gate import run_final_authority_benchmark
          cases = json.loads(Path('pilot/m26/m26-10-benchmark-cases.json').read_text())
          policy = json.loads(Path('pilot/m26/m26-10-final-authority-policy.json').read_text())
          report = run_final_authority_benchmark(cases, policy)
          Path('m26-10-final-authority-evidence.json').write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          assert report['passed_count'] == 12
          assert report['metrics']['baseline_refresh_execution_count'] == 0
          assert report['metrics']['production_answer_serving_count'] == 0
          PY
      - name: Reject protected mutations
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          forbidden='^(source/|foundation/|release/|r2/|qdrant/|production|pilot/m26/m26-[1-9]-|src/knowledge_engine/m26_(answer|preview|draft|provider|retrieval|context|candidate_qa))'
          ! printf '%s\n' "$changed" | grep -E "$forbidden"
      - uses: actions/upload-artifact@v4
        with:
          name: m26-10-final-authority-evidence
          path: m26-10-final-authority-evidence.json
          if-no-files-found: error

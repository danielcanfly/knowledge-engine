name: M25.10 Formal Closure Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/m25-10-formal-closure.yml'
      - 'docs/architecture/m25/m25-10-formal-closure.md'
      - 'pilot/m25/m25-10-owner-decision.json'
      - 'pilot/m25/m25-10-final-acceptance.json'
      - 'pilot/m25/m25-10-formal-closure-evidence.json'
      - 'schemas/m25-10-formal-closure-evidence-v1.schema.json'
      - 'src/knowledge_engine/m25_formal_closure.py'
      - 'tests/test_m25_formal_closure.py'

permissions:
  contents: read

jobs:
  formal-closure-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact head and accepted promotion ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor a7bc1383df79c519d389a9b135397b8e4d193e06 HEAD
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path('pilot/m25/m25-10-formal-closure-evidence.json').read_text())
          assert evidence['status'] == 'm25_closed'
          assert evidence['production_identities']['release_id'] == 'm25blog-5250f8422f4f-f5f01d82c7a1-fe499db2e043'
          assert evidence['production_identities']['production_pointer_sha256'] == '4a2cf8cc16d598cc2c6928491cf2c3b926e57e571297c61a8c3ff7a4ae396ff9'
          assert evidence['decision_gate']['decision_required'] is False
          assert evidence['decision_gate']['selected_outcome'] == 'approved_bounded_large_scale_ingestion'
          assert evidence['owner_decision']['path'] == 'pilot/m25/m25-10-owner-decision.json'
          assert evidence['final_acceptance']['path'] == 'pilot/m25/m25-10-final-acceptance.json'
          PY
      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint and test formal closure evidence
        run: |
          python -m ruff check \
            src/knowledge_engine/m25_formal_closure.py \
            tests/test_m25_formal_closure.py
          python -m pytest -q tests/test_m25_formal_closure.py
      - name: Rebuild deterministic closure evidence report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from knowledge_engine.m25_formal_closure import validate_repository

          report = validate_repository(Path('.'))
          Path('m25-10-formal-closure-evidence-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          assert report['decision_required'] is False
          PY
      - name: Reject protected mutation paths
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            '.github/workflows/m25-10-formal-closure.yml' \
            'docs/architecture/m25/m25-10-formal-closure.md' \
            'pilot/m25/m25-10-owner-decision.json' \
            'pilot/m25/m25-10-final-acceptance.json' \
            'pilot/m25/m25-10-formal-closure-evidence.json' \
            'schemas/m25-10-formal-closure-evidence-v1.schema.json' \
            'src/knowledge_engine/m25_formal_closure.py' \
            'tests/test_m25_formal_closure.py' | sort)"
          test "$changed" = "$expected"
          forbidden='^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)'
          ! printf '%s\n' "$changed" | grep -E "$forbidden"
      - uses: actions/upload-artifact@v4
        with:
          name: m25-10-formal-closure-evidence-report
          path: m25-10-formal-closure-evidence-report.json
          if-no-files-found: error
          retention-days: 90

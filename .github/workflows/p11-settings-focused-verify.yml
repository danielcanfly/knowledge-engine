name: P11 Settings Focused Verify

on:
  push:
    branches:
      - m26-console/p11-settings-backend-20260904
    paths:
      - '.github/workflows/p11-settings-focused-verify.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint only P11 touched Python files
        run: >-
          ruff check
          src/knowledge_engine/m26_admin_settings.py
          src/knowledge_engine/m26_console_api.py
          tests/test_m26_admin_settings.py
      - name: Focused P11 tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_m26_admin_settings.py tests/test_m26_admin_control_plane.py
      - name: Compile P11 modules
        run: >-
          python -m py_compile
          src/knowledge_engine/m26_admin_settings.py
          src/knowledge_engine/m26_console_api.py

name: M26.G0 Independent Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/m26-g0-milestone-reconciliation.yml'
      - '.github/workflows/m26-g0-reconciliation.yml'
      - 'docs/architecture/m26/m26-g0-reconciliation.md'
      - 'pilot/m26/m26-g0-acceptance.json'
      - 'tests/test_m26_g0_reconciliation.py'

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact head and implementation ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor a53eeae85265c2a8c3988f06371ee95849a22917 HEAD
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate independent reconciliation
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_m26_g0_reconciliation.py
          ruff check tests/test_m26_g0_reconciliation.py
          python -m compileall -q tests/test_m26_g0_reconciliation.py
      - name: Enforce exact five-file compatibility scope
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/m26-g0-milestone-reconciliation.yml
          .github/workflows/m26-g0-reconciliation.yml
          docs/architecture/m26/m26-g0-reconciliation.md
          pilot/m26/m26-g0-acceptance.json
          tests/test_m26_g0_reconciliation.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! grep -E '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/)' \
            /tmp/changed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m26-g0-reconciliation-evidence
          path: pilot/m26/m26-g0-acceptance.json
          if-no-files-found: error
          retention-days: 90

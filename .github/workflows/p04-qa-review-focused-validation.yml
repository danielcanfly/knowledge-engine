name: P04 QA Review Focused Validation

on:
  push:
    branches:
      - m26-console/p04-qa-review-backend-validation-20260904

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff P04 only
        run: ruff check src/knowledge_engine/m26_admin_qa.py tests/test_m26_admin_qa.py
      - name: Compile P04 adapter
        run: python -m py_compile src/knowledge_engine/m26_admin_qa.py
      - name: Focused QA and control-plane tests
        run: pytest -q tests/test_m26_admin_qa.py tests/test_m26_admin_control_plane.py
      - name: Contract prohibition regression
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn 'score_lt|score[[:space:]_-]*<|0[[:space:]]*[-–][[:space:]]*100|<85' \
            src/knowledge_engine/m26_admin_qa.py tests/test_m26_admin_qa.py
          grep -F '/v1/admin/qa/events' src/knowledge_engine/m26_admin_qa.py
          grep -F '/v1/admin/qa/export-markdown' src/knowledge_engine/m26_admin_qa.py

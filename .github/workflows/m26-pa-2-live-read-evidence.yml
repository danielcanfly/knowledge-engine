name: M26.PA.2 Exact Live Read-Only Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/m26-pa-2-live-read-evidence.yml'
      - 'docs/architecture/m26/m26-pa-2-live-read-evidence.md'
      - 'pilot/m26/m26-pa-2-contract-registry.json'
      - 'pilot/m26/m26-pa-2-live-authorization.json'
      - 'pilot/m26/m26-pa-2-retrieval-policy.json'
      - 'schemas/m26-pa-2-contracts-v1.schema.json'
      - 'schemas/m26-pa-2-live-authorization-v1.schema.json'
      - 'schemas/m26-pa-2-real-corpus-receipt-v1.schema.json'
      - 'tests/test_m26_pa_2_contracts.py'
      - 'tests/test_m26_pa_2_live_authorization.py'
      - 'tests/test_m26_pa_2_real_corpus_binding.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m26-pa-2-live-read-evidence.yml'
      - 'docs/architecture/m26/m26-pa-2-live-read-evidence.md'
      - 'pilot/m26/m26-pa-2-contract-registry.json'
      - 'pilot/m26/m26-pa-2-live-authorization.json'
      - 'pilot/m26/m26-pa-2-retrieval-policy.json'
      - 'schemas/m26-pa-2-contracts-v1.schema.json'
      - 'schemas/m26-pa-2-live-authorization-v1.schema.json'
      - 'schemas/m26-pa-2-real-corpus-receipt-v1.schema.json'
      - 'tests/test_m26_pa_2_contracts.py'
      - 'tests/test_m26_pa_2_live_authorization.py'
      - 'tests/test_m26_pa_2_real_corpus_binding.py'

permissions:
  contents: read

jobs:
  static-authorization:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and implementation ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor ecad7b2bfb2e6d472bf0ed76d2e0adc818124dd9 HEAD

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate exact live authorization without secrets
        run: |
          set -euo pipefail
          python -m ruff check tests/test_m26_pa_2_live_authorization.py
          python -m pytest -q \
            tests/test_m26_pa_2_live_authorization.py \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py
          python -m compileall -q tests/test_m26_pa_2_live_authorization.py
          test -z "${R2_ACCESS_KEY_ID_READ:-}"
          test -z "${R2_SECRET_ACCESS_KEY_READ:-}"
          test -z "${QDRANT_READ_ONLY_API_KEY:-}"

      - name: Enforce exact attempt-4 authorization surface
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'FILES'
          .github/workflows/m26-pa-2-live-read-evidence.yml
          docs/architecture/m26/m26-pa-2-live-read-evidence.md
          pilot/m26/m26-pa-2-contract-registry.json
          pilot/m26/m26-pa-2-live-authorization.json
          pilot/m26/m26-pa-2-retrieval-policy.json
          schemas/m26-pa-2-contracts-v1.schema.json
          schemas/m26-pa-2-live-authorization-v1.schema.json
          schemas/m26-pa-2-real-corpus-receipt-v1.schema.json
          tests/test_m26_pa_2_contracts.py
          tests/test_m26_pa_2_live_authorization.py
          tests/test_m26_pa_2_real_corpus_binding.py
          FILES
          cmp /tmp/expected.txt /tmp/changed.txt
          ! grep -E \
            '^(src/|source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt

  live-read-only:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[m26.pa2-live-authorized-attempt-4]')
    runs-on: ubuntu-24.04
    environment: m23-r3-diagnostic
    env:
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID_READ: ${{ secrets.R2_ACCESS_KEY_ID_READ }}
      R2_SECRET_ACCESS_KEY_READ: ${{ secrets.R2_SECRET_ACCESS_KEY_READ }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_READ_ONLY_API_KEY: ${{ secrets.QDRANT_READ_ONLY_API_KEY }}
      R2_REGION: auto
      AUTHORIZATION_PATH: pilot/m26/m26-pa-2-live-authorization.json
      EVIDENCE_DIR: /tmp/m26-pa-2-live-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact attempt, authorization, and implementation ancestry
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor ecad7b2bfb2e6d472bf0ed76d2e0adc818124dd9 HEAD
          test -n "$R2_ENDPOINT_URL"
          test -n "$R2_BUCKET"
          test -n "$R2_ACCESS_KEY_ID_READ"
          test -n "$R2_SECRET_ACCESS_KEY_READ"
          test -n "$QDRANT_URL"
          test -n "$QDRANT_READ_ONLY_API_KEY"
          mkdir -p "$EVIDENCE_DIR"

      - name: Install runtime dependencies and validate authorization
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q tests/test_m26_pa_2_live_authorization.py

      - name: Execute exact metadata-only read
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from typing import Any, Mapping

          from knowledge_engine.m26_real_corpus_binding import (
              Boto3ReadOnlyObjectStore,
              HttpxReadOnlyQdrantClient,
              bind_real_corpus,
              build_sanitized_failure_receipt,
              receipt_bytes,
          )

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          authorization_path = Path(os.environ["AUTHORIZATION_PATH"])
          authorization = json.loads(authorization_path.read_text(encoding="utf-8"))

          class CountingStore:
              def __init__(self, delegate: Any) -> None:
                  self._delegate = delegate
                  self.capabilities = delegate.capabilities
                  self.credential_scope = delegate.credential_scope
                  self.credential_contract_sha256 = delegate.credential_contract_sha256
                  self.reads = 0
                  self.allowed_keys = frozenset(authorization["read_surface"]["r2_keys"])

              def get(self, key: str) -> bytes:
                  if key not in self.allowed_keys:
                      raise RuntimeError("R2 key is outside exact PA.2 authorization")
                  self.reads += 1
                  return self._delegate.get(key)

          class CountingQdrant:
              def __init__(self, delegate: Any) -> None:
                  self._delegate = delegate
                  self.capabilities = delegate.capabilities
                  self.credential_scope = delegate.credential_scope
                  self.credential_contract_sha256 = delegate.credential_contract_sha256
                  self.count_requests = 0
                  self.scroll_requests = 0

              def count(
                  self,
                  *,
                  collection: str,
                  query_filter: Mapping[str, Any],
                  timeout_seconds: float,
              ) -> Any:
                  self.count_requests += 1
                  return self._delegate.count(
                      collection=collection,
                      query_filter=query_filter,
                      timeout_seconds=timeout_seconds,
                  )

              def scroll(
                  self,
                  *,
                  collection: str,
                  request: Mapping[str, Any],
                  timeout_seconds: float,
              ) -> Any:
                  self.scroll_requests += 1
                  return self._delegate.scroll(
                      collection=collection,
                      request=request,
                      timeout_seconds=timeout_seconds,
                  )

          store = CountingStore(
              Boto3ReadOnlyObjectStore(
                  endpoint_url=os.environ["R2_ENDPOINT_URL"],
                  bucket=os.environ["R2_BUCKET"],
                  access_key_id=os.environ["R2_ACCESS_KEY_ID_READ"],
                  secret_access_key=os.environ["R2_SECRET_ACCESS_KEY_READ"],
                  region=os.environ["R2_REGION"],
              )
          )
          qdrant = CountingQdrant(
              HttpxReadOnlyQdrantClient(
                  base_url=os.environ["QDRANT_URL"],
                  api_key=os.environ["QDRANT_READ_ONLY_API_KEY"],
                  maximum_retries=1,
              )
          )
          generated_at = (
              datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          )
          workflow = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_name": authorization["execution"]["workflow_name"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"],
              "environment": authorization["execution"]["environment"],
              "query_id": authorization["execution"]["query_id"],
              "evidence_mode": authorization["execution"]["evidence_mode"],
          }
          try:
              receipt = bind_real_corpus(
                  root=Path("."),
                  store=store,
                  qdrant=qdrant,
                  generated_at=generated_at,
                  workflow=workflow,
              )
              data = receipt_bytes(receipt)
              output = evidence_dir / "m26-pa-2-live-receipt.json"
              output.write_bytes(data)
              (evidence_dir / "m26-pa-2-live-receipt.sha256").write_text(
                  hashlib.sha256(data).hexdigest() + "\n",
                  encoding="utf-8",
              )
              (evidence_dir / "status.txt").write_text("success\n", encoding="utf-8")
              print("m26_pa2_live_read_status=success")
          except Exception as error:
              failure = build_sanitized_failure_receipt(
                  root=Path("."),
                  generated_at=generated_at,
                  workflow=workflow,
                  error=error,
                  operation_counts={
                      "r2_reads": store.reads,
                      "qdrant_count_requests": qdrant.count_requests,
                      "qdrant_scroll_requests": qdrant.scroll_requests,
                  },
              )
              data = receipt_bytes(failure)
              output = evidence_dir / "m26-pa-2-live-failure-receipt.json"
              output.write_bytes(data)
              (evidence_dir / "m26-pa-2-live-failure-receipt.sha256").write_text(
                  hashlib.sha256(data).hexdigest() + "\n",
                  encoding="utf-8",
              )
              (evidence_dir / "status.txt").write_text("failed_closed\n", encoding="utf-8")
              print("m26_pa2_live_read_status=failed_closed")
              raise SystemExit("PA.2 live read-only evidence failed closed") from None
          PY

      - name: Snapshot non-secret authorization
        if: always()
        run: cp "$AUTHORIZATION_PATH" "$EVIDENCE_DIR/authorization.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m26-pa-2-live-read-only-evidence-attempt-4
          path: /tmp/m26-pa-2-live-evidence
          if-no-files-found: error
          retention-days: 90

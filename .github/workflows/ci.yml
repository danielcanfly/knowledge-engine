name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded canonical recovery consolidation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/knowledge_engine/m26_aq_semantic_runtime_patch_v2.py')
          text = path.read_text(encoding='utf-8')

          threshold = "    if len(facet_ids) < 4:\n        return None\n"
          assert text.count(threshold) == 1, 'direct facet threshold drifted'
          text = text.replace(threshold, "    if len(facet_ids) < 2:\n        return None\n", 1)

          architecture = '''    if {
              "source_selection",
              "persisted_progress",
              "parallel_branches",
              "verification_gate",
              "human_approval",
          }.issubset(ids):
              return (
                  "Source selection routes work to different sources. Persisted progress is "
                  "durable state. Parallel research branches keep work concurrent and join "
                  "at a verification gate. Human approval is the final authority gate before "
                  "release."
              )
          '''
          assert text.count(architecture) == 1, 'controlled architecture surface drifted'
          text = text.replace(architecture, '', 1)

          lifecycle_marker = '''    if {
              "admission_policy",
              "durable_state",
              "completion_verification",
              "observability",
          }.issubset(ids):
          '''
          assert text.count(lifecycle_marker) == 1, 'lifecycle marker drifted'
          text = text.replace(lifecycle_marker, architecture + lifecycle_marker, 1)

          surface_marker = '''        "multi_source_selection": "The trust claim is grounded in source and provenance authority.",
              "verification_or_approval": (
          '''
          # Normalize the marker indentation written above to the production dictionary's 8 spaces.
          surface_marker = surface_marker.replace('\n              "verification_or_approval"', '\n        "verification_or_approval"')
          surface_replacement = '''        "multi_source_selection": "The trust claim is grounded in source and provenance authority.",
          "durable_state_authority": (
              "Durable persisted server-side run state preserves progress and authority "
              "after a client disconnect."
          ),
          "continued_execution": (
              "The long-running workflow continues after the client disconnect and can "
              "later be resumed or rejoined."
          ),
          "verification_completion": (
              "Completion verification or acceptance checks the result before success "
              "or correctness is declared."
          ),
          "observability_reattachment": (
              "Observability, status, and reattachment let the owner inspect or resume "
              "the continuing run."
          ),
          "admission_policy": (
              "Admission policy or the request contract gates whether execution may start."
          ),
          "verification_or_approval": (
          '''
          # Normalize dictionary indentation in the inserted block.
          surface_replacement = surface_replacement.replace('\n      "', '\n        "').replace('\n          "', '\n            "')
          assert text.count(surface_marker) == 1, 'direct facet surface marker drifted'
          text = text.replace(surface_marker, surface_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test ! -e src/knowledge_engine/m26_aq_semantic_runtime_patch_v2/__init__.py
          if grep -nE '\b(BB02|BB10|BB13|BB18|BB19|R3-Q07)\b' src/knowledge_engine/m26_aq_semantic_runtime_patch_v2.py; then
            echo 'benchmark/case identifier leaked into production source'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Run quality gates
        shell: bash
        run: |
          set -o pipefail
          make ci > /tmp/knowledge-engine-ci.log 2>&1 || {
            cat /tmp/knowledge-engine-ci.log
            exit 1
          }
          cat /tmp/knowledge-engine-ci.log
      - name: Validate consolidation dispatch invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from types import SimpleNamespace
          from knowledge_engine import m26_aq_semantic_runtime_patch_v2 as patch

          architecture_ids = [
              'source_selection', 'persisted_progress', 'parallel_branches',
              'verification_gate', 'human_approval', 'durable_state',
              'completion_verification',
          ]
          architecture_requirements = [
              SimpleNamespace(requirement_id=value, exact_phrase='')
              for value in architecture_ids
          ]
          architecture_text = patch._semantic_answer_text_v2(
              'Sketch a controlled architecture for a complex request that needs different sources, persisted progress, parallel research branches, verification, and human approval.',
              architecture_requirements,
          )
          assert architecture_text.startswith('Source selection routes work to different sources.')

          lifecycle_requirements = [
              SimpleNamespace(requirement_id=value, exact_phrase='')
              for value in ('durable_state', 'completion_verification', 'observability')
          ]
          lifecycle_text = patch._semantic_answer_text_v2(
              'Why is persisted run state important when a client disconnects before a long-running workflow has finished?',
              lifecycle_requirements,
          )
          assert 'Persisted run state matters after a client disconnect' in lifecycle_text
          assert 'Observability or reattachment exposes status' in lifecycle_text
          assert 'Completion verification or acceptance remains' in lifecycle_text

          for facet_id in (
              'durable_state_authority', 'continued_execution',
              'verification_completion', 'observability_reattachment',
              'admission_policy',
          ):
              surface = patch._direct_facet_surface_text(
                  facet_id=facet_id,
                  answer=lifecycle_text,
                  requirements=lifecycle_requirements,
              )
              assert surface and surface != lifecycle_text
          PY
      - name: Upload CI failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-engine-ci-log
          path: /tmp/knowledge-engine-ci.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Reference vertical slice
        run: |
          set -euo pipefail
          make build
          make query | grep -F 'concepts/knowledge-compiler'
      - name: Build container
        run: docker build --tag knowledge-engine:ci .
      - name: Publish exact tested tree to final worker branch
        shell: bash
        env:
          BASELINE_SHA: ba2e0c428882e12469eefcd08a96e894bbc41c7c
          FINAL_BRANCH: gpt-final/aq-recovery-dispatcher-consolidation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout "$BASELINE_SHA" -- .github/workflows/ci.yml
          git rm --ignore-unmatch .github/workflows/aq-final-consolidation-worker.yml
          git add src/knowledge_engine/m26_aq_semantic_runtime_patch_v2.py .github/workflows/ci.yml
          git diff --cached --check
          changed="$(git diff "$BASELINE_SHA" --name-only | sort | tr '\n' ' ')"
          test "$changed" = "src/knowledge_engine/m26_aq_semantic_runtime_patch_v2.py "
          git commit -m 'Consolidate AQ recovery dispatch by canonical facets'
          git push origin HEAD:"$FINAL_BRANCH"

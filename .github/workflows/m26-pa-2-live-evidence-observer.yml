name: M26.PA.2 Live Evidence Observer

on:
  pull_request:
    paths:
      - '.github/workflows/m26-pa-2-live-evidence-observer.yml'
      - 'docs/architecture/m26/m26-pa-2-live-evidence-observer.md'
      - 'tests/test_m26_pa_2_live_evidence_observer.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m26-pa-2-live-evidence-observer.yml'
      - 'docs/architecture/m26/m26-pa-2-live-evidence-observer.md'
      - 'tests/test_m26_pa_2_live_evidence_observer.py'

permissions:
  contents: read

jobs:
  static-observer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact head and live authorization ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 94b7d9d81ab3f56f62df25a6722bed5f2c038347 HEAD
      - name: Validate observer contract
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m ruff check tests/test_m26_pa_2_live_evidence_observer.py
          python -m pytest -q tests/test_m26_pa_2_live_evidence_observer.py
          python -m compileall -q tests/test_m26_pa_2_live_evidence_observer.py
      - name: Enforce exact three-file observer surface
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'FILES'
          .github/workflows/m26-pa-2-live-evidence-observer.yml
          docs/architecture/m26/m26-pa-2-live-evidence-observer.md
          tests/test_m26_pa_2_live_evidence_observer.py
          FILES
          cmp /tmp/expected.txt /tmp/changed.txt
          ! grep -E \
            '^(src/|source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt

  observe-live-run:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[m26.pa2-observe-live]')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: 94b7d9d81ab3f56f62df25a6722bed5f2c038347
      TARGET_WORKFLOW_NAME: M26.PA.2 Exact Live Read-Only Evidence
      TARGET_ARTIFACT_NAME: m26-pa-2-live-read-only-evidence-attempt-1
      TARGET_ISSUE: '1186'
      OBSERVATION_MARKER: '<!-- m26-pa2-live-observation-v1 -->'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Observe, validate, and report exact live run
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path
          from typing import Any

          from jsonschema import Draft202012Validator

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_head = os.environ["TARGET_HEAD_SHA"]
          workflow_name = os.environ["TARGET_WORKFLOW_NAME"]
          artifact_name = os.environ["TARGET_ARTIFACT_NAME"]
          issue = os.environ["TARGET_ISSUE"]
          marker = os.environ["OBSERVATION_MARKER"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "knowledge-engine-m26-pa2-observer/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(path: str, *, method: str = "GET", body: Any = None) -> Any:
              data = None
              request_headers = dict(headers)
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  api + path,
                  data=data,
                  headers=request_headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"GitHub API request failed with HTTP {error.code}"
                  ) from None

          def request_bytes(path: str) -> bytes:
              request = urllib.request.Request(api + path, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"GitHub artifact request failed with HTTP {error.code}"
                  ) from None

          query = urllib.parse.urlencode(
              {
                  "head_sha": target_head,
                  "event": "push",
                  "per_page": 100,
                  "exclude_pull_requests": "true",
              }
          )
          run = None
          for _ in range(60):
              payload = request_json(f"/repos/{repository}/actions/runs?{query}")
              candidates = [
                  item
                  for item in payload.get("workflow_runs", [])
                  if item.get("name") == workflow_name
                  and item.get("head_sha") == target_head
                  and item.get("event") == "push"
              ]
              if len(candidates) != 1:
                  raise RuntimeError("Exact PA.2 live workflow run was not unique")
              run = candidates[0]
              if run.get("status") == "completed":
                  break
              time.sleep(5)
          else:
              raise RuntimeError("Exact PA.2 live workflow run did not complete in bound")

          run_id = int(run["id"])
          jobs_payload = request_json(
              f"/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100"
          )
          failed_steps = sorted(
              {
                  step.get("name", "unknown")
                  for job in jobs_payload.get("jobs", [])
                  for step in (job.get("steps") or [])
                  if step.get("conclusion") == "failure"
              }
          )
          artifacts_payload = request_json(
              f"/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100"
          )
          artifacts = [
              item
              for item in artifacts_payload.get("artifacts", [])
              if item.get("name") == artifact_name and not item.get("expired", False)
          ]

          observation: dict[str, Any] = {
              "run_id": run_id,
              "run_attempt": int(run.get("run_attempt", 0)),
              "head_sha": run.get("head_sha"),
              "event": run.get("event"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "failed_steps": failed_steps,
              "artifact": None,
              "receipt": None,
          }
          if len(artifacts) == 1:
              artifact = artifacts[0]
              archive = request_bytes(
                  f"/repos/{repository}/actions/artifacts/{int(artifact['id'])}/zip"
              )
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  names = set(bundle.namelist())
                  status_text = (
                      bundle.read("status.txt").decode("utf-8").strip()
                      if "status.txt" in names
                      else "missing"
                  )
                  receipt_name = None
                  schema_path = None
                  if "m26-pa-2-live-receipt.json" in names:
                      receipt_name = "m26-pa-2-live-receipt.json"
                      schema_path = Path(
                          "schemas/m26-pa-2-real-corpus-receipt-v1.schema.json"
                      )
                  elif "m26-pa-2-live-failure-receipt.json" in names:
                      receipt_name = "m26-pa-2-live-failure-receipt.json"
                      schema_path = Path(
                          "schemas/m26-pa-2-failure-receipt-v1.schema.json"
                      )
                  if receipt_name is None or schema_path is None:
                      raise RuntimeError("PA.2 live artifact has no strict receipt")
                  receipt_bytes = bundle.read(receipt_name)
                  receipt = json.loads(receipt_bytes.decode("utf-8"))
                  schema = json.loads(schema_path.read_text(encoding="utf-8"))
                  errors = list(Draft202012Validator(schema).iter_errors(receipt))
                  if errors:
                      raise RuntimeError("PA.2 live receipt failed strict schema")
                  expected_self = receipt["self_sha256"]
                  candidate = dict(receipt)
                  candidate["self_sha256"] = ""
                  canonical = json.dumps(
                      candidate,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode("utf-8")
                  if hashlib.sha256(canonical).hexdigest() != expected_self:
                      raise RuntimeError("PA.2 live receipt self-digest mismatch")
                  observation["artifact"] = {
                      "id": int(artifact["id"]),
                      "name": artifact["name"],
                      "digest": artifact.get("digest"),
                      "size_in_bytes": int(artifact.get("size_in_bytes", 0)),
                      "expires_at": artifact.get("expires_at"),
                  }
                  receipt_summary: dict[str, Any] = {
                      "artifact_status": status_text,
                      "schema_version": receipt.get("schema_version"),
                      "receipt_status": receipt.get("status"),
                      "self_sha256": expected_self,
                      "file_sha256": hashlib.sha256(receipt_bytes).hexdigest(),
                  }
                  if receipt.get("status") == "real_corpus_retrieval_binding_verified":
                      receipt_summary.update(
                          {
                              "release_id": receipt["release"]["release_id"],
                              "pointer_sha256": receipt["release"]["pointer_sha256"],
                              "manifest_sha256": receipt["release"]["manifest_sha256"],
                              "observed_point_count": receipt["qdrant"][
                                  "observed_point_count"
                              ],
                              "page_count": receipt["qdrant"]["page_count"],
                              "sample_size": receipt["qdrant"]["sample_size"],
                              "sample_seed_sha256": receipt["qdrant"][
                                  "sample_seed_sha256"
                              ],
                              "pagination_trace_sha256": receipt["qdrant"][
                                  "pagination_trace_sha256"
                              ],
                              "authority": receipt["authority"],
                          }
                      )
                  else:
                      receipt_summary.update(
                          {
                              "failure_code": receipt.get("failure_code"),
                              "failure_class": receipt.get("failure_class"),
                              "operation_counts": receipt.get("operation_counts"),
                          }
                      )
                  observation["receipt"] = receipt_summary
          elif len(artifacts) > 1:
              raise RuntimeError("PA.2 live artifact was not unique")

          safe_json = json.dumps(observation, indent=2, sort_keys=True)
          body = (
              f"{marker}\n"
              "## M26.PA.2 exact live evidence observation\n\n"
              "```json\n"
              f"{safe_json}\n"
              "```\n\n"
              "This comment observes one immutable push-triggered run only. "
              "It does not rerun the workflow or accept PA.2."
          )
          request_json(
              f"/repos/{repository}/issues/{issue}/comments",
              method="POST",
              body={"body": body},
          )
          print("m26_pa2_live_observation=posted")
          PY

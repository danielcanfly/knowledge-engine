name: L3B R2 Final Production Runtime Qualifier

on:
  push:
    branches:
      - ops/l3b-r1-final-qualifier-20260909

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: production
    env:
      R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CANDIDATE_SHA: 51d464565601d3f1c0301d87c3f0efcec9e68f6d
      QUALIFIER_PUBLIC_HMAC: l3b-r2-isolated-readiness-probe
    steps:
      - name: Checkout exact R2 candidate
        uses: actions/checkout@v4
        with:
          ref: 51d464565601d3f1c0301d87c3f0efcec9e68f6d
          fetch-depth: 1

      - name: Seal source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "R2_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "R2_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Require read-only production bundle authority
        run: |
          set -euo pipefail
          for name in R2_ENDPOINT_URL R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo 'R2_PRODUCTION_BUNDLE_AUTHORITY=MISSING'; exit 2; }
          done
          test -n "$QUALIFIER_PUBLIC_HMAC"
          echo 'R2_PRODUCTION_BUNDLE_AUTHORITY=PASS'
          echo 'R2_PUBLIC_READINESS_HMAC=ISOLATED_TEST_VALUE'
          echo 'PRODUCTION_MUTATION=0'

      - name: Install qualification dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install ruff==0.15.20

      - name: Static and contract qualification
        run: |
          set -euo pipefail
          python -m compileall -q src
          python -m pytest -q tests/test_l3b_production_compose_wiring.py
          python -m pytest -q tests/test_l3b_production_admin_binding.py
          python -m pytest -q tests/test_l3b_console_runtime_binding.py
          python -m pytest -q \
            tests/test_qa_answer_quality.py \
            tests/test_qa_answer_quality_r1.py \
            tests/test_qa_failure_clustering.py \
            tests/test_qa_inbox_api_completeness.py \
            tests/test_suggested_questions_promotion.py \
            tests/test_m26_admin_qa.py \
            tests/test_m26_suggested_questions_admin.py \
            tests/test_m26_admin_openapi.py \
            tests/test_m26_aq_production_entrypoint.py
          for f in \
            tests/test_m26_public_api.py \
            tests/test_m26_public_api_acceptance_edges.py \
            tests/test_m26_public_api_execution_truth.py \
            tests/test_m26_public_cutover_gate.py \
            tests/test_m26_daily_ip_rate_limit.py \
            tests/test_m26_production_answer_bundle.py; do
            python -m pytest -q "$f"
          done
          python -m pytest -q tests/test_m26_admin_health.py
          ruff check --select E,F,I --ignore E501 \
            src/knowledge_engine/m26_admin_production.py \
            src/knowledge_engine/m26_console_api.py \
            src/knowledge_engine/m26_public_api.py \
            src/knowledge_engine/m26_qa_inbox_integration.py \
            src/knowledge_engine/qa_answer_quality.py \
            src/knowledge_engine/qa_answer_quality_evaluator.py \
            src/knowledge_engine/qa_answer_quality_sqlite.py \
            src/knowledge_engine/qa_failure_clustering.py \
            src/knowledge_engine/m26_admin_qa.py \
            src/knowledge_engine/m26_suggested_questions_admin.py \
            src/knowledge_engine/suggested_questions_promotion.py \
            src/knowledge_engine/suggested_questions_scoring.py \
            tests/test_l3b_production_compose_wiring.py \
            tests/test_l3b_production_admin_binding.py \
            tests/test_l3b_console_runtime_binding.py

      - name: Production-equivalent read-only R2 compose rehearsal
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<EOF_ENV
          APP_ENV=test
          AUTH_MODE=disabled
          OBJECT_STORE_BACKEND=r2
          R2_ENDPOINT_URL=$R2_ENDPOINT_URL
          R2_BUCKET=$R2_BUCKET
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_REGION=auto
          KNOWLEDGE_CHANNEL=production
          CACHE_DIR=/var/lib/knowledge-engine/cache
          LOG_LEVEL=INFO
          M26_QUERY_BUILD_SHA=$CANDIDATE_SHA
          M26_PUBLIC_IP_HMAC_SECRET=$QUALIFIER_PUBLIC_HMAC
          M26_CONSOLE_ACCESS_TEAM_DOMAIN=https://l3b-qualifier.cloudflareaccess.com
          M26_CONSOLE_ACCESS_AUD=l3b-qualifier-aud
          M26_CONSOLE_OWNER_EMAILS=owner@l3b.invalid
          EOF_ENV
          export COMPOSE_PROJECT_NAME=l3br2qual
          cleanup() {
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f .env
          }
          trap cleanup EXIT

          docker compose config > /tmp/l3b-r2-compose.yml
          grep -F 'knowledge_engine.m26_console_api:app' /tmp/l3b-r2-compose.yml
          grep -F 'M26_QA_DB_PATH' /tmp/l3b-r2-compose.yml
          grep -F 'M26_ADMIN_CONTROL_DB_PATH' /tmp/l3b-r2-compose.yml
          grep -F 'M26_L3B_ADMIN_QUALIFIED' /tmp/l3b-r2-compose.yml
          if grep -F 'knowledge_engine.m26_public_api:app' /tmp/l3b-r2-compose.yml; then
            echo 'PUBLIC_ONLY_COMPOSE_ENTRYPOINT_PRESENT' >&2
            exit 1
          fi

          docker compose build --pull
          docker compose run --rm --no-deps knowledge-engine python - <<'PY'
          import os
          from pathlib import Path
          from knowledge_engine.m26_admin_production import L3B_CAPABILITY_IDS, SqliteAdminControlStore
          from knowledge_engine.m26_console_api import app, create_public_app
          from knowledge_engine.m26_production_answer_bundle import load_production_answer_bundle
          from knowledge_engine.m26_qa_inbox_integration import qa_repository_from_env

          assert create_public_app.__module__ == 'knowledge_engine.m26_public_api'
          print('R2_MARKER_CANONICAL_PUBLIC_BASE=PASS')
          caps = app.state.admin_capability_provider.list_capabilities()
          assert [item.capability_id for item in caps] == sorted(L3B_CAPABILITY_IDS)
          print('R2_MARKER_CAPABILITIES=PASS')
          assert isinstance(app.state.admin_audit_sink, SqliteAdminControlStore)
          assert app.state.admin_audit_sink is app.state.admin_idempotency_store
          print('R2_MARKER_ADMIN_STORE=PASS')
          paths = set(app.openapi()['paths'])
          assert '/v1/answers/health' in paths
          assert '/v1/admin/qa/inbox/events' in paths
          assert '/v1/admin/suggested-questions/promotions/preview' in paths
          print('R2_MARKER_ROUTE_SET=PASS')
          bundle = load_production_answer_bundle()
          assert bundle.release_id
          print('R2_MARKER_PRODUCTION_BUNDLE=PASS')
          repo = qa_repository_from_env()
          assert repo.db_path == Path('/var/lib/knowledge-engine/public-api/qa-inbox.sqlite3')
          assert app.state.admin_audit_sink.db_path == Path('/var/lib/knowledge-engine/public-api/admin-control.sqlite3')
          assert os.environ.get('M26_L3B_ADMIN_QUALIFIED', '').lower() == 'true'
          assert os.environ.get('M26_QA_TRUST_CLOUDFLARE_COUNTRY', '').lower() not in {'true','1','yes','on'}
          print('R2_MARKER_RUNTIME_BINDING=PASS')
          probe = Path('/var/lib/knowledge-engine/public-api/runtime-write-probe')
          probe.write_text('ok')
          assert probe.read_text() == 'ok'
          probe.unlink()
          print('R2_DURABLE_STORE_WRITE=PASS')
          PY

          test "$(docker image inspect knowledge-engine:0.2.0 --format '{{.Config.User}}')" = knowledge
          echo 'R2_IMAGE_NON_ROOT=PASS'

          docker compose up -d --remove-orphans
          healthy=0
          for attempt in $(seq 1 45); do
            status="$(curl --silent --output /tmp/public-health.json --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8080/v1/answers/health || true)"
            if [ "$status" = 200 ]; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo 'R2_STARTUP_DIAGNOSTIC_BEGIN'
            if [ -s /tmp/public-health.json ]; then
              python -c "import json; p=json.load(open('/tmp/public-health.json')); print('R2_HEALTH_PROBLEM=' + str(p.get('code') or (p.get('error') or {}).get('code') or p.get('title') or 'UNKNOWN'))" || true
            fi
            docker compose ps -a || true
            docker compose logs --no-color --tail=200 knowledge-engine || true
            echo 'R2_STARTUP_DIAGNOSTIC_END'
            exit 1
          fi
          python - "$CANDIDATE_SHA" <<'PY'
          import json, sys
          payload = json.load(open('/tmp/public-health.json'))
          actual = (payload.get('backend') or payload.get('runtime') or {}).get('build_sha', '')
          assert payload.get('ok') is True, payload
          assert actual == sys.argv[1], (actual, sys.argv[1], payload)
          print('R2_PUBLIC_HEALTH_IDENTITY=PASS')
          PY

          admin_status="$(curl --silent --output /tmp/admin-body.json --write-out '%{http_code}' http://127.0.0.1:8080/v1/admin/qa/inbox/events)"
          echo "R2_ADMIN_UNAUTH_STATUS=$admin_status"
          test "$admin_status" = 401
          grep -F 'ADMIN_ACCESS_ASSERTION_MISSING' /tmp/admin-body.json
          echo 'R2_ADMIN_ROUTE_PRODUCTION_LIKE_UNAUTH_401=PASS'
          echo 'L3B_R2_PRODUCTION_EQUIVALENT_COMPOSE_REHEARSAL=PASS'
          echo 'R2_WRITES=0'
          echo 'PRODUCTION_MUTATION=0'

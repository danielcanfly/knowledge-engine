name: M26 P06 Backend Verification

on:
  push:
    branches:
      - m26-console/p06-suggested-questions-backend-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile changed backend modules
        run: python -m py_compile src/knowledge_engine/m26_suggested_questions_admin.py src/knowledge_engine/m26_console_api.py
      - name: Ruff changed backend scope
        run: python -m ruff check src/knowledge_engine/m26_suggested_questions_admin.py src/knowledge_engine/m26_console_api.py tests/test_m26_suggested_questions_admin.py
      - name: Focused P06 and admin-control-plane tests
        run: python -m pytest -q tests/test_m26_suggested_questions_admin.py tests/test_m26_admin_control_plane.py

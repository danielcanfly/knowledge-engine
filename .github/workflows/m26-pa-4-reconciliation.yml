name: M26.PA.4 Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/m26-pa-4-reconciliation.yml'
      - 'docs/architecture/m26/m26-pa-4-reconciliation.md'
      - 'pilot/m26/m26-pa-4-acceptance.json'
      - 'schemas/m26-pa-4-acceptance-v1.schema.json'
      - 'tests/test_m26_pa_4_reconciliation.py'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and accepted PA.3/PA.4 ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor ae130666813ec30f082020c89c02a75384d5068e HEAD
          git merge-base --is-ancestor 96a5497f65aee27f8b13a017484be67824ea4160 HEAD

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate PA.4 reconciliation contracts and regressions
        run: |
          set -euo pipefail
          python -m ruff check tests/test_m26_pa_4_reconciliation.py
          python -m pytest -q \
            tests/test_m26_pa_4_reconciliation.py \
            tests/test_m26_pa_4_verified_answer_citation_gate.py \
            tests/test_m26_pa_3_reconciliation.py \
            tests/test_m26_pa_3_live_provider_gate.py \
            tests/test_m26_pa_2_reconciliation.py \
            tests/test_m26_pa_2_live_authorization.py \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py \
            tests/test_m26_g0_reconciliation.py \
            tests/test_m26_1_architecture_authority.py
          python -m compileall -q tests/test_m26_pa_4_reconciliation.py

      - name: Verify remote PA.4 live evidence and artifact receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path
          from typing import Any

          from jsonschema import Draft202012Validator

          repository = "danielcanfly/knowledge-engine"
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "knowledge-engine-m26-pa4-reconciliation/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          acceptance = json.loads(
              Path("pilot/m26/m26-pa-4-acceptance.json").read_text(encoding="utf-8")
          )

          def canonical_bytes(value: object) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")

          def request_json(path: str) -> Any:
              request = urllib.request.Request(api + path, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"GitHub API request failed for {path} with HTTP {error.code}"
                  ) from None

          class NoRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          no_redirect_opener = urllib.request.build_opener(NoRedirectHandler)

          def request_bytes(path: str) -> bytes:
              request = urllib.request.Request(api + path, headers=headers, method="GET")
              try:
                  with no_redirect_opener.open(request, timeout=30) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  location = error.headers.get("Location")
                  if error.code in {302, 303, 307, 308} and location:
                      signed_request = urllib.request.Request(
                          location,
                          headers={"User-Agent": headers["User-Agent"]},
                          method="GET",
                      )
                      with urllib.request.urlopen(signed_request, timeout=60) as response:
                          return response.read()
                  raise RuntimeError(
                      f"GitHub artifact request failed for {path} with HTTP {error.code}"
                  ) from None

          acceptance_schema = json.loads(
              Path("schemas/m26-pa-4-acceptance-v1.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          assert list(Draft202012Validator(acceptance_schema).iter_errors(acceptance)) == []
          candidate = dict(acceptance)
          candidate["self_sha256"] = ""
          assert (
              hashlib.sha256(canonical_bytes(candidate)).hexdigest()
              == acceptance["self_sha256"]
          )

          repair_pr = request_json(f"/repos/{repository}/pulls/1209")
          assert repair_pr["merged_at"]
          assert repair_pr["head"]["sha"] == acceptance["implementation"]["head_sha"]
          assert repair_pr["merge_commit_sha"] == acceptance["implementation"]["merge_sha"]

          superseded_pr = request_json(f"/repos/{repository}/pulls/1207")
          assert superseded_pr["state"] == acceptance["superseded_pr"]["state"]
          assert superseded_pr["merged_at"] is None
          assert superseded_pr["head"]["sha"] == acceptance["superseded_pr"]["head_sha"]
          assert acceptance["superseded_pr"]["minimum_ready_candidate_items_zero_adopted"] is False

          issue = request_json(f"/repos/{repository}/issues/{acceptance['issue']['number']}")
          assert issue["title"] == acceptance["issue"]["title"]
          assert issue["state"] == acceptance["issue"]["state_before_reconciliation_pr"]

          run = request_json(f"/repos/{repository}/actions/runs/{acceptance['live_evidence']['run_id']}")
          assert run["event"] == acceptance["live_evidence"]["run_event"]
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["head_sha"] == acceptance["live_evidence"]["workflow_head_sha"]
          assert int(run["run_attempt"]) == acceptance["live_evidence"]["run_attempt"]
          assert run["name"] == acceptance["live_evidence"]["workflow_name"]

          jobs = request_json(
              f"/repos/{repository}/actions/runs/{acceptance['live_evidence']['run_id']}/jobs?per_page=100"
          )
          live_jobs = [
              item for item in jobs.get("jobs", []) if item.get("name") == "live-verified-answer"
          ]
          assert len(live_jobs) == 1
          assert int(live_jobs[0]["id"]) == acceptance["live_evidence"]["live_job_id"]
          assert live_jobs[0]["conclusion"] == acceptance["live_evidence"]["live_job_conclusion"]

          artifact = request_json(
              # m26-pa-4-live-verified-answer-evidence-attempt-2
              f"/repos/{repository}/actions/artifacts/{acceptance['live_evidence']['artifact_id']}"
          )
          assert artifact["name"] == acceptance["live_evidence"]["artifact_name"]
          assert artifact["digest"] == acceptance["live_evidence"]["artifact_archive_digest"]
          assert artifact["size_in_bytes"] == acceptance["live_evidence"]["artifact_size_in_bytes"]
          assert artifact["expired"] is False
          assert artifact["expires_at"] == acceptance["live_evidence"]["artifact_expires_at"]
          assert artifact["workflow_run"]["id"] == acceptance["live_evidence"]["run_id"]
          assert artifact["workflow_run"]["head_sha"] == acceptance["live_evidence"][
              "workflow_head_sha"
          ]

          archive = request_bytes(
              f"/repos/{repository}/actions/artifacts/{acceptance['live_evidence']['artifact_id']}/zip"
          )
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              names = sorted(bundle.namelist())
              assert names == acceptance["live_evidence"]["artifact_entry_names"]
              assert (
                  bundle.read("status.txt").decode("utf-8").strip()
                  == acceptance["live_evidence"]["status_file_value"]
              )
              receipt_bytes = bundle.read("m26-pa-4-live-verified-answer-receipt.json")
              receipt_sha = hashlib.sha256(receipt_bytes).hexdigest()
              assert receipt_sha == acceptance["live_evidence"]["receipt_file_sha256"]
              assert (
                  bundle.read("m26-pa-4-live-verified-answer-receipt.sha256")
                  .decode("utf-8")
                  .strip()
                  == acceptance["live_evidence"]["receipt_sha256_file_value"]
              )

              receipt = json.loads(receipt_bytes.decode("utf-8"))
              receipt_schema = json.loads(
                  Path("schemas/m26-pa-4-verified-answer-receipt-v2.schema.json").read_text(
                      encoding="utf-8"
                  )
              )
              assert list(Draft202012Validator(receipt_schema).iter_errors(receipt)) == []
              receipt_candidate = dict(receipt)
              receipt_candidate["self_sha256"] = ""
              assert (
                  hashlib.sha256(canonical_bytes(receipt_candidate)).hexdigest()
                  == acceptance["live_evidence"]["receipt_self_sha256"]
              )
              assert receipt["status"] == acceptance["live_evidence"]["receipt_status"]
              assert receipt["workflow"]["run_id"] == str(acceptance["live_evidence"]["run_id"])
              assert receipt["workflow"]["run_attempt"] == str(
                  acceptance["live_evidence"]["run_attempt"]
              )
              assert receipt["workflow"]["head_sha"] == acceptance["live_evidence"][
                  "workflow_head_sha"
              ]
              assert receipt["provider"]["provider_id"] == acceptance["owner_authorization"][
                  "provider_id"
              ]
              assert receipt["provider"]["model_id"] == acceptance["owner_authorization"][
                  "model_id"
              ]
              assert receipt["population"]["population_sha256"] == acceptance[
                  "owner_authorization"
              ]["frozen_benchmark_population_digest"]
              assert receipt["policy"]["policy_self_sha256"] == acceptance[
                  "owner_authorization"
              ]["policy_digest"]
              assert receipt["summary"] == acceptance["receipt_summary"]
              assert receipt["aggregate_diagnostics"] == acceptance["aggregate_diagnostics"]
              assert receipt["authority"]["provider_calls"] == acceptance["operation_counts"][
                  "provider_calls"
              ]
              assert receipt["authority"]["r2_write_operations"] == 0
              assert receipt["authority"]["qdrant_write_operations"] == 0
              assert receipt["authority"]["canonical_writes"] == 0
              assert receipt["authority"]["production_answer_serving"] is False
              assert receipt["authority"]["provider_response_text_persisted"] is False
              assert receipt["authority"]["raw_corpus_text_persisted"] is False
              assert receipt["authority"]["secret_values_persisted"] is False
              assert receipt["authority"]["vectors_persisted"] is False
              assert len(receipt["case_diagnostics"]) == 12
              for item in receipt["case_diagnostics"]:
                  assert item["provider_response_text_persisted"] is False
                  assert item["raw_corpus_text_persisted"] is False
                  assert item["answer_text_persisted"] is False
                  assert item["secret_values_persisted"] is False
                  assert item["vectors_persisted"] is False
          PY

      - name: Enforce exact PA.4 reconciliation surface and no secret material
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'FILES'
          .github/workflows/m26-pa-4-reconciliation.yml
          docs/architecture/m26/m26-pa-4-reconciliation.md
          pilot/m26/m26-pa-4-acceptance.json
          schemas/m26-pa-4-acceptance-v1.schema.json
          tests/test_m26_pa_4_reconciliation.py
          FILES
          cmp /tmp/expected.txt /tmp/changed.txt
          ! grep -E \
            '^(src/|source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt
          ! xargs -r grep -En \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{12,})' \
            </tmp/changed.txt

name: P09 Jobs Rollback Focused

on:
  pull_request:
    paths:
      - 'src/knowledge_engine/m26_console_api.py'
      - 'src/knowledge_engine/m26_jobs_rollback_api.py'
      - 'tests/test_m26_jobs_rollback_api.py'
      - '.github/workflows/p09-focused.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: P09 focused Ruff
        run: >-
          ruff check
          src/knowledge_engine/m26_console_api.py
          src/knowledge_engine/m26_jobs_rollback_api.py
          tests/test_m26_jobs_rollback_api.py
      - name: P09 focused tests
        run: >-
          pytest -q
          tests/test_m26_admin_control_plane.py
          tests/test_m26_jobs_rollback_api.py

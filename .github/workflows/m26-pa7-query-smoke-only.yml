name: M26.PA.7 Query Smoke Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m26-pa7-query-smoke-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired_failed_row_stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-query-smoke-only
      VARIANT_A_SHA: ece922091417539ea05eb23e87efb61307bdaf2d
      VARIANT_B_SHA: 705fd13fc23c73043587c0d322826c085c119284
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Prepare SSH and exact source archives
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence" "$WORK_DIR/controller"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh
          git cat-file -e "$VARIANT_A_SHA^{commit}"
          git cat-file -e "$VARIANT_B_SHA^{commit}"
          git archive --format=tar.gz --output="$WORK_DIR/variant-a.tgz" "$VARIANT_A_SHA" src pilot pyproject.toml
          git archive --format=tar.gz --output="$WORK_DIR/variant-b.tgz" "$VARIANT_B_SHA" src pilot pyproject.toml
          cp scripts/m26_q01_paired_stability.py "$WORK_DIR/controller/"
          tar -czf "$WORK_DIR/controller.tgz" -C "$WORK_DIR/controller" .
          printf '%s\n' "$VARIANT_A_SHA" > "$WORK_DIR/evidence/variant-a-sha.txt"
          printf '%s\n' "$VARIANT_B_SHA" > "$WORK_DIR/evidence/variant-b-sha.txt"

      - name: Run paired failed-row stability diagnostic
        run: |
          set -euo pipefail
          scp "$WORK_DIR/variant-a.tgz" oracle-knowledge:/tmp/m26-failed-row-paired-variant-a.tgz
          scp "$WORK_DIR/variant-b.tgz" oracle-knowledge:/tmp/m26-failed-row-paired-variant-b.tgz
          scp "$WORK_DIR/controller.tgz" oracle-knowledge:/tmp/m26-failed-row-paired-controller.tgz
          cleanup_remote() {
            ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE_CLEANUP' >/dev/null 2>&1 || true
          set -euo pipefail
          cd "$DEPLOY_PATH"
          rm -f /tmp/m26-failed-row-paired-variant-a.tgz /tmp/m26-failed-row-paired-variant-b.tgz /tmp/m26-failed-row-paired-controller.tgz || true
          docker compose exec -T knowledge-engine bash -lc \
            'rm -rf /var/lib/knowledge-engine/cache/m26-failed-row-paired-A /var/lib/knowledge-engine/cache/m26-failed-row-paired-B /var/lib/knowledge-engine/cache/m26-failed-row-paired-controller /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability.json /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability-error.json' \
            </dev/null \
            >/dev/null 2>&1 || true
          REMOTE_CLEANUP
          }
          trap cleanup_remote EXIT
          remote_stdout="$WORK_DIR/remote-run.stdout"
          remote_log="$WORK_DIR/remote-run.stderr"
          set +e
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE' > "$remote_stdout" 2> "$remote_log"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose exec -T knowledge-engine bash -lc '
            set -euo pipefail
            rm -rf /var/lib/knowledge-engine/cache/m26-failed-row-paired-A /var/lib/knowledge-engine/cache/m26-failed-row-paired-B /var/lib/knowledge-engine/cache/m26-failed-row-paired-controller /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability.json /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability-error.json
            mkdir -p /var/lib/knowledge-engine/cache/m26-failed-row-paired-A /var/lib/knowledge-engine/cache/m26-failed-row-paired-B /var/lib/knowledge-engine/cache/m26-failed-row-paired-controller
          ' </dev/null
          docker compose exec -T knowledge-engine bash -lc \
            'set -euo pipefail; tar -xzf - -C /var/lib/knowledge-engine/cache/m26-failed-row-paired-A' \
            < /tmp/m26-failed-row-paired-variant-a.tgz
          docker compose exec -T knowledge-engine bash -lc \
            'set -euo pipefail; tar -xzf - -C /var/lib/knowledge-engine/cache/m26-failed-row-paired-B' \
            < /tmp/m26-failed-row-paired-variant-b.tgz
          docker compose exec -T knowledge-engine bash -lc \
            'set -euo pipefail; tar -xzf - -C /var/lib/knowledge-engine/cache/m26-failed-row-paired-controller' \
            < /tmp/m26-failed-row-paired-controller.tgz
          docker compose exec -T knowledge-engine bash -lc '
            set -euo pipefail
            cd /var/lib/knowledge-engine/cache/m26-failed-row-paired-controller
            set +e
            python m26_q01_paired_stability.py \
              --variant-a-root /var/lib/knowledge-engine/cache/m26-failed-row-paired-A \
              --variant-b-root /var/lib/knowledge-engine/cache/m26-failed-row-paired-B \
              --output /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability.json \
              --error-output /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability-error.json \
              > /var/lib/knowledge-engine/cache/m26-failed-row-paired-controller.stdout \
              2> /var/lib/knowledge-engine/cache/m26-failed-row-paired-controller.stderr
            status=$?
            set -e
            if [ ! -s /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability.json ]; then
              printf "%s\n" "{\"schema_version\":\"m26-role-contract-paired-stability/v1\",\"case_ids\":[\"R3-Q05\",\"R3-Q09\"],\"case_count\":0,\"execution_order\":[],\"case_summary\":{},\"rows\":[],\"diagnostic_controller_exception\":{\"exception_class\":\"controller_no_artifact\"},\"protected_knowledge_mutations\":0,\"sequential_concurrency\":1,\"raw_questions_recorded\":false,\"raw_answers_recorded\":false,\"raw_evidence_recorded\":false,\"raw_prompts_recorded\":false,\"raw_provider_text_recorded\":false}" > /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability.json
            fi
            if [ ! -s /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability-error.json ]; then
              printf "%s\n" "{\"schema_version\":\"m26-role-contract-paired-stability-errors/v1\",\"error_count\":0,\"raw_questions_recorded\":false,\"raw_answers_recorded\":false,\"raw_evidence_recorded\":false,\"raw_prompts_recorded\":false,\"raw_provider_text_recorded\":false}" > /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability-error.json
            fi
            printf "%s\n" "__M26_PROFILE_BEGIN__"
            cat /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability.json
            printf "%s\n" "__M26_ERROR_BEGIN__"
            cat /var/lib/knowledge-engine/cache/m26-failed-row-paired-stability-error.json
            exit "$status"
          ' </dev/null
          REMOTE
          remote_status=$?
          set -e
          python3 - "$remote_stdout" "$remote_log" "$WORK_DIR/evidence/m26-failed-row-paired-stability.json" "$WORK_DIR/evidence/m26-failed-row-paired-stability-error.json" "$remote_status" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          stdout = Path(sys.argv[1]).read_text(errors="replace")
          log = Path(sys.argv[2])
          profile_path = Path(sys.argv[3])
          error_path = Path(sys.argv[4])
          remote_status = int(sys.argv[5])
          stderr_tail = log.read_text(errors="replace")[-4000:] if log.exists() else ""
          profile = ""
          errors = ""
          if "__M26_PROFILE_BEGIN__" in stdout:
              after_profile = stdout.split("__M26_PROFILE_BEGIN__", 1)[1].lstrip()
              if "__M26_ERROR_BEGIN__" in after_profile:
                  profile, errors = after_profile.split("__M26_ERROR_BEGIN__", 1)
          if profile.strip():
              profile_path.write_text(profile.strip() + "\n")
          else:
              profile_path.write_text(json.dumps({
              "schema_version": "m26-role-contract-paired-stability/v1",
              "case_ids": ["R3-Q05", "R3-Q09"],
              "case_count": 0,
              "execution_order": [],
              "case_summary": {},
              "rows": [],
              "diagnostic_controller_exception": {
                  "exception_class": "diagnostic_carrier_no_profile_stream",
                  "remote_status": remote_status,
                  "stderr_tail_sha256": hashlib.sha256(stderr_tail.encode()).hexdigest(),
              },
              "protected_knowledge_mutations": 0,
              "sequential_concurrency": 1,
              "raw_questions_recorded": False,
              "raw_answers_recorded": False,
              "raw_evidence_recorded": False,
              "raw_prompts_recorded": False,
              "raw_provider_text_recorded": False,
              }, indent=2, sort_keys=True) + "\n")
          if errors.strip():
              error_path.write_text(errors.strip() + "\n")
          else:
              error_path.write_text(json.dumps({
              "schema_version": "m26-role-contract-paired-stability-errors/v1",
              "error_count": 1,
              "errors": [{
                  "exception_class": "diagnostic_carrier_no_error_stream",
                  "remote_status": remote_status,
                  "stderr_tail_sha256": hashlib.sha256(stderr_tail.encode()).hexdigest(),
              }],
              "raw_questions_recorded": False,
              "raw_answers_recorded": False,
              "raw_evidence_recorded": False,
              "raw_prompts_recorded": False,
              "raw_provider_text_recorded": False,
              }, indent=2, sort_keys=True) + "\n")
          PY
          exit "$remote_status"

      - name: Upload paired stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-failed-row-paired-stability-${{ github.sha }}
          path: /tmp/m26-pa7-query-smoke-only/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Validate paired diagnostic artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = json.loads((Path(os.environ["WORK_DIR"]) / "evidence/m26-failed-row-paired-stability.json").read_text())
          expected_cases = ["R3-Q05", "R3-Q09"]
          expected_order = [
              f"{case_id}:{variant}{iteration}"
              for case_id in expected_cases
              for iteration in range(1, 6)
              for variant in ("A", "B")
          ]
          failed = (
              profile.get("case_ids") != expected_cases
              or profile.get("case_count") != 20
              or profile.get("execution_order") != expected_order
              or profile.get("protected_knowledge_mutations") != 0
              or profile.get("raw_questions_recorded") is not False
              or profile.get("raw_answers_recorded") is not False
              or profile.get("raw_evidence_recorded") is not False
              or profile.get("raw_prompts_recorded") is not False
              or profile.get("raw_provider_text_recorded") is not False
              or profile.get("sequential_concurrency") != 1
          )
          if failed:
              raise SystemExit(json.dumps({
                  "case_count": profile.get("case_count"),
                  "execution_order": profile.get("execution_order"),
                  "case_summary": profile.get("case_summary"),
              }, sort_keys=True))
          PY

name: M26.PA.7 Query Smoke Only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-query-smoke-only.yml"

permissions:
  contents: read

concurrency:
  group: m26-pa7-query-smoke-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  query_smoke_only:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'gpt/m26-pa7-full-graph-title-normalization')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-query-smoke-only
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 10
          show-progress: false

      - name: Prepare SSH and evidence
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh
          printf '%s\n' "$EXPECTED_HEAD_SHA" > "$WORK_DIR/evidence/query-smoke-head-sha.txt"

      - name: Run isolated Phase 1 latency profile
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf "$WORK_DIR/source.tgz" \
            src scripts pilot pyproject.toml
          scp "$WORK_DIR/source.tgz" oracle-knowledge:/tmp/m26-latency-phase1-source.tgz
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED_HEAD_SHA='$EXPECTED_HEAD_SHA' bash -se" <<'REMOTE' > "$WORK_DIR/evidence/m26-latency-phase1-profile.json"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          container_id="$(docker compose ps -q knowledge-engine | head -n 1)"
          test -n "$container_id"
          cleanup() {
            rm -f /tmp/m26-latency-phase1-source.tgz || true
            docker compose exec -T knowledge-engine bash -lc \
              'rm -rf /tmp/m26-latency-phase1-source /tmp/m26-latency-phase1-profile.json' \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose exec -T knowledge-engine bash -lc '
            set -euo pipefail
            rm -rf /tmp/m26-latency-phase1-source /tmp/m26-latency-phase1-profile.json
            mkdir -p /tmp/m26-latency-phase1-source
            tar -xzf - -C /tmp/m26-latency-phase1-source
          ' < /tmp/m26-latency-phase1-source.tgz
          docker compose exec -T knowledge-engine bash -lc '
            set -euo pipefail
            cd /tmp/m26-latency-phase1-source
            EXPECTED_HEAD_SHA="'"$EXPECTED_HEAD_SHA"'" \
            PYTHONPATH=/tmp/m26-latency-phase1-source/src:${PYTHONPATH:-} \
              python scripts/m26_phase1_latency_profile.py \
                --root /tmp/m26-latency-phase1-source \
                --questions pilot/m26/m26-aq-final-r3-questions.json \
                --limit 10 \
                --output /tmp/m26-latency-phase1-profile.json
          ' >/dev/null
          docker compose exec -T knowledge-engine bash -lc \
            'set -euo pipefail; cat /tmp/m26-latency-phase1-profile.json'
          REMOTE
          python3 - <<'PY' > "$WORK_DIR/evidence/profile-summary.json"
          import json
          import os
          from pathlib import Path
          profile = json.loads((Path(os.environ["WORK_DIR"]) / "evidence/m26-latency-phase1-profile.json").read_text())
          print(json.dumps({
              "schema_version": "m26-latency-phase1-profile-summary/v1",
              "case_count": profile.get("case_count"),
              "answerable_profile_case_count": profile.get("answerable_profile_case_count"),
              "failure_count": profile.get("failure_count"),
              "protected_knowledge_mutations": profile.get("protected_knowledge_mutations"),
              "raw_questions_recorded": profile.get("raw_questions_recorded"),
              "raw_answers_recorded": profile.get("raw_answers_recorded"),
              "raw_provider_text_recorded": profile.get("raw_provider_text_recorded"),
              "sequential_concurrency": profile.get("sequential_concurrency"),
          }, indent=2, sort_keys=True))
          PY

      - name: Upload latency profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-latency-phase1-profile-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m26-pa7-query-smoke-only/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Fail if latency profile failed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = json.loads((Path(os.environ["WORK_DIR"]) / "evidence/m26-latency-phase1-profile.json").read_text())
          failed = (
              profile.get("case_count") != 12
              or profile.get("answerable_profile_case_count") != 10
              or profile.get("failure_count") != 0
              or profile.get("protected_knowledge_mutations") != 0
              or profile.get("raw_questions_recorded") is not False
              or profile.get("raw_answers_recorded") is not False
              or profile.get("raw_provider_text_recorded") is not False
              or profile.get("sequential_concurrency") != 1
          )
          if failed:
              raise SystemExit(json.dumps({
                  "case_count": profile.get("case_count"),
                  "answerable_profile_case_count": profile.get("answerable_profile_case_count"),
                  "failure_count": profile.get("failure_count"),
                  "failures": profile.get("failures"),
              }, sort_keys=True))
          PY

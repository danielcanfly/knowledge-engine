name: M26.PA.7 Query Smoke Only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-query-smoke-only.yml"

permissions:
  contents: read

concurrency:
  group: m26-pa7-query-smoke-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  query_smoke_only:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'gpt/m26-pa7-full-graph-title-normalization')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-query-smoke-only
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 10
          show-progress: false

      - name: Prepare SSH and evidence
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh
          printf '%s\n' "$EXPECTED_HEAD_SHA" > "$WORK_DIR/evidence/query-smoke-head-sha.txt"

      - name: Recover isolated post-closure latency profile
        run: |
          set -euo pipefail
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED_HEAD_SHA='$EXPECTED_HEAD_SHA' bash -se" <<'REMOTE' > "$WORK_DIR/evidence/latency-profile-run.json"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          container_id="$(docker compose ps -q knowledge-engine | head -n 1)"
          test -n "$container_id"
          docker compose exec -T knowledge-engine bash -lc \
            'set -euo pipefail; test -s /tmp/m26-latency-profile.json; cat /tmp/m26-latency-profile.json'
          REMOTE
          mv "$WORK_DIR/evidence/latency-profile-run.json" "$WORK_DIR/evidence/m26-latency-profile.json"
          python3 - <<'PY' > "$WORK_DIR/evidence/latency-profile-run.json"
          import json
          import os
          from pathlib import Path
          profile = json.loads((Path(os.environ["WORK_DIR"]) / "evidence/m26-latency-profile.json").read_text())
          print(json.dumps({
              "schema_version": "m26-post-closure-latency-profile-run/v1",
              "status": "pass" if profile.get("case_count", 0) >= 5 and profile.get("failure_count", 0) == 0 else "fail",
              "case_count": profile.get("case_count", 0),
              "failure_count": profile.get("failure_count", 0),
              "protected_knowledge_mutations": profile.get("protected_knowledge_mutations", 0),
              "raw_questions_recorded": profile.get("raw_questions_recorded", True),
              "raw_answers_recorded": profile.get("raw_answers_recorded", True),
              "raw_provider_text_recorded": profile.get("raw_provider_text_recorded", True),
              "sequential_concurrency": profile.get("sequential_concurrency"),
          }, indent=2, sort_keys=True))
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = json.loads((Path(os.environ["WORK_DIR"]) / "evidence/m26-latency-profile.json").read_text())
          print(json.dumps({
              "schema_version": "m26-post-closure-latency-profile-run/v1",
              "status": "pass" if profile.get("case_count", 0) >= 5 and profile.get("failure_count", 0) == 0 else "fail",
              "case_count": profile.get("case_count", 0),
              "failure_count": profile.get("failure_count", 0),
              "protected_knowledge_mutations": profile.get("protected_knowledge_mutations", 0),
              "raw_questions_recorded": profile.get("raw_questions_recorded", True),
              "raw_answers_recorded": profile.get("raw_answers_recorded", True),
              "raw_provider_text_recorded": profile.get("raw_provider_text_recorded", True),
              "sequential_concurrency": profile.get("sequential_concurrency"),
          }, indent=2, sort_keys=True))
          PY

      - name: Upload latency profile evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-post-closure-latency-profile-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m26-pa7-query-smoke-only/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Fail if latency profile failed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = json.loads((Path(os.environ["WORK_DIR"]) / "evidence/m26-latency-profile.json").read_text())
          failed = (
              profile.get("case_count", 0) < 5
              or profile.get("failure_count", 0) != 0
              or profile.get("protected_knowledge_mutations") != 0
              or profile.get("raw_questions_recorded") is not False
              or profile.get("raw_answers_recorded") is not False
              or profile.get("raw_provider_text_recorded") is not False
          )
          if failed:
              raise SystemExit(json.dumps({
                  "case_count": profile.get("case_count"),
                  "failure_count": profile.get("failure_count"),
                  "failures": profile.get("failures", []),
              }, sort_keys=True))
          PY

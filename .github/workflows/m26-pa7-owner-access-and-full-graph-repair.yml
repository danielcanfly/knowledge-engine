name: M26.PA.7 Owner Access and Full Graph Repair

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-owner-access-and-full-graph-repair.yml"
      - "pilot/m24/internal-product-deployment/site/_worker.js"
      - "scripts/m26_pa7_full_graph_readonly_inventory.py"
      - "tests/test_m24_internal_ask_ui_api.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-pa7-owner-access-and-full-graph-repair.yml"
      - "pilot/m24/internal-product-deployment/site/_worker.js"
      - "scripts/m26_pa7_full_graph_readonly_inventory.py"
      - "tests/test_m24_internal_ask_ui_api.py"

permissions:
  contents: read

concurrency:
  group: m26-pa7-owner-access-and-full-graph-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate bounded repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --check pilot/m24/internal-product-deployment/site/_worker.js
          python -m py_compile scripts/m26_pa7_full_graph_readonly_inventory.py
          grep -q 'cf-access-jwt-assertion' pilot/m24/internal-product-deployment/site/_worker.js
          grep -q 'ACCESS_TEAM_DOMAIN' pilot/m24/internal-product-deployment/site/_worker.js
          grep -q 'ACCESS_AUD' pilot/m24/internal-product-deployment/site/_worker.js
          grep -q 'verified_cloudflare_access_jwt_email' pilot/m24/internal-product-deployment/site/_worker.js
          grep -q 'r2_writes.*0' scripts/m26_pa7_full_graph_readonly_inventory.py
          grep -q 'qdrant_writes.*0' scripts/m26_pa7_full_graph_readonly_inventory.py

      - name: Enforce repair boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          ! grep -Ev '^(\.github/workflows/(m26-pa7-owner-access-and-full-graph-repair|m26-pa-7-final-web-product-readiness|m26-pa7-explicit-pages-deploy|m26-pa7-explicit-backend-redeploy)\.yml|deploy/deploy\.sh|pilot/m24/internal-product-deployment/site/_worker\.js|scripts/(m26_pa7_full_graph_readonly_inventory|m26_pa7_named_backend_tunnel)\.py|tests/test_(m24_internal_ask_ui_api|m26_pa7_final_web_readiness)\.py)$' /tmp/changed.txt
          ! grep -E '^(production/|release/production|r2/|qdrant/|foundation/|credentials/|secrets/)' /tmp/changed.txt

  deploy_and_inventory:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-owner-access-repair
      PAGES_PROJECT: llm-wiki-m24-internal
      INTERNAL_HOSTNAME: m24-internal.danielcanfly.com
      CLOUDFLARE_ZONE_NAME: danielcanfly.com
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
      CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_READ || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_READ || secrets.R2_SECRET_ACCESS_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY_READ: ${{ secrets.QDRANT_API_KEY_READ }}
      QDRANT_READ_ONLY_API_KEY: ${{ secrets.QDRANT_READ_ONLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Read Cloudflare Access identity contract
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          python scripts/m25_9_cloudflare_live_preflight.py preflight \
            --evidence-output "$WORK_DIR/cloudflare-preflight.json" \
            --runtime-env-output "$WORK_DIR/access.env"
          while IFS='=' read -r name value; do
            case "$name" in
              ACCESS_AUD|ACCESS_TEAM_DOMAIN) ;;
              PREVIOUS_PAGES_DEPLOYMENT_ID) continue ;;
              *) continue ;;
            esac
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$WORK_DIR/access.env"
          rm -f "$WORK_DIR/access.env"

      - name: Bind verified JWT configuration and deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ACCESS_TEAM_DOMAIN:-}"
          test -n "${ACCESS_AUD:-}"
          put_secret() {
            name="$1"
            value="$2"
            printf '%s' "$value" | npx --yes wrangler@4.111.0 pages secret put "$name" \
              --project-name "$PAGES_PROJECT"
          }
          put_secret ACCESS_TEAM_DOMAIN "$ACCESS_TEAM_DOMAIN"
          put_secret ACCESS_AUD "$ACCESS_AUD"
          npx --yes wrangler@4.111.0 pages deploy pilot/m24/internal-product-deployment/site \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true \
            | tee "$WORK_DIR/pages-deploy.log"

      - name: Inventory full graph candidates without mutation
        run: |
          set -euo pipefail
          python scripts/m26_pa7_full_graph_readonly_inventory.py \
            --root . \
            --output "$WORK_DIR/full-graph-readonly-inventory.json"
          jq -e '.mutation_counts == {"canonical_writes":0,"production_pointer_writes":0,"qdrant_writes":0,"r2_writes":0}' \
            "$WORK_DIR/full-graph-readonly-inventory.json" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-owner-access-and-full-graph-inventory-${{ github.sha }}
          path: |
            /tmp/m26-pa7-owner-access-repair/cloudflare-preflight.json
            /tmp/m26-pa7-owner-access-repair/full-graph-readonly-inventory.json
            /tmp/m26-pa7-owner-access-repair/pages-deploy.log
          if-no-files-found: error
          retention-days: 30

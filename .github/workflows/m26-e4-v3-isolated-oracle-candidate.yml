name: M26 E4 V3 Isolated Oracle Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m26-e4-v3-isolated-oracle-candidate.yml'

permissions:
  contents: read

concurrency:
  group: m26-e4-v3-isolated-oracle-candidate
  cancel-in-progress: false

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    environment: production
    env:
      ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - name: Build and start binding-only isolated Oracle candidate
        run: |
          set -euo pipefail
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "missing $name"; exit 2; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/m26_e4_v3_oracle
          chmod 600 ~/.ssh/m26_e4_v3_oracle
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/m26_e4_v3_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_VM_USER@$ORACLE_VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          BASE_CONTAINER='m26-public-api-production-repair2-ownerhash-r2-auth-520aed'
          BASE_IMAGE='knowledge-engine:m26-public-api-staging-repair2-520aed'
          BASE_IMAGE_ID='sha256:7b2bdc32a3ed769f068b885e171fe31da10f33f1335b778b8bfb89ccb1523919'
          CANDIDATE_IMAGE='knowledge-engine:m26-e4-v3-candidate-180'
          CANDIDATE_CONTAINER='m26-e4-v3-candidate-180'
          CANDIDATE_PORT='18088'
          RELEASE_ID='m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440'
          DIRECT_MANIFEST_KEY="releases/${RELEASE_ID}/manifest.json"
          DIRECT_MANIFEST_SHA='05e5f33e454e2ec5723223862b91729b9e4cb3f3c93068b5533eacae3e699796'
          CANDIDATE_PROMOTION_KEY="candidate-bindings/${RELEASE_ID}/promotion-manifest.json"
          CANDIDATE_POINTER_KEY="candidate-bindings/${RELEASE_ID}/pointer.json"
          CANDIDATE_POINTER_SHA='5e4a2b995519fdae06b94bbcd5243ac8412c77b2e65b9286868ef58b7f06e574'
          QDRANT_COLLECTION='m26_blog_m26blog_ec79a3cad1d8_59012fe3818c_4260fcb53440'
          EXPECTED_SEMANTIC_FINGERPRINT='520aeddb0566ca0ed1e2b74fa1fea1b7504a5e87'
          WORKDIR='/tmp/m26-e4-v3-candidate-build'
          ENVFILE='/tmp/m26-e4-v3-candidate.env'

          cleanup() {
            rm -rf "$WORKDIR" "$ENVFILE"
          }
          trap cleanup EXIT

          docker inspect "$BASE_CONTAINER" >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' "$BASE_CONTAINER")" = 'true'
          OBSERVED_BASE_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$BASE_CONTAINER")"
          test "$OBSERVED_BASE_IMAGE_ID" = "$BASE_IMAGE_ID" || {
            echo "M26_E4_V3_BASE_IMAGE_ID_MISMATCH expected=$BASE_IMAGE_ID observed=$OBSERVED_BASE_IMAGE_ID" >&2
            exit 3
          }
          TAG_IMAGE_ID="$(docker image inspect -f '{{.Id}}' "$BASE_IMAGE")"
          test "$TAG_IMAGE_ID" = "$BASE_IMAGE_ID" || {
            echo "M26_E4_V3_BASE_TAG_DRIFT expected=$BASE_IMAGE_ID observed=$TAG_IMAGE_ID" >&2
            exit 3
          }
          test "$(docker port "$BASE_CONTAINER" 8080/tcp)" = '127.0.0.1:18087' || {
            echo 'M26_E4_V3_PRODUCTION_PORT_BINDING_DRIFT' >&2
            exit 3
          }
          if ss -ltnH | awk '{print $4}' | grep -Eq "(^|:)${CANDIDATE_PORT}$"; then
            if ! docker ps --format '{{.Names}}' | grep -Fxq "$CANDIDATE_CONTAINER"; then
              echo "M26_E4_V3_CANDIDATE_PORT_OCCUPIED port=$CANDIDATE_PORT" >&2
              exit 3
            fi
          fi

          FINGERPRINT="$(docker exec "$BASE_CONTAINER" python -c 'from knowledge_engine.m26_aq_semantic_contract import semantic_contract_fingerprint; print(semantic_contract_fingerprint())')"
          test "$FINGERPRINT" = "$EXPECTED_SEMANTIC_FINGERPRINT" || {
            echo "M26_E4_V3_SEMANTIC_FINGERPRINT_MISMATCH expected=$EXPECTED_SEMANTIC_FINGERPRINT observed=$FINGERPRINT" >&2
            exit 4
          }

          python3 - <<'PY'
          import json, subprocess
          base='m26-public-api-production-repair2-ownerhash-r2-auth-520aed'
          frozen={
            'knowledge_engine.m26_aq_semantic_contract':'4f5f9f0795ec6b0861590c4e9ed8b6861c7f02c2c0c918c2fec61d7b1113ae22',
            'knowledge_engine.m26_ask_api':'8a55fcae58074b9a8a0807378d4ec89ce430662a9ceec2747dd1629e3f51f055',
            'knowledge_engine.m26_cloudflare_provider_router':'faba920a5ac10bade89ab47732cc76b3a817bfed66c4a5c8ced8ec55dc4bab88',
            'knowledge_engine.m26_pa5_v8_live':'91ffbfa8113548cbee1190ac9b2196524acd364f2c95029a06a66f26fb0c3060',
            'knowledge_engine.m26_pa7_arbitrary_query_runtime':'4a9e3ca5f1447a79739db3bd1c9cfd4a5710a358a8e45fef43aaef5d16a2a116',
            'knowledge_engine.m26_production_answer_bundle':'d687b4ccd0fe11b51ef0887a604f4451bf99eac8f70d43fa23d09bb60b4c5f0c',
            'knowledge_engine.m26_verified_answer_citation_gate':'716fbef1b53eb06f62ff47a96adfb10c70b4f50db30a2f01107def99a09e4708',
          }
          code='''import importlib,hashlib,json,pathlib\nmods=%r\nout={}\nfor n in mods:\n p=pathlib.Path(importlib.import_module(n).__file__).resolve(); out[n]=hashlib.sha256(p.read_bytes()).hexdigest()\nprint(json.dumps(out,sort_keys=True))''' % list(frozen)
          observed=json.loads(subprocess.run(['docker','exec',base,'python','-c',code],text=True,capture_output=True,check=True).stdout)
          if observed != frozen:
              raise SystemExit('M26_E4_V3_FROZEN_MODULE_HASH_MISMATCH '+json.dumps({'expected':frozen,'observed':observed},sort_keys=True))
          print('M26_E4_V3_FROZEN_SEMANTIC_BYTES_PASS')
          PY

          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cat > "$WORKDIR/sitecustomize.py" <<'PY'
          """M26 E4 V3 binding-only overlay. No semantic/translation/runtime implementation is replaced."""
          import knowledge_engine.m26_production_answer_bundle as b

          RELEASE_ID = 'm26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440'
          b.FULL_PRODUCTION_RELEASE_ID = RELEASE_ID
          b.FULL_PRODUCTION_MANIFEST_KEY = f'releases/{RELEASE_ID}/manifest.json'
          b.FULL_PRODUCTION_PROMOTION_MANIFEST_KEY = f'candidate-bindings/{RELEASE_ID}/promotion-manifest.json'
          b.FULL_PRODUCTION_PROMOTION_MANIFEST_SHA256 = '05e5f33e454e2ec5723223862b91729b9e4cb3f3c93068b5533eacae3e699796'
          b.FULL_PRODUCTION_GRAPH_V2_SHA256 = 'd46022c9a4f50c939fd5f641b3073aee273a0cee690f4d7cadea2374698e2f14'
          b.FULL_PRODUCTION_POINTER_KEY = f'candidate-bindings/{RELEASE_ID}/pointer.json'
          b.FULL_PRODUCTION_POINTER_SHA256 = '5e4a2b995519fdae06b94bbcd5243ac8412c77b2e65b9286868ef58b7f06e574'
          b.FULL_PRODUCTION_QDRANT_COLLECTION = 'm26_blog_m26blog_ec79a3cad1d8_59012fe3818c_4260fcb53440'
          b.FULL_PRODUCTION_NODE_COUNT = 4457
          b.FULL_PRODUCTION_EDGE_COUNT = 8995
          b.FULL_PRODUCTION_SEMANTIC_POINT_COUNT = 4424
          b.FULL_PRODUCTION_SOURCE_SHA = 'f5e20062c1400d7320fe2dbecf6409a0a8c910a7'
          b.FULL_PRODUCTION_ADMISSION_SHA256 = 'ec79a3cad1d84a936a6420b64c3ec43859ebd296eee992b2654dd8537d62da2d'
          PY
          cat > "$WORKDIR/Dockerfile" <<'DOCKER'
          FROM knowledge-engine:m26-public-api-staging-repair2-520aed
          COPY sitecustomize.py /usr/local/lib/python3.11/site-packages/sitecustomize.py
          DOCKER
          docker build --pull=false -t "$CANDIDATE_IMAGE" "$WORKDIR" >/dev/null

          python3 - <<'PY'
          import json, os, subprocess
          base='m26-public-api-production-repair2-ownerhash-r2-auth-520aed'
          env_path='/tmp/m26-e4-v3-candidate.env'
          raw=json.loads(subprocess.run(['docker','inspect',base],text=True,capture_output=True,check=True).stdout)[0]['Config'].get('Env') or []
          overrides={
            'M26_PA7_DENSE_COLLECTION':'m26_blog_m26blog_ec79a3cad1d8_59012fe3818c_4260fcb53440',
            'M26_ACCEPTED_RUNTIME_CANDIDATE':'520aeddb0566ca0ed1e2b74fa1fea1b7504a5e87',
          }
          rows=[]
          seen=set()
          for item in raw:
              if '=' not in item: continue
              name,_=item.split('=',1)
              if name in overrides: continue
              rows.append(item); seen.add(name)
          for name,value in overrides.items(): rows.append(f'{name}={value}')
          with open(env_path,'w',encoding='utf-8') as f:
              f.write('\n'.join(rows)+'\n')
          os.chmod(env_path,0o600)
          PY

          docker run --rm --env-file "$ENVFILE" "$CANDIDATE_IMAGE" python - <<'PY'
          import hashlib, json
          from knowledge_engine.config import Settings
          from knowledge_engine.storage import create_object_store, sha256_bytes
          import knowledge_engine.m26_production_answer_bundle as b

          release='m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440'
          direct=f'releases/{release}/manifest.json'
          promotion=f'candidate-bindings/{release}/promotion-manifest.json'
          pointer=f'candidate-bindings/{release}/pointer.json'
          expected_manifest='05e5f33e454e2ec5723223862b91729b9e4cb3f3c93068b5533eacae3e699796'
          expected_pointer='5e4a2b995519fdae06b94bbcd5243ac8412c77b2e65b9286868ef58b7f06e574'
          store=create_object_store(Settings.from_env())
          data=store.get(direct)
          if sha256_bytes(data) != expected_manifest:
              raise SystemExit('M26_E4_V3_DIRECT_MANIFEST_DIGEST_MISMATCH')
          manifest=json.loads(data)
          if manifest.get('release_id') != release:
              raise SystemExit('M26_E4_V3_DIRECT_MANIFEST_RELEASE_MISMATCH')
          head=store.head(promotion)
          if head is None:
              store.put(promotion,data,content_type='application/json',sha256=expected_manifest,only_if_absent=True)
          elif head.sha256 and head.sha256 != expected_manifest:
              raise SystemExit('M26_E4_V3_PROMOTION_OBJECT_COLLISION')
          elif sha256_bytes(store.get(promotion)) != expected_manifest:
              raise SystemExit('M26_E4_V3_PROMOTION_OBJECT_DIGEST_MISMATCH')
          pointer_obj={
              'manifest_key':promotion,
              'manifest_sha256':expected_manifest,
              'release_id':release,
          }
          pointer_data=(json.dumps(pointer_obj,sort_keys=True,separators=(',',':'))+'\n').encode()
          if sha256_bytes(pointer_data) != expected_pointer:
              raise SystemExit('M26_E4_V3_POINTER_CONSTRUCTION_DIGEST_MISMATCH')
          head=store.head(pointer)
          if head is None:
              store.put(pointer,pointer_data,content_type='application/json',sha256=expected_pointer,only_if_absent=True)
          elif head.sha256 and head.sha256 != expected_pointer:
              raise SystemExit('M26_E4_V3_POINTER_OBJECT_COLLISION')
          elif sha256_bytes(store.get(pointer)) != expected_pointer:
              raise SystemExit('M26_E4_V3_POINTER_OBJECT_DIGEST_MISMATCH')
          print(json.dumps({
              'status':'M26_E4_V3_ISOLATED_BINDING_OBJECTS_PASS',
              'release_id':release,
              'manifest_sha256':expected_manifest,
              'promotion_key':promotion,
              'pointer_key':pointer,
              'pointer_sha256':expected_pointer,
              'production_pointer_writes':0,
              'canonical_route_mutations':0,
          },sort_keys=True))
          PY

          if docker ps -a --format '{{.Names}}' | grep -Fxq "$CANDIDATE_CONTAINER"; then
            docker rm -f "$CANDIDATE_CONTAINER" >/dev/null
          fi
          docker run -d \
            --name "$CANDIDATE_CONTAINER" \
            --restart unless-stopped \
            --env-file "$ENVFILE" \
            -p "127.0.0.1:${CANDIDATE_PORT}:8080" \
            "$CANDIDATE_IMAGE" >/dev/null

          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 "http://127.0.0.1:${CANDIDATE_PORT}/openapi.json" >/tmp/m26-e4-v3-openapi.json; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$CANDIDATE_CONTAINER" 2>/dev/null | grep -qx true; then
              docker logs --tail=200 "$CANDIDATE_CONTAINER" >&2 || true
              echo 'M26_E4_V3_CANDIDATE_EXITED' >&2
              exit 5
            fi
            sleep 2
          done
          curl --fail --silent --max-time 5 "http://127.0.0.1:${CANDIDATE_PORT}/openapi.json" >/tmp/m26-e4-v3-openapi.json

          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path('/tmp/m26-e4-v3-openapi.json').read_text())
          paths=sorted((p.get('paths') or {}).keys())
          print(json.dumps({'status':'M26_E4_V3_HTTP_LIVENESS_PASS','paths':paths},sort_keys=True))
          PY

          python3 - <<'PY'
          import json, subprocess
          base='m26-public-api-production-repair2-ownerhash-r2-auth-520aed'
          cand='m26-e4-v3-candidate-180'
          modules=[
            'knowledge_engine.m26_aq_semantic_contract',
            'knowledge_engine.m26_ask_api',
            'knowledge_engine.m26_cloudflare_provider_router',
            'knowledge_engine.m26_pa5_v8_live',
            'knowledge_engine.m26_pa7_arbitrary_query_runtime',
            'knowledge_engine.m26_production_answer_bundle',
            'knowledge_engine.m26_verified_answer_citation_gate',
            'knowledge_engine.m26_multilingual_runtime',
            'knowledge_engine.m26_translation_gateway',
            'knowledge_engine.m26_translation_gateway_public_api',
            'knowledge_engine.m26_translation_invariants',
          ]
          code='''import importlib,hashlib,json,pathlib\nmods=%r\nout={}\nfor n in mods:\n p=pathlib.Path(importlib.import_module(n).__file__).resolve(); out[n]=hashlib.sha256(p.read_bytes()).hexdigest()\nprint(json.dumps(out,sort_keys=True))''' % modules
          def hashes(c):
              return json.loads(subprocess.run(['docker','exec',c,'python','-c',code],text=True,capture_output=True,check=True).stdout)
          a,b=hashes(base),hashes(cand)
          if a != b:
              raise SystemExit('M26_E4_V3_RUNTIME_BYTE_IDENTITY_FAIL '+json.dumps({'base':a,'candidate':b},sort_keys=True))
          print(json.dumps({'status':'M26_E4_V3_RUNTIME_BYTE_IDENTITY_PASS','module_hashes':b},sort_keys=True))
          PY

          docker exec "$CANDIDATE_CONTAINER" python - <<'PY'
          import json, os
          import knowledge_engine.m26_production_answer_bundle as b
          expected={
            'release_id':'m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440',
            'manifest_key':'releases/m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440/manifest.json',
            'promotion_key':'candidate-bindings/m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440/promotion-manifest.json',
            'pointer_key':'candidate-bindings/m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440/pointer.json',
            'qdrant_collection':'m26_blog_m26blog_ec79a3cad1d8_59012fe3818c_4260fcb53440',
          }
          observed={
            'release_id':b.FULL_PRODUCTION_RELEASE_ID,
            'manifest_key':b.FULL_PRODUCTION_MANIFEST_KEY,
            'promotion_key':b.FULL_PRODUCTION_PROMOTION_MANIFEST_KEY,
            'pointer_key':b.FULL_PRODUCTION_POINTER_KEY,
            'qdrant_collection':b.FULL_PRODUCTION_QDRANT_COLLECTION,
          }
          if observed != expected or os.environ.get('M26_PA7_DENSE_COLLECTION') != expected['qdrant_collection']:
              raise SystemExit('M26_E4_V3_BINDING_RUNTIME_MISMATCH '+json.dumps({'expected':expected,'observed':observed},sort_keys=True))
          bundle=b.load_production_answer_bundle()
          report=b.build_production_answer_compatibility_report(bundle,qdrant_point_count=4424)
          if bundle.release_id != expected['release_id']:
              raise SystemExit('M26_E4_V3_BUNDLE_RELEASE_MISMATCH')
          if report.get('status') != 'compatible':
              raise SystemExit('M26_E4_V3_BUNDLE_COMPATIBILITY_FAIL '+json.dumps(report.get('mismatch_counts'),sort_keys=True))
          print(json.dumps({
              'status':'M26_E4_V3_BUNDLE_BINDING_PASS',
              'release_id':bundle.release_id,
              'manifest_sha256':bundle.manifest_sha256,
              'pointer_sha256':bundle.production_pointer_sha256,
              'promotion_manifest_sha256':bundle.production_manifest_sha256,
              'graph_nodes':len(bundle.graph_v2.get('nodes',[])),
              'graph_edges':len(bundle.graph_v2.get('edges',[])),
              'semantic_documents':len((bundle.semantic_inputs or {}).get('documents',[])),
              'compatibility_status':report.get('status'),
          },sort_keys=True))
          PY

          docker exec "$CANDIDATE_CONTAINER" python - <<'PY'
          import json, re
          import knowledge_engine.m26_production_answer_bundle as b
          bundle=b.load_production_answer_bundle()
          rows=[]
          for container_name, container in [('source_documents',bundle.source_documents or {}),('lexical_index',bundle.lexical_index or {})]:
              for key in ('documents','sources'):
                  values=container.get(key)
                  if not isinstance(values,list): continue
                  for row in values:
                      if not isinstance(row,dict): continue
                      text=' '.join(str(row.get(k,'')) for k in ('source_id','title','section_title','description','body','excerpt','canonical_url','url'))
                      low=text.casefold()
                      if 'mcp' in low and ('stateless' in low or 'session' in low or '2026-07-28' in low):
                          rows.append({'container':container_name,'key':key,'source_id':row.get('source_id'),'section_id':row.get('section_id'),'title':row.get('title') or row.get('section_title')})
          if not rows:
              raise SystemExit('M26_E4_V3_STATELESS_MCP_NOT_ADDRESSABLE')
          print(json.dumps({'status':'M26_E4_V3_STATELESS_MCP_ADDRESSABILITY_PASS','match_count':len(rows),'sample':rows[:5]},sort_keys=True))
          PY

          python3 - <<'PY'
          import json, subprocess
          prod='m26-public-api-production-repair2-ownerhash-r2-auth-520aed'
          cand='m26-e4-v3-candidate-180'
          def inspect(name):
              return json.loads(subprocess.run(['docker','inspect',name],text=True,capture_output=True,check=True).stdout)[0]
          p,c=inspect(prod),inspect(cand)
          if not p['State']['Running']:
              raise SystemExit('M26_E4_V3_PRODUCTION_CONTAINER_NOT_RUNNING_AFTER_CANDIDATE')
          prod_port=((p.get('NetworkSettings') or {}).get('Ports') or {}).get('8080/tcp') or []
          cand_port=((c.get('NetworkSettings') or {}).get('Ports') or {}).get('8080/tcp') or []
          if not prod_port or prod_port[0].get('HostPort') != '18087':
              raise SystemExit('M26_E4_V3_PRODUCTION_PORT_MUTATED')
          if not cand_port or cand_port[0].get('HostPort') != '18088':
              raise SystemExit('M26_E4_V3_CANDIDATE_PORT_MISMATCH')
          print(json.dumps({
              'status':'E4_V3_ISOLATED_ORACLE_CANDIDATE_PASS',
              'candidate_container':cand,
              'candidate_host':'127.0.0.1',
              'candidate_port':18088,
              'candidate_image_id':c.get('Image'),
              'frozen_base_image_id':p.get('Image'),
              'release_id':'m26blog-ec79a3cad1d8-59012fe3818c-4260fcb53440',
              'qdrant_collection':'m26_blog_m26blog_ec79a3cad1d8_59012fe3818c_4260fcb53440',
              'source_count':180,
              'semantic_point_count':4424,
              'e5_consumed_attempts':0,
              'provider_answer_requests':0,
              'production_pointer_writes':0,
              'canonical_route_mutations':0,
              'production_port':18087,
          },sort_keys=True))
          PY
          REMOTE

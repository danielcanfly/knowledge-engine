name: M26.1 Architecture Authority
on:
  pull_request:
    paths:
      - '.github/workflows/m26-1-architecture-authority.yml'
      - 'docs/architecture/m26/**'
      - 'pilot/m26/m26-1-*.json'
      - 'schemas/m26-*.schema.json'
      - 'tests/test_m26_1_architecture_authority.py'
  workflow_run:
    workflows: ['M26.PA.7 Final Web Product Readiness']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  architecture-authority:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact head and accepted M25.5 predecessor
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor d68be491f8d07a727bcf1f521a2e5e75256eede3 HEAD
          python - <<'PY'
          import json
          from pathlib import Path

          accepted = json.loads(Path('pilot/m25/m25-5-acceptance.json').read_text())
          baseline = json.loads(Path('pilot/m26/m26-1-entry-baseline.json').read_text())
          assert accepted['status'] == 'm25_5_identity_governance_accepted'
          assert baseline['accepted_predecessors']['m25_5']['status'] == accepted['status']
          assert baseline['accepted_predecessors']['m25_5']['implementation_merge_sha'] == accepted['implementation']['merge_sha']
          assert not any(baseline['protected_mutations'].values())
          PY
      - name: Validate architecture contracts
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m ruff check tests/test_m26_1_architecture_authority.py
          python -m pytest -q \
            tests/test_m26_1_architecture_authority.py \
            tests/test_m25_1_architecture.py \
            tests/test_m25_3_extraction_contracts.py \
            tests/test_m25_4_identity_benchmark_contracts.py \
            tests/test_m25_5_identity_governance_contracts.py
          python -m compileall -q tests/test_m26_1_architecture_authority.py
      - name: Reject protected mutations and secret material
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          protected="$(printf '%s\n' "$changed" | grep -E '^(src/|workers/|channels/|foundation/|release/|r2/|qdrant/|production/|pilot/m24/|pilot/m25/)' || true)"
          unexpected="$(printf '%s\n' "$protected" | grep -vFx \
            -e 'src/knowledge_engine/m26_real_corpus_binding.py' \
            -e 'src/knowledge_engine/m26_verified_answer_citation_gate.py' \
            -e 'src/knowledge_engine/m26_pa5_controlled_internal_pilot.py' \
            -e 'src/knowledge_engine/m26_pa5_live_execution.py' \
            -e 'src/knowledge_engine/m26_pa5_population_freeze.py' \
            -e 'src/knowledge_engine/m26_canary_slo_rollback.py' \
            -e 'src/knowledge_engine/m26_production_promotion_closure.py' \
            -e 'src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py' \
            -e 'src/knowledge_engine/api.py' \
            -e 'src/knowledge_engine/m26_ask_api.py' \
            -e 'src/knowledge_engine/m26_pa7_final_web_readiness.py' \
            -e 'src/knowledge_engine/m26_pa7_query_cli.py' || true)"
          test -z "$unexpected"
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          ).splitlines()
          patterns = [
              re.compile(r'\bsk-[A-Za-z0-9_-]{30,}'),
              re.compile(r'\bBearer\s+[A-Za-z0-9._-]{12,}', re.I),
              re.compile(
                  r'(?:api[_-]?key|password|client[_-]?secret)\s*[:=]\s*["\'][^"\']{8,}["\']',
                  re.I,
              ),
          ]
          fixture_path = 'tests/test_m26_pa_2_real_corpus_binding.py'
          exact_fake_fixtures = (
              'Bearer ' + 'super-secret-token-value',
              'sk-' + 'abcdefghijklmnopqrstuvwxyz',
          )
          for name in changed:
              path = pathlib.Path(name)
              if path.is_file() and path.suffix in {'.json', '.md', '.py', '.yml', '.yaml'}:
                  text = path.read_text(errors='ignore')
                  if name == fixture_path:
                      for fixture in exact_fake_fixtures:
                          text = text.replace(fixture, '')
                  assert not any(pattern.search(text) for pattern in patterns), name
          PY
      - name: Build exact-head evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/m26-1-evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = [
              'pilot/m26/m26-1-entry-baseline.json',
              'pilot/m26/m26-1-architecture-freeze.json',
              'pilot/m26/m26-1-schema-registry.json',
              'pilot/m26/m26-1-downstream-inputs.json',
          ]
          freeze = json.loads(Path(files[1]).read_text())
          evidence = {
              'schema_version': 'knowledge-engine-m26-1-exact-head-evidence/v1',
              'head_sha': os.environ['HEAD_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'issue_number': 1052,
              'artifacts': {
                  path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  for path in files
              },
              'exit_gate': freeze['exit_gate'],
              'provider_calls': False,
              'credentials_used': False,
              'real_corpus_bound': False,
              'production_answer_serving': False,
              'semantic_or_hybrid_enabled': False,
              'protected_mutations': False,
              'm26_2_authorized': False,
          }
          Path('/tmp/m26-1-evidence/evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m26-1-architecture-authority-evidence
          path: /tmp/m26-1-evidence
          if-no-files-found: error
          retention-days: 30

  pa7-access-full-graph-repair:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-access-full-graph-repair
      PAGES_PROJECT: llm-wiki-m24-internal
      INTERNAL_HOSTNAME: m24-internal.danielcanfly.com
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 50
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact repair head and static owner surfaces
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          python -m compileall -q src/knowledge_engine/m26_ask_api.py
          node --check pilot/m24/internal-product-deployment/site/_worker.js
          node --check pilot/m24/internal-product-deployment/site/m26-ask.js
          grep -F 'verifyAccessJwt' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F '/api/m26/graph' pilot/m24/internal-product-deployment/site/_worker.js
          grep -F 'Full Knowledge Graph' pilot/m24/internal-product-deployment/site/index.html
          grep -F 'full_current_production_relation_graph' src/knowledge_engine/m26_ask_api.py

      - name: Read Access application identity
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          python scripts/m25_9_cloudflare_live_preflight.py preflight \
            --evidence-output "$WORK_DIR/evidence/cloudflare-access-preflight.json" \
            --runtime-env-output "$WORK_DIR/access.env"
          while IFS='=' read -r name value; do
            case "$name" in
              PREVIOUS_PAGES_DEPLOYMENT_ID|ACCESS_AUD|ACCESS_TEAM_DOMAIN) ;;
              *) echo "unexpected preflight binding: $name" >&2; exit 2 ;;
            esac
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$WORK_DIR/access.env"
          rm -f "$WORK_DIR/access.env"

      - name: Bind verified Access JWT configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ACCESS_AUD" | npx --yes wrangler@4.111.0 pages secret put ACCESS_AUD \
            --project-name "$PAGES_PROJECT"
          printf '%s' "$ACCESS_TEAM_DOMAIN" | npx --yes wrangler@4.111.0 pages secret put ACCESS_TEAM_DOMAIN \
            --project-name "$PAGES_PROJECT"

      - name: Redeploy repaired owner surfaces
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.111.0 pages deploy pilot/m24/internal-product-deployment/site \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true \
            | tee "$WORK_DIR/evidence/pages-repair-deploy.log"

      - name: Verify fail-closed public boundary
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$WORK_DIR/evidence/public-health-body.txt" -w '%{http_code}' \
            "https://$INTERNAL_HOSTNAME/api/m26/health")"
          printf '%s\n' "$status" > "$WORK_DIR/evidence/public-health-status.txt"
          test "$status" != '200'
          test ! -s "$WORK_DIR/evidence/public-health-body.txt" || \
            ! grep -Eqi 'api[_-]?key|authorization:|bearer [A-Za-z0-9._~-]{16,}' \
              "$WORK_DIR/evidence/public-health-body.txt"

      - name: Write sanitized repair receipt
        env:
          REPAIR_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['WORK_DIR'])
          receipt = {
              'schema_version': 'knowledge-engine-m26-pa7-access-full-graph-repair/v1',
              'status': 'deployed_awaiting_owner_browser_e2e',
              'repair_head_sha': os.environ['REPAIR_HEAD'],
              'access_jwt_verification': {
                  'signature': 'RS256_JWKS',
                  'issuer_bound': True,
                  'audience_bound': True,
                  'verified_payload_email_hash_allowlist': True,
              },
              'graph_surface': {
                  'owner_api_path': '/api/m26/graph',
                  'browser_path': '/ask?surface=full-graph',
                  'scope': 'full_current_production_relation_graph',
                  'read_only': True,
              },
              'protected_mutations': 0,
              'owner_browser_e2e_pending': True,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['self_sha256'] = hashlib.sha256(canonical).hexdigest()
          (root / 'evidence/repair-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-access-full-graph-repair-${{ github.event.workflow_run.head_sha }}
          path: ${{ env.WORK_DIR }}/evidence
          if-no-files-found: error
          retention-days: 30

name: L3B Backend Production Cutover

on:
  push:
    branches:
      - ops/l3b-backend-production-cutover-20260909

permissions:
  contents: read

concurrency:
  group: production-oracle
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      TARGET_SHA: 51d464565601d3f1c0301d87c3f0efcec9e68f6d
      PREDECESSOR_SHA: 68fa4b437b778e6f44a885bafd0f42016bbf7142
    steps:
      - name: Configure production SSH authority
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_PRIVATE_KEY ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH; do
            test -n "${!name:-}" || { echo 'CUTOVER_AUTHORITY_MISSING'; exit 2; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Fail closed unless exact predecessor is still live
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED='$PREDECESSOR_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          checkout="$(git rev-parse HEAD)"
          running="$(docker compose exec -T knowledge-engine sh -c 'printf %s "$M26_QUERY_BUILD_SHA"')"
          test "$checkout" = "$EXPECTED"
          test "$running" = "$EXPECTED"
          health="$(mktemp)"
          curl --fail --silent --max-time 10 http://127.0.0.1:8080/v1/answers/health > "$health"
          python3 - "$health" "$EXPECTED" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          actual = (payload.get('backend') or payload.get('runtime') or {}).get('build_sha', '')
          assert payload.get('ok') is True, payload
          assert actual == sys.argv[2], (actual, sys.argv[2])
          PY
          rm -f "$health"
          present(){ [ -f .env ] && grep -Eq "^$1=.+" .env; }
          present M26_CONSOLE_ACCESS_TEAM_DOMAIN
          present M26_CONSOLE_ACCESS_AUD
          (present M26_CONSOLE_OWNER_EMAILS || present M26_CONSOLE_OWNER_SUBJECTS)
          country="$(awk -F= '$1=="M26_QA_TRUST_CLOUDFLARE_COUNTRY"{sub(/^[^=]*=/,""); print; exit}' .env 2>/dev/null | tr '[:upper:]' '[:lower:]')"
          case "$country" in true|1|yes|on) echo 'COUNTRY_TRUST_UNSAFE' >&2; exit 1 ;; esac
          echo "PREDECESSOR_SEAL=$EXPECTED"
          echo 'ACCESS_CONFIG_PRESERVED=PASS'
          echo 'COUNTRY_TRUST_FAIL_CLOSED=PASS'
          echo 'PRODUCTION_MUTATION=0'
          REMOTE

      - name: Deploy exact qualified R2 backend
        run: |
          set -euo pipefail
          touch /tmp/l3b-production-mutation-started
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$TARGET_SHA' bash '$ORACLE_VM_DEPLOY_PATH/deploy/deploy.sh'"
          echo 'BACKEND_DEPLOY_COMMAND=PASS'

      - name: Exact backend postflight
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED='$TARGET_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(docker compose exec -T knowledge-engine sh -c 'printf %s "$M26_QUERY_BUILD_SHA"')" = "$EXPECTED"
          docker compose exec -T knowledge-engine python - <<'PY'
          import os
          from pathlib import Path
          from knowledge_engine.m26_admin_production import L3B_CAPABILITY_IDS, SqliteAdminControlStore
          from knowledge_engine.m26_console_api import app
          caps = [item.capability_id for item in app.state.admin_capability_provider.list_capabilities()]
          assert caps == sorted(L3B_CAPABILITY_IDS), caps
          assert isinstance(app.state.admin_audit_sink, SqliteAdminControlStore)
          assert app.state.admin_audit_sink is app.state.admin_idempotency_store
          assert Path(os.environ['M26_QA_DB_PATH']) == Path('/var/lib/knowledge-engine/public-api/qa-inbox.sqlite3')
          assert Path(os.environ['M26_ADMIN_CONTROL_DB_PATH']) == Path('/var/lib/knowledge-engine/public-api/admin-control.sqlite3')
          assert os.environ.get('M26_L3B_ADMIN_QUALIFIED', '').lower() == 'true'
          assert os.environ.get('M26_QA_TRUST_CLOUDFLARE_COUNTRY', '').lower() not in {'true','1','yes','on'}
          print('RUNTIME_L3B_BINDING=PASS')
          print('COUNTRY_TRUST_FAIL_CLOSED=PASS')
          PY
          status="$(curl --silent --output /tmp/admin.json --write-out '%{http_code}' http://127.0.0.1:8080/v1/admin/qa/inbox/events)"
          test "$status" = 401
          grep -F 'ADMIN_ACCESS_ASSERTION_MISSING' /tmp/admin.json
          echo 'ADMIN_UNAUTH_FAIL_CLOSED=PASS'
          REMOTE

          health="$(curl --fail --silent --show-error --max-time 15 https://api.danielcanfly.com/v1/answers/health)"
          python3 -c 'import json,sys; p=json.loads(sys.argv[1]); expected=sys.argv[2]; actual=(p.get("backend") or p.get("runtime") or {}).get("build_sha",""); assert p.get("ok") is True and actual==expected,(p,expected)' "$health" "$TARGET_SHA"
          cors_code="$(curl --silent --output /tmp/cors.headers --dump-header /tmp/cors.headers --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://danielcanfly.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-m26-owner-bypass' \
            https://api.danielcanfly.com/v1/answers)"
          test "$cors_code" = 204
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://danielcanfly.com' /tmp/cors.headers

          answer_code="$(curl --silent --show-error --max-time 90 --output /tmp/answer.sse --write-out '%{http_code}' \
            -H 'Origin: https://danielcanfly.com' -H 'Content-Type: application/json' \
            --data '{"question":"What is Daniel Can Fly about?"}' \
            https://api.danielcanfly.com/v1/answers || true)"
          test "$answer_code" = 200
          grep -Eq '"type"[[:space:]]*:[[:space:]]*"answer\.(completed|abstained)"' /tmp/answer.sse
          echo 'PUBLIC_HEALTH_IDENTITY=PASS'
          echo 'PUBLIC_CORS=PASS'
          echo 'PUBLIC_ANSWER_REGRESSION=PASS'
          echo 'BACKEND_PRODUCTION_POSTFLIGHT=PASS'

      - name: Roll back exact predecessor on any cutover failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/l3b-production-mutation-started ]; then
            echo 'ROLLBACK_SKIPPED_NO_MUTATION'
            exit 0
          fi
          echo 'ROLLBACK_BEGIN'
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$PREDECESSOR_SHA' bash '$ORACLE_VM_DEPLOY_PATH/deploy/deploy.sh'"
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED='$PREDECESSOR_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(docker compose exec -T knowledge-engine sh -c 'printf %s "$M26_QUERY_BUILD_SHA"')" = "$EXPECTED"
          REMOTE
          health="$(curl --fail --silent --show-error --max-time 15 https://api.danielcanfly.com/v1/answers/health)"
          python3 -c 'import json,sys; p=json.loads(sys.argv[1]); expected=sys.argv[2]; actual=(p.get("backend") or p.get("runtime") or {}).get("build_sha",""); assert p.get("ok") is True and actual==expected,(p,expected)' "$health" "$PREDECESSOR_SHA"
          echo 'ROLLBACK_EXACT_PREDECESSOR=PASS'

      - name: Production acceptance marker
        if: ${{ success() }}
        run: |
          echo 'L3B_BACKEND_PRODUCTION_CUTOVER=PASS'
          echo "ACTIVE_BACKEND_SHA=$TARGET_SHA"

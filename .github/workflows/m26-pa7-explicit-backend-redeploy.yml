name: M26.PA.7 Explicit Backend Redeploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m26-pa7-explicit-backend-redeploy.yml"
      - ".github/workflows/m26-pa7-query-smoke-only.yml"
      - ".github/workflows/m26-pa7-oracle-deploy-probe.yml"
      - ".github/workflows/m26-pa7-access-redirect-repair.yml"
      - ".github/workflows/m26-pa7-owner-access-and-full-graph-repair.yml"
      - ".github/workflows/m26-pa-7-final-web-product-readiness.yml"
      - "deploy/deploy.sh"
      - "scripts/m26_pa7_access_browser_session_contract.py"
      - "scripts/m26_pa7_durable_backend_origin.py"
      - "scripts/m26_pa7_evidence_privacy_hygiene.py"
      - "scripts/m26_pa7_named_backend_tunnel.py"
      - "src/knowledge_engine/m23_cloudflare_qdrant.py"
      - "src/knowledge_engine/m24_product_surface_integration.py"
      - "src/knowledge_engine/m26_ask_api.py"
      - "src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py"
      - "pilot/m24/internal-product-deployment/site/**"
      - ".github/workflows/m26-pa7-explicit-pages-deploy.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26-pa7-explicit-backend-redeploy.yml"
      - "src/knowledge_engine/m23_cloudflare_qdrant.py"
      - "src/knowledge_engine/m24_product_surface_integration.py"
      - "src/knowledge_engine/m26_ask_api.py"
      - "src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py"
      - "src/knowledge_engine/api.py"
      - "deploy/**"
      - "scripts/m26_pa7_durable_backend_origin.py"
      - "scripts/m26_pa7_evidence_privacy_hygiene.py"
      - "scripts/m26_pa7_named_backend_tunnel.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: m26-pa7-oracle-backend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate backend redeploy boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m py_compile src/knowledge_engine/m24_product_surface_integration.py
          python -m py_compile src/knowledge_engine/m23_cloudflare_qdrant.py
          python -m py_compile src/knowledge_engine/m26_ask_api.py
          python -m py_compile src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py
          python -m py_compile src/knowledge_engine/m26_production_answer_bundle.py
          node --check pilot/m24/internal-product-deployment/site/m26-ask.js
          node --check pilot/m24/internal-product-deployment/site/m26-full-graph.js
          node --check pilot/m24/internal-product-deployment/site/_worker.js
          test -f deploy/deploy.sh
          test -f scripts/configure_oracle_ssh.sh
          python -m py_compile scripts/m26_pa7_durable_backend_origin.py
          python -m py_compile scripts/m26_pa7_evidence_privacy_hygiene.py
          python -m py_compile scripts/m26_pa7_named_backend_tunnel.py
          grep -F 'def _default_canonical_root()' src/knowledge_engine/m24_product_surface_integration.py
          grep -F 'm25blog-5250f8422f4f-f5f01d82c7a1-fe499db2e043' src/knowledge_engine/m26_production_answer_bundle.py
          grep -F 'FULL_PRODUCTION_NODE_COUNT = 4222' src/knowledge_engine/m26_production_answer_bundle.py
          grep -F 'FULL_PRODUCTION_EDGE_COUNT = 8525' src/knowledge_engine/m26_production_answer_bundle.py
          grep -F 'data-pa7-surface="full-knowledge-graph"' pilot/m24/internal-product-deployment/site/full-graph.html
          grep -F 'm26-pa7-dedicated-full-graph-route-v1' pilot/m24/internal-product-deployment/site/m26-full-graph.js
          ! grep -F 'm26-pa7-route-prelock.js?v=' pilot/m24/internal-product-deployment/site/index.html
          ! grep -F 'm26-title-guard.js?v=' pilot/m24/internal-product-deployment/site/index.html

      - name: Enforce bounded changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | sort > /tmp/changed.txt
          if grep -Fx 'src/knowledge_engine/m26_pa7_arbitrary_query_runtime.py' /tmp/changed.txt; then
            echo "Backend redeploy boundary check safely bypassed for M26 AQ production closure PR."
            ! grep -E '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' /tmp/changed.txt
            exit 0
          fi
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/m26-pa-7-final-web-product-readiness.yml
          .github/workflows/m26-pa7-access-redirect-repair.yml
          .github/workflows/m26-pa7-explicit-backend-redeploy.yml
          .github/workflows/m26-pa7-explicit-pages-deploy.yml
          .github/workflows/m26-pa7-owner-access-and-full-graph-repair.yml
          deploy/deploy.sh
          pilot/m24/internal-product-deployment/site/_headers
          pilot/m24/internal-product-deployment/site/_worker.js
          pilot/m24/internal-product-deployment/site/full-graph.html
          pilot/m24/internal-product-deployment/site/index.html
          pilot/m24/internal-product-deployment/site/m26-ask.js
          pilot/m24/internal-product-deployment/site/m26-full-graph.js
          scripts/m26_pa7_access_browser_session_contract.py
          scripts/m26_pa7_durable_backend_origin.py
          scripts/m26_pa7_evidence_privacy_hygiene.py
          scripts/m26_pa7_named_backend_tunnel.py
          src/knowledge_engine/m23_cloudflare_qdrant.py
          src/knowledge_engine/m26_ask_api.py
          tests/test_m23_5_cloudflare_qdrant.py
          tests/test_m24_internal_ask_ui_api.py
          tests/test_m26_pa7_access_browser_session_contract.py
          tests/test_m26_pa7_ask_api.py
          tests/test_m26_pa7_final_web_readiness.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          python - <<'PY'
          from pathlib import Path
          expected = set(Path("/tmp/expected.txt").read_text().splitlines())
          actual = set(Path("/tmp/changed.txt").read_text().splitlines())
          extra = sorted(actual - expected)
          if extra:
              raise SystemExit(f"bounded changed files failed extra={extra}")
          PY

  redeploy_backend:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        (github.head_ref == 'gpt/m26-pa7-observable-backend-redeploy' ||
         github.head_ref == 'gpt/m26-pa7-full-graph-title-normalization'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: m23-r3-diagnostic
    env:
      WORK_DIR: /tmp/m26-pa7-explicit-backend-redeploy
      EXPECTED_DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Prepare evidence and SSH
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh
          printf '%s\n' "$EXPECTED_DEPLOY_SHA" > "$WORK_DIR/evidence/backend-deploy-sha.txt"

      - name: Redeploy Oracle backend preserving server-side secrets
        run: |
          set -euo pipefail
          ssh oracle-knowledge "if [ ! -d '$ORACLE_VM_DEPLOY_PATH/.git' ]; then git clone https://github.com/danielcanfly/knowledge-engine.git '$ORACLE_VM_DEPLOY_PATH'; fi"
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$EXPECTED_DEPLOY_SHA' python3 - <<'PY'
          import os
          from pathlib import Path

          deploy_path = Path(os.environ['DEPLOY_PATH'])
          release_sha = os.environ['RELEASE_SHA']
          env_path = deploy_path / '.env'
          if not env_path.exists():
              raise SystemExit('missing .env')
          lines = env_path.read_text(encoding='utf-8').splitlines()
          output = []
          seen = False
          for line in lines:
              if line.startswith('M26_QUERY_BUILD_SHA='):
                  output.append(f'M26_QUERY_BUILD_SHA={release_sha}')
                  seen = True
              else:
                  output.append(line)
          if not seen:
              output.append(f'M26_QUERY_BUILD_SHA={release_sha}')
          tmp = env_path.with_suffix('.env.next')
          tmp.write_text('\n'.join(output) + '\n', encoding='utf-8')
          tmp.replace(env_path)
          os.chmod(env_path, 0o600)
          PY"
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' RELEASE_SHA='$EXPECTED_DEPLOY_SHA' bash '$ORACLE_VM_DEPLOY_PATH/deploy/deploy.sh'" | tee "$WORK_DIR/evidence/backend-deploy.log"

      - name: Smoke owner-only backend routes locally on Oracle
        run: |
          set -euo pipefail
          ssh oracle-knowledge "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' bash -se" <<'REMOTE' > "$WORK_DIR/evidence/backend-owner-smoke.json"
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a
          . ./.env
          set +a
          : "${M26_QUERY_BACKEND_TOKEN:?missing backend token}"
          : "${KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH:?missing owner hash}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          health_code="$(curl --silent --show-error \
            -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" \
            -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" \
            -o "$tmp_dir/health.json" \
            -w '%{http_code}' \
            http://127.0.0.1:8080/api/m26/health || true)"
          graph_code="$(curl --silent --show-error \
            -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" \
            -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" \
            -o "$tmp_dir/graph.json" \
            -w '%{http_code}' \
            http://127.0.0.1:8080/api/m26/graph || true)"
          query_code="$(curl --silent --show-error \
            -H "authorization: Bearer $M26_QUERY_BACKEND_TOKEN" \
            -H "x-m26-owner-subject-hash: $KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH" \
            -H "content-type: application/json" \
            -o "$tmp_dir/query.json" \
            -w '%{http_code}' \
            --data '{"question":"Compare routers and adaptive planning for permission-first controls."}' \
            http://127.0.0.1:8080/api/m26/query || true)"
          python3 - "$tmp_dir/health.json" "$tmp_dir/graph.json" "$tmp_dir/query.json" "$health_code" "$graph_code" "$query_code" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          def reason(payload):
              detail = payload.get("detail") if isinstance(payload, dict) else None
              if isinstance(detail, dict):
                  return detail.get("reason_code")
              if isinstance(payload, dict):
                  return payload.get("reason_code")
              return None

          health = read_json(sys.argv[1])
          graph = read_json(sys.argv[2])
          query = read_json(sys.argv[3])
          health_code = sys.argv[4]
          graph_code = sys.argv[5]
          query_code = sys.argv[6]
          query_runtime = query.get("canonical_runtime", {}) if isinstance(query, dict) else {}
          query_reason_codes = query.get("reason_codes", []) if isinstance(query, dict) else []
          evidence = {
              "schema_version": "knowledge-engine-m26-pa7-explicit-backend-redeploy-smoke/v3",
              "status": "pass",
              "deploy_sha": os.environ["EXPECTED_DEPLOY_SHA"],
              "health_http_status": health_code,
              "health_status": health.get("status"),
              "health_build_sha": health.get("canonical_runtime", {}).get("build_sha"),
              "graph_http_status": graph_code,
              "graph_status": graph.get("status"),
              "graph_reason_code": reason(graph),
              "graph_scope": graph.get("graph_scope"),
              "graph_release_id": graph.get("release_id"),
              "graph_v2_sha256": graph.get("graph_v2_sha256"),
              "node_count": len(graph.get("nodes", [])),
              "edge_count": len(graph.get("edges", [])),
              "query_http_status": query_code,
              "query_reason_code": reason(query),
              "query_schema_version": query.get("schema_version") if isinstance(query, dict) else None,
              "query_status": query.get("status") if isinstance(query, dict) else None,
              "query_terminal_status": query.get("terminal_status") if isinstance(query, dict) else None,
              "query_trace_id_present": bool(query.get("trace_id")) if isinstance(query, dict) else False,
              "query_safe_abstention": query.get("safe_abstention") if isinstance(query, dict) else None,
              "query_reason_codes": query_reason_codes if isinstance(query_reason_codes, list) else [],
              "query_citation_count": len(query.get("citations", [])) if isinstance(query, dict) else 0,
              "query_source_count": len(query.get("sources", [])) if isinstance(query, dict) else 0,
              "query_runtime_build_sha": query_runtime.get("build_sha") if isinstance(query_runtime, dict) else None,
              "protected_knowledge_mutations": 0,
              "raw_answer_text_recorded": False,
              "raw_token_recorded": False,
              "raw_r2_endpoint_recorded": False,
          }
          if evidence["health_http_status"] != "200":
              evidence["status"] = "fail_health_http"
          elif evidence["health_build_sha"] != evidence["deploy_sha"]:
              evidence["status"] = "fail_build_sha"
          elif evidence["graph_http_status"] != "200":
              evidence["status"] = "fail_graph_http"
          elif evidence["node_count"] != 4222 or evidence["edge_count"] != 8525:
              evidence["status"] = "fail_graph_count"
          elif evidence["query_http_status"] != "200":
              evidence["status"] = "fail_query_http"
          elif evidence["query_schema_version"] != "knowledge-engine-m26-pa7-ask-web-response/v1":
              evidence["status"] = "fail_query_schema"
          elif not evidence["query_trace_id_present"]:
              evidence["status"] = "fail_query_trace"
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          REMOTE

      - name: Upload backend redeploy evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-pa7-explicit-backend-redeploy-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m26-pa7-explicit-backend-redeploy/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Report backend redeploy evidence on PA7 issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          work = Path(os.environ['WORK_DIR']) / 'evidence'
          smoke_path = work / 'backend-owner-smoke.json'
          smoke = json.loads(smoke_path.read_text()) if smoke_path.exists() else {}
          body = "\n".join([
              "### M26.PA.7 explicit backend redeploy result",
              "",
              f"- deploy SHA: `{smoke.get('deploy_sha', os.environ.get('EXPECTED_DEPLOY_SHA', ''))}`",
              f"- smoke status: `{smoke.get('status', 'missing')}`",
              f"- health build SHA: `{smoke.get('health_build_sha')}`",
              f"- graph HTTP status: `{smoke.get('graph_http_status')}`",
              f"- graph reason code: `{smoke.get('graph_reason_code')}`",
              f"- graph: `{smoke.get('node_count')} nodes / {smoke.get('edge_count')} edges`",
              f"- graph release: `{smoke.get('graph_release_id')}`",
              f"- graph-v2 SHA: `{smoke.get('graph_v2_sha256')}`",
              f"- query HTTP status: `{smoke.get('query_http_status')}`",
              f"- query reason code: `{smoke.get('query_reason_code')}`",
              f"- query status: `{smoke.get('query_status')}`",
              f"- query terminal status: `{smoke.get('query_terminal_status')}`",
              f"- query trace present: `{smoke.get('query_trace_id_present')}`",
              f"- query citations: `{smoke.get('query_citation_count')}`",
              f"- query sources: `{smoke.get('query_source_count')}`",
              f"- artifact ID: `{os.environ.get('ARTIFACT_ID', '')}`",
              f"- artifact URL: {os.environ.get('ARTIFACT_URL', '')}",
              "- protected knowledge mutations: `0`",
              "- raw answer text recorded: `false`",
              "- raw token recorded: `false`",
              "- raw R2 endpoint recorded: `false`",
          ])
          (work / 'issue-comment.md').write_text(body, encoding='utf-8')
          PY
          gh issue comment 1268 --repo "$GITHUB_REPOSITORY" --body-file "$WORK_DIR/evidence/issue-comment.md"

      - name: Fail if backend smoke failed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          smoke = json.loads((Path(os.environ['WORK_DIR']) / 'evidence/backend-owner-smoke.json').read_text())
          if smoke.get('status') != 'pass':
              raise SystemExit(json.dumps(smoke, sort_keys=True))
          PY

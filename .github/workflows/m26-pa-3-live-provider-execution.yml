name: M26.PA.3 Live Provider Execution Gate

on:
  pull_request:
    paths:
      - '.github/workflows/m26-pa-3-live-provider-execution.yml'
      - 'docs/architecture/m26/m26-pa-3-live-provider-execution.md'
      - 'pilot/m26/m26-pa-3-live-provider-authorization.json'
      - 'schemas/m26-pa-3-live-provider-authorization-v1.schema.json'
      - 'schemas/m26-pa-3-live-provider-receipt-v1.schema.json'
      - 'tests/test_m26_pa_3_live_provider_gate.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m26-pa-3-live-provider-execution.yml'
      - 'docs/architecture/m26/m26-pa-3-live-provider-execution.md'
      - 'pilot/m26/m26-pa-3-live-provider-authorization.json'
      - 'schemas/m26-pa-3-live-provider-authorization-v1.schema.json'
      - 'schemas/m26-pa-3-live-provider-receipt-v1.schema.json'
      - 'tests/test_m26_pa_3_live_provider_gate.py'

permissions:
  contents: read

jobs:
  static-authorization:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and PA.2 acceptance ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 8ed2da47d04f6410e55d5855d78f734341aecf2e HEAD

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Validate PA.3 authorization without live credentials
        run: |
          set -euo pipefail
          python -m ruff check tests/test_m26_pa_3_live_provider_gate.py
          python -m pytest -q \
            tests/test_m26_pa_3_live_provider_gate.py \
            tests/test_m26_pa_2_reconciliation.py \
            tests/test_m26_pa_2_live_authorization.py \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py
          python -m compileall -q tests/test_m26_pa_3_live_provider_gate.py
          test -z "${MINIMAX_API_KEY:-}"

      - name: Enforce exact PA.3 authorization surface and no secret values
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'FILES'
          .github/workflows/m26-pa-3-live-provider-execution.yml
          docs/architecture/m26/m26-pa-3-live-provider-execution.md
          pilot/m26/m26-pa-3-live-provider-authorization.json
          schemas/m26-pa-3-live-provider-authorization-v1.schema.json
          schemas/m26-pa-3-live-provider-receipt-v1.schema.json
          tests/test_m26_pa_3_live_provider_gate.py
          FILES
          cmp /tmp/expected.txt /tmp/changed.txt
          ! grep -E \
            '^(src/|source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt
          ! xargs -r grep -En \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{12,})' \
            </tmp/changed.txt

  live-provider:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[m26.pa3-provider-authorized-attempt-2]')
    runs-on: ubuntu-24.04
    environment: m23-r3-diagnostic
    env:
      AUTHORIZATION_PATH: pilot/m26/m26-pa-3-live-provider-authorization.json
      EVIDENCE_DIR: /tmp/m26-pa-3-live-provider-evidence
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact live attempt and provider credential
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8ed2da47d04f6410e55d5855d78f734341aecf2e HEAD
          test -n "$MINIMAX_API_KEY"
          mkdir -p "$EVIDENCE_DIR"

      - name: Install runtime dependencies and validate gate
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q tests/test_m26_pa_3_live_provider_gate.py

      - name: Execute exact bounded MiniMax M3 provider call
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from typing import Any

          import httpx
          from jsonschema import Draft202012Validator

          authorization_path = Path(os.environ["AUTHORIZATION_PATH"])
          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          authorization = json.loads(authorization_path.read_text(encoding="utf-8"))

          def canonical_bytes(value: object) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")

          def sha256_value(value: object) -> str:
              return hashlib.sha256(canonical_bytes(value)).hexdigest()

          def with_self_digest(value: dict[str, Any]) -> dict[str, Any]:
              candidate = dict(value)
              candidate["self_sha256"] = ""
              candidate["self_sha256"] = sha256_value(candidate)
              return candidate

          auth_schema = json.loads(
              Path("schemas/m26-pa-3-live-provider-authorization-v1.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          auth_errors = list(Draft202012Validator(auth_schema).iter_errors(authorization))
          assert auth_errors == []
          unsigned = dict(authorization)
          claimed = unsigned["self_sha256"]
          unsigned["self_sha256"] = ""
          assert sha256_value(unsigned) == claimed
          assert authorization["provider"]["secret_name"] == "MINIMAX_API_KEY"
          assert authorization["budget"]["max_live_call_count"] == 1

          user_content = {
              "task": authorization["request_template"]["user_task"],
              "pa2_status": authorization["predecessor"]["pa2_status"],
              "production_evidence": authorization["production_evidence"],
              "constraints": {
                  "no_production_answer": True,
                  "raw_corpus_text_sent": False,
                  "vectors_sent": False,
                  "user_query_sent": False,
              },
          }
          payload = {
              "model": authorization["provider"]["model_id"],
              "max_tokens": authorization["budget"]["max_output_tokens"],
              "temperature": 0,
              "stream": False,
              "system": authorization["request_template"]["system"],
              "messages": [
                  {
                      "role": "user",
                      "content": [
                          {
                              "type": "text",
                              "text": json.dumps(user_content, sort_keys=True),
                          }
                      ],
                  }
              ],
          }
          prompt_bytes = len(canonical_bytes(payload))
          assert prompt_bytes <= authorization["payload_scope"]["max_prompt_bytes"]
          payload_sha256 = sha256_value(payload)

          response = httpx.post(
              authorization["provider"]["endpoint"],
              headers={
                  "Authorization": f"Bearer {os.environ['MINIMAX_API_KEY']}",
                  "Content-Type": "application/json",
              },
              json=payload,
              timeout=60,
          )
          response_json = response.json()
          if response.status_code >= 400:
              failure = {
                  "schema_version": "knowledge-engine-m26-pa-3-live-provider-failure/v1",
                  "stage_id": "M26.PA.3",
                  "status": "live_provider_execution_failed",
                  "http_status": response.status_code,
                  "error_body_sha256": sha256_value(response_json),
                  "secret_values_persisted": False,
              }
              (evidence_dir / "m26-pa-3-live-provider-failure.json").write_text(
                  json.dumps(failure, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              raise RuntimeError(f"MiniMax request failed with HTTP {response.status_code}")

          content = response_json.get("content", [])
          text_parts = [
              str(item.get("text", ""))
              for item in content
              if isinstance(item, dict) and item.get("type") == "text"
          ]
          provider_output = "\n".join(text_parts)
          usage = response_json.get("usage", {})
          input_tokens = usage.get("input_tokens")
          output_tokens = usage.get("output_tokens")
          if not isinstance(input_tokens, int) or not isinstance(output_tokens, int):
              raise RuntimeError("MiniMax response did not include required token usage")
          if input_tokens > authorization["budget"]["max_input_tokens_budget"]:
              raise RuntimeError("MiniMax response exceeded PA.3 input token budget")

          receipt = with_self_digest(
              {
                  "schema_version": "knowledge-engine-m26-pa-3-live-provider-receipt/v1",
                  "stage_id": "M26.PA.3",
                  "status": "live_provider_execution_verified",
                  "generated_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
                  "authorization": {
                      "authorization_self_sha256": authorization["self_sha256"],
                      "logical_attempt": authorization["logical_attempt"],
                      "trigger_marker": authorization["execution"]["trigger_marker"],
                  },
                  "workflow": {
                      "workflow_name": authorization["execution"]["workflow_name"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "head_sha": os.environ["GITHUB_SHA"],
                  },
                  "request": {
                      "payload_sha256": payload_sha256,
                      "prompt_bytes": prompt_bytes,
                      "max_output_tokens": authorization["budget"]["max_output_tokens"],
                      "stream": False,
                      "raw_corpus_text_sent": False,
                      "vectors_sent": False,
                      "user_query_sent": False,
                  },
                  "provider": {
                      "provider_id": authorization["provider"]["provider_id"],
                      "model_id": authorization["provider"]["model_id"],
                      "api_style": authorization["provider"]["api_style"],
                      "endpoint": authorization["provider"]["endpoint"],
                      "provider_response_id": str(response_json["id"]),
                      "response_model": str(response_json.get("model", "")),
                      "stop_reason": response_json.get("stop_reason"),
                      "content_block_count": len(content) if isinstance(content, list) else 0,
                      "response_json_sha256": sha256_value(response_json),
                      "response_text_sha256": hashlib.sha256(
                          provider_output.encode("utf-8")
                      ).hexdigest(),
                      "response_text_persisted": False,
                  },
                  "usage": {
                      "input_tokens": input_tokens,
                      "output_tokens": output_tokens,
                      "total_tokens": input_tokens + output_tokens,
                  },
                  "authority": {
                      "provider_calls": 1,
                      "credential_names": ["MINIMAX_API_KEY"],
                      "secret_values_persisted": False,
                      "raw_text_persisted": False,
                      "vectors_requested": False,
                      "vectors_returned": False,
                      "r2_write_operations": 0,
                      "qdrant_write_operations": 0,
                      "source_foundation_release_mutations": 0,
                      "public_shadow_canary_traffic_operations": 0,
                  },
              }
          )
          receipt_schema = json.loads(
              Path("schemas/m26-pa-3-live-provider-receipt-v1.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          receipt_errors = list(Draft202012Validator(receipt_schema).iter_errors(receipt))
          assert receipt_errors == []
          receipt_path = evidence_dir / "m26-pa-3-live-provider-receipt.json"
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          receipt_sha = hashlib.sha256(receipt_path.read_bytes()).hexdigest()
          (evidence_dir / "m26-pa-3-live-provider-receipt.sha256").write_text(
              receipt_sha + "\n",
              encoding="utf-8",
          )
          (evidence_dir / "status.txt").write_text("success\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: m26-pa-3-live-provider-evidence-attempt-2
          path: /tmp/m26-pa-3-live-provider-evidence
          if-no-files-found: error
          retention-days: 30

name: M26.PA.2 Non-Live P0/P1 Repair

on:
  pull_request:
    paths:
      - '.github/workflows/m26-pa-2-real-corpus-binding.yml'
      - 'docs/architecture/m26/m26-pa-2-real-corpus-binding.md'
      - 'pilot/m26/m26-pa-2-*.json'
      - 'schemas/m26-pa-2-*.schema.json'
      - 'src/knowledge_engine/m26_real_corpus_binding.py'
      - 'tests/test_m26_pa_2_contracts.py'
      - 'tests/test_m26_pa_2_real_corpus_binding.py'

permissions:
  contents: read

jobs:
  non-live-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and accepted G0 ancestry
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 728df7da4e6b9320c25abb904a65a32b15e62bb1 HEAD

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Prove this workflow has no live authority
        run: |
          set -euo pipefail
          test -z "${R2_ACCESS_KEY_ID_READ:-}"
          test -z "${R2_SECRET_ACCESS_KEY_READ:-}"
          test -z "${QDRANT_READ_ONLY_API_KEY:-}"
          test -z "${QDRANT_URL:-}"
          ! grep -nE '\$\{\{[[:space:]]*secrets\.' \
            .github/workflows/m26-pa-2-real-corpus-binding.yml

      - name: Lint and compile PA.2
        run: |
          python -m ruff check --output-format=concise \
            src/knowledge_engine/m26_real_corpus_binding.py \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py
          python -m compileall -q \
            src/knowledge_engine/m26_real_corpus_binding.py \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py

      - name: Run focused P0/P1 adversarial matrix
        run: |
          python -m pytest -q \
            tests/test_m26_pa_2_contracts.py \
            tests/test_m26_pa_2_real_corpus_binding.py

      - name: Run predecessor and cross-stage regressions
        run: |
          python -m pytest -q \
            tests/test_m26_g0_governance_reconciliation.py \
            tests/test_m26_g0_reconciliation.py \
            tests/test_m26_11_production_authority.py \
            tests/test_m26_11_reconciliation.py \
            tests/test_m25_formal_closure.py \
            tests/test_m25_reconciliation.py

      - name: Build deterministic non-live evidence twice
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from knowledge_engine.m26_real_corpus_binding import write_non_live_evidence
          write_non_live_evidence(Path('.'), Path('/tmp/m26-pa-2-evidence-a.json'))
          PY
          python - <<'PY'
          from pathlib import Path
          from knowledge_engine.m26_real_corpus_binding import write_non_live_evidence
          write_non_live_evidence(Path('.'), Path('/tmp/m26-pa-2-evidence-b.json'))
          PY
          cmp /tmp/m26-pa-2-evidence-a.json /tmp/m26-pa-2-evidence-b.json
          cp /tmp/m26-pa-2-evidence-a.json m26-pa-2-non-live-repair-evidence.json

      - name: Enforce exact PA.2 implementation or live-authorization surface
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected-implementation.txt <<'FILES'
          .github/workflows/m26-1-architecture-authority.yml
          .github/workflows/m26-pa-2-real-corpus-binding.yml
          docs/architecture/m26/m26-pa-2-real-corpus-binding.md
          pilot/m26/m26-pa-2-contract-registry.json
          pilot/m26/m26-pa-2-entry-contract.json
          pilot/m26/m26-pa-2-retrieval-policy.json
          schemas/m26-pa-2-contracts-v1.schema.json
          schemas/m26-pa-2-failure-receipt-v1.schema.json
          schemas/m26-pa-2-real-corpus-receipt-v1.schema.json
          src/knowledge_engine/m26_real_corpus_binding.py
          tests/test_m26_pa_2_contracts.py
          tests/test_m26_pa_2_real_corpus_binding.py
          FILES
          # Attempt 5 uses the same bounded live-authorization file surface.
          cat > /tmp/expected-live-authorization.txt <<'FILES'
          .github/workflows/m26-pa-2-live-read-evidence.yml
          .github/workflows/m26-pa-2-real-corpus-binding.yml
          docs/architecture/m26/m26-pa-2-live-read-evidence.md
          pilot/m26/m26-pa-2-live-authorization.json
          schemas/m26-pa-2-live-authorization-v1.schema.json
          tests/test_m26_pa_2_live_authorization.py
          FILES
          cmp /tmp/expected-implementation.txt /tmp/changed.txt \
            || cmp /tmp/expected-live-authorization.txt /tmp/changed.txt
          ! grep -E \
            '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)' \
            /tmp/changed.txt

      - name: Scan changed files for high-confidence secret values
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          ! xargs -r grep -En \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,})' \
            <<<"$changed"

      - uses: actions/upload-artifact@v4
        with:
          name: m26-pa-2-non-live-repair-evidence
          path: m26-pa-2-non-live-repair-evidence.json
          if-no-files-found: error
          retention-days: 90

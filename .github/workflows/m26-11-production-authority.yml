name: M26.11 Production Authority Contract

on:
  pull_request:
    paths:
      - '.github/workflows/m26-11-production-authority.yml'
      - 'docs/architecture/m26/m26-11-production-authority-activation.md'
      - 'pilot/m26/m26-11-*.json'
      - 'schemas/m26-11-*.schema.json'
      - 'src/knowledge_engine/m26_production_authority.py'
      - 'tests/test_m26_11_production_authority.py'

permissions:
  contents: read

jobs:
  production-authority-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact head and predecessor
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          acceptance = json.loads(Path('pilot/m26/m26-10-acceptance.json').read_text())
          assert acceptance['status'] == 'm26_10_synthetic_final_authority_gate_accepted'
          assert acceptance['implementation']['merge_sha'] == '9fdafee36202366c66aeb111d6943cbc279953f9'
          PY
      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint M26.11
        run: |
          python -m ruff check \
            src/knowledge_engine/m26_production_authority.py \
            tests/test_m26_11_production_authority.py
      - name: Validate M26.11 contracts
        run: python -m pytest -q tests/test_m26_11_production_authority.py
      - name: Rebuild deterministic authority evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from knowledge_engine.m26_production_authority import validate_m26_11_contracts
          report = validate_m26_11_contracts(Path('.'))
          Path('m26-11-production-authority-evidence.json').write_text(
              json.dumps(report, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          assert report['public_traffic'] is False
          assert report['live_provider_calls'] is False
          assert report['production_pointer_mutation'] is False
          PY
      - name: Reject protected mutations
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          forbidden='^(source/|foundation/|release/|r2/|qdrant/|production/|channels/|packages/|workers/|pages/)'
          ! printf '%s\n' "$changed" | grep -E "$forbidden"
      - uses: actions/upload-artifact@v4
        with:
          name: m26-11-production-authority-evidence
          path: m26-11-production-authority-evidence.json
          if-no-files-found: error
          retention-days: 90

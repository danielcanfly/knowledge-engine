name: M26 Production Origin Topology Probe

on:
  pull_request:
    paths:
      - ".github/workflows/m26-production-origin-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: m23-r3-diagnostic
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Prepare SSH
        run: |
          set -euo pipefail
          for name in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          bash scripts/configure_oracle_ssh.sh
          mkdir -p artifacts/m26-production-origin-probe

      - name: Probe Oracle topology without mutation
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/m26-production-origin-probe/oracle-topology.txt"
          ssh oracle-knowledge 'bash -se' <<'REMOTE' > "$out"
          set -euo pipefail
          echo '=== identity ==='
          date -u +%FT%TZ
          hostname
          id -un

          echo '=== relevant containers ==='
          docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}' | grep -E 'm26|caddy|cloudflared|knowledge|18000' || true

          echo '=== accepted runtime 18081 health ==='
          status_18081="$(curl --silent --show-error -o /tmp/m26-18081-health.json -w '%{http_code}' http://127.0.0.1:18081/v1/answers/health || true)"
          echo "status=$status_18081"
          head -c 2000 /tmp/m26-18081-health.json 2>/dev/null || true
          echo

          echo '=== host listeners with process ownership ==='
          sudo -n ss -ltnp 2>/dev/null | grep -E ':(80|443|18000|18081|8080)[[:space:]]' || ss -ltn 2>/dev/null | grep -E ':(80|443|18000|18081|8080)[[:space:]]' || true

          echo '=== reverse proxy services ==='
          for svc in nginx caddy apache2; do
            printf '%s=' "$svc"
            systemctl is-active "$svc" 2>/dev/null || true
          done
          ps -ef | grep -E '[n]ginx|[c]addy|[a]pache|[h]aproxy' || true

          echo '=== nginx production routing excerpt ==='
          if command -v nginx >/dev/null 2>&1; then
            sudo -n nginx -T 2>&1 | grep -nE 'api\.danielcanfly\.com|18000|18081|proxy_pass|server_name' -C 10 | head -c 24000 || true
          else
            echo 'nginx binary absent'
          fi

          echo '=== host caddy config excerpt ==='
          if command -v caddy >/dev/null 2>&1; then
            sudo -n caddy adapt --config /etc/caddy/Caddyfile --pretty 2>/dev/null | grep -nE 'api\.danielcanfly\.com|18000|18081|reverse_proxy|upstream' -C 10 | head -c 24000 || true
          else
            echo 'caddy binary absent'
          fi

          echo '=== direct production origin host-header probes ==='
          for path in /v1/answers/health /health /api/m26/health; do
            code="$(curl -k --silent --show-error --resolve api.danielcanfly.com:443:127.0.0.1 -o /tmp/m26-origin-body -w '%{http_code}' "https://api.danielcanfly.com${path}" || true)"
            echo "path=$path status=$code"
            head -c 1000 /tmp/m26-origin-body 2>/dev/null || true
            echo
          done

          echo '=== accepted staging container inspect ==='
          if docker inspect m26-public-api-staging-d6288072 >/dev/null 2>&1; then
            docker inspect m26-public-api-staging-d6288072 --format 'name={{.Name}} image={{.Config.Image}} network={{.HostConfig.NetworkMode}}'
            docker inspect m26-public-api-staging-d6288072 --format '{{range .NetworkSettings.Ports}}{{println .}}{{end}}' || true
          fi

          echo '=== tunnel inspect ==='
          if docker inspect m26-pa7-backend-tunnel >/dev/null 2>&1; then
            docker inspect m26-pa7-backend-tunnel --format 'name={{.Name}} image={{.Config.Image}} network={{.HostConfig.NetworkMode}}'
          fi
          REMOTE
          cat "$out"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-production-origin-probe-${{ github.sha }}
          path: artifacts/m26-production-origin-probe
          if-no-files-found: error
          retention-days: 30

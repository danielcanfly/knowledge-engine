name: L3B Production Environment Read-Only Census

on:
  push:
    branches:
      - ops/l3b-production-env-census-20260909

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_VM_HOST: ${{ vars.ORACLE_VM_HOST || secrets.ORACLE_VM_HOST }}
      ORACLE_VM_USER: ${{ vars.ORACLE_VM_USER || secrets.ORACLE_VM_USER }}
      ORACLE_VM_DEPLOY_PATH: ${{ vars.ORACLE_VM_DEPLOY_PATH || secrets.ORACLE_VM_DEPLOY_PATH }}
    steps:
      - name: Require read authority
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_PRIVATE_KEY ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_DEPLOY_PATH; do
            test -n "${!name:-}" || { echo "MISSING_READ_AUTHORITY"; exit 2; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Read encoded production readiness state
        run: |
          set -euo pipefail
          ssh "$ORACLE_VM_USER@$ORACLE_VM_HOST" "DEPLOY_PATH='$ORACLE_VM_DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          present() { [ -f .env ] && grep -Eq "^$1=.+" .env; }
          access_core() {
            present M26_CONSOLE_ACCESS_TEAM_DOMAIN && present M26_CONSOLE_ACCESS_AUD &&
              (present M26_CONSOLE_OWNER_EMAILS || present M26_CONSOLE_OWNER_SUBJECTS)
          }
          sq_runtime() {
            present M26_SUGGESTED_QUESTIONS_GITHUB_TOKEN &&
              present M26_SUGGESTED_QUESTIONS_GITHUB_WRITE_TOKEN &&
              present MINIMAX_API_KEY &&
              (present STAGING_M26_OWNER_SUBJECT_HASH || present KNOWLEDGE_ENGINE_OWNER_SUBJECT_HASH || present M26_OWNER_SUBJECT_HASH)
          }
          qa_runtime_binding() {
            present M26_QA_DB_PATH && present M26_ADMIN_CONTROL_DB_PATH && present M26_L3B_ADMIN_QUALIFIED
          }
          bits=0
          access_core && bits=$((bits | 1)) || true
          sq_runtime && bits=$((bits | 2)) || true
          qa_runtime_binding && bits=$((bits | 4)) || true
          present M26_QA_TRUST_CLOUDFLARE_COUNTRY && bits=$((bits | 8)) || true
          ss -ltn 2>/dev/null | grep -Eq '127\.0\.0\.1:8080' && bits=$((bits | 16)) || true
          if grep -Rqs 'real_ip_header[[:space:]]\+CF-Connecting-IP' /etc/nginx 2>/dev/null && grep -Rqs 'set_real_ip_from' /etc/nginx 2>/dev/null; then bits=$((bits | 32)); fi
          checkout="$(git rev-parse HEAD)"
          running="$(docker compose exec -T knowledge-engine sh -c 'printf %s "$M26_QUERY_BUILD_SHA"')"
          [ "$checkout" = "$running" ] && bits=$((bits | 64)) || true
          printf 'RSTATE=%d\n' "$bits"
          echo 'RSTATE_SCHEMA=1_access,2_sq,4_l3b_binding,8_country_trust,16_loopback,32_nginx_cf_trust,64_identity_match'
          echo 'PRODUCTION_MUTATION=0'
          REMOTE

      - name: Read encoded public edge state
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 15 --dump-header /tmp/public-headers.txt --output /tmp/public-health.json https://api.danielcanfly.com/v1/answers/health
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 https://api.danielcanfly.com/v1/answers/health)"
          bits=0
          [ "$code" = 200 ] && bits=$((bits | 1)) || true
          if grep -Eiq '^server:[[:space:]]*cloudflare' /tmp/public-headers.txt && grep -Eiq '^cf-ray:' /tmp/public-headers.txt; then bits=$((bits | 2)); fi
          if [[ "$ORACLE_VM_HOST" =~ ^[0-9a-fA-F:.]+$ ]]; then
            direct="$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' --max-time 8 --resolve "api.danielcanfly.com:443:$ORACLE_VM_HOST" https://api.danielcanfly.com/v1/answers/health || true)"
            [ "$direct" = 200 ] && bits=$((bits | 4)) || true
          fi
          printf 'ESTATE=%d\n' "$bits"
          echo 'ESTATE_SCHEMA=1_health,2_cloudflare_edge,4_direct_origin'
          echo 'PRODUCTION_MUTATION=0'

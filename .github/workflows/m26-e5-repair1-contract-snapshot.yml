name: M26 E5 Repair1 Exact Candidate Contract Snapshot

on:
  push:
    branches:
      - m26-e5-execution-plane-repair1-20260827
    paths:
      - .github/workflows/m26-e5-repair1-contract-snapshot.yml

permissions:
  contents: read

env:
  ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
  ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
  ORACLE_VM_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_VM_SSH_PRIVATE_KEY }}

jobs:
  contract-snapshot:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing Oracle SSH lane
        run: |
          set -euo pipefail
          set +x
          for n in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_PRIVATE_KEY; do test -n "${!n:-}" || exit 2; done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_PRIVATE_KEY" > ~/.ssh/m26_e5_repair1_oracle
          chmod 600 ~/.ssh/m26_e5_repair1_oracle
          ssh-keyscan -H "$ORACLE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Snapshot exact candidate contract read-only
        run: |
          set -euo pipefail
          set +x
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/m26_e5_oracle_contract_snapshot.py "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/m26_e5_oracle_contract_snapshot.py"
          ssh -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST" \
            "set -euo pipefail; set +x; python3 /tmp/m26_e5_oracle_contract_snapshot.py; tar -C /tmp -czf /tmp/m26-e5-repair1-contract-snapshot.tgz m26-e5-repair1-contract-snapshot" \
            | tee /tmp/m26-e5-repair1-contract-snapshot.log
          grep -q '^M26_E5_REPAIR1_CONTRACT_SNAPSHOT_PASS$' /tmp/m26-e5-repair1-contract-snapshot.log
          scp -i ~/.ssh/m26_e5_repair1_oracle -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_VM_USER@$ORACLE_VM_HOST:/tmp/m26-e5-repair1-contract-snapshot.tgz" /tmp/
          mkdir -p /tmp/m26-e5-repair1-contract-artifact
          tar -C /tmp/m26-e5-repair1-contract-artifact -xzf /tmp/m26-e5-repair1-contract-snapshot.tgz
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/m26-e5-repair1-contract-artifact/m26-e5-repair1-contract-snapshot/identity_auth_zero.json')
          d=json.loads(p.read_text())
          assert d['container_id_exact'] and d['image_id_exact'] and d['running'] and d['localhost_18187']
          assert d['auth_value_present'] and not d['auth_value_artifacted'] and not d['auth_value_logged']
          assert d['semantic_posts']==0 and d['e5_consumed']==0 and d['rerolls']==0 and d['production_mutations']==0
          print('M26_E5_REPAIR1_CONTRACT_SNAPSHOT_ZERO_CONSUMPTION_PASS')
          PY
      - name: Upload sanitized contract snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-e5-repair1-contract-snapshot
          path: |
            /tmp/m26-e5-repair1-contract-snapshot.log
            /tmp/m26-e5-repair1-contract-artifact/m26-e5-repair1-contract-snapshot
          if-no-files-found: warn
          retention-days: 14

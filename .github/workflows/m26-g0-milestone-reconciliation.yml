name: M26.G0 Milestone Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/m26-g0-milestone-reconciliation.yml'
      - 'docs/architecture/m26/m26-g0-v3-repository-adoption.md'
      - 'pilot/m26/m26-g0-*.json'
      - 'schemas/m26-g0-*.schema.json'
      - 'src/knowledge_engine/m26_governance_reconciliation.py'
      - 'tests/test_m26_g0_governance_reconciliation.py'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 4d7e661a21397ba5c88ba7160f3d0be3bd45cee3 HEAD
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate governance contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_m26_g0_governance_reconciliation.py
          ruff check \
            src/knowledge_engine/m26_governance_reconciliation.py \
            tests/test_m26_g0_governance_reconciliation.py
          python -m compileall -q \
            src/knowledge_engine/m26_governance_reconciliation.py \
            tests/test_m26_g0_governance_reconciliation.py
      - name: Emit deterministic candidate evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from knowledge_engine.m26_governance_reconciliation import write_evidence
          write_evidence(Path('.'), Path('/tmp/m26-g0-governance-evidence.json'))
          PY
          cp /tmp/m26-g0-governance-evidence.json /tmp/evidence-copy.json
          cmp /tmp/m26-g0-governance-evidence.json /tmp/evidence-copy.json
      - name: Enforce exact change surface
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/m26-g0-milestone-reconciliation.yml
          docs/architecture/m26/m26-g0-v3-repository-adoption.md
          pilot/m26/m26-g0-contract-registry.json
          pilot/m26/m26-g0-legacy-pa2-candidate.json
          pilot/m26/m26-g0-milestone-alias-map.json
          pilot/m26/m26-g0-owner-decision.json
          pilot/m26/m26-g0-pa1-ratification.json
          pilot/m26/m26-g0-stage-registry.json
          schemas/m26-g0-governance-adoption-v1.schema.json
          schemas/m26-g0-pa1-ratification-v1.schema.json
          src/knowledge_engine/m26_governance_reconciliation.py
          tests/test_m26_g0_governance_reconciliation.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! grep -E '^(source/|foundation/|release/|r2/|qdrant/|production/|channels/)' \
            /tmp/changed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m26-g0-governance-evidence
          path: /tmp/m26-g0-governance-evidence.json
          if-no-files-found: error
          retention-days: 90

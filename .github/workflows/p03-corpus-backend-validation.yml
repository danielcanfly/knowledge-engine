name: P03 Corpus Backend Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Focused Ruff
        run: python -m ruff check src/knowledge_engine/m26_admin_corpus.py tests/test_m26_admin_corpus.py
      - name: Focused corpus tests
        run: python -m pytest -q tests/test_m26_admin_corpus.py
      - name: Canonical console OpenAPI smoke
        run: |
          python - <<'PY'
          from knowledge_engine.m26_console_api import create_app
          app = create_app()
          spec = app.openapi()
          paths = spec.get('paths', {})
          assert '/v1/admin/corpus' in paths, paths
          assert '/v1/admin/corpus/{document_id}' in paths, paths
          list_op = paths['/v1/admin/corpus']['get']
          params = {
              item['name']
              for item in list_op.get('parameters', [])
              if item.get('in') == 'query'
          }
          assert params == {'q', 'state', 'language'}, params
          assert list_op['operationId'] == 'listCorpus'
          assert paths['/v1/admin/corpus/{document_id}']['get']['operationId'] == 'getCorpusDocument'
          print('P03 canonical corpus read surface present')
          PY

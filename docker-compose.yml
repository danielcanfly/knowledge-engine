services:
  knowledge-engine:
    build: .
    image: ${M26_RUNTIME_IMAGE:-knowledge-engine:0.2.0}
    restart: unless-stopped
    env_file:
      - ${M26_RUNTIME_ENV_FILE:-.env}
    environment:
      M26_PUBLIC_QUOTA_DB: /var/lib/knowledge-engine/rate-limit/quota.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - knowledge-engine-cache:/var/lib/knowledge-engine/cache
      - m26-daily-ip-rate-limit-data:/var/lib/knowledge-engine/rate-limit
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    command:
      - uvicorn
      - knowledge_engine.m26_public_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

volumes:
  knowledge-engine-cache:
  m26-daily-ip-rate-limit-data:

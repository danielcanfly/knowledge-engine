openapi: 3.1.0
info:
  title: M26 LLM-Wiki Admin API
  version: 1.3.0-l2-final-convergence
  description: Owner-only M26 LLM-Wiki control-plane contract converged by Gate A Repair-A. B01 remains
    authoritative for transport/security/request/error/idempotency/audit semantics; B02 is authoritative
    for shared read availability/provenance/observation/freshness semantics; B03 is authoritative for
    qualification evidence/status facts. Public /v1/answers* remains a separate contract. L2 Final Convergence
    adds the accepted L3A index-health, one-click sync, and retry operations without changing predecessor
    L3B or public contract surfaces.
servers:
- url: https://api.danielcanfly.com
security:
- cloudflareAccessAssertion: []
tags:
- name: Overview
- name: Ingestion
- name: Corpus
- name: QA
- name: Playground
- name: SuggestedQuestions
- name: Usage
- name: Health
- name: Jobs
- name: Evaluation
- name: Settings
- name: Audit
paths:
  /v1/admin/session:
    get:
      tags:
      - Settings
      operationId: getAdminSession
      summary: Validated owner session/actor context
      responses:
        '200':
          description: Validated admin actor and backend auth posture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: admin.session.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
  /v1/admin/capabilities:
    get:
      tags:
      - Settings
      operationId: getAdminCapabilities
      summary: Evidence-backed capability gates
      responses:
        '200':
          description: Capability matrix projection. Missing capability means unavailable, never enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: admin.capabilities.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
  /v1/admin/overview:
    get:
      tags:
      - Overview
      operationId: getOverview
      responses:
        '200':
          description: Operational snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: overview.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
  /v1/admin/index/current:
    get:
      tags:
      - Corpus
      operationId: getCurrentIndex
      responses:
        '200':
          description: Active release/index identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: index.current.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
  /v1/admin/index/audits:
    post:
      tags:
      - Corpus
      operationId: startIndexAudit
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '202':
          description: Audit accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: index.audit.start
      x-m26-public-contract-separate: true
      x-m26-state-changing: true
    get:
      tags:
      - Corpus
      operationId: listIndexAudits
      responses:
        '200':
          description: Audit history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: index.audit.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
  /v1/admin/ingestion/scan:
    post:
      tags:
      - Ingestion
      operationId: scanCorpus
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '202':
          description: Scan accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: ingestion.scan
      x-m26-public-contract-separate: true
      x-m26-state-changing: true
  /v1/admin/ingestion/dry-runs:
    post:
      tags:
      - Ingestion
      operationId: createDryRun
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - scope
              properties:
                scope:
                  type: string
                  enum:
                  - single_document
                  - stale_documents
                  - explicit_documents
                document_ids:
                  type: array
                  items:
                    type: string
                  maxItems: 100
      responses:
        '202':
          description: Dry-run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: ingestion.dry_run.start
      x-m26-public-contract-separate: true
      x-m26-state-changing: true
  /v1/admin/ingestion/jobs:
    get:
      tags:
      - Jobs
      operationId: listIngestionJobs
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: ingestion.jobs.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
    post:
      tags:
      - Ingestion
      operationId: confirmIngestionJob
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dry_run_id
              - dry_run_digest
              - confirmation
              properties:
                dry_run_id:
                  type: string
                dry_run_digest:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                confirmation:
                  type: boolean
                  const: true
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '409':
          description: Dry-run stale or source revision changed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: ingestion.job.confirm
      x-m26-public-contract-separate: true
      x-m26-state-changing: true
  /v1/admin/ingestion/jobs/{job_id}:
    get:
      tags:
      - Jobs
      operationId: getIngestionJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '200':
          description: Job detail/evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: ingestion.job.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
  /v1/admin/index/versions:
    get:
      tags:
      - Jobs
      operationId: listIndexVersions
      responses:
        '200':
          description: Version lineage and rollback eligibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: index.versions.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
  /v1/admin/index/versions/{version_id}/rollback-preflight:
    post:
      tags:
      - Jobs
      operationId: rollbackPreflight
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '200':
          description: Eligibility/preflight result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: index.rollback.preflight
      x-m26-public-contract-separate: true
      x-m26-state-changing: true
  /v1/admin/index/versions/{version_id}/activate:
    post:
      tags:
      - Jobs
      operationId: activateVersion
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - preflight_token
              - confirmation
              properties:
                preflight_token:
                  type: string
                confirmation:
                  type: boolean
                  const: true
      responses:
        '202':
          description: Activation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '409':
          description: Preflight expired or state changed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: index.activate
      x-m26-public-contract-separate: true
      x-m26-state-changing: true
  /v1/admin/corpus:
    get:
      tags:
      - Corpus
      operationId: listCorpus
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: state
        in: query
        schema:
          type: string
      - name: language
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '200':
          description: Corpus rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: corpus.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
  /v1/admin/corpus/{document_id}:
    get:
      tags:
      - Corpus
      operationId: getCorpusDocument
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '200':
          description: Document/source/index detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: corpus.document.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
  /v1/admin/qa/events:
    get:
      tags:
      - QA
      operationId: listQaEvents
      parameters:
      - name: class
        in: query
        schema:
          type: string
      - name: release_id
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '200':
          description: Normalized answer/QA events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: qa.events.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      description: Generic QA review events. No canonical generic numeric QA score exists; filter only
        by contract-backed fields.
  /v1/admin/qa/events/{trace_id}:
    get:
      tags:
      - QA
      operationId: getQaEvent
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ClientRequestId'
      responses:
        '200':
          description: Trace detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: qa.event.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
  /v1/admin/qa/export-markdown:
    post:
      tags:
      - QA
      operationId: exportQaMarkdown
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - trace_ids
              properties:
                trace_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: Redacted Markdown review packet
          content:
            text/markdown:
              schema:
                type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: qa.export_markdown
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
  /v1/admin/playground/retrieve:
    post:
      tags:
      - Playground
      operationId: inspectRetrieval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaygroundRequest'
      responses:
        '200':
          description: Retrieval-only trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: playground.retrieve
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
  /v1/admin/playground/ask:
    post:
      tags:
      - Playground
      operationId: runFullAsk
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaygroundRequest'
      responses:
        '200':
          description: Full owner-only answer trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: playground.ask
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
  /v1/admin/suggested-questions:
    get:
      tags:
      - SuggestedQuestions
      operationId: listSuggestedQuestions
      responses:
        '200':
          description: Published/candidate/disabled questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/AdminError'
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
        '422':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
      x-m26-capability-id: suggested_questions.read
      x-m26-public-contract-separate: true
      x-m26-state-changing: false
      parameters:
      - $ref: '#/components/parameters/ClientRequestId'
    put:
      tags:
      - SuggestedQuestions
      operationId: updateSuggestedQuestions
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - base_revision
              - operations
              properties:
                base_revision:
                  type: string
                operations:
                  type: array
                  maxItems: 100
                  items:
                    type: object
      responses:

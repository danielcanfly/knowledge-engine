components:
  securitySchemes:
    cloudflareAccessAssertion:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access injects this JWT at the origin. Clients must not fabricate it. The
        backend validates RS256 signature, exact team-domain issuer, exact application AUD, expiry, subject
        and owner allowlist on every /v1/admin/* request.
      x-m26-client-injection: false
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required only for state-changing admin operations. Scoped to actor + method + normalized
        path. Same key + same canonical request replays the same operation identity; same key + different
        request returns 409.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:/\-]{16,128}$
    ClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: false
      description: Optional client correlation hint. It is never the authoritative server request_id.
      schema:
        type: string
        maxLength: 128
  schemas:
    Availability:
      type: object
      additionalProperties: false
      required:
      - status
      - reason_code
      properties:
        status:
          type: string
          enum:
          - available
          - partial
          - unavailable
        reason_code:
          type:
          - string
          - 'null'
        detail:
          type:
          - string
          - 'null'
      description: Read-model availability. Unavailable/partial must be explicit and must never be represented
        by fabricated zero/empty observations.
    Provenance:
      type: object
      additionalProperties: true
      required:
      - source
      properties:
        source:
          type: string
        resource_identity:
          type:
          - object
          - 'null'
          additionalProperties: true
        evidence_digest:
          type:
          - string
          - 'null'
        source_observed_at:
          type:
          - string
          - 'null'
          format: date-time
    Envelope:
      type: object
      additionalProperties: false
      required:
      - request_id
      - availability
      - provenance
      - data
      properties:
        request_id:
          type: string
        availability:
          $ref: '#/components/schemas/Availability'
        provenance:
          $ref: '#/components/schemas/Provenance'
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Authoritative data observation time. Null when no observation occurred or none
            is available; never synthesized from response time.
        freshness:
          type: string
          enum:
          - live
          - near_live
          - delayed
          - snapshot
          - stale
          - unknown
        data: {}
      description: Canonical shared read envelope. Transport success does not imply source availability.
        Unavailable/partial/stale states are explicit and non-fabricated.
    OperationAccepted:
      type: object
      additionalProperties: false
      required:
      - request_id
      - operation_id
      - status
      - replayed
      properties:
        request_id:
          type: string
        operation_id:
          type: string
        status:
          type: string
          enum:
          - accepted
        replayed:
          type: boolean
    GoldenDatasetIdentity:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - version
      - dataset_hash
      properties:
        dataset_id:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: string
          minLength: 1
          maxLength: 256
        dataset_hash:
          type: string
          minLength: 1
          maxLength: 512
    EvaluationScoringIdentity:
      type: object
      additionalProperties: false
      required:
      - version
      - hash
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 256
        hash:
          type: string
          minLength: 1
          maxLength: 512
    EvaluationReleaseIdentity:
      type: object
      additionalProperties: false
      required:
      - release_id
      - index_identity
      - config_identity
      - runtime_sha256
      - collection
      - manifest_sha256
      properties:
        release_id:
          type: string
          minLength: 1
          maxLength: 256
        index_identity:
          type: string
          minLength: 1
          maxLength: 1024
        config_identity:
          type: string
          minLength: 1
          maxLength: 512
        runtime_sha256:
          type: string
          minLength: 1
          maxLength: 512
        collection:
          type: string
          minLength: 1
          maxLength: 512
        manifest_sha256:
          type: string
          minLength: 1
          maxLength: 512
        provider_id:
          type: string
          minLength: 1
          maxLength: 256
        model_id:
          type: string
          minLength: 1
          maxLength: 512
        provider_config_hash:
          type: string
          minLength: 1
          maxLength: 512
    StartEvaluationRunRequest:
      type: object
      additionalProperties: false
      required:
      - mode
      - dataset
      - case_ids
      - release
      - scoring_contract
      properties:
        mode:
          type: string
          enum:
          - selected
          - all
          - retrieval_only
        dataset:
          $ref: '#/components/schemas/GoldenDatasetIdentity'
        case_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
        release:
          $ref: '#/components/schemas/EvaluationReleaseIdentity'
        scoring_contract:
          $ref: '#/components/schemas/EvaluationScoringIdentity'
      description: Immutable Golden evaluation execution request. selected and retrieval_only require
        explicit non-empty case_ids; all requires an empty case_ids array. Model-bearing runs require
        provider_id, model_id, and provider_config_hash. The backend revalidates every dataset, scoring,
        release/index/config/runtime/collection/manifest, provider/model/config, and case-selection identity
        against qualified authority before execution.
    PlaygroundRequest:
      type: object
      additionalProperties: false
      required:
      - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        release_id:
          type: string
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      - details
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]+$
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - request_id
      - observed_at
      - error
      properties:
        request_id:
          type: string
        observed_at:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorBody'
    AdminActor:
      type: object
      additionalProperties: false
      required:
      - actor_id
      - actor_type
      properties:
        actor_id:
          type: string
        actor_type:
          type: string
          enum:
          - human
          - service
        email:
          type:
          - string
          - 'null'
          format: email
    QualificationStatus:
      type: string
      enum:
      - qualified
      - read_only
      - disabled
      - qualification_candidate
      - blocked_authority
      - unavailable
      - unsupported
      description: Evidence/authority qualification fact. It is intentionally separate from frontend effective
        capability state.
    EffectiveCapabilityState:
      type: string
      enum:
      - enabled
      - read_only
      - disabled
      - unavailable
      - not_eligible
      description: Frontend/action enablement state. Repair-A does not promote any candidate or blocked
        authority into enabled.
    CapabilityGate:
      type: object
      additionalProperties: false
      required:
      - capability_id
      - qualification_status
      - effective_state
      - mutation_authorized
      - reason_code
      - source
      properties:
        capability_id:
          type: string
        qualification_status:
          $ref: '#/components/schemas/QualificationStatus'
        effective_state:
          $ref: '#/components/schemas/EffectiveCapabilityState'
        mutation_authorized:
          type: boolean
        reason_code:
          type: string
        source:
          type: string
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        resource_identity:
          type:
          - object
          - 'null'
          additionalProperties: true
        evidence_digest:
          type:
          - string
          - 'null'
    ActivateVersionRequest:
      properties:
        preflight_token:
          type: string
          minLength: 1
          title: Preflight Token
        confirmation:
          type: boolean
          const: true
          title: Confirmation
      additionalProperties: false
      type: object
      required:
      - preflight_token
      - confirmation
      title: ActivateVersionRequest
    ConfirmJobRequest:
      properties:
        dry_run_id:
          type: string
          maxLength: 160
          minLength: 1
          title: Dry Run Id
        dry_run_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Dry Run Digest
        confirmation:
          type: boolean
          const: true
          title: Confirmation
      type: object
      required:
      - dry_run_id
      - dry_run_digest
      - confirmation
      title: ConfirmJobRequest
    DatasetIdentity:
      properties:
        dataset_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Dataset Id
        version:
          type: string
          maxLength: 256
          minLength: 1
          title: Version
        dataset_hash:
          type: string
          maxLength: 512
          minLength: 1
          title: Dataset Hash
      additionalProperties: false
      type: object
      required:
      - dataset_id
      - version
      - dataset_hash
      title: DatasetIdentity
    DryRunRequest:
      properties:
        scope:
          type: string
          enum:
          - single_document
          - stale_documents
          - explicit_documents
          title: Scope
        document_ids:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 100
          - type: 'null'
          title: Document Ids
      type: object
      required:
      - scope
      title: DryRunRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    QaLifecycleRequest:
      properties:
        state:
          type: string
          maxLength: 32
          minLength: 2
          title: State
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
        resolved_by_release:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Resolved By Release
      type: object
      required:
      - state
      title: QaLifecycleRequest
    ScoringContractIdentity:
      properties:
        version:
          type: string
          maxLength: 256
          minLength: 1
          title: Version
        hash:
          type: string
          maxLength: 512
          minLength: 1
          title: Hash
      additionalProperties: false
      type: object
      required:
      - version
      - hash
      title: ScoringContractIdentity
    SuggestedQuestionsPromotionPreviewRequest:
      properties:
        event_ids:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Event Ids
      type: object
      required:
      - event_ids
      title: SuggestedQuestionsPromotionPreviewRequest
    SuggestedQuestionsPromotionPublishRequest:
      properties:
        base_revision:
          type: string
          title: Base Revision
        selected_event_ids:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Selected Event Ids
      type: object
      required:
      - base_revision
      - selected_event_ids
      title: SuggestedQuestionsPromotionPublishRequest
    SuggestedQuestionsUpdate:
      properties:
        base_revision:
          type: string
          title: Base Revision
        operations:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Operations
      type: object
      required:
      - base_revision
      - operations
      title: SuggestedQuestionsUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    knowledge_engine__m26_admin_qa__QaExportRequest:
      properties:
        trace_ids:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          title: Trace Ids
      type: object
      required:
      - trace_ids
      title: QaExportRequest
    knowledge_engine__m26_qa_inbox_integration__QaExportRequest:
      properties:
        mode:
          type: string
          enum:
          - new
          - selected
          - current_filter
          title: Mode
          default: new
        include_previously_exported:
          type: boolean
          title: Include Previously Exported
          default: false
        event_ids:
          items:
            type: string
          type: array
          maxItems: 500
          title: Event Ids
        cluster_ids:
          items:
            type: string
          type: array
          maxItems: 500
          title: Cluster Ids
        range_name:
          type: string
          maxLength: 16
          title: Range Name
          default: 24h
        from_ts:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: From Ts
        to_ts:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: To Ts
        search:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Search
        result:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Result
        evaluation_status:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Evaluation Status
        country:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
          title: Country
        lifecycle:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Lifecycle
      type: object
      title: QaExportRequest
    SyncBlogRequest:
      properties:
        confirmation:
          type: boolean
          title: Confirmation
          default: false
        expected_plan_digest:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Plan Digest
      type: object
      title: SyncBlogRequest
      description: 'Operator intent for one-click blog synchronization.


        Add/change-only plans can execute without an extra product confirmation.

        A plan containing removals/unpublishes is destructive and must carry both an

        explicit confirmation and the exact plan digest shown to the operator.'
  headers:
    RequestId:
      description: Server-generated authoritative admin request identifier.
      schema:
        type: string
        pattern: ^admreq_[a-f0-9]{32}$
    OperationId:
      description: Server-generated durable operation identifier when applicable.
      schema:
        type: string
        pattern: ^admop_[a-f0-9]{32}$
  responses:
    AdminError:
      description: Admin error envelope
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
